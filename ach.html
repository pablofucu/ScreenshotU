<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logro</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      body { font-family: 'M PLUS Rounded 1c', 'Segoe UI', system-ui, sans-serif; position: relative; color: #23262e; }
      /* Tarjeta clara teñida con el color de la rareza (--r): fondo, borde, anillo, medidor y etiqueta. */
      .card {
        --r: #00a0d8;
        position: absolute; left: 6px; right: 6px; top: 6px; height: 80px; box-sizing: border-box; border-radius: 16px; overflow: hidden;
        display: flex; align-items: center; gap: 12px; padding: 0 14px 0 8px; opacity: 0;
        background: linear-gradient(105deg, color-mix(in srgb, var(--r) 30%, #fbfcfe), color-mix(in srgb, var(--r) 9%, #fbfcfe) 62%, #fbfcfe);
        box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--r) 60%, transparent), 0 0 0 1px rgba(0, 0, 0, 0.08), 0 3px 10px rgba(0, 0, 0, 0.32);
      }
      .medal { position: relative; flex: none; width: 66px; height: 66px; perspective: 300px; }
      .medal svg.rg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
      .rg .t { fill: none; stroke: color-mix(in srgb, var(--r) 22%, transparent); stroke-width: 3; }
      .rg .a { fill: none; stroke: var(--r); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
      .coin { position: absolute; left: 9px; top: 9px; width: 48px; height: 48px; transform-style: preserve-3d; transform: rotateY(180deg); }
      .face { position: absolute; inset: 0; border-radius: 13px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .face img { width: 100%; height: 100%; display: block; object-fit: cover; }
      .face.front img { filter: grayscale(1) brightness(0.72) contrast(0.9); }
      .face.back { transform: rotateY(180deg); box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--r) 70%, transparent); }
      .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .k { font-size: 10.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: color-mix(in srgb, var(--r) 62%, black); }
      .nm { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ds { font-size: 12.5px; font-weight: 500; color: #5b6270; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ds:empty { display: none; }
      .meta { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; color: #5f6877; margin-top: 2px; white-space: nowrap; }
      .meta:empty { display: none; }
      .meter { width: 46px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--r) 22%, transparent); overflow: hidden; flex: none; }
      .meter i { display: block; height: 100%; background: var(--r); transform-origin: 0 50%; }
      .sheen { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.85) 50%, transparent 60%); transform: translateX(-110%); mix-blend-mode: soft-light; }
      .spk { position: absolute; width: 10px; height: 10px; color: var(--r); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="c" class="card">
      <div class="medal">
        <svg class="rg" viewBox="0 0 66 66"><circle class="t" cx="33" cy="33" r="31" /><circle class="a" cx="33" cy="33" r="31" pathLength="100" /></svg>
        <div class="coin">
          <div class="face front"><img id="i0" alt="" /></div>
          <div class="face back"><img id="i1" alt="" /></div>
        </div>
      </div>
      <div class="txt">
        <span class="k">¡Logro conseguido!</span>
        <b class="nm" id="nm"></b>
        <span class="ds" id="ds"></span>
        <span class="meta" id="meta"></span>
      </div>
      <i class="sheen"></i>
    </div>
    <div id="sp"></div>
    <script type="module" src="/src/ach/main.ts"></script>
  </body>
</html>
