name: Compilar para Windows

# Genera el instalador (NSIS .exe y MSI) en un runner de Windows y lo deja como artefacto,
# para poder compilar desde GitHub sin tener Rust ni Node instalados en local.
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Pruebas de la logica (visor-core)
        working-directory: src-tauri
        run: cargo test -p visor-core

      - name: Comprobar el frontend (svelte-check)
        run: npm run check

      - name: Compilar la aplicacion
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: visor-capturas-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
