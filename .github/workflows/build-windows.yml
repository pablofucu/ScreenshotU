name: Compilar para Windows

# Genera el instalador (NSIS .exe y MSI) en un runner de Windows y lo deja como artefacto,
# para poder compilar desde GitHub sin tener Rust ni Node instalados en local.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la release a crear (p. ej. v1.0.0); vacío = solo compilar'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Pruebas de la logica (visor-core)
        working-directory: src-tauri
        run: cargo test -p visor-core

      - name: Comprobar el frontend (svelte-check)
        run: npm run check

      - name: Compilar la aplicacion
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clave que firma las actualizaciones (secretos del repo; ver docs/publicar.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Con una etiqueta vX.Y.Z crea la release en GitHub con los instaladores y latest.json (lo que lee el actualizador).
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
          releaseName: 'Visor de capturas __VERSION__'
          releaseBody: 'Novedades en CHANGELOG.md.'
          releaseDraft: false
          includeUpdaterJson: true

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: visor-capturas-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
