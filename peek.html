<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Captura</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      .f {
        position: relative; box-sizing: border-box; width: 100%; height: 100%; border-radius: 8px; overflow: hidden;
        background: rgba(30, 36, 48, 0.88);
        opacity: 0;
      }
      img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .f::after {
        content: ''; position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.75); z-index: 5;
      }
      /* Obturador: dos láminas que se abren y un destello blanco que quema la foto. */
      .blade { position: absolute; left: 0; right: 0; height: 51%; background: #0b0d12; z-index: 3; }
      .blade.t { top: 0; transform: translateY(-101%); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25); }
      .blade.b { bottom: 0; transform: translateY(101%); box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.25); }
      .flash { position: absolute; inset: 0; background: #fff; z-index: 4; opacity: 0; }
      i {
        position: absolute; right: 5px; bottom: 5px; width: 14px; height: 14px; border-radius: 50%; z-index: 6;
        background: #3bd35a; box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
      }
      i::after {
        content: ''; position: absolute; left: 5px; top: 2.5px; width: 3px; height: 6px;
        border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div id="f" class="f"><img id="img" alt="" /><div class="blade t"></div><div class="blade b"></div><div class="flash"></div><i></i></div>
    <script type="module" src="/src/peek/main.ts"></script>
  </body>
</html>
