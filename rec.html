<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REC</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      body { font-family: 'M PLUS Rounded 1c', 'Segoe UI', system-ui, sans-serif; position: relative; }
      .pill {
        box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; height: 100%; padding: 0 18px;
        border-radius: 999px; font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.02em;
        background: rgba(30, 36, 48, 0.88); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35), 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      .pill.goal { display: none; }
      .pill i { width: 14px; height: 14px; border-radius: 50%; background: #ff3b4f; box-shadow: 0 0 10px #ff3b4f; animation: p 1s infinite; }
      .done i { background: #3bd35a; box-shadow: 0 0 10px #3bd35a; animation: none; }
      .error i { background: #f2b807; box-shadow: 0 0 10px #f2b807; animation: none; }
      .audio i { background: #4aa8ff; box-shadow: 0 0 10px #4aa8ff; animation: none; }
      #t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      @keyframes p { 50% { opacity: 0.35; } }

      /* Meta de lectura cumplida: tarjeta de 64 px con la llama de la racha y los días que rueda. Dos colores, los
         de los anillos de la app (azul: novelas visuales, rosa: novelas japonesas). */
      .gc {
        --a: #0073a0; --b: #00a0d8;
        position: absolute; inset: 0; display: none; align-items: center; gap: 12px; padding: 0 18px 0 10px; overflow: hidden;
        box-sizing: border-box; border-radius: 18px; color: #fff; transform-origin: 100% 0; opacity: 0;
        background: linear-gradient(100deg, var(--a), var(--b)); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.28);
      }
      .gc.on { display: flex; }
      .gc .badge { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, 0.22); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.22); }
      .gc .flame { position: absolute; left: 10px; top: 10px; width: 24px; height: 24px; transform-origin: 50% 100%; }
      .gc .ember { position: absolute; left: 20px; top: 14px; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 5px rgba(255, 255, 255, 0.9); opacity: 0; }
      .gc .ember.e2 { left: 14px; }
      .gc .ember.e3 { left: 27px; }
      .gc .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .gc .txt b { font-size: 16.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gc .txt span { font-size: 12.5px; font-weight: 700; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gc .num { flex: none; display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
      .gc .odo { display: inline-block; height: 1.1em; line-height: 1.1em; overflow: hidden; font-size: 32px; font-weight: 800; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
      .gc .col { display: flex; flex-direction: column; transform: translateY(-50%); }
      .gc .col span { display: block; height: 1.1em; text-align: center; }
      .gc small { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.88; margin-top: 1px; }
      .gc .sheen { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.28) 50%, transparent 60%); transform: translateX(-110%); }
    </style>
  </head>
  <body>
    <div id="p" class="pill recording"><i></i><span id="t">● REC 0:00</span></div>
    <div id="g" class="gc">
      <span class="badge">
        <svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 10.941c2.333 -3.308 .167 -7.823 -1 -8.941c0 3.395 -2.235 5.299 -3.667 6.706c-1.43 1.408 -2.333 3.621 -2.333 5.588c0 3.704 3.134 6.706 7 6.706s7 -3.002 7 -6.706c0 -1.712 -1.232 -4.403 -2.333 -5.588c-2.084 3.353 -3.257 3.353 -4.667 2.235" /></svg>
        <i class="ember e1"></i><i class="ember e2"></i><i class="ember e3"></i>
      </span>
      <div class="txt"><b id="gt"></b><span id="gs"></span></div>
      <div class="num"><span class="odo"><span class="col" id="gc"></span></span><small id="gd"></small></div>
      <div class="sheen"></div>
    </div>
    <script type="module" src="/src/rec/main.ts"></script>
  </body>
</html>
