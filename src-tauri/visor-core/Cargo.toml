[package]
name = "visor-core"
version = "0.1.0"
edition = "2021"
description = "Logica pura del visor de capturas (escaneo, fechas, miniaturas, favoritas, configuracion). No depende de Tauri."

[dependencies]
anyhow = "1"
imagesize = "0.13"
rayon = "1"
regex = "1"
lindera = { version = "6.2.0", features = ["embed-ipadic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde_yaml = "0.9"
# Servidor para la app movil (ver docs/api-movil.md).
tiny_http = "0.12"
flate2 = "1"
getrandom = "0.2"

[dev-dependencies]
tempfile = "3"
