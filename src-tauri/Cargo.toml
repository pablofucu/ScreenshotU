[package]
name = "visor-capturas"
version = "0.1.0"
description = "Visor de capturas de juegos para pantalla grande y mando, estilo menu Wii U"
edition = "2021"
rust-version = "1.77"

[workspace]
members = ["visor-core"]

[lib]
name = "visor_capturas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2", features = ["json"] }
visor-core = { path = "visor-core" }
# Novelas japonesas: LunaHook (FFI), servidor de la pagina de lectura y portapapeles.
libloading = "0.8"
tungstenite = "0.24"
arboard = { version = "3", default-features = false }
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
# Grabacion del audio del proceso del juego (WASAPI process loopback).
wasapi = "0.26"
# Necesario para la macro `interface` (IPolicyConfig, cambio de salida de audio).
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_Storage_Xps", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_Registry", "Media_SpeechSynthesis", "Storage_Streams", "Foundation", "Foundation_Collections"] }
