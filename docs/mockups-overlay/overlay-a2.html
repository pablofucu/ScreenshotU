<style>
/* ===== base común (igual que overlay-a.html) ===== */
:root{--r1:#ff7a9c;--r2:#ffb36b;--r3:#ffe680;--r4:#7be0a8;--r5:#6cc6ff;--r6:#9d8bff;--rb:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6))}

.p1{left:-20%;top:14%}.p2{left:-30%;top:30%;animation-duration:26s!important;animation-delay:-9s!important}.p3{left:-25%;top:6%;animation-duration:32s!important;animation-delay:-20s!important}

.hero{left:610px;bottom:110px;width:58px;height:104px;border-radius:26px 26px 14px 14px}
.hero::before{content:'';position:absolute;left:9px;top:-38px;width:40px;height:40px;border-radius:50%;background:inherit}

.game.gone{opacity:0}
.glass{position:relative;border-radius:var(--r,24px);background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.06) 48%,rgba(255,255,255,.12)),rgba(16,20,36,.46);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 18px 40px -18px rgba(0,0,0,.7);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6)}
.glass::after{content:'';position:absolute;inset:1px;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 40%);pointer-events:none}
[data-f]{cursor:pointer;transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s}

@keyframes pop{from{opacity:0;transform:scale(.86) translateY(18px)}}
@keyframes popout{to{opacity:0;transform:scale(.9)}}
@keyframes fadei{from{opacity:0}}

svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}

.big{font-size:40px;font-weight:800;line-height:1}
.big small{font-size:18px;opacity:.7}

.sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.78);display:flex;align-items:center;gap:6px}
.sub svg{width:16px;height:16px}
.ring{--p:50;--s:120px;--t:12px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;display:grid;place-items:center}
.ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6) calc(var(--p)*1%),rgba(255,255,255,.14) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--t)),#000 calc(100% - var(--t) + 1px));mask:radial-gradient(farthest-side,transparent calc(100% - var(--t)),#000 calc(100% - var(--t) + 1px));filter:drop-shadow(0 0 5px rgba(255,255,255,.35))}
.ring>*{position:relative;text-align:center;line-height:1.05;font-weight:800}
.batt{--p:70;width:34px;height:16px;border:2px solid rgba(255,255,255,.85);border-radius:5px;position:relative;padding:2px;display:inline-block;flex:none}
.batt::after{content:'';position:absolute;right:-6px;top:3px;width:3px;height:6px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.85)}

.vbar{--p:50;height:12px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.vbar i{display:block;height:100%;width:calc(var(--p)*1%);background:var(--rb);border-radius:9px;box-shadow:0 0 12px rgba(255,255,255,.4);transition:width .15s}

.th{position:relative;border-radius:12px;--r:12px;aspect-ratio:16/9;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 6px 14px -8px rgba(0,0,0,.6)}

.am{flex:none;font-size:12.5px;opacity:.85;display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.k{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;font-size:12px;font-weight:800;font-style:normal;background:#fff;color:#1d2230}
.k.a{background:#5ad17a;color:#fff}.k.b{background:#ff6b7f;color:#fff}.k.x{background:#58a8ff;color:#fff}.k.y{background:#ffc94a;color:#3a2b00}
.vhead{display:flex;gap:20px;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}

.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}

.vperf{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}

.pblk{padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.07)}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:10px}

/* ===== A v2 ===== */
.A{position:absolute;inset:0}

function chart(k,w,h,grid){const id='c'+(++CH);return `<svg class="ch" data-k="${k}" data-w="${w}" data-h="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="${id}s" x1="0" x2="1">${RB.map((c,i)=>`<stop offset="${i/5}" stop-color="${c}"/>`).join('')}</linearGradient><linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="${id}m"><rect width="${w}" height="${h}" fill="url(#${id}v)"/></mask></defs>${grid?[.25,.5,.75].map(f=>`<line class="gl" x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" vector-effect="non-scaling-stroke"/>`).join(''):''}<path class="af" fill="url(#${id}s)" mask="url(#${id}m)"/><path class="ln" stroke="url(#${id}s)" vector-effect="non-scaling-stroke"/></svg>`}
function drawChart(s){const a=D[s.dataset.k],w=+s.dataset.w,h=+s.dataset.h,st=w/(a.length-1);let d='';a.forEach((v,i)=>{d+=(i?'L':'M')+(i*st).toFixed(1)+' '+(h-4-v/100*(h-8)).toFixed(1)});s.querySelector('.ln').setAttribute('d',d);s.querySelector('.af').setAttribute('d',d+`L${w} ${h}L0 ${h}Z`)}
function achRow(a,i){return `<div class="arow"><div class="ai${a.ok?'':' lk'}" style="--g:linear-gradient(135deg,${RB[i%6]},${RB[(i+2)%6]})">${svg(a.ok?'star':'lock')}</div><div class="at"><b>${a.n}</b><small>${a.d}</small></div><div class="am">${a.ok?a.t:(a.p?`<span class="mini"><i style="width:${a.p}%"></i></span>${a.p} %`:`${a.r} de jugadores`)}</div></div>`}
const H=a=>a.map(([k,t,c])=>`<span><i class="k ${c||''}">${k}</i>${t}</span>`).join('');

/* ===== racha (lenguaje de ReadRings / HuchaMini) ===== */
function gring(frac,c,size,sw,inner){const r=size/2-sw/2-1,C=2*Math.PI*r,m=size/2;return `<div class="gring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${c}" stroke-opacity=".25" stroke-width="${sw}"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 ${m} ${m})" style="filter:drop-shadow(0 0 5px ${c})"/></svg><div class="gin">${inner}</div></div>`}
/* HuchaMini: casillas de 1, 5 o 10 min; macizo = días anteriores, claro = hoy */
function huchaMini(r){const need=Math.max(1,r.need),unit=need<=12?1:need<=60?5:10*Math.ceil(need/120);let cells='';for(let lo=0;lo<need;lo+=unit){const w=Math.min(need,lo+unit)-lo,pct=v=>Math.round(Math.max(0,Math.min(1,(v-lo)/w))*100);cells+=`<i style="--a:${pct(r.before)}%;--b:${pct(r.got)}%"><s class="fb"></s><s class="fa"></s></i>`}
 return `<div class="hm"><div class="mh"><span class="mk">Rescate</span><span class="mn"><b>${r.got}</b>/${r.need}<small> min</small></span></div><div class="mbar">${cells}</div><div class="mf"><span>quedan <b>${r.left}</b></span><span>${r.close}</span></div></div>`}
/* mapa de semanas de ReadRings (10 columnas, lunes arriba); hoy = miércoles */
function rmap(c,streak,weeks=10){const todayPos=(weeks-1)*7+2;let h='';for(let w=0;w<weeks;w++){h+='<div>';for(let d=0;d<7;d++){const p=w*7+d;if(p>todayPos){h+='<span class="cell"></span>';continue}const dist=todayPos-p,st=dist<streak,r=st?1+Math.abs(Math.sin(p*1.7))*1.4:(Math.sin(p*2.3)>.1?Math.abs(Math.sin(p*3.1))*.9:0);const bg=r<=0?'rgba(255,255,255,.1)':`color-mix(in srgb, ${c} ${(r<1?15+45*r:Math.min(100,60+40*(r-1))).toFixed(0)}%, transparent)`;h+=`<span class="cell${st?' st':''}${dist===0?' td':''}" style="background:${bg}"></span>`}h+='</div>'}return `<div class="rmap">${h}</div>`}
function weekBars(wk,cls='wk'){const mx=Math.max(...wk,.1);return `<div class="${cls}">${wk.map((v,i)=>`<div class="${i===wk.length-1?'td':''}"><i style="height:${v/mx*100}%;background:linear-gradient(180deg,${RB[i%6]},${RB[(i+1)%6]})"></i><small>${'LMXJVSD'[i]}</small></div>`).join('')}</div>`}
function readNote(v){const r=v.read,left=Math.ceil(r.goal-r.today);if(r.done)return `✓ Cumplida a las ${r.doneAt}${v.rescue?` · +${v.rescue.gotToday||0} min a la hucha`:''}`;return r.streak>0?`Faltan ${left} min para seguir la racha`:`Faltan ${left} min`}
function timeTile(v){
 const ses=`<div class="tses"><span class="sub">Esta sesión</span><b class="big">${v.ses}</b><small class="sub">Hoy&nbsp;<b>${v.hoy}</b></small><small class="sub">Total&nbsp;<b>${v.total}</b></small></div>`;
 if(!v.key){const rec=v.rec;return `<div class="lbl">${svg('clock')}Tiempo de juego<em>${v.cat} · desde las ${v.since}</em></div><div class="tt">${ses}${weekBars(v.week)}<div class="recc"><span class="kk">Sesión récord</span><b>${rec.v}</b>Te falta ${rec.left} para batirla<br><span style="opacity:.75">Semana: ${v.weekT}</span></div></div>`}
 const g=GC[v.key],r=v.read,n=r.streak;
 const med=`<div class="rmed">${flame(g.c)}<span class="n">${n}</span><span class="l">${g.name}<small class="${v.rescue?'rp':''}">${v.rescue?'pendiente':(n>0&&n>=r.best?'récord':'mejor '+r.best)}</small></span></div>`;
 const slot=v.rescue?huchaMini(v.rescue):`<div class="rrow">${rmap(g.c,n)}<span class="rnote ok">${n} ${n===1?'día seguido':'días seguidos'}<br><span style="opacity:.8;color:#fff">sin rescates pendientes</span></span></div>`;
 return `<div class="lbl">${svg('clock')}Tiempo y racha<em class="rnote${r.done?' ok':''}">${readNote(v)}</em></div><div class="tt">${ses}${gring(Math.min(1,r.today/r.goal),g.c,104,11,`<b>${r.today}m</b><small>de ${r.goal/60} h</small>`)}<div class="rside">${med}${slot}</div></div>`;
}

function vAch(){return `<div class="vhead">${ring(48,96,10,'<b style="font-size:30px">23<small style="display:block;font-size:13px;opacity:.7">de 48</small></b>')}<div><div class="big2">48 % completado</div><div class="sub">3 conseguidos en esta sesión · te queda poco: Cartógrafo (70 %)</div><div class="tabs"><i class="k">LB</i><span class="tab on">Recientes</span><span class="tab">Por conseguir</span><span class="tab">Todos</span><i class="k">RB</i></div></div></div><div class="alist">${D.ach.map((x,i)=>achRow(x,i).replace('class="arow"','class="arow" data-f')).join('')}</div>`}
function vShots(){const s=shots[selShot]||shots[0];return `<div class="vshots"><div class="th prevw" style="--bg:${SHOT[s.bg]}"><small>${s.t} · 2560 × 1440</small>${favs.has(s.id)?'<i class="fav">★</i>':''}</div><div class="side"><div class="sgrid">${shots.slice(0,6).map((x,i)=>`<div class="th${i===selShot?' sel':''}" data-f data-pick="${i}" style="--bg:${SHOT[x.bg]}"><small>${x.t}</small>${favs.has(x.id)?'<i class="fav">★</i>':''}</div>`).join('')}</div><div class="sub">${shots.length+6} en esta sesión · 128 en total</div><div class="acts"><div class="btn sm" data-f>${svg('open')} Abrir en el visor</div><div class="btn sm" data-f data-act="favsel">${svg('star')} Favorita <i class="k y">Y</i></div></div></div></div>`}
function opt(name,on,ic,i,act){const [a,b]=name.split(' (');return `<div class="row opt${on?' on':''}" data-f data-act="${act}" data-i="${i}">${svg(ic)}<span><b>${a}</b><small>${b?b.slice(0,-1):''}</small></span><i class="radio"></i></div>`}
function vAudio(){return `<div class="vaud"><div class="vcol"><div class="lbl">${svg('head')}Salida</div><div class="grp">${D.outs.map((o,i)=>opt(o,A.out===i,['head','spk','tv'][i],i,'out')).join('')}</div><div class="lbl" style="margin-top:10px">${svg('mic')}Entrada</div><div class="grp">${D.ins.map((o,i)=>opt(o,!i,'mic',i,'in')).join('')}</div></div><div class="vcol"><div class="lbl">${svg('vol')}Ajustes más finos</div><div class="row" data-f>${svg('vol')}<span><b>Volumen del juego aparte</b><small>Mezclador por aplicación (si se decide hacerlo)</small></span><i class="tog"></i></div><div class="row" data-f data-act="mic">${svg('mic')}<span><b>Silenciar micrófono</b><small>También desde la baldosa</small></span><i class="tog${A.mic?' on':''}"></i></div><div class="row" data-f>${svg('head')}<span><b>Comunicaciones</b><small>Cambiar también la salida de chat</small></span><i class="tog on"></i></div><div class="sub" style="margin-top:6px">El volumen, el silencio y la salida se cambian directamente en la baldosa; aquí queda lo menos frecuente.</div></div></div>`}
function vPerf(w){const blk=(k,name,sub,foot)=>`<div class="pblk"><div class="phead"><span class="lbl">${svg(k=='cpu'?'cpu':'bolt')}${name}</span><span class="sub">${sub}</span><b class="pbig"><span data-v="${k}"></span><small>%</small></b></div>${chart(k,w,120,1)}<div class="pfoot">${foot}</div></div>`;return `<div class="vperf">${blk('cpu','CPU','AMD Ryzen 7 5800X · 16 hilos','Media: <b>41 %</b> · Pico: <b>77 %</b>')}${blk('gpu','GPU','NVIDIA GeForce RTX 3070','<b>71 °C</b> · VRAM <b>6,1 / 8 GB</b> · Media: <b>85 %</b>')}<div class="sub">Últimos 2 minutos · sin cambios respecto a la v1</div></div>`}
function vTime(){const v=V[dv];const top=`<div class="tbig"><div><span class="sub">Esta sesión</span><b class="big">${v.ses}</b><small class="sub">desde las ${v.since}</small></div><div><span class="sub">Hoy</span><b class="big">${v.hoy}</b><small class="sub">${v.hoyN}</small></div><div><span class="sub">Total</span><b class="big">${v.total}</b><small class="sub">${v.totN}</small></div></div>`;
 if(!v.key)return `<div class="vtime">${top}${weekBars(v.week,'week')}<div class="sub">Horas por día, esta semana (${v.weekT}) · sesión récord ${v.rec.v}: te falta ${v.rec.left} para batirla · <i>Juegos no tiene racha: las rachas son solo de lectura de novelas.</i></div></div>`;
 const g=GC[v.key],r=v.read,n=r.streak;
 if(!v.rescue)return `<div class="vtime">${top}<div style="display:flex;gap:24px;align-items:center;--c:${g.c}">${gring(Math.min(1,r.today/r.goal),g.c,140,14,`<b style="font-size:30px">${r.today}m</b><small>de ${r.goal/60} h</small>`)}<div style="display:flex;flex-direction:column;gap:10px;flex:1"><div class="rmed" style="height:60px">${flame(g.c)}<span class="n" style="font-size:34px">${n}</span><span class="l" style="font-size:15px">días de racha de ${g.full.toLowerCase()}<small>${n>=r.best?'récord':'mejor '+r.best}</small></span></div><div class="rnote ok" style="font-size:15px">${readNote(v)}</div></div>${rmap(g.c,n,14).replace('class="rmap"','class="rmap" style="transform:scale(1.5);transform-origin:right center;margin-left:40px"')}</div><div class="sub">Lo mismo que «Lectura de hoy» de Inicio: anillo de hoy, racha y mapa de las últimas semanas. Solo de esta categoría.</div></div>`;
 const R=v.rescue;let jar='';for(let i=0;i<R.need;i++)jar+=`<i class="${i<R.before?'d1':i<R.got?'d2':''}"></i>`;
 return `<div class="vtime">${top}<div class="resc r-vn" style="--c:${g.c}"><div class="rtitle"><span class="rdot"></span>Rescate del ${R.failed}<span style="margin-left:auto;display:flex;gap:10px;align-items:center"><div class="rmed" style="height:38px">${flame(g.c)}<span class="n" style="font-size:22px">${n}</span><span class="l">${g.name}<small class="rp">pendiente</small></span></div></span></div><div class="jar">${jar}</div><div class="jarl"><span>Domingo 18: ${R.played} de ${R.goal} min · 1 casilla = 1 min que faltó</span><b>Recuperado ${R.got} de ${R.need} min</b></div><div class="hrow"><div class="plist"><div class="kk">Partidas lun 19 – mié 21</div>${R.plays.map(p=>`<div class="pr${p[3]?'':' no'}"><span>${p[0]}</span><span><s>${p[1]}</s>${p[3]?'':'<em>no cuenta · menos de 10 min</em>'}</span><span class="pm">${p[2]} min</span></div>`).join('')}</div><div><div class="cd"><span class="kk">Cierra en</span><b>${R.left}</b><small>${R.closeL}</small><small>${R.next} en partidas de 10 min o más</small></div><div class="rcnt"><span style="opacity:.7;text-transform:uppercase;letter-spacing:.05em">Rescates · 30 días</span><b>${R.used} <small style="opacity:.7">de ${R.max}</small></b></div></div></div></div></div>`}
function vPad(){return `<div class="vpad"><div class="padcard"><div class="padart">${svg('pad')}</div><div><b class="big2">DualSense</b><div class="sub">Bluetooth · jugador 1</div><div class="pb"><span class="batt lg" style="--p:70"><i></i></span><b class="big">70 %</b></div><div class="sub">Unas 5 h de juego · aviso al 15 %</div></div></div><div class="row" data-f>${svg('pad')}<span>Vibrar para reconocerlo</span></div><div class="row dim">${svg('pad')}<span>Mando 2 · no conectado</span></div></div>`}
const DET={logros:['trophy','Logros',vAch],capturas:['cam','Últimas capturas',vShots],audio:['vol','Audio · más ajustes',vAudio],rendimiento:['bolt','Rendimiento',()=>vPerf(480)],tiempo:['clock','Tiempo de juego y racha',vTime],mando:['pad','Mando',vPad]};

 if(id==='mic')return H([['A','Silenciar micro','a'],['X','Captura','x']].concat(base));
 if(id==='cap')return H([['A','Capturar','a'],['LT RT','Volumen']].concat(base));
 if(/^s\d/.test(id))return H([['A','Ver','a'],['Y','Favorita','y'],['X','Captura','x']].concat(base));
 if(id==='close')return H([['A','Cerrar juego (3 s para deshacer)','a']].concat(base));
 if(id==='force')return H([['Mantén A','Forzar cierre','a']].concat(base));
 return H([['A','Abrir','a'],['X','Captura','x'],['LT RT','Volumen']].concat(base))}
function view(k,o){
 const v=V[dv];
 if(k==='cerrado')return `<div class="tag">${excl?'Pantalla completa <b>exclusiva</b>: el overlay no puede salir. <b>Espacio</b> corto = aviso; <b>mantenlo</b> 1,5 s = forzar cierre':'Jugando. <b>Espacio</b> = atajo del menú (pulsar abre · mantener 1,5 s fuerza el cierre)'}</div>`;
 if(k==='fin')return `<div class="fin"><div class="glass toast">${svg('power')}<div>${v.game} se ha cerrado a la fuerza<small>${finWhy==='excl'?'Manteniendo el atajo con el juego en pantalla completa exclusiva · el mando ha dado una vibración larga':finWhy==='hold'?'Manteniendo el atajo 1,5 s':'Desde el botón «Forzar cierre»'} · sesión de 1 h 24 min guardada · Intro para repetir</small></div></div></div>`;
 if(k==='finok')return `<div class="gamedlg"><b>¿Guardar antes de salir?</b><div><span>Guardar y salir</span><span>Salir sin guardar</span><span>Cancelar</span></div></div><div class="glass toast toptoast">${svg('x')}<div>Se ha pedido al juego que se cierre<small>Responde a su pregunta con el mando como siempre</small></div></div>`;
 if(k==='ajustes')return settingsView();
 const det=DET[k];
 const hints=det?H([['✚','Mover'],['A','Elegir','a'],['B','Atrás','b']].concat(k==='logros'?[['LB RB','Pestañas']]:k==='capturas'?[['Y','Favorita','y']]:[])):hintsMain(null);
 return `<div class="A${o.anim?' anim':''}${det?' det':''}${k==='cerrando'?' closing':''}"><div class="scrim"></div>
 <header class="topA"><div class="glass gname">${svg('pad')}<b>${v.game}</b><small>${v.cat}</small></div><span class="paused"><i></i>Juego en pausa</span><div class="sp"></div><div class="clock"><b data-clock></b><small data-date></small></div></header>
 <main class="gridA">${tiles(!det)}</main>
 ${k==='cerrando'?`<div class="glass cdban">${svg('power')}Cerrando ${v.game} en <b data-cd>${cdN}</b> s<div class="btn" data-f data-undo>${svg('undo')}Deshacer</div></div>`:''}
 ${det?`<section class="glass sheetA"><div class="sh-h"><div class="lbl">${svg(det[0])}${det[1]}</div></div><div class="sh-b">${det[2]()}</div></section>`:''}
 <div class="hints">${hints}</div></div>`}

/* ajustes simulados */
const SET=[
 {id:'combo',l:'Capturar con el mando',v:'View + RB',old:1},{id:'mouse',l:'Capturar con el ratón',v:'Desactivado',old:1},{id:'hotkey',l:'Capturar con el teclado',v:'F12',old:1},
 {h:'Menú del juego'},
 {id:'qmkey',l:'Abrir el menú con el teclado',v:'F24',pre:['F24','F13','Ctrl+Alt+O','Desactivado'],d:'Atajo global (funciona con el juego delante). Pulsa A y luego la tecla. Con DS4Windows: asigna el botón del mando (p. ej. el de silencio) a una tecla que no uses, como F24, y púlsalo aquí. Mantenerlo 1,5 s fuerza el cierre del juego (ver abajo).'},
 {id:'qmpad',l:'Abrir el menú con el mando',v:'Xbox',pre:['Desactivado','Xbox','View + Menú','L3 + R3'],d:'Pulsa A y luego el botón o la combinación (XInput, incluido el botón Xbox/PS). Ojo: si la Xbox Game Bar o Steam usan el botón Xbox, desactívalo allí. No puede repetir ni contener la combinación de captura o la de audio.'},
 {id:'qmmouse',l:'Abrir el menú con el ratón',v:'Desactivado',pre:['Desactivado','Botón central (rueda)','Lateral atrás','Lateral adelante'],d:'Un botón del ratón (central o lateral). No puede ser el mismo que el de captura.'},
 {id:'qmhold',l:'Mantener el atajo para forzar el cierre',v:'Sí · 1,5 s',pre:['Sí · 1,5 s','No'],d:'Mantener cualquiera de los tres atajos 1,5 s cierra el juego a la fuerza, se abra o no el menú (sirve en pantalla completa exclusiva, donde el menú no se ve). Con el menú visible sale una barra que se llena; sin él, el mando da toques cada vez más seguidos y una vibración larga al cerrar. Una pulsación corta en exclusiva solo da dos toques de aviso.'},
 {id:'qmpause',l:'Pausar el juego con el menú abierto',v:'Sí',pre:['Sí','No'],d:'Congela el juego mientras el menú está abierto (no recibe el mando ni sigue la partida). Desactívalo para juegos en línea o con antitrampas.'},
];
let setLearn=null;
function settingsView(){return `<div class="setm"><h2>Ajustes</h2><div class="stabs2"><span>General</span><span>Apariencia</span><span class="on">Mando</span><span>Biblioteca</span><span>Mi lista</span><span>Acerca de</span></div><div class="srows">${SET.map(r=>r.h?`<div class="sgh">${r.h}</div>`:`<div class="srow${r.old?'':' new'}" data-f data-set="${r.id}"><span>${r.l}</span><em>${r.v}</em></div>`).join('')}</div><div class="sdesc" id="sdesc"></div>${setLearn?`<div class="lrn"><div><h3>${setLearn==='qmpad'?'Pulsa en el mando':setLearn==='qmmouse'?'Pulsa un botón del ratón':'Pulsa la tecla'}</h3><p>${setLearn==='qmpad'?'Un botón o varios a la vez (también el botón Xbox). Se guarda al soltarlos todos.':setLearn==='qmmouse'?'El botón central (rueda) o uno de los laterales.':'Sola (F1–F24, Impr Pant, Pausa…) o con Ctrl, Alt o Shift. Si usas DS4Windows, pulsa ahora el botón del mando que convierte en tecla.'}</p><div class="lc">Esperando…</div><p style="margin:12px 0 0">12 s · Esc cancela</p></div></div>`:''}</div>`}
function setDesc(el){const r=SET.find(x=>x.id===(el&&el.dataset.set));const d=document.getElementById('sdesc');if(d)d.innerHTML=r?(r.d||'Fila que ya existe (sin cambios).'):''}

/* ===== motor ===== */
const INTRO='<b>A v2 · «Plaza» interactiva.</b> Misma rejilla de cristal sobre el juego desenfocado, pero con lo frecuente <b>directamente en las baldosas</b> (volumen, silencio, salida, micro, capturar, favorita, cerrar) y las hojas solo para lo menos frecuente.';
const PAD='<b>Teclado del mockup:</b> <kbd>Espacio</kbd> = atajo del menú (pulsar / <b>mantener 1,5 s</b>), <kbd>← ↑ → ↓</kbd> = cruceta (en la barra de volumen ← → ajustan), <kbd>Intro</kbd> = A (mantenla en «Forzar»), <kbd>Esc</kbd> = B, <kbd>X</kbd> = captura, <kbd>Y</kbd> = favorita, <kbd>Q</kbd>/<kbd>E</kbd> = LT/RT (volumen). <b>Ratón:</b> pasar enfoca, clic acciona, rueda sobre el audio = volumen, clic derecho = B.';
const $=s=>document.querySelector(s);
const stage=$('#stage'),ov=$('#ov'),game=$('#game'),bar=$('#bar'),info=$('#info');
let cur='cerrado',bg=location.search.includes('claro')?'light':'dark';
const foEl=()=>ov.querySelector('.fo');
function onFocus(el){if(S[cur]&&S[cur].main){const h=ov.querySelector('.hints');if(h)h.innerHTML=hintsMain(el)}if(cur==='ajustes')setDesc(el)}
function setFo(el){const c=foEl();if(c===el)return;if(c)c.classList.remove('fo');if(el){el.classList.add('fo');onFocus(el)}}
function pick(dx,dy){const items=[...ov.querySelectorAll('[data-f]')];const c=foEl();if(!c)return items[0];const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=1e9;for(const it of items){if(it===c)continue;const q=it.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy,al=dx?x*dx:y*dy;if(al<=2)continue;const d=al+(dx?Math.abs(y):Math.abs(x))*2.2;if(d<bd){bd=d;best=it}}return best}
const move=(dx,dy)=>{const b=pick(dx,dy);if(b)setFo(b)};
const rerender=()=>{const f=foEl();go(cur,{fid:f&&f.dataset.id})};
function setVol(d){A.mute=false;A.vol=Math.max(0,Math.min(100,A.vol+d));if(S[cur].main)rerender()}
function capture(){if(!S[cur]||!(S[cur].main||DET[cur]))return;shots.forEach(s=>s.fresh=0);shots.unshift({id:nextShot++,t:'ahora',bg:Math.floor(Math.random()*6),fresh:1});stage.insertAdjacentHTML('beforeend','<div class="flash"></div>');setTimeout(()=>stage.querySelector('.flash')?.remove(),400);if(S[cur].main)rerender()}
function toggleFav(i){const s=shots[i];if(!s)return;favs.has(s.id)?favs.delete(s.id):favs.add(s.id);rerender()}
function act(el){if(!el)return;const d=el.dataset;
 if('undo' in d){go('abierto',{fid:'close'});return}
 if(d.act==='mute'){A.mute=!A.mute;rerender();return}
 if(d.act==='out'){A.out=+d.i;rerender();return}
 if(d.act==='mic'){A.mic=!A.mic;rerender();return}
 if(d.act==='in'){el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===el));return}
 if(d.act==='cap'){capture();return}
 if(d.act==='close'){go('cerrando',{fid:'close'});return}
 if(d.act==='favsel'){toggleFav(selShot);return}
 if(d.pick!=null){selShot=+d.pick;rerender();return}
 if(d.shot!=null){selShot=+d.shot;go('capturas');return}
 if(d.go){go(d.go);return}
 if(el.querySelector('.tog')){el.querySelector('.tog').classList.toggle('on')}}
function back(){const s=S[cur];if(cur==='cerrando'){go('abierto',{fid:'close'});return}if(s&&s.back)go(s.back,{fid:cur==='capturas'?'s'+(shots[selShot]||{}).id:{logros:'ach',audio:'amore',tiempo:'time',rendimiento:'perf',mando:'pad'}[cur]});else closeOv()}
const isOpen=()=>!!(S[cur]&&(S[cur].main||S[cur].back));
function closeOv(){const r=ov.firstElementChild;if(!r||!isOpen()){go('cerrado');return}r.classList.add('out');game.classList.remove('blur');setTimeout(()=>go('cerrado'),240)}
function refresh(){ov.querySelectorAll('svg[data-k]').forEach(drawChart);ov.querySelectorAll('[data-v]').forEach(e=>e.textContent=Math.round(last(D[e.dataset.v])));const d=new Date();ov.querySelectorAll('[data-clock]').forEach(e=>e.textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));ov.querySelectorAll('[data-date]').forEach(e=>e.textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}
/* cuenta atrás de «Cerrar de un clic» */
let cdN=3,cdT=null,cdT0=0;
function cdStart(){cdN=3;cdT0=performance.now();clearInterval(cdT);cdT=setInterval(()=>{const t=(performance.now()-cdT0)/1000;cdN=Math.max(0,Math.ceil(3-t));ov.querySelectorAll('[data-cd]').forEach(e=>e.textContent=cdN);ov.querySelectorAll('[data-cdr]').forEach(e=>e.style.setProperty('--p',Math.max(0,1-t/3)));if(t>=3){clearInterval(cdT);go('finok')}},50)}
function go(k,o={}){if(!S[k])k='cerrado';const was=cur;cur=k;const s=S[k];if(k!=='cerrando')clearInterval(cdT);
 game.className='game '+bg+(s.blur?' blur':'')+(s.gone?' gone':'')+(s.settings?' gone':'');ov.innerHTML=view(k,o);
 const want=o.fid?ov.querySelector(`[data-f][data-id="${o.fid}"]`):null;const f=want||ov.querySelector('[data-f]');ov.querySelectorAll('.fo').forEach(e=>e.classList.remove('fo'));if(f)setFo(f);
 if(k==='cerrando'&&was!=='cerrando'){cdStart();const u=ov.querySelector('[data-undo]');if(u)setFo(u)}
 refresh();info.innerHTML=INTRO+(s.note?'<br><br>'+s.note:'')+'<br><br>'+PAD;bar.querySelectorAll('button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k)}
/* mantener A / clic en «Forzar» */
let holdT=null;
function holdBegin(el){if(holdT)return;const t0=performance.now();const tick=()=>{const p=Math.min(1,(performance.now()-t0)/1500);el.style.setProperty('--h',p);if(p>=1){holdT=null;finWhy='';go('fin');return}holdT=requestAnimationFrame(tick)};holdT=requestAnimationFrame(tick)}
function holdEnd(){if(holdT){cancelAnimationFrame(holdT);holdT=null}ov.querySelectorAll('[data-hold]').forEach(e=>e.style.setProperty('--h',0))}
/* atajo del menú (Espacio): corto = abrir/cerrar; mantener 1,5 s = forzar cierre */
let tg=null;
function padFb(html,ms){ov.querySelector('.padfb')?.remove();ov.insertAdjacentHTML('beforeend',`<div class="padfb">${html}</div>`);if(ms)setTimeout(()=>ov.querySelector('.padfb')?.remove(),ms)}
function trigDown(){if(tg)return;if(S[cur].gone||cur==='finok'||cur==='ajustes'){go('cerrado');return}
 const wasOpen=isOpen();tg={t0:performance.now(),wasOpen,raf:0,tick:0};
 if(!excl&&!wasOpen)go(OPEN,{anim:1});
 const step=()=>{const t=performance.now()-tg.t0;
  if(t>=400){const p=Math.min(1,(t-400)/1100);
   if(excl){const n=Math.floor((t-400)/Math.max(90,260-p*170));if(n!==tg.tick){tg.tick=n;padFb(`<span class="bz">📳</span><div>tic · tic · tic… (cada vez más seguido)<small>Simulación: lo que notas en el mando mientras mantienes el atajo en exclusiva</small></div>`)}}
   else{let b=ov.querySelector('.holdban');if(!b){ov.querySelector('.A')?.insertAdjacentHTML('beforeend',`<div class="glass holdban"><i class="hf"></i>${svg('power')}<span>Forzando el cierre…<small>Suelta para cancelar</small></span></div>`);b=ov.querySelector('.holdban')}if(b)b.style.setProperty('--h',p);const fb=ov.querySelector('[data-id="force"]');if(fb)fb.style.setProperty('--h',p)}}
  if(t>=1500){const ex=excl;tg=null;finWhy=ex?'excl':'hold';go('fin');return}
  tg.raf=requestAnimationFrame(step)};tg.raf=requestAnimationFrame(step)}
function trigUp(){if(!tg)return;cancelAnimationFrame(tg.raf);const t=performance.now()-tg.t0,wasOpen=tg.wasOpen;tg=null;
 ov.querySelector('.holdban')?.remove();ov.querySelectorAll('[data-hold]').forEach(e=>e.style.setProperty('--h',0));
 if(excl){if(t<400)padFb('<span class="bz">📳</span><div>bzz · bzz (dos toques)<small>Simulación: el menú no puede salir en pantalla completa exclusiva</small></div>',1600);else ov.querySelector('.padfb')?.remove();return}
 if(t<400&&wasOpen)closeOv()}
addEventListener('keydown',e=>{
 if(cur==='ajustes'){settingsKey(e);return}
 if(e.key===' '){e.preventDefault();if(!e.repeat)trigDown();return}
 if(cur==='cerrado')return;
 if(S[cur].gone||cur==='finok'){if(e.key==='Escape'||e.key==='Enter')go('cerrado');return}
 const k=e.key.toLowerCase();
 if(k==='x'){capture();return}
 if(k==='q'||e.key==='PageDown'){setVol(-5);return}
 if(k==='e'||e.key==='PageUp'){setVol(5);return}
 if(k==='y'){const f=foEl();if(f&&f.dataset.shot!=null)toggleFav(+f.dataset.shot);else if(cur==='capturas')toggleFav(selShot);return}
 const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
 if(m){e.preventDefault();const f=foEl();if(f&&'slider' in f.dataset&&m[0]){setVol(m[0]*2);return}move(...m);return}
 if(e.key==='Enter'){e.preventDefault();const f=foEl();if(f&&'hold' in f.dataset)holdBegin(f);else if(!e.repeat)act(f);return}
 if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();back()}
});
addEventListener('keyup',e=>{if(e.key===' ')trigUp();if(e.key==='Enter')holdEnd()});
function settingsKey(e){
 if(setLearn){e.preventDefault();if(e.key==='Escape'){setLearn=null;rerender();return}if(setLearn==='qmkey'&&!['Control','Alt','Shift','Meta'].includes(e.key)){const mods=[e.ctrlKey&&'Ctrl',e.altKey&&'Alt',e.shiftKey&&'Shift'].filter(Boolean);const kn=/^Key/.test(e.code)?e.code.slice(3):/^Digit/.test(e.code)?e.code.slice(5):e.code;if(!mods.length&&!/^F\d/.test(kn))return;SET.find(r=>r.id==='qmkey').v=[...mods,kn].join('+');setLearn=null;go('ajustes',{fid:'qmkey'})}return}
 const m={ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();move(...m);return}
 const f=foEl();const r=f&&SET.find(x=>x.id===f.dataset.set);
 if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&r&&r.pre){const i=r.pre.indexOf(r.v),n=r.pre.length;r.v=r.pre[((i<0?0:i)+(e.key==='ArrowRight'?1:-1)+n)%n];go('ajustes',{fid:r.id});return}
 if(e.key==='Enter'&&r&&/^qm(key|pad|mouse)$/.test(r.id)){setLearn=r.id;go('ajustes',{fid:r.id});if(r.id==='qmpad')setTimeout(()=>{if(setLearn==='qmpad'){r.v='Xbox';setLearn=null;go('ajustes',{fid:'qmpad'})}},1600);return}
 if(e.key==='Escape'){go('cerrado')}}
ov.addEventListener('pointerdown',e=>{if(e.button!==0)return;const el=e.target.closest('[data-f]');if(!el)return;setFo(el);if('hold' in el.dataset)holdBegin(el)});
ov.addEventListener('click',e=>{if(cur==='fin'||cur==='finok'){go('cerrado');return}if(cur==='ajustes'){if(setLearn==='qmmouse')return;const el=e.target.closest('[data-set]');if(el&&/^qm(key|pad|mouse)$/.test(el.dataset.set)){setLearn=el.dataset.set;go('ajustes',{fid:el.dataset.set})}return}
 const sl=e.target.closest('[data-slider]');if(sl){const vb=sl.querySelector('.vbar').getBoundingClientRect();if(e.clientX>=vb.left&&e.clientX<=vb.right){A.mute=false;A.vol=Math.round((e.clientX-vb.left)/vb.width*100);rerender()}return}
 const el=e.target.closest('[data-f]');if(el){if(!('hold' in el.dataset))act(el)}else if(S[cur]&&S[cur].back&&!e.target.closest('.glass'))back()});
ov.addEventListener('mousedown',e=>{if(cur==='ajustes'&&setLearn==='qmmouse'&&(e.button===1||e.button===3||e.button===4)){e.preventDefault();SET.find(r=>r.id==='qmmouse').v=e.button===1?'Botón central (rueda)':e.button===3?'Lateral atrás':'Lateral adelante';setLearn=null;go('ajustes',{fid:'qmmouse'})}});
ov.addEventListener('contextmenu',e=>{e.preventDefault();if(cur==='ajustes'){if(setLearn){setLearn=null;rerender()}return}if(isOpen())back()});
ov.addEventListener('wheel',e=>{if(e.target.closest('.t-aud')&&S[cur].main){e.preventDefault();setVol(e.deltaY<0?2:-2)}},{passive:false});
ov.addEventListener('pointerover',e=>{const el=e.target.closest('[data-f]');if(el)setFo(el)});
addEventListener('pointerup',holdEnd);
setInterval(()=>{walk(D.cpu,38,18);walk(D.gpu,84,10);refresh()},900);
let lastG='';for(const [k,s] of Object.entries(S)){if(s.grp!==lastG){bar.insertAdjacentHTML('beforeend',`<span class="lab">${s.grp}</span>`);lastG=s.grp}const b=document.createElement('button');b.textContent=s.btn;b.dataset.k=k;b.onclick=()=>go(k,{anim:cur==='cerrado'});bar.appendChild(b)}
bar.insertAdjacentHTML('beforeend',`<span class="lab">Datos</span><button data-dv="vnh">Novela con hucha</button><button data-dv="vn">Novela sin hucha</button><button data-dv="game">Juego (sin racha)</button><span class="lab">Fondo del juego</span><button data-bg="dark">Oscuro</button><button data-bg="light">Claro</button><span class="lab">Modo</span><button data-ex="0">Normal</button><button data-ex="1">Exclusiva</button>`);
bar.querySelectorAll('[data-bg]').forEach(b=>{b.classList.toggle('on',b.dataset.bg===bg);b.onclick=()=>{bg=b.dataset.bg;bar.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('on',x===b));game.classList.remove('dark','light');game.classList.add(bg)}});
bar.querySelectorAll('[data-dv]').forEach(b=>{b.classList.toggle('on',b.dataset.dv===dv);b.onclick=()=>{dv=b.dataset.dv;bar.querySelectorAll('[data-dv]').forEach(x=>x.classList.toggle('on',x===b));if(cur!=='cerrado')rerender()}});
bar.querySelectorAll('[data-ex]').forEach(b=>{b.classList.toggle('on',(b.dataset.ex==='1')===excl);b.onclick=()=>{excl=b.dataset.ex==='1';bar.querySelectorAll('[data-ex]').forEach(x=>x.classList.toggle('on',x===b));go('cerrado')}});
if(location.search.includes('embed'))document.body.classList.add('embed');
function fit(){const h=$('#hold');const sc=Math.min(1,(innerWidth-(document.body.classList.contains('embed')?0:32))/1280);stage.style.transform=`scale(${sc})`;h.style.width=1280*sc+'px';h.style.height=720*sc+'px'}

go(location.hash.slice(1)||OPEN,{anim:1});
