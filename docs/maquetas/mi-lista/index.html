<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi lista, propuestas</title>
<!-- Maquetas de «Mi lista» (franjas por estado). Usa el app.css real; la organización es la de hoy en todas. -->
<link rel="stylesheet" href="../../../src/app.css">
<style>
html,body{margin:0;height:auto;overflow:auto;background:#cfd3da;font-family:var(--round)}
body.dk{background:#0b0c10}
.tool{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:rgba(236,238,242,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(0,0,0,.08);font:700 13px/1 var(--round);color:#3a414e}
body.dk .tool{background:rgba(20,22,28,.92);color:#e6e9f0}
.tool b{margin-right:auto;font-size:15px}
.tool button{font:700 13px/1 var(--round);height:32px;padding:0 14px;border-radius:16px;border:0;background:rgba(255,255,255,.8);color:#3a414e;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.tool button.on{background:#3a414e;color:#fff}
.desc{max-width:1280px;margin:18px auto 0;padding:0 16px;color:#3a414e}
body.dk .desc{color:#e6e9f0}
.desc h2{margin:0 0 6px;font:800 20px/1.2 var(--round)}
.desc p{margin:0;font:500 15px/1.45 var(--round);opacity:.85;max-width:1000px}
.desc ul{margin:8px 0 0;padding-left:20px;font:500 14px/1.5 var(--round);opacity:.85}
.hold{margin:16px auto 40px;width:calc(1280px * var(--k,1));height:calc(720px * var(--k,1))}

/* ---------- Escenario 1280 × 720 ---------- */
#stage.m{position:relative;transform:scale(var(--k,1));transform-origin:0 0;border-radius:14px;box-shadow:0 30px 60px -30px rgba(20,30,50,.6);user-select:none}
.m .glass,.m .pill{position:relative}
.top{position:absolute;left:22px;right:24px;top:8px;height:60px;display:flex;align-items:center;gap:16px;z-index:4}
.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--arc-azul),var(--arc-anil));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 3px var(--glass-chip),var(--sh-1)}
.top .crumb{position:relative;left:auto;top:auto}
.top .hr{margin-left:auto;font:800 var(--t-xl)/1 var(--round);color:var(--ink-2)}
.m .sx{top:80px}
.hints{right:var(--gut)}
.hint .btn{background:var(--b)}

/* Datos comunes */
.board{position:absolute;left:48px;right:48px;top:140px;height:504px;display:flex;flex-direction:column;gap:12px}
.lane{position:relative;flex:none;height:92px}
.lane.empty{height:30px}
.lh{display:flex;align-items:center;gap:8px}
.lh svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.its{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;gap:12px;overflow:hidden;
  -webkit-mask:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.it{flex:none;display:flex;align-items:center;gap:8px;height:80px;padding:0 12px 0 0;cursor:pointer;position:relative;
  transition:transform var(--d-2) var(--e-bounce),background var(--d-2),box-shadow var(--d-2)}
.cv{position:relative;flex:none;width:56px;height:80px;padding:4px}
.cv i{display:block;width:100%;height:100%;border-radius:var(--r-xs);background:var(--face) center/cover;box-shadow:0 0 0 1px var(--line)}
.cv i.na{display:grid;place-items:center;font:800 var(--t-xs)/1.1 var(--round);color:var(--ink-2);text-align:center;padding:4px;font-style:normal}
.tx{width:112px;display:flex;flex-direction:column;gap:4px;min-width:0}
.done .tx{width:80px}
.tx b{font:800 var(--t-s)/1.15 var(--round);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tx small{font:700 var(--t-s)/1.2 var(--round);color:var(--ink-2)}
.tx .w{display:flex;align-items:center;gap:4px;font:800 var(--t-xs)/1.1 var(--round);color:color-mix(in srgb,var(--warn) 70%,black)}
.tx .w svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.tx .p{font:800 var(--t-xs)/1.1 var(--round);color:var(--cf)}
.bd{position:absolute;right:-2px;top:-2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--cf);box-shadow:0 0 0 2px var(--glass-chip)}
.bd svg{width:12px;height:12px}
.ys{flex:none;align-self:stretch;display:flex;align-items:center;padding:0 8px 0 12px;font:800 var(--t-s)/1 var(--round);color:var(--ink-2);border-left:2px solid color-mix(in srgb,var(--c) 30%,transparent)}
.ys:first-child{border-left:0;padding-left:0}
.et{font:700 var(--t-s)/1 var(--round);color:var(--ink-3)}

/* ===================== HOY ===================== */
.v-act .lane{border-radius:var(--r-m);overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 15%,var(--glass-top)),color-mix(in srgb,var(--c) 15%,var(--glass-mid)) 46%,color-mix(in srgb,var(--c) 15%,var(--glass-bot)));
  box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),inset 0 -10px 14px -8px var(--hl-bot),0 0 0 1px rgba(95,110,135,.24),0 18px 30px -16px rgba(40,50,70,.42)}
.v-act .lane.run{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,var(--glass-top)),color-mix(in srgb,var(--c) 22%,var(--glass-mid)) 46%,color-mix(in srgb,var(--c) 18%,var(--glass-bot)));box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 18px 30px -16px rgba(40,50,70,.42),0 6px 18px -10px var(--c)}
.v-act .lh{position:absolute;left:0;top:0;bottom:0;width:40px;justify-content:center;background:var(--c);color:#fff}
.v-act .lh svg,.v-act .lh em{display:none}
.v-act .lh span{writing-mode:vertical-rl;transform:rotate(180deg);font:800 var(--t-s)/1 var(--round);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.v-act .its{left:52px}
.v-act .it{background:linear-gradient(180deg,var(--glass-top),var(--glass-mid) 46%,var(--glass-bot));border-radius:var(--r-s);box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),0 0 0 1px rgba(95,110,135,.24),0 18px 30px -16px rgba(40,50,70,.42)}
.v-act .park .it:not(.f){filter:saturate(.35);opacity:.86}
.v-act .done .it:not(.f){filter:saturate(.1);opacity:.66}
.v-act .it.f{background:var(--glass-chip);box-shadow:var(--ring);z-index:2}
.v-act .lane.empty{display:flex;align-items:center;padding:0 14px}
.v-act .lane.empty .lh{position:static;width:auto;background:none;color:var(--ink-3)}
.v-act .lane.empty .lh span{writing-mode:horizontal-tb;transform:none;text-transform:none;letter-spacing:0;font-weight:700}

/* ===================== A · Chips ===================== */
/* Cada franja es un panel neutro, como los chips de Estadísticas: el color queda en el icono y en el foco. */
.v-a .lane{border-radius:var(--r-m);background:var(--panel);box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),var(--sh-1)}
.v-a .lh{position:absolute;left:16px;top:0;bottom:0;width:140px;flex-wrap:wrap;align-content:center;gap:4px 8px;color:var(--ink-2);font:700 var(--t-s)/1.2 var(--round)}
.v-a .lh svg{color:var(--c);filter:drop-shadow(0 2px 5px color-mix(in srgb,var(--c) 50%,transparent))}
.v-a .lh em{flex-basis:100%;white-space:nowrap;font:800 var(--t-2xl)/1 var(--round);font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.v-a .lh em small{font:700 var(--t-s)/1 var(--round);color:var(--ink-2);margin-left:6px}
.v-a .its{left:172px;padding-left:16px;box-shadow:inset 1px 0 0 var(--line)}
.v-a .it{border-radius:var(--r-s);background:var(--glass-in);box-shadow:inset 0 1px 0 var(--hl-ring),inset 0 0 0 1px var(--line)}
.v-a .it.f{transform:scale(1.04);background:var(--glass-chip);box-shadow:var(--sh-2);z-index:2}
.v-a .lane.empty .lh{width:auto;flex-wrap:nowrap}
.v-a .lane.empty .lh svg{width:16px;height:16px;color:var(--ink-3);filter:none}
.v-a .lane.empty .lh em{flex-basis:auto;font:700 var(--t-s)/1 var(--round);color:var(--ink-3)}
.v-a .lane.empty .lh em small{display:none}

/* ===================== B · Un solo panel ===================== */
/* Todas las franjas en un panel de cristal, separadas por líneas finas. Los juegos no llevan tarjeta. */
.v-b .board{gap:0;padding:6px 16px;border-radius:var(--r-l);background:var(--panel);box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),var(--sh-1)}
.v-b .lane{height:96px}
.v-b .lane.empty{height:34px}
.v-b .lane+.lane{box-shadow:0 -1px 0 var(--line)}
.v-b .lh{position:absolute;left:0;top:0;bottom:0;width:150px;font:800 var(--t-m)/1.2 var(--round);color:var(--ink)}
.v-b .lh svg{display:none}
.v-b .lh::before{content:'';width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.v-b .lh em{margin-left:auto;margin-right:12px;min-width:26px;height:22px;padding:0 8px;border-radius:var(--r-pill);display:grid;place-items:center;font:800 var(--t-xs)/1 var(--round);font-style:normal;color:var(--cf);background:color-mix(in srgb,var(--c) 14%,var(--tint-base))}
.v-b .lh span{white-space:nowrap}
.v-b .lh em small{display:none}
.v-b .its{left:162px}
.v-b .it{border-radius:var(--r-s)}
.v-b .it:hover{background:var(--glass-in)}
.v-b .it.f{background:var(--glass-chip);box-shadow:var(--ring);z-index:2}
.v-b .lane.empty .lh{font:700 var(--t-s)/1 var(--round);color:var(--ink-3)}
.v-b .lane.empty .lh::before{background:var(--ink-3);box-shadow:none;width:8px;height:8px}
.v-b .lane.empty .lh em{background:none;color:var(--ink-3)}

/* ===================== C · Lomo fino ===================== */
/* Se queda el lomo de color, pero fino y vivo; el rótulo se lee en horizontal. */
.v-c .lane{border-radius:var(--r-m);background:var(--panel);box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),var(--sh-1);overflow:hidden}
.v-c .lane::before{content:'';position:absolute;left:8px;top:10px;bottom:10px;width:6px;border-radius:3px;background:linear-gradient(180deg,var(--c),var(--c2));box-shadow:0 0 10px color-mix(in srgb,var(--c) 55%,transparent)}
.v-c .lh{position:absolute;left:26px;top:0;bottom:0;width:120px;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
.v-c .lh svg{display:none}
.v-c .lh span{font:800 var(--t-l)/1.1 var(--round);color:var(--cf)}
.v-c .lh em{font:700 var(--t-s)/1 var(--round);font-style:normal;color:var(--ink-2)}
.v-c .lh em small{display:none}
.v-c .lh em::after{content:' juegos'}
.v-c .its{left:150px}
.v-c .it{border-radius:var(--r-s);background:var(--glass-in);box-shadow:inset 0 1px 0 var(--hl-ring),inset 0 0 0 1px var(--line)}
.v-c .it.f{background:var(--glass-chip);box-shadow:var(--ring);z-index:2}
.v-c .lane.run{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,var(--panel)),var(--panel) 40%)}
.v-c .lane.empty::before{top:8px;bottom:8px;width:4px;opacity:.5;box-shadow:none}
.v-c .lane.empty .lh{flex-direction:row;align-items:center;gap:6px}
.v-c .lane.empty .lh span{font:700 var(--t-s)/1 var(--round);color:var(--ink-3)}
.v-c .lane.empty .lh em{color:var(--ink-3)}
.v-c .lane.empty .lh em::before{content:'· '}
.v-c .lane.empty .lh em::after{content:''}

/* ===================== D · Estantes ===================== */
/* Sin caja: cada franja es una balda de cristal sobre el fondo; el rótulo es una pastilla. */
.v-d .board{gap:8px}
.v-d .lane{height:96px}
.v-d .lane::after{content:'';position:absolute;left:150px;right:0;bottom:2px;height:14px;border-radius:var(--r-xs);
  background:linear-gradient(180deg,var(--pill-top),var(--pill-bot));box-shadow:inset 0 1px 0 var(--hl),inset 0 -2px 0 color-mix(in srgb,var(--c) 70%,transparent),0 0 0 1px var(--line),0 10px 16px -10px rgba(40,50,70,.5);z-index:0}
.v-d .lh{position:absolute;left:0;top:50%;transform:translateY(-50%);height:40px;padding:0 14px 0 6px;border-radius:var(--r-pill);background:linear-gradient(180deg,var(--pill-top),var(--pill-bot));box-shadow:inset 0 1px 0 var(--pill-glow),0 0 0 1px var(--line),0 8px 18px -10px rgba(20,30,50,.35);
  font:800 var(--t-m)/1 var(--round);color:var(--ink);max-width:150px}
.v-d .lh svg{width:28px;height:28px;padding:5px;border-radius:50%;color:#fff;background:var(--cf);stroke-width:2.4}
.v-d .lh span{white-space:nowrap}
.v-d .lh em small{display:none}
.v-d .lh em{margin-left:2px;font:700 var(--t-s)/1 var(--round);font-style:normal;color:var(--ink-2)}
.v-d .its{left:162px;bottom:12px;align-items:flex-end;z-index:1;overflow:visible;-webkit-mask:none;mask:none}
.v-d .its{overflow:hidden;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 40px),transparent);padding-top:8px}
.v-d .it{height:80px;border-radius:var(--r-s) var(--r-s) 0 0}
.v-d .it .cv i{box-shadow:0 0 0 1px var(--line),0 6px 10px -6px rgba(20,30,50,.6)}
.v-d .it.f{background:var(--glass-chip);box-shadow:var(--ring);transform:translateY(-4px);z-index:2}
.v-d .lane.empty{height:32px}
.v-d .lane.empty::after{display:none}
.v-d .lane.empty .lh{height:30px;font:700 var(--t-s)/1 var(--round);color:var(--ink-3);background:none;box-shadow:none;padding-left:10px}
.v-d .lane.empty .lh svg{width:20px;height:20px;padding:3px;background:var(--ink-3)}
#stage[data-theme=dark] .it.f{background:color-mix(in srgb,var(--cf) 28%,#1d212b)}

/* ---------- Portadas más grandes (se combina con cualquier variante) ---------- */
/* «grandes»: huecos de 8, Terminado en una franja compacta y la portada ocupa todo el alto de la tarjeta. */
.pg .board,.pm .board{gap:8px}
.pg .lane,.pm .lane{flex:1 1 0;height:auto}
.pg .lane.done,.pm .lane.done{flex:none;height:72px}
.pg .lane.empty,.pm .lane.empty{flex:none;height:30px}
.pg .its,.pm .its{top:4px;bottom:4px}
.pg .it,.pm .it{height:100%;padding:4px 12px 4px 4px}
.pg .cv,.pm .cv{height:100%;width:auto;aspect-ratio:2/3;padding:0}
.pg .done .tx b,.pm .done .tx b{-webkit-line-clamp:1}
/* «máximas»: además, las pestañas suben a la barra de arriba y el tablero empieza en y=88. */
.pm .sx{top:16px;left:auto;right:120px}
.pm .board{top:88px;height:556px}
.pm .tx{width:124px}
.pm .tx b{font-size:var(--t-m)}
</style>
</head>
<body>
<div class="tool"><b>Mi lista · propuestas</b>
  <span id="vbtns"></span>
  <button id="port">Portadas: hoy</button>
  <button id="vacia">Franja vacía: no</button>
  <button id="tema">Tema: claro</button>
</div>
<div class="desc" id="desc"></div>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-run" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
  <symbol id="i-mid" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
  <symbol id="i-pend" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="i-park" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></symbol>
  <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2h-4v6l-1 1-1-1v-6H7v-2l3-3z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-chk" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</defs></svg>

<div class="hold"><div id="stage" class="m v-a" data-theme="light">
  <div class="bg"><div class="blob" style="left:-140px;top:-180px;width:640px;height:640px;--b:var(--b1)"></div><div class="blob" style="right:-160px;top:200px;width:580px;height:580px;--b:var(--b2)"></div><div class="blob" style="left:30%;bottom:-280px;width:640px;height:640px;--b:var(--b3)"></div></div>
  <div class="top"><div class="av"></div><div class="pill crumb"><span>Inicio</span><span class="sep">›</span><span class="cur">Juegos PC</span></div><span class="hr">18:42</span></div>
  <div class="sx"><div class="gl"><span class="gem">Mi lista</span><span class="o">Colecciones</span><span class="o">Catálogo</span></div></div>
  <div class="board" id="board"></div>
  <div class="hints">
    <div class="pill hint"><span class="btn a">A</span>Abrir</div>
    <div class="pill hint"><span class="btn x">X</span>Fijar</div>
    <div class="pill hint"><span class="btn y">Y</span>Estado</div>
    <div class="pill hint"><span class="btn b">B</span>Volver</div>
  </div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');
const IM = n => `../estadisticas/capturas/${n}.png`;
// Franjas de BAND_DEF, con su posición fija en el arcoíris (rojo, naranja, verde, azul, violeta).
const LANES = [
  { k:'run',  n:'En marcha', ic:'i-run',  c:'--arc-rojo',    c2:'--arc-naranja', h:20,  items:[
    ['Hades','a1','12 h · hoy',{pin:1}],['Elden Ring','b1','86 h · ayer'],['Balatro','c1','34 h · hace 3 días']]},
  { k:'mid',  n:'A medias',  ic:'i-mid',  c:'--arc-naranja', c2:'--arc-amarillo', h:52,  items:[
    ['Persona 5 Royal','b2','48 h · hace 12 días',{warn:6}],['Outer Wilds','c2','9 h · hace 20 días'],['Hollow Knight','a2','22 h · hace 25 días'],['Disco Elysium',null,'14 h · hace 18 días'],['Celeste','b3','5 h · hace 1 mes'],['Tunic','a1','3 h · hace 1 mes']]},
  { k:'pend', n:'Pendiente', ic:'i-pend', c:'--arc-verde',   c2:'--arc-azul', h:146, items:[
    ["Baldur's Gate 3",'c1','sin empezar'],['Pentiment','a2','sin empezar'],['Inscryption',null,'sin empezar'],['Cocoon','b1','sin empezar'],['Sea of Stars','c2','sin empezar'],['Chained Echoes','b3','sin empezar']]},
  { k:'park', n:'Aparcado',  ic:'i-park', c:'--arc-azul',    c2:'--arc-anil', h:232, items:[
    ['Cyberpunk 2077','b2','31 h · hace 5 meses'],['Starfield','a1','abandonado'],['Death Stranding','c1','18 h · hace 1 año']]},
];
const VARS = {
  'v-act':['Hoy','La pantalla actual, para comparar. Lomo de color macizo con el rótulo girado en mayúsculas, cada franja teñida de su color, cada juego en su propia tarjeta de cristal y Aparcado y Terminado apagados en gris.',
    ['Es la única pantalla con texto vertical y bloques de color macizo: el arcoíris pesa más que las portadas.','Cinco fondos teñidos a la vez; en el resto de la app el color de identidad es pequeño y va con su nombre (guía §3.4).','Cristal sobre cristal y sombras escritas a mano en vez de .glass / .glass-in (guía §6).','El gris de Aparcado y Terminado no se usa en ninguna otra pantalla.']],
  'v-a':['A · Chips','Cada franja es un panel neutro, igual que los chips de Estadísticas: icono de trazo en el color del estado, rótulo en gris y la cifra grande debajo. El color solo aparece en el icono y en el brillo del foco; los juegos son paneles interiores.',
    ['La más cercana a Estadísticas y Panorama.','Se lee el recuento de un vistazo.','Nada apagado: Terminado se distingue por la marca violeta.']],
  'v-b':['B · Un solo panel','Las cinco franjas dentro de un mismo panel de cristal, separadas por líneas finas, como una tabla. Un punto de color y una etiqueta con el número; los juegos van sin tarjeta y solo el enfocado lleva cristal.',
    ['La más tranquila: un único cristal en pantalla.','Las portadas mandan; el color es solo un punto.','Se parece a las filas de Ajustes y a la lista de Terminados.']],
  'v-c':['C · Lomo fino','Se queda el lomo de color, que es lo más reconocible de hoy, pero fino y con el color vivo y su brillo. El rótulo pasa a horizontal, en el color de texto del estado, con el recuento debajo. «En marcha» lleva un tinte muy suave.',
    ['El cambio más pequeño: se reconoce la pantalla de hoy.','Usa el acento vivo como en los gráficos (guía §3.2): trazo con brillo, sin texto encima.']],
  'v-d':['D · Estantes','Sin cajas: cada franja es una balda de cristal sobre el fondo y los juegos están de pie encima. El rótulo es una pastilla con el icono en un círculo de color; la balda lleva un filo del mismo color.',
    ['La más «Wii U»: deja ver el fondo con sus manchas de color.','Al enfocar, el juego se levanta de la balda.','Encaja con la idea de «estantería» que ya usa Terminados.']],
};
let V = 'v-a', empty = false, focus = { l:0, i:0 };

function render() {
  const lanes = LANES.map(l => empty && l.k === 'park' ? { ...l, items:[] } : l);
  $('#board').innerHTML = lanes.map((l, li) => {
    const games = l.items.filter(x => typeof x[0] === 'string');
    const st = `--c:var(${l.c});--c2:var(${l.c2});--cf:oklch(0.52 0.15 ${l.h});--f1:oklch(0.52 0.15 ${l.h});--f2:oklch(0.52 0.15 ${l.h + 20});--g1:oklch(0.80 0.12 ${l.h});--g2:oklch(0.80 0.12 ${l.h + 20})`;
    const head = `<header class="lh"><svg><use href="#${l.ic}"/></svg><span>${l.n}</span><em>${games.length}<small>${games.length === 1 ? 'juego' : 'juegos'}</small></em></header>`;
    if (!games.length) return `<section class="lane empty ${l.k}" style="${st}">${head}</section>`;
    let gi = 0;
    const its = l.items.map(x => {
      if (typeof x[0] === 'number') return `<div class="ys">${x[0]}</div>`;
      const [name, im, meta, o = {}] = x, i = gi++;
      const cov = im ? `<i style="background-image:url(${IM(im)})"></i>` : `<i class="na">${name}</i>`;
      const bd = o.pin ? '<span class="bd"><svg><use href="#i-pin"/></svg></span>' : l.k === 'done' ? '<span class="bd"><svg><use href="#i-chk"/></svg></span>' : '';
      const extra = o.warn ? `<span class="w"><svg><use href="#i-clock"/></svg>Aparca en ${o.warn} d</span>` : o.pin ? '<span class="p">Fijado</span>' : '';
      return `<div class="it${focus.l === li && focus.i === i ? ' f' : ''}" data-l="${li}" data-i="${i}"><div class="cv">${cov}${bd}</div><div class="tx"><b>${name}</b><small>${meta}</small>${extra}</div></div>`;
    }).join('');
    return `<section class="lane ${l.k}" style="${st}">${head}<div class="its">${its}</div></section>`;
  }).join('');
  // El acento de la pestaña sigue al estado enfocado, como en la app.
  const fl = lanes[focus.l];
  const h = fl.h;
  ['--f1',`oklch(0.52 0.15 ${h})`,'--f2',`oklch(0.52 0.15 ${h + 20})`,'--g1',`oklch(0.80 0.12 ${h})`,'--g2',`oklch(0.80 0.12 ${h + 20})`,
   '--gf',`linear-gradient(115deg,oklch(0.52 0.15 ${h}),oklch(0.52 0.15 ${h + 20}))`,'--acc',`oklch(0.52 0.15 ${h})`,
   '--b1','oklch(0.80 0.12 232)','--b2','oklch(0.80 0.12 268)','--b3',`oklch(0.80 0.12 ${h})`,'--on','#fff'].forEach((v, k, a) => { if (k % 2 === 0) stage.style.setProperty(v, a[k + 1]); });
}
function counts() { return LANES.map(l => empty && l.k === 'park' ? 0 : l.items.filter(x => typeof x[0] === 'string').length); }
function move(dl, di) {
  const c = counts();
  if (di) { focus.i = Math.max(0, Math.min(c[focus.l] - 1, focus.i + di)); }
  else { let l = focus.l + dl; while (l >= 0 && l < c.length && !c[l]) l += dl; if (l >= 0 && l < c.length) { focus.l = l; focus.i = Math.min(focus.i, c[l] - 1); } }
  render();
  const el = $('.it.f'); if (el) { const box = el.closest('.its'); box.scrollTo({ left: Math.max(0, el.offsetLeft - box.clientWidth / 2), behavior:'smooth' }); }
}
document.addEventListener('keydown', e => {
  const m = { ArrowLeft:[0,-1], ArrowRight:[0,1], ArrowUp:[-1,0], ArrowDown:[1,0] }[e.key];
  if (m) { e.preventDefault(); move(...m); }
});
$('#board').addEventListener('click', e => { const it = e.target.closest('.it'); if (it) { focus = { l:+it.dataset.l, i:+it.dataset.i }; render(); } });
function setV(v) {
  V = v; stage.className = 'm ' + v + (typeof P !== 'undefined' && PORT[P][0] ? ' ' + PORT[P][0] : '');
  const [t, p, li] = VARS[v];
  $('#desc').innerHTML = `<h2>${t}</h2><p>${p}</p><ul>${li.map(x => `<li>${x}</li>`).join('')}</ul>`;
  [...$('#vbtns').children].forEach(b => b.classList.toggle('on', b.dataset.v === v));
  try { history.replaceState(null, '', '#' + v.slice(2)); } catch (e) {}
}
Object.keys(VARS).forEach(v => { const b = document.createElement('button'); b.dataset.v = v; b.textContent = VARS[v][0].split(' · ')[0]; b.onclick = () => setV(v); $('#vbtns').appendChild(b); $('#vbtns').append(' '); });
$('#tema').onclick = () => { const d = stage.dataset.theme !== 'dark'; stage.dataset.theme = d ? 'dark' : 'light'; document.body.classList.toggle('dk', d); $('#tema').textContent = 'Tema: ' + (d ? 'oscuro' : 'claro'); };
const PORT=[['','hoy'],['pg','grandes'],['pm','máximas']]; let P=0;
$('#port').onclick = () => { P=(P+1)%3; setV(V); $('#port').textContent='Portadas: '+PORT[P][1]; };
$('#vacia').onclick = () => { empty = !empty; if (empty && focus.l === 3) focus = { l:0, i:0 }; $('#vacia').textContent = 'Franja vacía: ' + (empty ? 'sí' : 'no'); render(); };
const fit = () => document.documentElement.style.setProperty('--k', Math.min(1, (window.innerWidth - 32) / 1280));
window.addEventListener('resize', fit); fit();
const h0 = location.hash.slice(1); setV(VARS['v-' + h0] ? 'v-' + h0 : 'v-a');
render();
</script>
</body>
</html>
