0;--grad:linear-gradient(115deg,#00A0D8,#3F63E0);--f1:#0089be;--f2:#3253c5;--gf:linear-gradient(115deg,#0089be,#3253c5);--on:#ffffff;user-select:none;-webkit-user-select:none}\n\n#stage:focus-visible{box-shadow:inset 0 0 0 4px var(--acc)}\n\n/* ---------- Tokens del sistema (v5) ----------\n\n   Superficies, texto, radios, tipograf\u00eda y cristal. Las pantallas usan estas variables en vez de hex fijos;\n\n   el color de cada secci\u00f3n / juego llega por --g1 --g2 --grad (suaves) y --f1 --f2 --gf --on (rellenos),\n\n   que App.svelte calcula desde la atm\u00f3sfera. --acc = --f1 para todo lo antiguo. */\n\n#stage{\n\n  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#8a92a1;--line:rgba(95,110,135,.24);--line-2:rgba(150,160,180,.35);\n\n  --face:#dfe3e9;--face-hi:rgba(247,249,252,.94);--panel:rgba(255,255,255,.75);--scrim:rgba(20,26,36,.45);\n\n  --glass-top:rgba(255,255,255,.72);--glass-mid:rgba(255,255,255,.30);--glass-bot:rgba(225,234,246,.22);\n\n  --glass-in:rgba(255,255,255,.55);--glass-chip:rgba(255,255,255,.80);\n\n  --ok:#3BB54A;--bad:#E8384F;--warn:#F2B807;\n\n  --r-xs:6px;--r-s:12px;--r-m:18px;--r-l:28px;--r-pill:999px;\n\n  --t-xs:11px;--t-s:13px;--t-m:15px;--t-l:17px;--t-xl:20px;--t-2xl:28px;--t-3xl:44px;\n\n  --ring:0 0 0 3px var(--f1),0 0 22px 2px color-mix(in srgb,var(--f2) 45%,transparent);\n\n}\n\n/* \u00abNoche ahumada\u00bb: modo oscuro oficial (ne\u00f3n). Solo redefine tokens; las reglas no cambian. */\n\n#stage[data-theme=dark]{color-scheme:dark;color:#e6e9f0;background:#14161c;\n\n  --ink:#e6e9f0;--ink-2:#b4bccb;--ink-3:#7f8899;--line:rgba(200,210,235,.16);--line-2:rgba(200,210,235,.24);\n\n  --face:#262a33;--face-hi:rgba(30,33,41,.94);--panel:rgba(30,34,43,.78);--scrim:rgba(0,0,0,.6);\n\n  --glass-top:rgba(60,66,80,.62);--glass-mid:rgba(36,40,50,.42);--glass-bot:rgba(20,22,28,.38);\n\n  --glass-in:rgba(255,255,255,.08);--glass-chip:rgba(40,44,56,.82);\n\n  --ring:0 0 0 3px var(--g1),0 0 26px 4px color-mix(in srgb,var(--g2) 60%,transparent);\n\n}\n\n#stage[data-theme=dark] .bg{background:radial-gradient(120% 90% at 50% 0%,#232631 0%,#16181e 60%,#0f1115 100%)}\n\n#stage[data-theme=dark] .blob{opacity:.38}\n\n.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}\n\n/* Sin filter:blur: re-rasterizar el difuminado de cada mancha en cada fotograma (por el movimiento y el\n\n   cambio de color) hac\u00eda parpadear la interfaz. El degradado de tres paradas ya da el borde suave. */\n\n.blob{position:absolute;border-radius:50%;opacity:.55;background:radial-gradient(circle,var(--b,var(--b1)),color-mix(in srgb,var(--b,var(--b1)) 45%,transparent) 35%,transparent 70%);transition:background .6s;animation:drift 26s ease-in-out infinite alternate}\n\n@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,-30px) scale(1.15)}}\n\n\n\n.ghost{position:absolute;width:118px;height:118px;border-radius:28px;padding:10px;box-sizing:border-box;background:rgba(255,255,255,.7);box-shadow:0 0 0 1px rgba(120,130,150,.25),0 10px 18px -10px rgba(40,50,70,.4);filter:blur(5px)}\n\n.ghost i{display:block;width:100%;height:100%;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 30%,white),var(--g));transition:background .6s}\n\n.bokeh{position:absolute;border-radius:50%;filter:blur(2px)}\n\n.screen{position:absolute;inset:0}\n\n\n\n/* glass frame: the core Wii U trait */\n\n/* Translucent acrylic case: blurred backdrop shows through the rim, bright top edge, caustic glow along the bottom,\n\n   one gloss arc that runs across rim AND content, and a sunken content well. */\n\n.glass{position:absolute;--r:28px;--bw:10px;border-radius:var(--r);padding:var(--bw);box-sizing:border-box;cursor:pointer;isolation:isolate;\n\n  background:linear-gradient(180deg,var(--glass-top) 0%,var(--glass-mid) 46%,var(--glass-bot) 100%);\n\n  -webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);\n\n  box-shadow:\n\n    inset 0 1.5px 0 rgba(255,255,255,1),\n\n    inset 0 0 0 1px rgba(255,255,255,.55),\n\n    inset 0 -10px 14px -8px rgba(255,255,255,.95),\n\n    inset 0 -1.5px 0 rgba(110,125,150,.30),\n\n    0 0 0 1px rgba(95,110,135,.24),\n\n    0 2px 3px rgba(40,50,70,.10),\n\n    0 18px 30px -16px rgba(40,50,70,.42);\n\n  transition:transform .24s cubic-bezier(.34,1.32,.64,1),box-shadow .24s ease,background .24s ease}\n\n/* gloss arc over the whole case, content included */\n\n.glass::before{content:'';position:absolute;z-index:2;left:2px;right:2px;top:2px;height:52%;pointer-events:none;\n\n  border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;\n\n  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.20) 55%,rgba(255,255,255,0) 100%);\n\n  -webkit-mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:.85}\n\n/* small specular glint on the upper-left rim */\n\n.glass::after{content:'';position:absolute;z-index:3;left:12%;top:3px;width:34%;height:5px;border-radius:5px;pointer-events:none;\n\n  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,1) 40%,rgba(255,255,255,0));filter:blur(.6px);opacity:.9}\n\n.glass .face{position:relative;z-index:1;width:100%;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);overflow:hidden;background:var(--face)}\n\n.glass .face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;\n\n  box-shadow:inset 0 0 0 1px rgba(20,30,50,.20),inset 0 3px 6px -2px rgba(0,0,0,.35),inset 0 -2px 4px -2px rgba(255,255,255,.5)}\n\n.glass .face img{width:100%;height:100%;object-fit:cover;display:block}\n\n.glass.f{transform:scale(1.06);z-index:3;\n\n  background:linear-gradient(150deg,color-mix(in srgb,var(--g1) 55%,white) 0%,var(--f1) 50%,var(--f2) 100%);\n\n  box-shadow:\n\n    inset 0 1.5px 0 rgba(255,255,255,.95),\n\n    inset 0 0 0 1px color-mix(in srgb,white 45%,transparent),\n\n    inset 0 -10px 14px -8px color-mix(in srgb,var(--g2) 40%,white),\n\n    0 0 0 1px color-mix(in srgb,var(--f2) 75%,black),\n\n    0 0 26px 2px color-mix(in srgb,var(--f1) 45%,transparent),\n\n    0 22px 34px -16px color-mix(in srgb,var(--f2) 70%,black)}\n\n.glass.bump{animation:bump .18s ease-out}\n\n@keyframes bump{0%,100%{translate:0 0}40%{translate:var(--bx,0) var(--by,0)}}\n\n/* shared glass pill for crumbs, hints, info */\n\n.pill{-webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);\n\n  background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.52));\n\n  box-shadow:inset 0 1px 0 var(--glass-top),inset 0 -6px 10px -6px rgba(255,255,255,.9),inset 0 -1px 0 rgba(110,125,150,.22),0 0 0 1px rgba(95,110,135,.22),0 10px 20px -12px rgba(40,50,70,.4)}\n\n@keyframes enterFwd{from{opacity:.5;transform:scale(.975)}to{opacity:1;transform:none}}\n\n@keyframes enterBack{from{opacity:.5;transform:scale(1.025)}to{opacity:1;transform:none}}\n\n.screen.fwd{animation:enterFwd .28s cubic-bezier(.2,.8,.3,1)}\n\n.screen.back{animation:enterBack .28s cubic-bezier(.2,.8,.3,1)}\n\n\n\n/* top bar */\n\n.top{position:absolute;left:0;right:0;top:0;height:76px;z-index:5}\n\n.avatar{left:22px;top:12px;width:60px;height:60px;--r:16px;--bw:5px;cursor:default}\n\n.avatar .face{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 35%,white),var(--acc));display:grid;place-items:center;transition:background .4s}\n\n.crumb{position:absolute;left:98px;top:22px;height:40px;display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:999px;font-size:20px;font-weight:700;color:var(--ink-2);max-width:820px;overflow:hidden}\n\n.crumb span{white-space:nowrap;flex:none}\n\n.crumb .sep{color:var(--ink-3);font-weight:500}\n\n.crumb.withp{max-width:420px}\n\n.crumb .cur{color:var(--acc);transition:color .3s;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}\n\n.clock{position:absolute;right:24px;top:24px;display:flex;gap:14px;align-items:center;font-size:20px;font-weight:700;color:var(--ink-2)}\n\n.clock small{font-size:15px;font-weight:500;color:var(--ink-3)}\n\n.batt{display:flex;gap:2px;align-items:center}\n\n.batt b{width:6px;height:13px;border-radius:2px;background:var(--acc)}\n\n.batt b.off{background:var(--line-2)}\n\n\n\n/* hints */\n\n.hints{position:absolute;right:22px;bottom:16px;display:flex;gap:10px;z-index:5}\n\n.hint{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:999px;font-size:16px;font-weight:700;color:var(--ink-2);cursor:pointer}\n\n.btn{min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--on);--b:var(--ink-2);padding:0 6px;box-sizing:border-box;\n\n  background:linear-gradient(180deg,color-mix(in srgb,var(--b) 55%,white) 0%,var(--b) 55%,color-mix(in srgb,var(--b) 85%,black) 100%);\n\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px color-mix(in srgb,var(--b) 70%,black),0 1px 2px rgba(0,0,0,.2);text-shadow:0 1px 1px rgba(0,0,0,.25)}\n\n.btn.a{--b:var(--ok)}.btn.b{--b:var(--bad)}.btn.x{--b:var(--acc)}.btn.y{--b:var(--warn);color:var(--ink);text-shadow:none}\n\n.btn.sh{border-radius:8px;--b:var(--ink-3)}\n\n\n\n/* home */\n\n.plat{--r:38px;--bw:12px}\n\n.plat .face{background:radial-gradient(120% 100% at 30% 10%,color-mix(in srgb,var(--pc) 22%,white) 0%,var(--pc) 70%,color-mix(in srgb,var(--pc) 80%,black) 100%);display:grid;place-items:center}\n\n.plat svg{width:62%;height:62%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.10)) drop-shadow(0 8px 12px rgba(0,0,0,.22))}\n\n.plabel{position:absolute;width:300px;text-align:center;font-size:28px;font-weight:800;color:var(--ink-2);transition:color .2s}\n\n.plabel small{display:block;font-size:17px;font-weight:500;color:var(--ink-2);margin-top:2px}\n\n.plabel.on{color:var(--pc)}\n\n\n\n/* titles grid */\n\n.ttrack{position:absolute;left:0;top:0;height:100%;transition:transform .35s cubic-bezier(.25,1,.4,1)}\n\n/* Portadas y miniaturas repetidas: sin backdrop-filter. Decenas de desenfoques en vivo (encima del fondo ya difuminado)\n\n   saturan la composici\u00f3n de WebView2 y parpadean al mover el foco o cambiar de pesta\u00f1a; el cristal se ve casi igual. */\n\n.glass.cover,.glass.scov,.glass.bsb,.glass.shot,.glass.vthumb,.glass.pkcov,.glass.dshot,.glass.dcover{-webkit-backdrop-filter:none;backdrop-filter:none}\n\n.cover{width:176px;height:236px;--r:24px;--bw:9px}\n\n.cover .face{border-radius:16px}\n\n.thead{position:absolute;left:96px;top:82px;right:96px;display:flex;align-items:baseline;gap:14px;font-size:26px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden}\n\n.thead span{font-size:18px;font-weight:600;color:var(--ink-2)}\n\n.thead .chip{font-size:15px;font-weight:700;color:var(--on);background:var(--gf);padding:3px 12px;border-radius:999px;align-self:center}\n\n.side{position:absolute;top:300px;width:56px;height:110px;cursor:pointer;z-index:4;filter:drop-shadow(0 8px 10px rgba(40,50,70,.25));transition:opacity .2s}\n\n.side svg{width:100%;height:100%}\n\n.side.off{opacity:0;pointer-events:none}\n\n\n\n/* carousel */\n\n.ctrack{position:absolute;left:0;top:200px;height:320px;transition:transform .32s cubic-bezier(.25,1,.4,1)}\n\n.ccover{width:200px;height:266px;--r:26px;--bw:10px;top:20px}\n\n.ccover:not(.f){opacity:.78}\n\n.ccover.f{transform:scale(1.32)}\n\n.cinfo{position:absolute;left:0;right:0;top:560px;text-align:center}\n\n.cinfo h3{margin:0;font-size:34px;font-weight:800;color:var(--ink)}\n\n.cinfo p{margin:4px 0 0;font-size:18px;color:var(--ink-2);font-weight:500}\n\n\n\n/* shots grid */\n\n.ghead{position:absolute;left:68px;right:68px;top:90px;height:70px;display:flex;align-items:center;gap:18px}\n\n.mini{position:relative;width:52px;height:70px;--r:12px;--bw:4px;cursor:default;flex:none}\n\n.ghead h3{margin:0;font-size:28px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n\n.ghead .chip{font-size:15px;font-weight:700;color:var(--on);background:var(--gf);padding:4px 12px;border-radius:999px;white-space:nowrap}\n\n.ghead .soft{font-size:15px;font-weight:700;color:var(--ink-2);background:var(--panel);box-shadow:0 0 0 1px var(--line-2);padding:4px 12px;border-radius:999px;white-space:nowrap}\n\n.ghead .date{margin-left:auto;font-size:17px;color:var(--ink-2);font-weight:600;white-space:nowrap}\n\n.gview{position:absolute;left:0;right:0;top:172px;height:480px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 18px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(transparent 0,#000 18px,#000 calc(100% - 22px),transparent)}\n\n.gtrack{position:absolute;left:0;right:0;top:0;transition:transform .28s cubic-bezier(.25,1,.4,1)}\n\n.shot{width:266px;height:162px;--r:18px;--bw:6px}\n\n.shot .face{border-radius:13px}\n\n.star{position:absolute;right:8px;top:8px;width:26px;height:26px;display:none}\n\n.shot.fav .star,.vstar.on{display:block}\n\n.sbar{position:absolute;right:30px;top:190px;width:6px;height:440px;border-radius:9px;background:linear-gradient(180deg,var(--f1),var(--f2))}\n\n.sbar.rb{background:var(--rby);transition:background .4s}\n\n.sbar em{position:absolute;left:-3px;font-style:normal;font-size:11px;font-weight:800;color:var(--ink-3)}\n\n.sbar i{position:absolute;left:-4px;width:14px;border-radius:9px;background:#fff;box-shadow:0 3px 10px -2px rgba(30,40,60,.4);transition:top .3s}\n\n\n\n/* viewer */\n\n.vw{position:absolute;inset:0;background:#1a1d24;overflow:hidden}\n\n.vbg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(60px) brightness(.62) saturate(1.3);transition:background-image .4s ease}\n\n.vw::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45))}\n\n.vframe{position:absolute;left:148px;top:66px;width:984px;height:553px;--r:22px;--bw:7px;cursor:default;transform:none !important}\n\n.vframe .face{border-radius:16px;background:#000}\n\n.vframe::before,.vthumb::before{display:none}\n\n.vframe img{position:absolute;inset:0;object-fit:contain}\n\n.vframe img.in-r{animation:inr .26s cubic-bezier(.25,1,.4,1)}\n\n.vframe img.in-l{animation:inl .26s cubic-bezier(.25,1,.4,1)}\n\n@keyframes inr{from{transform:translateX(70px);opacity:0}to{transform:none;opacity:1}}\n\n@keyframes inl{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}\n\n.varrow{position:absolute;top:304px;width:76px;height:76px;border-radius:50%;cursor:pointer;display:grid;place-items:center;z-index:4;\n\n  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.18));-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);\n\n  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -8px 12px -8px rgba(255,255,255,.8),0 0 0 1px rgba(255,255,255,.35),0 12px 24px -10px rgba(0,0,0,.6);transition:opacity .3s,transform .15s}\n\n.varrow:active{transform:scale(.94)}\n\n.varrow svg{width:34px;height:34px}\n\n.varrow.dis{opacity:.25}\n\n.vinfo{position:absolute;left:24px;top:14px;max-width:720px;display:flex;gap:14px;align-items:center;height:38px;padding:0 18px;border-radius:999px;font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;z-index:4;transition:opacity .3s}\n\n.vinfo .n{color:var(--acc);font-size:19px}\n\n.vinfo .dim{color:var(--ink-2);font-weight:600}\n\n.vstar{width:22px;height:22px;display:none}\n\n.vstrip{position:absolute;left:0;right:0;bottom:0;height:82px;z-index:4;transition:opacity .3s;overflow:hidden;\n\n  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}\n\n.vtrack{position:absolute;top:0;left:0;height:100%;transition:transform .26s cubic-bezier(.25,1,.4,1)}\n\n.vthumb{width:104px;height:62px;--r:11px;--bw:4px;top:10px}\n\n.vthumb:not(.f){opacity:.85}\n\n.vthumb .face{border-radius:8px}\n\n.vthumb.f{transform:scale(1.12)}\n\n.vw .hints{top:14px;bottom:auto;right:24px;transition:opacity .3s}\n\n.vw .hint{height:34px;font-size:15px}\n\n.vw.idle .vinfo,.vw.idle .vstrip,.vw.idle .varrow,.vw.idle .hints{opacity:0}\n\n.vzoom{position:absolute;inset:0;transform-origin:50% 50%}\n\n/* Modo \u00absolo imagen\u00bb (View): la imagen llena la ventana y no queda nada de interfaz. */\n\n.vw.bare{background:#000}\n\n.vw.bare .vbg,.vw.bare .vinfo,.vw.bare .vstrip,.vw.bare .varrow,.vw.bare .hints{display:none}\n\n.vw.bare::after{display:none}\n\n.vw.bare .vframe{left:0;top:0;width:1280px;height:720px;--r:0px;--bw:0px;background:#000;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}\n\n.vw.bare .vframe::after,.vw.bare .vframe .face::after{display:none}\n\n.vw.bare .vframe .face{border-radius:0}\n\n#toast{position:absolute;left:50%;bottom:74px;transform:translate(-50%,10px);padding:10px 20px;border-radius:999px;background:rgba(40,46,58,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px -10px rgba(0,0,0,.5);color:var(--on);font-size:17px;font-weight:700;opacity:0;transition:all .2s;z-index:50;pointer-events:none;white-space:normal;max-width:1000px;text-align:center}\n\n#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;cursor:pointer}\n\n@media (prefers-reduced-motion: reduce){.glass,.ttrack,.ctrack,.gtrack,.vtrack{transition:none}.vframe img{animation:none!important}.blob{animation:none}}\n\n\n\n/* ---------- A\u00f1adidos de la app (no estaban en el mockup) ---------- */\n\n.screen > *{will-change:auto}\n\n.note{position:absolute;transform:translateX(-50%);width:max-content;max-width:900px;padding:10px 22px;border-radius:26px;font-size:17px;font-weight:600;line-height:1.35;color:var(--ink-2);text-align:center;white-space:normal;overflow-wrap:anywhere;z-index:6}\n\n.glass img{ const BASE = JSON.parse(document.getElementById('base').textContent);
const grid = document.getElementById('grid');
function mount(frame, v){
  const f = document.createElement('iframe');
  f.srcdoc = BASE.replace('</head>', '<style>' + v.css + '</style></head>');
  frame.appendChild(f);
  const fit = () => { f.style.transform = `scale(${frame.clientWidth / 1280})`; };
  new ResizeObserver(fit).observe(frame); fit();
}
for (const v of V) {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `<div class="head"><b>${v.name}</b><span>${v.sub}</span>${v.tag ? `<em class="tag">${v.tag}</em>` : ''}</div><div class="frame"></div>` +
    (v.notes.length ? `<ul>${v.notes.map(n => `<li>${n}</li>`).join('')}</ul>` : '<ul><li>Cómo está hoy.</li></ul>');
  const fr = c.querySelector('.frame');
  mount(fr, v);
