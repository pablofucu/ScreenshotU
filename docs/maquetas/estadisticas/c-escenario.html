<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estadísticas · Escenario</title><style>
:root{--ink:#3a414e;--ink-2:#5f6776;--ink-3:#8a92a1;--line:rgba(60,70,90,.12);--f1:#5b5bd6;--v1:#7b6cf6;
--pc:#2f8fe0;--sw:#e0405a;--vn:#d98a1c;--ok:#2fa84f;--fin:#8b5cf6;--glass:rgba(255,255,255,.72);--glass-in:rgba(240,243,250,.9);
--r:18px;--r-s:10px;--round:'M PLUS Rounded 1c','Nunito','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:#dfe3ee;font-family:var(--round);color:var(--ink)}
.wrap{width:100vw;height:calc(100vw * 720 / 1280);max-height:100vh;max-width:calc(100vh * 1280 / 720);margin:0 auto;position:relative;overflow:hidden}
.cv{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;
background:radial-gradient(900px 500px at 80% -10%,#e9e3ff 0,transparent 60%),radial-gradient(700px 400px at 0% 100%,#e3f0ff 0,transparent 60%),#f3f4f9;overflow:hidden}
.top{position:absolute;left:24px;right:24px;top:16px;height:40px;display:flex;align-items:center;gap:12px}
.crumb{background:var(--glass);border-radius:999px;padding:8px 18px;font-weight:700;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.crumb b{color:var(--f1)}.clock{margin-left:auto;font-weight:800;font-size:18px}
.bar{position:absolute;left:24px;right:24px;top:68px;height:36px;display:flex;align-items:center;gap:12px}
.cat{font-weight:800;font-size:15px}
.per{display:flex;align-items:center;gap:6px;background:var(--glass);border-radius:999px;padding:4px 6px;font-weight:800;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.per span{padding:2px 14px}.per i{width:22px;height:22px;display:grid;place-items:center;color:var(--f1);font-style:normal}
.tabs{margin-left:auto;display:flex;gap:2px;background:var(--glass);border-radius:999px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs button{all:unset;cursor:pointer;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink-2)}
.tabs button.on{background:linear-gradient(180deg,#7d7cf0,#5b5bd6);color:#fff}
.stage{position:absolute;left:24px;right:24px;top:116px;height:528px}
.hints{position:absolute;right:24px;bottom:13px;display:flex;gap:10px}
.hint{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:999px;background:var(--glass);font-size:15px;font-weight:700;color:var(--ink-2);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.k{min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:#6b7280;padding:0 6px}
.k.a{background:var(--ok);border-radius:50%}.k.b{background:#d92c44;border-radius:50%}.k.y{background:#f2b632;color:var(--ink);border-radius:50%}
.kp{display:flex;gap:2px}.kp .k{height:22px;min-width:28px;font-size:11px;background:#8a92a1;border-radius:9px 9px 4px 4px}.kp .k.t{border-radius:4px 4px 9px 9px}
.g{background:var(--glass);border-radius:var(--r);box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(40,50,80,.08),0 0 0 1px rgba(255,255,255,.6);padding:14px 16px;position:relative}
.g.f{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--f1),0 8px 20px rgba(91,91,214,.25)}
.lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.lab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.big{font-size:40px;font-weight:900;line-height:1}.big small{font-size:17px;font-weight:800;margin-left:3px}
.mid{font-size:26px;font-weight:900;line-height:1}.mid small{font-size:14px;margin-left:2px}
.sub{font-size:13px;color:var(--ink-2);font-weight:700}
.cov{border-radius:6px;position:relative;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.18);flex:none}
.cov b{position:absolute;left:4px;right:4px;bottom:3px;font-size:9px;color:#fff;font-weight:800;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cov:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--c,transparent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--glass-in);color:var(--ink-2)}
.note{position:fixed;left:8px;bottom:8px;font:600 12px var(--round);color:#556;background:#fff;padding:6px 10px;border-radius:8px;opacity:.9}

.lay{display:grid;grid-template-columns:1fr 300px;gap:12px;height:100%}
.side{display:grid;gap:10px;align-content:start}
.side .g{padding:10px 14px;display:flex;align-items:center;gap:12px}
.side .g .v{margin-left:auto;text-align:right}
.side .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--glass-in);color:var(--f1)}
.side .ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.quad{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:10px;height:calc(100% - 40px)}
.quad>div{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.quad h4{margin:0 0 8px;display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:900}
.quad h4 span{font-size:12px;color:var(--ink-2);font-weight:700}
.quad .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.quad .it{display:flex;flex-direction:column;align-items:center;gap:3px}
.quad .it .d{font-size:10px;font-weight:800;color:var(--ink-2)}
</style></head><body>
<div class="wrap"><div class="cv">
<div class="top"><div class="crumb"></div><div class="clock">17/11 · 15:23</div></div>
<div class="bar"><div class="cat"></div><div class="per"><i>&lsaquo;</i><span></span><i>&rsaquo;</i></div><div class="tabs"></div></div>
<div class="stage" id="st"></div><div class="hints" id="hn"></div>
</div></div><div class="note">C · Escenario: un gráfico grande a la izquierda y una columna fija de cifras a la derecha.</div>
<script>
const ICON={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',fire:'<path d="M12 3c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-7z"/>',
cam:'<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7l2-3h4l2 3"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 20h8"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
up:'<path d="M5 16l7-7 7 7"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${ICON[n]}</svg>`;
const CATS={pc:{n:'Juegos PC',c:'var(--pc)'},sw:{n:'Juegos Switch',c:'var(--sw)'},vn:{n:'Novelas visuales',c:'var(--vn)'}};
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const FIN=[ // terminados de 2026: mes (0-11), día, categoría, título, horas, tono
 [0,18,'vn','Clannad',41,200],[1,9,'pc','Stardew Valley',62,95],[2,22,'pc','Hades II',38,10],[3,30,'vn','Steins;Gate',33,170],
 [4,14,'sw','Super Mario Odyssey',24,0],[5,2,'pc','Outer Wilds',19,30],[6,19,'sw','Zelda: Tears of the Kingdom',120,140],
 [7,11,'pc','Celeste',14,320],[7,27,'vn','Higurashi',28,350],[8,30,'pc','Balatro',48,280],[9,15,'sw','Pikmin 4',22,110],[10,8,'pc','Hollow Knight',44,230]];
const cover=(f,w,h)=>`<div class="cov" style="width:${w}px;height:${h}px;--c:${CATS[f[2]].c};background:linear-gradient(160deg,hsl(${f[5]},60%,62%),hsl(${f[5]+40},55%,32%))"><b>${f[3]}</b></div>`;
const SEAS=[['Invierno',[0,1,11],'#dbeafe'],['Primavera',[2,3,4],'#dcfce7'],['Verano',[5,6,7],'#fef3c7'],['Otoño',[8,9,10],'#ffe4d6']];
const WEEK={tot:'11 h 40 min',prev:'9 h 05 min',days:[1,1,0,1,1,1,0],streak:12,shots:37,best:['Vida tranquila','Hades II','0,9 %'],
 cats:[['pc','6 h 10 min',[60,90,0,40,80,70,0],['Hades II','Hollow Knight']],['sw','3 h 20 min',[0,30,0,50,0,90,0],['Pikmin 4']],['vn','2 h 10 min',[30,0,0,40,20,40,0],['Higurashi']]]};
const PANO={hours:449,goal:[38,60],days:5,week:'4 h 20 min',longest:['2 h 59 min','Hades II','vie 19 jun'],mile:[9,10,'Elden Ring'],shots:552,fav:'18 h',fav2:'de 18 a 21 h'};
function heat(cols,rows,cell,gap){let s='';let seed=7;for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){seed=(seed*9301+49297)%233280;const v=seed/233280;const l=v<.35?0:v;s+=`<rect x="${c*(cell+gap)}" y="${r*(cell+gap)}" width="${cell}" height="${cell}" rx="2" fill="${l?`rgba(47,143,224,${.15+l*.85})`:'rgba(60,70,90,.07)'}"/>`}return s}
function fit(){const w=document.querySelector('.wrap');document.querySelector('.cv').style.transform=`scale(${w.clientWidth/1280})`}
addEventListener('resize',fit);
let TAB='fin';
const TABN={week:'Semana',fin:'Terminados',pano:'Panorama'};
function frame(){
 document.querySelector('.tabs').innerHTML=Object.entries({week:'Semana',fin:'Terminados',pano:'Panorama',streak:'Rachas',rank:'Clasificación',cal:'Calendario',year:'Resumen anual'})
  .map(([k,v])=>`<button class="${k===TAB?'on':''}" ${TABN[k]?`onclick="TAB='${k}';draw()"`:'disabled style="opacity:.55;cursor:default"'}>${v}</button>`).join('');
 document.querySelector('.crumb').innerHTML=`Inicio › Estadísticas › <b>${TABN[TAB]}</b>`;
 document.querySelector('.cat').textContent=TAB==='pano'?'Juegos PC':'Todas las categorías';
 document.querySelector('.per span').textContent=TAB==='week'?'Esta semana':TAB==='fin'?'2026':'Siempre';
}

const kp=(a,b,t)=>`<span class="kp"><span class="k${t?' t':''}">${a}</span><span class="k${t?' t':''}">${b}</span></span>`;const kk=(c,t)=>`<span class="k ${c}">${t}</span>`;
const side=(rows)=>`<div class="side">${rows.map(([i,l,v,s,f])=>`<div class="g ${f?'f':''}"><div class="ico">${ic(i)}</div><div class="sub">${l}</div><div class="v"><div class="mid" style="font-size:22px">${v}</div>${s?`<div class="sub" style="font-size:11px">${s}</div>`:''}</div></div>`).join('')}</div>`;
const VIEWS={
fin(){return `<div class="lay"><div class="g f" style="padding:14px 16px"><div class="ptitle" style="display:flex;align-items:baseline;gap:10px;font-size:20px;font-weight:900;margin-bottom:10px">El año por estaciones<span class="sub">cada portada, en la estación en que la terminaste</span></div>
 <div class="quad">${SEAS.map(([n,ms,bg])=>{const fs=FIN.filter(f=>ms.includes(f[0]));const h=fs.reduce((a,f)=>a+f[4],0);
 return `<div style="background:${bg}"><h4>${n}<span>${ms.map(m=>MON[m]).join(' · ')} · ${fs.length} ${fs.length===1?'título':'títulos'} · ${h} h</span></h4><div class="row">${fs.map(f=>`<div class="it">${cover(f,80,106)}<div class="d">${f[1]} ${MON[f[0]]} · ${f[4]} h</div></div>`).join('')}</div></div>`}).join('')}</div></div>
 ${side([['check','Terminados','12','en 2026'],['up','Frente a 2025','+3','9 el año pasado'],['trophy','El último','Hollow Knight','8 nov · 44 h'],['clock','Horas hasta acabarlos','493 h','41 h de media'],['star','Más rápido','Celeste','14 h'],['cal','Mejor estación','Verano','4 títulos']])}</div>`},
pano(){return `<div class="lay"><div style="display:grid;grid-template-rows:1fr 190px;gap:12px">
 <div class="g f" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:18px 24px">
  <div><div class="lab">${ic('clock')}Tiempo jugado · Juegos PC · desde siempre</div><div class="big" style="font-size:88px;margin-top:14px">449<small style="font-size:28px">h</small></div><div class="sub" style="margin-top:8px">en 6 juegos · +4 h esta semana</div></div>
  <div><div class="lab">${ic('up')}Últimas 8 semanas</div><svg viewBox="0 0 300 140" style="width:100%;margin-top:10px"><path d="M0 120 L43 90 L86 100 L129 60 L172 75 L215 40 L258 55 L300 25 L300 140 L0 140Z" fill="rgba(91,91,214,.15)"/><path d="M0 120 L43 90 L86 100 L129 60 L172 75 L215 40 L258 55 L300 25" fill="none" stroke="var(--f1)" stroke-width="3"/></svg></div></div>
 <div class="g"><div class="lab">${ic('grid')}2026 día a día · 210 días con partida</div><svg viewBox="0 0 1180 135" style="width:100%;margin-top:10px">${heat(53,7,17,2.5)}</svg></div></div>
 ${side([['flag','Meta de hoy','38 / 60','faltan 22 min'],['cal','Días esta semana','5 de 7'],['up','Esta semana','4 h 20','+38 %'],['clock','Partida más larga','2 h 59','Hades II · 19 jun'],['flag','Próximo hito','10 h','Elden Ring · 48 min'],['cam','Capturas','552','12 favoritas'],['clock','Hora favorita','18 h','de 18 a 21 h']])}</div>`},
week(){return `<div class="lay"><div class="g f"><div style="display:flex;align-items:baseline;gap:10px;font-size:20px;font-weight:900">La semana por categoría<span class="sub">lunes a domingo; cada una con su color</span></div>
 <div style="display:grid;grid-template-columns:120px repeat(7,1fr);gap:8px;margin-top:20px;align-items:center">
 <div></div>${'Lun Mar Mié Jue Vie Sáb Dom'.split(' ').map(d=>`<div class="sub" style="text-align:center">${d}</div>`).join('')}
 ${WEEK.cats.map(([k,t,d,gs])=>{const c=CATS[k];return `<div><div class="lab" style="color:${c.c}">${c.n}</div><div class="mid" style="font-size:18px;margin-top:4px">${t}</div></div>${d.map(v=>`<div style="height:96px;border-radius:10px;background:rgba(60,70,90,.05);display:flex;align-items:flex-end;padding:4px"><i style="display:block;width:100%;border-radius:6px;background:${c.c};height:${v?Math.max(8,v/90*100):0}%"></i></div>`).join('')}`}).join('')}
 </div></div>
 ${side([['clock','Tiempo total','11 h 40','la pasada: 9 h 05'],['cal','Días activos','5 de 7'],['fire','Racha','12 días'],['cam','Capturas','37'],['star','Lo mejor','Vida tranquila','Hades II · 0,9 %']])}</div>`}};

function hints(){ document.getElementById('hn').innerHTML=[[kp('LB','RB'),'Año'],[kk('y','Y'),'Siguiente'],[kk('b','B'),'Volver']].map(([k,l])=>`<div class="hint">${k}${l}</div>`).join('') }
function draw(){frame();document.getElementById('st').innerHTML=VIEWS[TAB]();hints();fit()}
draw();</script></body></html>
