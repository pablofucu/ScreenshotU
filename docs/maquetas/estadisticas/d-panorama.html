<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D · Panorama</title>
<style>
/* Tema claro «Wii U glass» (tokens de src/app.css: .bg, .blob, .glass, .pill) con paleta arcoíris. Datos inventados. */
:root{--round:'M PLUS Rounded 1c','Nunito','Segoe UI','Yu Gothic UI',system-ui,sans-serif;
  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#8a92a1;--line:rgba(95,110,135,.24);
  --glass-top:rgba(255,255,255,.72);--glass-mid:rgba(255,255,255,.30);--glass-bot:rgba(225,234,246,.22);
  --hl:#fff;--hl-ring:rgba(255,255,255,.55);--hl-bot:rgba(255,255,255,.95);--tile-bg:rgba(255,255,255,.62);
  --pill-top:rgba(255,255,255,.80);--pill-bot:rgba(255,255,255,.52);
  --r1:#FF4D6D;--r2:#FF8A3D;--r3:#F2B807;--r4:#3BB54A;--r5:#00B3A4;--r6:#00A0D8;--r7:#3F63E0;--r8:#8E5BE0;
  --rainbow:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6),var(--r7),var(--r8));
  --k:#00A0D8;--k2:#3F63E0}
*{box-sizing:border-box}
body{margin:0;background:#d9dde4;color:var(--ink);font-family:var(--round)}
.note{padding:12px 18px;font-size:14px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note b{color:var(--ink)}
.note button{font:inherit;font-weight:800;padding:5px 14px;border-radius:999px;border:0;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,#fff,#e9edf3);box-shadow:inset 0 1px 0 #fff,0 0 0 1px var(--line),0 4px 10px -6px rgba(40,50,70,.4)}
#wrap{position:relative;width:1280px;height:720px;transform-origin:0 0;margin-bottom:30px}
#stage{position:absolute;inset:0;overflow:hidden;border-radius:12px;background:#eceef2;box-shadow:0 0 0 1px var(--line),0 20px 40px -20px rgba(40,50,70,.5)}
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}
.blob{position:absolute;border-radius:50%;opacity:.5;background:radial-gradient(circle,var(--b),color-mix(in srgb,var(--b) 45%,transparent) 35%,transparent 70%);transition:background .8s;animation:drift 26s ease-in-out infinite alternate}
.blob.b1{width:640px;height:640px;left:-200px;top:-260px;--b:var(--k)}
.blob.b2{width:560px;height:560px;right:-180px;top:140px;--b:var(--k2);animation-duration:31s}
.blob.b3{width:520px;height:520px;left:380px;bottom:-330px;--b:color-mix(in srgb,var(--k) 40%,#F2B807);animation-duration:37s}
@keyframes drift{to{transform:translate(60px,-30px) scale(1.15)}}
.stripes{position:absolute;inset:0;opacity:.35;background:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 1px,transparent 1px 4px)}

/* Píldoras de cristal */
.pill{background:linear-gradient(180deg,var(--pill-top),var(--pill-bot));-webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);
  box-shadow:inset 0 1px 0 var(--glass-top),inset 0 -6px 10px -6px #fff,inset 0 -1px 0 rgba(110,125,150,.22),0 0 0 1px rgba(95,110,135,.22),0 10px 20px -12px rgba(40,50,70,.4)}
.top{position:absolute;left:18px;right:18px;top:12px;height:46px;display:flex;align-items:center;gap:8px;z-index:4}
.ttl{height:46px;display:flex;align-items:center;gap:10px;padding:0 18px 0 8px;border-radius:999px;font-size:20px;font-weight:800}
.ttl .badge{width:32px;height:32px}
.seg{display:flex;gap:4px;padding:5px;border-radius:999px}
.seg span{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:800;color:var(--ink-2);cursor:pointer;transition:.25s}
.seg span.on{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%),var(--c);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),0 0 0 1px color-mix(in srgb,var(--c2,#3F63E0) 70%,black),0 6px 14px -6px var(--c2,#3F63E0)}
.seg.rain span.on{--c:var(--rainbow);--c2:#8E5BE0}
.cats{margin-left:auto}
.lbrb{display:inline-grid;place-items:center;height:24px;min-width:30px;padding:0 6px;border-radius:8px;font-size:11px;font-weight:900;color:var(--ink-2);background:linear-gradient(180deg,#fff,#e4e8ee);box-shadow:inset 0 -2px 0 rgba(110,125,150,.25),0 0 0 1px var(--line)}
.foot{position:absolute;left:18px;right:18px;bottom:10px;height:36px;border-radius:999px;display:flex;align-items:center;gap:18px;padding:0 16px;font-size:13px;font-weight:700;color:var(--ink-2);z-index:4}
.foot span{display:flex;gap:6px;align-items:center}
.fb{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 1px color-mix(in srgb,var(--c) 70%,black)}
#scroll{position:absolute;left:0;right:0;top:66px;bottom:52px;overflow-y:auto;scroll-behavior:smooth;padding:8px 26px 30px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 14px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(180deg,transparent,#000 14px,#000 calc(100% - 18px),transparent)}
#scroll::-webkit-scrollbar{display:none}

/* Caja de cristal (como .glass de la app, estática) */
.g{position:relative;--r:26px;--bw:8px;border-radius:var(--r);padding:var(--bw);isolation:isolate;
  background:linear-gradient(180deg,var(--glass-top),var(--glass-mid) 46%,var(--glass-bot));-webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);
  box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),inset 0 -10px 14px -8px var(--hl-bot),inset 0 -1.5px 0 rgba(110,125,150,.30),0 0 0 1px rgba(95,110,135,.24),0 2px 3px rgba(40,50,70,.10),0 18px 30px -16px rgba(40,50,70,.42);
  opacity:0;transform:translateY(16px) scale(.97);transition:opacity .55s,transform .6s cubic-bezier(.34,1.32,.64,1)}
.g.in{opacity:1;transform:none}
.g::before{content:'';position:absolute;z-index:2;left:2px;right:2px;top:2px;height:48%;pointer-events:none;border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;
  background:linear-gradient(180deg,var(--tile-bg),rgba(255,255,255,.16) 55%,rgba(255,255,255,0));
  -webkit-mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:.7}
.g::after{content:'';position:absolute;z-index:3;left:12%;top:3px;width:34%;height:5px;border-radius:5px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 40%,rgba(255,255,255,0));opacity:.9}
.face{position:relative;z-index:1;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);background:linear-gradient(180deg,rgba(250,251,253,.96),rgba(240,243,247,.94));padding:14px 16px;overflow:hidden}
.face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(20,30,50,.12),inset 0 3px 6px -3px rgba(0,0,0,.22)}
.hd{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:14px;font-weight:800;color:var(--ink-2)}
.hd small{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-3)}
.badge{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 25%,color-mix(in srgb,var(--c) 40%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 75%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px color-mix(in srgb,var(--c) 70%,black),0 4px 8px -4px var(--c)}
.badge svg{width:58%;height:58%;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.sec{display:flex;align-items:center;gap:10px;margin:20px 4px 10px}
.sec h2{margin:0;font-size:18px;font-weight:800}
.sec small{color:var(--ink-3);font-size:12.5px;font-weight:700}
.sec .rule{flex:1;height:3px;border-radius:3px;background:var(--rainbow);opacity:.45}
.grid{display:grid;gap:14px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.2);background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%),var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 1px color-mix(in srgb,var(--c) 70%,black)}

/* Contadores: cristal relleno de color */
.kpis{grid-template-columns:repeat(5,1fr)}
.kpi .face{padding:12px 14px 0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.22);height:132px;
  background:radial-gradient(120% 90% at 20% 0%,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000))}
.kpi .face::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 10px,transparent 10px 22px)}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(255,255,255,.35)}
.kpi .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi .l{position:relative;font-size:13px;font-weight:800;opacity:.95}
.kpi .v{position:relative;font-size:36px;font-weight:900;line-height:1.05;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:16px;font-weight:800;opacity:.85;margin-left:2px}
.kpi .d{position:relative;font-size:12px;font-weight:800;opacity:.95;display:flex;align-items:center;gap:4px}
.kpi .d svg{width:12px;height:12px;fill:#fff}
.kpi .sp{position:absolute;left:0;right:0;bottom:0;height:34px;width:100%}

/* Fila 2 */
.r2{grid-template-columns:1.3fr 1fr 1fr}
.r2 .face{height:318px}
#bubbles{position:relative;height:262px}
.bub{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff;font-weight:800;line-height:1.08;padding:6px;
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 18%,transparent 34%),radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 58%,color-mix(in srgb,var(--c) 65%,#000));
  box-shadow:inset 0 -8px 16px -6px color-mix(in srgb,var(--c) 50%,#000),inset 0 0 0 1.5px rgba(255,255,255,.55),0 0 0 1px color-mix(in srgb,var(--c) 70%,black),0 14px 22px -12px var(--c);
  transform:scale(0);transition:transform .8s cubic-bezier(.3,1.6,.5,1);animation:float 5.5s ease-in-out infinite alternate}
.bub::after{content:'';position:absolute;left:22%;right:22%;bottom:8%;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.45),transparent)}
.bub.in{transform:scale(1)}
.bub b{position:relative;z-index:1;display:block;font-size:var(--fs);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bub span{position:relative;z-index:1;font-size:11px;font-weight:800;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.35)}
@keyframes float{to{translate:0 -6px}}
#clock{display:block;margin:-6px auto 0}
.cap{text-align:center;font-size:13px;color:var(--ink-2);font-weight:700}
.cap b{color:var(--ink)}
.donut-wrap{display:flex;gap:12px;align-items:center}
.legend{display:grid;gap:7px;font-size:13px;font-weight:700;flex:1}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 55%);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 70%,black)}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.stars{margin-top:14px;display:grid;gap:6px}
.stars div{display:grid;grid-template-columns:70px 1fr 22px;gap:8px;align-items:center;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.stars .ss{display:flex;gap:1px}
.stars .ss svg{width:13px;height:13px;fill:var(--c);filter:drop-shadow(0 1px 0 color-mix(in srgb,var(--c) 60%,black))}
.tube{height:12px;border-radius:12px;background:linear-gradient(180deg,rgba(110,125,150,.18),rgba(255,255,255,.6));box-shadow:inset 0 1px 2px rgba(40,50,70,.25),0 1px 0 #fff;overflow:hidden}
.tube i{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:width 1.1s cubic-bezier(.2,.9,.3,1)}

/* Fila 3 */
.r3{grid-template-columns:1.45fr 1fr}
.r3 .face{height:236px}
#punch{width:100%;height:190px;display:block}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.mini b{color:var(--ink)}
.spark{width:100%;height:120px;display:block}

/* Récords */
.recs{grid-template-columns:repeat(4,1fr)}
.rec .face{height:122px;padding:14px}
.rec .big{font-size:26px;font-weight:900;margin:8px 0 2px;letter-spacing:-.3px}
.rec .sub{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.rec .top2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink-2)}
.rec .face::before{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);opacity:0}
.rec.shine .face::before{animation:sweep 1.1s ease-out}
.rec.shine{box-shadow:inset 0 1.5px 0 #fff,inset 0 0 0 1px var(--hl-ring),0 0 0 2px var(--c),0 0 22px 2px color-mix(in srgb,var(--c) 45%,transparent),0 18px 30px -16px rgba(40,50,70,.42)}
@keyframes sweep{0%{left:-60%;opacity:1}100%{left:130%;opacity:1}}
.ghostic{position:absolute;right:-14px;bottom:-18px;width:92px;height:92px;stroke:var(--c);fill:none;stroke-width:1.6;opacity:.16;transform:rotate(-12deg)}

/* Datos curiosos */
.fun .face{display:flex;align-items:center;gap:14px;padding:12px 18px;height:66px}
.fun .face::before{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rainbow)}
.fun .badge{width:38px;height:38px}
.fun .tx{font-size:16.5px;font-weight:700;transition:opacity .35s,transform .35s}
.fun .tx b{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.fun .tx.out{opacity:0;transform:translateY(8px)}
.dots{margin-left:auto;display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(110,125,150,.3);transition:.3s}
.dots i.on{width:22px;border-radius:8px;background:var(--rainbow)}

/* Todo */
.rv .face{height:236px}
.river{width:100%;height:190px;display:block}
.share{display:grid;gap:12px;margin-top:4px}
.share .row{display:grid;grid-template-columns:132px 1fr 48px;gap:10px;align-items:center;font-size:13px;font-weight:800}
.share .row b{text-align:right;font-variant-numeric:tabular-nums}
.share .tube{height:16px}
</style>
</head>

<div class="note"><b>D · Panorama (claro)</b> — LB/RB (o Q/E, o clic en la pastilla) cambia de categoría; ↑/↓ baja por la pantalla.
 <button id="replay">Repetir animación</button><button id="all">Ver «Todo»</button></div>
<div id="wrap"><div id="stage">

  kpi:[118,186,1830,109,1.16],status:[[5,'Terminadas'],[2,'Leyendo'],[12,'Pendientes'],[0,'Abandonadas']],

const ST_COL=['#3BB54A','#00A0D8','#F2B807','#a3abb8'];
let rnd=1;const R=()=>(rnd=(rnd*16807)%2147483647)/2147483647;
const $=s=>document.querySelector(s),ic=(id)=>`<svg><use href="#${id}"/></svg>`;

const badge=(id,c)=>`<span class="badge" style="--c:${c}">${ic(id)}</span>`;
const G=(inner,cls='',st='')=>`<div class="g ${cls}" style="${st}"><div class="face">${inner}</div></div>`;
let ci=1,funT=null,recT=null;

function render(){
 const C=CATS[ci],all=C.id==='all';rnd=11+ci*17;
 const st=document.documentElement.style;st.setProperty('--k',C.k);st.setProperty('--k2',C.k2);
 $('#cats').innerHTML=CATS.map((c,i)=>`<span class="${i===ci?'on':''}" style="--c:${c.c};--c2:${i?c.c:'#8E5BE0'}" data-i="${i}">${c.name}</span>`).join('');
 const s=CATS.slice(1),k=all?[0,1,2,3].map(i=>s.reduce((a,c)=>a+c.kpi[i],0)):C.kpi,read=C.id==='vn'||C.id==='jvn';
 const kp=[['Horas',k[0],' h','i-clock',RB[0],'18 % más que en 2025',1],['Partidas',k[1],'','i-pad',RB[1],'42 más que en 2025',1],['Capturas',k[2],'','i-cam',RB[2],'una cada 4 min de juego',0],['Días activos',k[3],' / 313','i-cal',RB[3],'68 % del año',0],
  all?['Categorías',4,'','i-layers',RB[6],'las cuatro con actividad',0]:read?['Caracteres',C.kpi[4],' M','i-book',RB[6],'9 % más que en 2025',1]:C.id==='switch'?['En la consola',211,' h','i-plug',RB[6],'datos de Nintendo',0]:['Logros',148,'','i-trophy',RB[6],'12 juegos al 100 %',0]];
 let h=`<div class="grid kpis">${kp.map((x,i)=>G(`<span class="ic">${ic(x[3])}</span><div class="l">${x[0]}</div><div class="v"><span data-n="${x[1]}" data-d="${x[1]%1?2:0}">0</span><small>${x[2]}</small></div><div class="d">${x[6]?'<svg viewBox="0 0 12 12"><use href="#i-up"/></svg>':''}${x[5]}</div>${sparkKpi(i)}`,'kpi',`--c:${x[4]}`)).join('')}</div>`;

 if(all){
  h+=sec('i-river',RB[5],'El año en un río','horas por mes, una franja por categoría')+
  `<div class="grid r3">${G(`<div class="hd">${badge('i-river',RB[5])}Horas por mes<small>ene – nov</small></div><svg class="river" id="river" viewBox="0 0 700 190" preserveAspectRatio="none"></svg>`,'rv')}
   ${G(`<div class="hd">${badge('i-pie',RB[7])}Tu reparto<small>963 h en total</small></div><div class="share">${s.map(c=>`<div class="row"><span><span class="chip" style="--c:${c.c}">${c.name}</span></span><span class="tube"><i style="--c:${c.c}" data-w="${c.kpi[0]/412*100}"></i></span><b>${c.kpi[0]} h</b></div>`).join('')}</div>`,'rv')}</div>`+
  sec('i-trophy',RB[2],'Lo mejor de cada categoría','un récord por categoría, con su etiqueta')+
  `<div class="grid recs">${s.map(c=>{const r=c.rec[0];return G(`<div class="top2"><span class="chip" style="--c:${c.c}">${c.name}</span></div><div class="big">${r[0]}</div><div class="sub">${r[1]} · ${r[2]}</div><svg class="ghostic" style="--c:${c.c}"><use href="#${r[3]}"/></svg>`,'rec',`--c:${c.c}`)}).join('')}</div>`;
 } else {
  h+=sec('i-chart',C.c,C.name,'solo títulos de esta categoría')+
  `<div class="grid r2">
   ${G(`<div class="hd">${badge('i-bubbles',RB[0])}Dónde se fue el tiempo<small>tamaño = horas</small></div><div id="bubbles"></div>`)}
   ${G(`<div class="hd">${badge('i-clock',RB[2])}Tu reloj<small>partidas por hora</small></div><svg id="clock" width="244" height="244" viewBox="-122 -122 244 244"></svg><div class="cap">Hora punta <b>${C.peak}:00 – ${C.peak+1}:00</b></div>`)}
   ${G(`<div class="hd">${badge('i-pie',RB[3])}Estados y notas</div><div class="donut-wrap"><svg id="donut" width="128" height="128" viewBox="-64 -64 128 128"></svg>
     <div class="legend">${C.status.map((x,i)=>`<div style="--c:${ST_COL[i]}"><i></i>${x[1]}<b>${x[0]}</b></div>`).join('')}</div></div>
     <div class="stars">${C.stars.map((n,i)=>`<div style="--c:${RB[i+1]}"><span class="ss">${`<svg viewBox="0 0 24 24"><use href="#i-star"/></svg>`.repeat(5-i)}</span><span class="tube"><i data-w="${n/Math.max(...C.stars)*100}"></i></span><span>${n}</span></div>`).join('')}</div>`)}
  </div>`+
  sec('i-grid',RB[5],'Semana tipo','cada punto: cuánto juegas ese día a esa hora')+
  `<div class="grid r3">${G(`<svg id="punch" viewBox="0 0 640 190"></svg>`)}${ownPanel(C)}</div>`+
  sec('i-trophy',RB[2],'Récords','se iluminan por turnos')+
  `<div class="grid recs">${C.rec.map((r,i)=>{const c=RB[[0,1,5,7][i]];return G(`<div class="top2">${badge(r[3],c)}${r[1]}</div><div class="big">${r[0]}</div><div class="sub">${r[2]}</div><svg class="ghostic" style="--c:${c}"><use href="#${r[3]}"/></svg>`,'rec',`--c:${c}`)}).join('')}</div>`;
 }
 h+=sec('i-bulb',RB[2],'¿Sabías que…?','')+G(`${badge('i-bulb',RB[2])}<span class="tx" id="funtx"></span><span class="dots" id="dots"></span>`,'fun');
 $('#scroll').innerHTML=h;$('#scroll').scrollTop=0;

const sec=(i,c,t,s)=>`<div class="sec">${badge(i,c)}<h2>${t}</h2><small>${s}</small><span class="rule"></span></div>`;
function sparkKpi(i){let p=[];for(let x=0;x<=12;x++)p.push([x/12*240,22-Math.sin(x*.8+i)*7-R()*8-x*.6]);
 const d='M'+p.map(q=>q[0].toFixed(0)+' '+q[1].toFixed(1)).join('L');
 return`<svg class="sp" viewBox="0 0 240 34" preserveAspectRatio="none"><path d="${d}L240 34L0 34Z" fill="rgba(255,255,255,.22)"/><path d="${d}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round" class="kl" stroke-dasharray="400" stroke-dashoffset="400" style="transition:stroke-dashoffset 1.6s ease-out ${.3+i*.1}s"/></svg>`}

function ownPanel(C){
 if(C.id==='switch')return G(`<div class="hd">${badge('i-plug',RB[0])}Consola o emulador</div><svg id="own" viewBox="0 0 300 150" width="100%" height="150"></svg><div class="mini"><span>Datos de Nintendo hasta <b>8 nov</b></span><span>Día récord <b>4 h 10 · 1 ene</b></span></div>`);
 if(C.id==='jvn')return G(`<div class="hd">${badge('i-type',RB[7])}Palabras conocidas<small>de 1 980 a 3 420</small></div><svg class="spark" id="own" viewBox="0 0 300 120" preserveAspectRatio="none"></svg><div class="mini"><span>Velocidad <b>9 840 car./h</b></span><span>Frases al glosario <b>486</b></span></div>`);
 if(C.id==='vn')return G(`<div class="hd">${badge('i-target',RB[4])}Meta de lectura<small>últimas 5 semanas</small></div><svg id="own" viewBox="0 0 300 140" width="100%" height="140"></svg><div class="mini"><span>Días cumplidos <b>214</b></span><span>Rescates <b>6</b></span><span>Media <b>41 min</b></span></div>`);
 return G(`<div class="hd">${badge('i-trophy',RB[2])}Logros<small>148 de 235</small></div><svg id="own" viewBox="0 0 300 160" width="100%" height="160"></svg><div class="mini"><span>Más raro <b>Señor de la llama</b></span><span>Elden Ring · <b>0,8 %</b></span></div>`);
}

function animate(C,all){
 const gs=[...document.querySelectorAll('.g')];gs.forEach((g,i)=>setTimeout(()=>g.classList.add('in'),60+i*65));
 document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,d=+e.dataset.d,t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/1500),v=n*(1-Math.pow(1-p,4));e.textContent=d?v.toFixed(d).replace('.',','):fmt(v);if(p<1)requestAnimationFrame(f)})(t0)});
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.kl').forEach(p=>p.style.strokeDashoffset=0)));
 setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%'),500);
 if(all)river();else{bubbles(C);clock(C);donut(C);punch(C);own(C);rotateRecs()}
 if(all)rotateRecs();
 fun(C,all);
}

function bubbles(C){
 const box=$('#bubbles'),W=box.clientWidth||420,H=262;
 const gs=[...C.games],sum=gs.reduce((a,g)=>a+g[1],0),sc=Math.sqrt(W*H*.52/(Math.PI*sum));
 const placed=[];let html='';
 gs.forEach((g,i)=>{let r=Math.max(24,Math.sqrt(g[1])*sc),x=W/2,y=H/2,best=null;
  for(let t=0;t<6&&!best;t++,best||(r*=.9))for(let yy=r;yy<=H-r;yy+=4)for(let xx=r;xx<=W-r;xx+=4){
   if(placed.some(p=>Math.hypot(p.x-xx,p.y-yy)<p.r+r+3))continue;const dd=Math.hypot((xx-W/2)/1.6,yy-H/2);if(!best||dd<best[2])best=[xx,yy,dd]}
  if(best){x=best[0];y=best[1]}
  placed.push({x,y,r});const c=RB[(i*3)%8],nm=r>50?g[0]:g[0].length>10?g[0].slice(0,9)+'…':g[0];
  html+=`<div class="bub" style="--c:${c};left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;--fs:${Math.max(10.5,Math.min(17,r/4.4))}px;animation-delay:-${i*1.1}s"><div><b>${nm}</b><span>${g[1]} h</span></div></div>`});
 box.innerHTML=html;[...box.children].forEach((b,i)=>setTimeout(()=>b.classList.add('in'),350+i*110));
}
function clock(C){
 const s=$('#clock');const vals=[...Array(24)].map((_,i)=>{const d=Math.min(Math.abs(i-C.peak),24-Math.abs(i-C.peak));return Math.max(.06,Math.exp(-d*d/10)+(i>=10&&i<=14?.28:0)+R()*.1)}),mx=Math.max(...vals);
 const P=(r,a)=>`${(r*Math.cos(a)).toFixed(1)} ${(r*Math.sin(a)).toFixed(1)}`;
 let h=`<defs><radialGradient id="cg" cx="40%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e3e8ef"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#28324a" flood-opacity=".25"/></filter></defs>
  <circle r="112" fill="rgba(255,255,255,.55)" stroke="rgba(95,110,135,.22)"/><circle r="40" fill="url(#cg)" filter="url(#sh)" stroke="#fff" stroke-width="2"/>`;
 vals.forEach((v,i)=>{const a0=i/24*Math.PI*2-Math.PI/2+.025,a1=a0+Math.PI*2/24-.05,r0=46,r1=r0+(v/mx)*58,c=`hsl(${(i/24)*330},85%,58%)`;
  h+=`<path d="M${P(r0,a0)}L${P(r1,a0)}A${r1} ${r1} 0 0 1 ${P(r1,a1)}L${P(r0,a1)}A${r0} ${r0} 0 0 0 ${P(r0,a0)}Z" fill="${c}" stroke="rgba(255,255,255,.9)" stroke-width="1" style="transform:scale(.4);opacity:0;transform-origin:0 0;transition:transform .7s cubic-bezier(.3,1.5,.5,1) ${i*28}ms,opacity .4s ${i*28}ms"/>`});
 [0,6,12,18].forEach(n=>{const a=n/24*Math.PI*2-Math.PI/2;h+=`<text x="${(116*Math.cos(a)).toFixed(0)}" y="${(116*Math.sin(a)+4).toFixed(0)}" fill="#8a92a1" font-size="11" font-weight="800" text-anchor="middle">${n}</text>`});
 const pa=(C.peak+.5)/24*Math.PI*2-Math.PI/2;
 h+=`<g style="transform:rotate(-180deg);transition:transform 1.4s cubic-bezier(.3,1.3,.5,1) .4s" id="hand"><line x1="0" y1="0" x2="${(34*Math.cos(pa)).toFixed(1)}" y2="${(34*Math.sin(pa)).toFixed(1)}" stroke="#3a414e" stroke-width="3" stroke-linecap="round"/></g><circle r="5" fill="#3a414e"/><circle r="2" fill="#fff"/>
  <path d="M-6 22a8 8 0 1 0 9-10 6 6 0 0 1-9 10z" fill="#8E5BE0" opacity=".85" transform="translate(2,-2) scale(.9)"/>`;
 s.innerHTML=h;setTimeout(()=>{s.querySelectorAll('path[stroke]').forEach(p=>{p.style.transform='scale(1)';p.style.opacity=1});const hd=s.querySelector('#hand');if(hd)hd.style.transform='rotate(0)'},300);
}
function donut(C){
 const s=$('#donut'),tot=C.status.reduce((a,x)=>a+x[0],0),r=46,L=2*Math.PI*r;let off=0;
 let h=`<defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <circle r="${r}" fill="none" stroke="rgba(110,125,150,.16)" stroke-width="20"/>`;
 C.status.forEach((x,i)=>{const l=x[0]/tot*L;if(l>0)h+=`<circle r="${r}" fill="none" stroke="${ST_COL[i]}" stroke-width="20" stroke-dasharray="0 ${L}" data-a="${Math.max(0,l-2.5)} ${L}" stroke-dashoffset="${-off}" transform="rotate(-90)" style="transition:stroke-dasharray 1.1s cubic-bezier(.2,.9,.3,1) ${i*120}ms"/>`;off+=l});
 h+=`<circle r="${r}" fill="none" stroke="url(#gl)" stroke-width="20"/><circle r="${r-10}" fill="none" stroke="rgba(0,0,0,.08)"/><circle r="${r+10}" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.5"/>
  <text y="4" fill="#3a414e" font-size="25" font-weight="900" text-anchor="middle">${Math.round(C.status[0][0]/tot*100)}%</text><text y="19" fill="#8a92a1" font-size="9.5" font-weight="800" text-anchor="middle">terminado</text>`;
 s.innerHTML=h;setTimeout(()=>s.querySelectorAll('[data-a]').forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.a)),400);
}
function punch(C){
 const s=$('#punch'),days=['L','M','X','J','V','S','D'];let h='';
 for(let i=0;i<24;i+=3)h+=`<text x="${44+i*24.5}" y="182" fill="#8a92a1" font-size="11" font-weight="800" text-anchor="middle">${i}h</text>`;
 days.forEach((d,di)=>{const y=12+di*23.5;h+=`<text x="10" y="${y+4}" fill="#5f6776" font-size="12" font-weight="800">${d}</text>`;
  for(let i=0;i<24;i++){const dd=Math.min(Math.abs(i-C.peak),24-Math.abs(i-C.peak));let v=Math.exp(-dd*dd/9)*(di>=5?1.1:.75);if(di>=5&&i>=10&&i<=16)v+=.5;v=Math.min(1,v*(.55+R()*.6));
   const c=`hsl(${(i/24)*330},85%,58%)`,r=(2+v*8.6).toFixed(1);
   h+=`<circle cx="${44+i*24.5}" cy="${y}" r="${v<.08?1.6:r}" fill="${v<.08?'rgba(110,125,150,.25)':c}" ${v<.08?'':`stroke="rgba(255,255,255,.9)" stroke-width="1.2"`} style="transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1) ${(i+di*3)*14}ms"/>`;
   if(v>=.08)h+=`<circle cx="${44+i*24.5-r*.3}" cy="${y-r*.35}" r="${(r*.32).toFixed(1)}" fill="#fff" opacity=".55" style="transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .5s ${(i+di*3)*14+80}ms"/>`}});
 s.innerHTML=h;setTimeout(()=>s.querySelectorAll('circle').forEach(c=>c.style.transform='scale(1)'),450);
}
function own(C){
 const s=$('#own');if(!s)return;
 if(C.id==='pc'){const n=60,p=148/235;let h='';
  for(let i=0;i<n;i++){const a0=Math.PI*(1+i/n),a1=Math.PI*(1+(i+.8)/n),on=i/n<p,c=on?`hsl(${(i/n)*330},85%,58%)`:'rgba(110,125,150,.18)';
   h+=`<path d="M${150+62*Math.cos(a0)} ${130+62*Math.sin(a0)}L${150+88*Math.cos(a0)} ${130+88*Math.sin(a0)}L${150+88*Math.cos(a1)} ${130+88*Math.sin(a1)}L${150+62*Math.cos(a1)} ${130+62*Math.sin(a1)}Z" fill="${c}" style="opacity:0;transition:opacity .3s ${i*22}ms"/>`}
  h+=`<g transform="translate(150 112)"><circle r="30" fill="url(#mg)" stroke="#fff" stroke-width="2.5"/><path d="M0 -15l4.4 9 9.8 1.3-7.1 6.8 1.7 9.7L0 7.1l-8.8 4.7 1.7-9.7-7.1-6.8L-4.4 -6z" fill="#fff"/></g>
   <defs><radialGradient id="mg" cx="35%" cy="28%"><stop offset="0" stop-color="#ffe58a"/><stop offset=".6" stop-color="#F2B807"/><stop offset="1" stop-color="#c98a00"/></radialGradient></defs>
   <text x="150" y="158" fill="#3a414e" font-size="20" font-weight="900" text-anchor="middle">63 %</text>`;
  s.innerHTML=h;setTimeout(()=>s.querySelectorAll('path').forEach(p=>p.style.opacity=1),300);return}

 data.forEach((d,i)=>{const top=base.map((b,m)=>b-(d[m]/mx)*160);
