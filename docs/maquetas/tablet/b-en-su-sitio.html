<title>Tablet · En su sitio</title><style>

.rk{position:absolute;inset:0;display:grid;grid-template-columns:1fr 380px;gap:16px}
.candles{padding:26px 30px;display:flex;flex-direction:column}

.rside{display:flex;flex-direction:column;gap:16px}
.rside .g{padding:20px;flex:1}
.free{display:flex;gap:10px;margin-top:12px}
.free span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--glass-in);color:var(--ok)}
/* Mi lista */
.bands{position:absolute;left:0;right:0;top:68px;bottom:0;display:flex;flex-direction:column;gap:12px}
.band{flex:1;display:flex;align-items:center;gap:16px;padding:0 16px 0 0;overflow:hidden}
.band .bt{width:150px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-left:20px;color:#fff;border-radius:var(--r) 0 0 var(--r)}
.band .bt h3{margin:0;font-size:19px}.band .bt span{font-weight:800;opacity:.85;font-size:13px}
.band .row{display:flex;gap:12px;overflow:auto;padding:8px 0;scrollbar-width:none}
.band .row::-webkit-scrollbar{display:none}
.band .cov{width:82px;height:118px}

<script>
const V = 'B';
const NOTES = {
  A: '<b>A · Barra arriba.</b> Las acciones de cada pantalla van arriba a la derecha, con icono y nombre; lo que no cabe, en «Más». Siempre en el mismo sitio. Toca portadas, capturas y botones para navegar; la flecha vuelve.',
  B: '<b>B · En su sitio.</b> Cada acción va junto a lo que toca: «Jugar» en la ficha, la barra del visor sobre la imagen, «Ordenar» junto a los filtros. El menú de acciones de una portada o captura sale <b>manteniendo pulsado</b> (prueba en la Biblioteca o en Mi lista).',
  C: '<b>C · Botón de acciones.</b> Un botón grande abajo a la derecha, bajo el pulgar: la acción principal de la pantalla y «Más» con el resto en un menú. Arriba solo queda volver y el título.'
};
const $ = s => document.querySelector(s);
const cv = $('#cv');
function fit(){ const w = $('#wrap').clientWidth; cv.style.transform = `scale(${w/1280})`; }
addEventListener('resize', fit);

const ic = (n, cls='') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const CATS = [
  {id:'pc', name:'Juegos', c:'var(--pc)', icon:'pc', n:142},
  {id:'vn', name:'Novelas visuales', c:'var(--vn)', icon:'book', n:68},
  {id:'sw', name:'Switch', c:'var(--sw)', icon:'sw', n:37},
  {id:'jp', name:'Novelas japonesas', c:'var(--jp)', icon:'jp', n:21},
];
const HUES = [[250,320],[200,260],[20,50],[150,200],[330,20],[40,90],[180,230],[280,340]];
const G = (t, h, st) => ({t, h, st});
const VN = [G('Steins;Gate',0,'fin'),G('Summer Pockets',3,'play'),G('Ever17',6,'fin'),G('Clannad',4,'pend'),G('Muv-Luv Alternative',1,'pend'),G('Little Busters!',5,'aban'),G('Fate/stay night',7,'fin'),G('Rewrite',2,'pend'),G('Sakura no Uta',4,'play'),G('Chaos;Child',1,'pend'),G('Umineko',7,'fin'),G('Planetarian',6,'fin'),G('Narcissu',3,'fin'),G('Hoshi Ori Yume Mirai',5,'pend'),G('Aokana',2,'play'),G('Kanon',0,'fin'),G('Air',3,'pend'),G('Grisaia',1,'aban'),G('Ao no Kanata',6,'pend'),G('Subahibi',7,'pend'),G('Tsukihime',0,'play'),G('Riddle Joker',5,'pend'),G('Senren Banka',2,'fin'),G('Cafe Stella',4,'pend')];
const ST = {play:'var(--l-play)', pend:'var(--l-pend)', fin:'var(--l-fin)', aban:'var(--l-aban)'};
const grad = h => `linear-gradient(160deg,hsl(${HUES[h][0]} 70% 62%),hsl(${HUES[h][1]} 65% 42%))`;
const cover = (g, extra='') => `<div class="cov ${extra}" style="--bgc:${grad(g.h)};--st:${ST[g.st]}"><i></i><b>${g.t}</b></div>`;
/* capturas: paisajes en SVG generados */
function art(seed, w=1280, h=720){
  const r = n => { seed = (seed*9301+49297)%233280; return seed/233280*n; };
  const hh = HUES[Math.floor(r(8))];
  const sky = `<linearGradient id="s${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hh[0]} 70% 72%)"/><stop offset="1" stop-color="hsl(${hh[1]} 60% 82%)"/></linearGradient>`;
  let hills = '';
  for (let k=0;k<3;k++){ let d=`M0 ${h}`; const base=h*(.55+k*.13); for(let x=0;x<=w;x+=w/8){ d+=` L${x} ${base - r(h*.18)}`;} d+=` L${w} ${h} Z`; hills+=`<path d="${d}" fill="hsl(${hh[1]} ${45-k*8}% ${48-k*12}%)" opacity="${.55+k*.2}"/>`; }
  const sun = `<circle cx="${r(w)}" cy="${h*.25}" r="${h*.08}" fill="#fff" opacity=".75"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"><defs>${sky}</defs><rect width="${w}" height="${h}" fill="url(#s${seed})"/>${sun}${hills}</svg>`;
}

/* acciones por pantalla: la primera es la principal */
const ACT = {
  home:   [{l:'Buscar', i:'search'}, {l:'Ajustes', i:'gear'}],
  lib:    [{l:'Buscar', i:'search'}, {l:'Ordenar', i:'sort'}, {l:'Juegos ocultos', i:'grid'}],
  detail: [{l:'Jugar', i:'play'}, {l:'Capturas', i:'img'}, {l:'Logros', i:'cup'}, {l:'Mover a Mi lista', i:'list'}, {l:'Ajustes del juego', i:'gear'}],
  viewer: [{l:'Favorita', i:'star'}, {l:'Detalles', i:'info'}, {l:'Mover', i:'move'}, {l:'Borrar', i:'trash', d:1}],
  stats:  [{l:'Cambiar periodo', i:'sort'}],
  streak: [{l:'Ajustar la meta', i:'gear'}],
  list:   [{l:'Ordenar', i:'sort'}, {l:'Buscar', i:'search'}],
};
const TITLES = {home:'Inicio', lib:'Novelas visuales', detail:'Steins;Gate', viewer:'Steins;Gate · 12 / 48', stats:'Estadísticas', streak:'Racha', list:'Mi lista'};
const ORDER = [['home','Inicio'],['lib','Biblioteca'],['detail','Ficha'],['viewer','Visor'],['stats','Estadísticas'],['streak','Racha'],['list','Mi lista']];

let stack = ['home'], vi = 11, stab = 0, chip = 0;
const cur = () => stack[stack.length-1];
function go(s){ stack.push(s); render(); }
function back(){ if (stack.length>1){ stack.pop(); render(); } }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),1400); }

function topbar(s, dark=false){
  const isHome = s==='home';
  const acts = ACT[s];
  let right = '';
  if (V==='A' && acts.length){
    const vis = acts.slice(0, s==='detail' ? 3 : 3);
    right += vis.map((a,k)=>`<div class="pill tap ${a.d?'danger':''} ${s==='detail'&&k===0?'main':''}" data-act="${a.l}">${ic(a.i)}${a.l}</div>`).join('');
    if (acts.length > vis.length) right += `<div class="pill ico tap" data-more="top">${ic('more')}</div>`;
  }
  if (s==='home') right += `<div class="clock">18:42</div>`;
  const crumb = s==='lib' ? `<span class="dot" style="background:var(--vn)"></span>${TITLES[s]}<span class="sub">68</span>` : TITLES[s];
  return `<div class="top ${dark?'vtop':''} ui">${isHome?'':`<div class="back tap" data-back>${ic('back')}</div>`}<div class="crumb">${crumb}</div><div class="right">${right}</div></div>`;
}
function fab(s){
  if (V!=='C') return '';
  const a = ACT[s]; if (!a.length) return '';
  const main = a[0];
  const more = a.length>1 ? `<div class="pill ico tap" data-more="fab">${ic('more')}</div>` : '';
  return `<div class="fab ui">${more}<div class="pill main tap" data-act="${main.l}">${ic(main.i)}${main.l}</div></div>`;
}
function sheet(){ return `<div class="sheet-scrim" id="scrim"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>`; }
function openSheet(title, acts, x, y){
  const sh = $('#sheet');
  sh.innerHTML = `<h4>${title}</h4>` + acts.map(a=>`<div class="row tap ${a.d?'danger':''}" data-act="${a.l}">${ic(a.i)}${a.l}</div>`).join('');
  const w=340, hgt = 50 + acts.length*56;
  sh.style.left = Math.max(16, Math.min(1280-w-16, x - w/2)) + 'px';
  sh.style.top = Math.max(16, Math.min(800-hgt-16, y)) + 'px';
  sh.classList.add('on'); $('#scrim').classList.add('on');
}
function closeSheet(){ $('#sheet')?.classList.remove('on'); $('#scrim')?.classList.remove('on'); }

/* ---------- pantallas ---------- */
function home(){
  const last = VN[1];
  const days = [3,5,0,4,6,2,5];
  return `${topbar('home')}<div class="body">
    <div class="g hero tap" data-go="detail"><div class="art">${art(7)}</div><div class="shade"></div>
      <div class="tx"><div class="k">Seguir jugando · Novelas visuales</div><h2>${last.t}</h2><p>Hace 2 h · 31 h en total · 214 capturas</p>
      <div class="pill main tap" data-act="Jugar">${ic('play')}Jugar</div></div></div>
    <div class="g streak tap" data-go="streak">
      <div class="lab">${ic('flame')}Racha</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px"><div class="big">23<small>días</small></div><span class="sub">2 días libres esta semana</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px;margin-top:22px">
      ${days.map((d,k)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:100%;height:${d?d*20:12}px;border-radius:10px 10px 5px 5px;background:${d?'linear-gradient(180deg,#ffb347,#ff6b6b)':'var(--glass-in)'}"></div><small style="font-weight:800;color:var(--ink-3)">${'LMXJVSD'[k]}</small></div>`).join('')}</div>
    </div>
    <div class="cats">${CATS.map((c,k)=>`<div class="g cat tap" data-go="lib"><div class="glyph" style="background:${c.c}">${ic(c.icon)}</div><div><h3>${c.name}</h3><div class="sub">${c.n} títulos</div></div>
      <div class="stack">${[0,1,2].map(j=>cover(VN[(k*3+j)%VN.length])).join('')}</div></div>`).join('')}</div>
    <div class="dock">
      ${[['Mi lista','list','linear-gradient(160deg,#ff8a8a,#e0405a)','list'],['Estadísticas','chart','linear-gradient(160deg,#9b8cff,#5b5bd6)','stats'],['Colecciones','grid','linear-gradient(160deg,#6fd0ff,#2f8fe0)','coll'],['Ajustes','gear','linear-gradient(160deg,#a6b0c0,#6b7280)','set']].map(([l,i,b,g])=>`<div class="g d tap" data-go="${g}"><div class="di" style="background:${b}">${ic(i)}</div>${l}</div>`).join('')}
    </div></div>${fab('home')}`;
}
function lib(){
  const chips = ['Todos','Jugando','Pendiente','Terminado','Abandonado'];
  const fil = ['', 'play','pend','fin','aban'][chip];
  const list = VN.filter(g=>!fil||g.st===fil);
  const inl = V==='B' ? `<div class="right"><div class="pill tap" data-act="Ordenar">${ic('sort')}Último jugado</div><div class="pill ico tap" data-act="Buscar">${ic('search')}</div></div>` : '';
  return `${topbar('lib')}<div class="body">
    <div class="lbar"><div class="chips">${chips.map((c,k)=>`<div class="chip tap ${k===chip?'on':''}" data-chip="${k}">${c}<span class="n">${k?VN.filter(g=>g.st===['','play','pend','fin','aban'][k]).length:VN.length}</span></div>`).join('')}</div>${inl}</div>
    <div class="cgrid">${list.map((g,k)=>`<div class="t tap" data-go="detail" data-hold="${g.t}">${cover(g)}<span>${g.t}</span></div>`).join('')}</div>
    ${V==='B'?`<div class="press" style="right:4px;top:-30px">${ic('hold')}Mantén pulsada una portada para sus acciones</div>`:''}
  </div>${fab('lib')}`;
}
function detail(){
  const g = VN[0];
  const inl = V==='B' ? `<div class="inl"><div class="pill main tap" data-act="Jugar" style="height:56px;font-size:18px;padding:0 28px">${ic('play')}Jugar</div><div class="pill tap" data-go="viewer">${ic('img')}Capturas</div><div class="pill tap" data-act="Logros">${ic('cup')}Logros</div><div class="pill ico tap" data-more="inline">${ic('more')}</div></div>` : '';
  return `<div class="fhero">${art(3)}<div class="shade"></div></div>${topbar('detail')}
  <div class="fbody">${cover(g)}<div>
    <div class="sub" style="display:flex;gap:8px;align-items:center;margin-top:16px"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--vn)"></span>Novelas visuales · 5pb. · 2009 <span class="chip" style="height:30px;padding:0 12px;background:var(--l-fin);color:#fff;font-size:13px">Terminado</span></div>
    <h1>${g.t}</h1>${inl}
    <div class="fstats">
      <div class="g"><div class="lab">${ic('pc')}Jugado</div><div class="big">46<small>h</small></div></div>
      <div class="g"><div class="lab">${ic('img')}Capturas</div><div class="big">48</div></div>
      <div class="g"><div class="lab">${ic('cup')}Logros</div><div class="big">31<small>/ 34</small></div></div>
      <div class="g"><div class="lab">${ic('book')}Leído</div><div class="big">1,2<small>M car.</small></div></div>
    </div>
    <div class="lab" style="margin-bottom:10px">${ic('img')}Últimas capturas</div>
    <div class="fshots">${[11,12,13,14,15].map(s=>`<div class="shot tap" data-go="viewer" data-vi="${s}" data-hold="Captura">${art(s,320,180)}</div>`).join('')}</div>
  </div></div>${fab('detail')}`;
}
function viewer(){
  const strip = [8,9,10,11,12,13,14,15,16].map(s=>`<div class="shot tap ${s===vi?'on':''}" data-vi="${s}">${art(s,192,108)}</div>`).join('');
  const bar = V==='B' ? `<div class="vbar ui">${ACT.viewer.map(a=>`<div class="pill tap ${a.d?'danger':''}" data-act="${a.l}">${ic(a.i)}${a.l}</div>`).join('')}</div>` : '';
  return `<div class="vw" id="vw"><div class="img" data-tapimg>${art(vi)}</div>${topbar('viewer', true)}
    <div class="vgest ui">Desliza para cambiar · Pellizca para ampliar<br>Toca la imagen para ocultar los controles</div>
    ${bar}<div class="vstrip ui">${strip}</div>${fab('viewer')}</div>`;
}
function stats(){
  const tabs = ['Semana','Terminados','Panorama','Rachas','Clasificación','Año','Resumen'];
  const data = [[2,4,1,5,3,6,2],[5,6,3,0,7,8,4],[0,2,3,1,0,4,5],[1,0,2,2,3,0,1]];
  const tops = [[VN[1],VN[8]],[VN[0],VN[14]],[VN[20],VN[2]],[VN[6],VN[16]]];
  const per = V==='B' ? `<div class="right"><div class="pill tap" data-act="Semana anterior">${ic('back')}</div><div class="pill" style="pointer-events:none">10 – 16 nov</div><div class="pill tap" data-act="Semana siguiente" style="transform:scaleX(-1)">${ic('back')}</div></div>` : `<div class="right"><div class="pill" style="pointer-events:none">10 – 16 nov</div></div>`;
  return `${topbar('stats')}<div class="body">
    <div class="lbar"><div class="stabs">${tabs.map((t,k)=>`<button class="tap ${k===stab?'on':''}" data-stab="${k}">${t}</button>`).join('')}</div>${per}</div>
    <div class="sgrid">${CATS.map((c,k)=>`<div class="g lane"><div class="hd"><span class="sq" style="background:${c.c}"></span>${c.name}</div>
      <div style="display:flex;align-items:baseline;gap:8px"><div class="big" style="font-size:38px">${data[k].reduce((a,b)=>a+b,0)}<small>h</small></div><span class="sub">${['+3 h','+11 h','−2 h','='][k]} vs. semana pasada</span></div>
      <div class="bars">${data[k].map((d,j)=>`<div style="height:${8+d*20}px;background:${d?c.c:'var(--glass-in)'};opacity:${d?1:.8}"><span>${'LMXJVSD'[j]}</span></div>`).join('')}</div>
      <div class="tops">${tops[k].map(g=>`<div class="r tap" data-go="detail">${cover(g)}<div>${g.t}<div class="sub" style="font-size:12px">${2+g.h} h</div></div></div>`).join('')}</div>
    </div>`).join('')}</div></div>${fab('stats')}`;
}
function streak(){
  const d = [[4,'L',1],[5,'M',1],[0,'X',2],[6,'J',1],[3,'V',1],[0,'S',2],[5,'D',3]];
  return `${topbar('streak')}<div class="body"><div class="rk">
    <div class="g candles"><div class="lab">${ic('flame')}Esta semana · meta 30 min al día</div>
      <div class="cands">${d.map(([h,l,s])=>`<div class="cand">${s===1?`<svg class="fl" viewBox="0 0 24 32"><path d="M12 2c2 7 8 9 8 17a8 8 0 01-16 0c0-4 2.5-6 3.5-8.5 1.2 2.5 3 3.2 3 3.2C10.5 9 12 5 12 2z" fill="url(#fg)"/><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient></defs></svg>`:`<div style="height:34px"></div>`}
        <div class="w" style="height:${s===2?70:s===3?40:60+h*40}px;background:${s===1?'linear-gradient(180deg,#fff3d6,#ffd28a)':s===2?'repeating-linear-gradient(135deg,#e6f6ea 0 8px,#d3efdb 8px 16px)':'var(--glass-in)'};box-shadow:${s===3?'inset 0 0 0 2px var(--line)':'none'}"></div>
        <b>${l}</b><small>${s===1?h*20+' min':s===2?'libre':'hoy'}</small></div>`).join('')}</div></div>
    <div class="rside">
      <div class="g"><div class="lab">${ic('flame')}Racha actual</div><div class="big" style="margin-top:10px">23<small>días</small></div><div class="sub" style="margin-top:6px">La mejor: 41 días (agosto)</div></div>
      <div class="g"><div class="lab">${ic('shield')}Días libres</div><div class="sub" style="margin-top:8px">2 cada 7 días. Te queda 1 esta semana.</div><div class="free"><span>${ic('shield')}</span><span>${ic('shield')}</span><span style="color:var(--ink-3);opacity:.5">${ic('shield')}</span></div></div>
      ${V==='B'?`<div class="pill tap" data-act="Ajustar la meta" style="justify-content:center">${ic('gear')}Ajustar la meta</div>`:''}
    </div></div></div>${fab('streak')}`;
}
function list(){
  const B = [['Jugando','play','var(--l-play)'],['Pendiente','pend','var(--l-pend)'],['Terminado','fin','var(--l-fin)'],['Abandonado','aban','var(--l-aban)']];
  const chips = CATS.map((c,k)=>`<div class="chip tap ${k===1?'on':''}" data-act="${c.name}"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${c.c}"></span>${c.name}</div>`).join('');
  const inl = V==='B' ? `<div class="right"><div class="pill tap" data-act="Ordenar">${ic('sort')}Ordenar</div></div>` : '';
  return `${topbar('list')}<div class="body">
    <div class="lbar"><div class="chips">${chips}</div>${inl}</div>
    <div class="bands">${B.map(([n,st,c])=>{ const gs = VN.filter(g=>g.st===st); return `<div class="g band"><div class="bt" style="background:${c}"><h3>${n}</h3><span>${gs.length} títulos</span></div>
      <div class="row">${gs.map(g=>`<div class="tap" data-go="detail" data-hold="${g.t}">${cover(g)}</div>`).join('')}</div></div>`; }).join('')}</div>
    ${V==='B'?`<div class="press" style="right:4px;top:-30px">${ic('hold')}Mantén pulsada una portada para cambiarla de estado</div>`:''}
  </div>${fab('list')}`;
}
const SCREENS = {home, lib, detail, viewer, stats, streak, list};

function render(){
  const s = cur();
  cv.innerHTML = SCREENS[s]() + sheet();
  $('#jump').innerHTML = '<b>Ir a:</b>' + ORDER.map(([k,l])=>`<button class="${k===s?'on':''}" data-j="${k}">${l}</button>`).join('');
}

/* ---------- toques ---------- */
let holdT = 0, held = false, sx = 0, sy = 0;
cv.addEventListener('pointerdown', e => {
  held = false; sx = e.clientX; sy = e.clientY;
  const h = e.target.closest('[data-hold]');
  if (V==='B' && h){ holdT = setTimeout(()=>{ held = true; const r = cv.getBoundingClientRect(), k = 1280/r.width;
    const acts = h.dataset.hold==='Captura' ? ACT.viewer : [{l:'Jugar',i:'play'},{l:'Mover a Mi lista',i:'list'},{l:'Ver capturas',i:'img'},{l:'Ajustes del juego',i:'gear'}];
    openSheet(h.dataset.hold, acts, (e.clientX-r.left)*k, (e.clientY-r.top)*k); }, 450); }
});
cv.addEventListener('pointerup', e => {
  clearTimeout(holdT);
  if (cur()==='viewer' && !e.target.closest('.ui')){
    const dx = e.clientX - sx, k = 1280 / cv.getBoundingClientRect().width;
    if (Math.abs(dx*k) > 70){ vi = Math.max(8, Math.min(16, vi + (dx<0?1:-1))); render(); return; }
  }
});
cv.addEventListener('pointermove', e => { if (Math.hypot(e.clientX-sx, e.clientY-sy) > 10) clearTimeout(holdT); });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('click', e => {
  if (held){ held = false; return; }
  const t = e.target;
  if (t.closest('#scrim')) return closeSheet();
  const a = t.closest('[data-act]'); if (a){ closeSheet(); return toast(a.dataset.act); }
  const m = t.closest('[data-more]');
  if (m){ const r = cv.getBoundingClientRect(), k = 1280/r.width, b = m.getBoundingClientRect();
    const acts = ACT[cur()].slice(m.dataset.more==='fab' ? 1 : m.dataset.more==='top' ? 3 : 3);
    const x = (b.left - r.left + b.width/2)*k, y = (b.top - r.top)*k;
    return openSheet('Más acciones', acts.length ? acts : ACT[cur()], x - (m.dataset.more==='fab'?120:0), m.dataset.more==='fab' ? y - 60 - acts.length*56 : y + 60); }
  if (t.closest('[data-back]')) return back();
  const ch = t.closest('[data-chip]'); if (ch){ chip = +ch.dataset.chip; return render(); }
  const sb = t.closest('[data-stab]'); if (sb){ stab = +sb.dataset.stab; render(); if (stab) toast('Pestaña ' + sb.textContent); return; }
  const v = t.closest('[data-vi]'); if (v){ vi = +v.dataset.vi; if (cur()!=='viewer') return go('viewer'); return render(); }
  const g = t.closest('[data-go]');
  if (g){ const s = g.dataset.go; if (SCREENS[s]) return go(s); return toast(g.textContent.trim() + (s==='coll' ? ': según la propuesta P-13' : '')); }
  if (cur()==='viewer' && t.closest('[data-tapimg]')) $('#vw').classList.toggle('idle');
});
$('#jump').addEventListener('click', e => { const b = e.target.closest('[data-j]'); if (b){ stack = b.dataset.j==='home' ? ['home'] : ['home', b.dataset.j]; render(); } });
addEventListener('keydown', e => { if (e.key==='Escape' || e.key==='Backspace') back(); });
$('#note').innerHTML = NOTES[V] + ' Común a las tres: lienzo de 1280×800 sin franjas, flecha de volver (y el gesto de atrás de Android), sin pistas de mando, objetivos de 44 px o más y sin marco de foco: lo pulsado se encoge un poco.';
render(); fit();
</script></body></html>
