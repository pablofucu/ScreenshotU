function walk(a,base,amp){const l=a.length?a[a.length-1]:base;let v=l+(Math.random()-.5)*amp+(base-l)*.15;v=Math.max(3,Math.min(99,v));a.push(v);if(a.length>60)a.shift()}
for(let i=0;i<60;i++){walk(D.cpu,38,18);walk(D.gpu,84,10)}
const last=a=>a[a.length-1];

let CH=0;
function chart(k,w,h,grid){const id='c'+(++CH);return `<svg class="ch" data-k="${k}" data-w="${w}" data-h="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="${id}s" x1="0" x2="1">${RB.map((c,i)=>`<stop offset="${i/5}" stop-color="${c}"/>`).join('')}</linearGradient><linearGradient id="${id}v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><mask id="${id}m"><rect width="${w}" height="${h}" fill="url(#${id}v)"/></mask></defs>${grid?[.25,.5,.75].map(f=>`<line class="gl" x1="0" x2="${w}" y1="${h*f}" y2="${h*f}" vector-effect="non-scaling-stroke"/>`).join(''):''}<path class="af" fill="url(#${id}s)" mask="url(#${id}m)"/><path class="ln" stroke="url(#${id}s)" vector-effect="non-scaling-stroke"/></svg>`}
function drawChart(s){const a=D[s.dataset.k],w=+s.dataset.w,h=+s.dataset.h,st=w/(a.length-1);let d='';a.forEach((v,i)=>{d+=(i?'L':'M')+(i*st).toFixed(1)+' '+(h-4-v/100*(h-8)).toFixed(1)});s.querySelector('.ln').setAttribute('d',d);s.querySelector('.af').setAttribute('d',d+`L${w} ${h}L0 ${h}Z`)}
const col=v=>{const i=Math.min(4,Math.floor((100-v)/20));return `linear-gradient(180deg,${RB[i]},${RB[i+1]})`};
const hbars=(k,n,h)=>`<div class="hb" data-hb="${k}" data-n="${n}" style="height:${h}px"></div>`;

const H=a=>a.map(([k,t,c])=>`<span><i class="k ${c||''}">${k}</i>${t}</span>`).join('');
function vAch(){return `<div class="vhead">${ring(48,96,10,'<b style="font-size:30px">23<small style="display:block;font-size:13px;opacity:.7">de 48</small></b>')}<div><div class="big2">48 % completado</div><div class="sub">3 conseguidos en esta sesión · el más raro: Coleccionista (22 %)</div><div class="tabs"><i class="k">LB</i><span class="tab on">Recientes</span><span class="tab">Por conseguir</span><span class="tab">Todos</span><i class="k">RB</i></div></div></div><div class="alist">${D.ach.map((x,i)=>achRow(x,i,1)).join('')}</div>`}
function vShots(){return `<div class="vshots"><div class="th prevw" style="--bg:${SHOT[0]}"><small>Hace 3 min · 2560 × 1440</small></div><div class="side"><div class="sgrid">${D.shots.map((t,i)=>`<div class="th${i?'':' sel'}" data-f style="--bg:${SHOT[i]}"><small>${t}</small></div>`).join('')}</div><div class="sub">12 en esta sesión · 128 en total</div><div class="acts"><div class="btn sm" data-f>${svg('open')} Abrir en el visor</div><div class="btn sm" data-f>${svg('star')} Favorita</div></div></div></div>`}
function opt(name,on,ic){const [a,b]=name.split(' (');return `<div class="row opt${on?' on':''}" data-f>${svg(ic)}<span><b>${a}</b><small>${b?b.slice(0,-1):''}</small></span><i class="radio"></i></div>`}
function vAudio(){return `<div class="vaud"><div class="vcol"><div class="lbl">${svg('vol')}Volumen general</div><div class="volbig" data-f><b>64</b><small> %</small><div class="vbar lg" style="--p:64"><i></i></div><span class="sub">← → para ajustar · LT / RT desde cualquier sitio</span></div><div class="row" data-f>${svg('vol')}<span>Silenciar todo</span><i class="tog"></i></div><div class="row" data-f>${svg('mic')}<span>Silenciar micrófono</span><i class="tog"></i></div></div><div class="vcol"><div class="lbl">${svg('head')}Salida</div><div class="grp">${D.outs.map((o,i)=>opt(o,!i,['head','spk','tv'][i])).join('')}</div><div class="lbl" style="margin-top:10px">${svg('mic')}Entrada</div><div class="grp">${D.ins.map((o,i)=>opt(o,!i,'mic')).join('')}</div></div></div>`}
function vPerf(w,style){const blk=(k,name,sub,foot)=>`<div class="pblk"><div class="phead"><span class="lbl">${svg(k=='cpu'?'cpu':'bolt')}${name}</span><span class="sub">${sub}</span><b class="pbig"><span data-v="${k}"></span><small>%</small></b></div>${style=='bars'?hbars(k,60,120):chart(k,w,120,1)}<div class="pfoot">${foot}</div></div>`;return `<div class="vperf">${blk('cpu','CPU','AMD Ryzen 7 5800X · 16 hilos','Media: <b>41 %</b> · Pico: <b>77 %</b>')}${blk('gpu','GPU','NVIDIA GeForce RTX 3070','<b>71 °C</b> · VRAM <b>6,1 / 8 GB</b> · Media: <b>85 %</b>')}<div class="sub">Últimos 2 minutos · se mide solo mientras hay un juego en marcha</div></div>`}
function vTime(){const wk=[1.2,0,2.5,.8,3.1,1.9,1.4];return `<div class="tbig"><div><span class="sub">Esta sesión</span><b class="big">1:24</b><small class="sub">desde las 22:17</small></div><div><span class="sub">Hoy</span><b class="big">2 h 05</b><small class="sub">2 sesiones</small></div><div><span class="sub">Total</span><b class="big">42 h 17</b><small class="sub">31 sesiones</small></div></div><div class="week">${wk.map((v,i)=>`<div><i style="height:${v/3.1*100}%;background:linear-gradient(180deg,${RB[i%6]},${RB[(i+1)%6]})"></i><small>${'LMXJVSD'[i]}</small></div>`).join('')}</div><div class="sub">Horas por día, esta semana</div>`}
function vPad(){return `<div class="vpad"><div class="padcard"><div class="padart">${svg('pad')}</div><div><b class="big2">DualSense</b><div class="sub">Bluetooth · jugador 1</div><div class="pb"><span class="batt lg" style="--p:70"><i></i></span><b class="big">70 %</b></div><div class="sub">Unas 5 h de juego · aviso al 15 %</div></div></div><div class="row" data-f>${svg('pad')}<span>Vibrar para reconocerlo</span></div><div class="row dim">${svg('pad')}<span>Mando 2 · no conectado</span></div></div>`}
function vPower(){return `<div class="vpow"><div class="ptitle">¿Salir de <b>${D.game}</b>?</div><div class="sub">Sesión de 1 h 24 min · el tiempo se guarda igual</div><div class="pbtns"><div class="btn xl" data-f data-go="finok">${svg('x')}<span><b>Cerrar juego</b><small>Le pide que se cierre, como Alt+F4. Puede preguntarte si quieres guardar.</small></span></div><div class="btn xl bad" data-f data-hold><i class="hf"></i>${svg('power')}<span><b>Forzar cierre</b><small>Mantén A (o el clic) 1,5 s. Cierra todos sus procesos al instante: se pierde lo no guardado.</small></span></div></div><div class="btn sm backb2" data-f data-back>Volver al juego</div></div>`}
const DET={logros:['trophy','Logros',vAch],capturas:['cam','Últimas capturas',vShots],audio:['vol','Audio',vAudio],rendimiento:['bolt','Rendimiento',()=>vPerf(520,'bars')],tiempo:['clock','Tiempo de juego',vTime],mando:['pad','Mando',vPad],salir:['power','Salir del juego',vPower]};
const finV=()=>`<div class="fin"><div class="glass toast">${svg('power')}<div>${D.game} se ha cerrado a la fuerza<small>Sesión de 1 h 24 min guardada · volviendo al visor · Intro para repetir</small></div></div></div>`;
const finOk=()=>`<div class="gamedlg"><b>¿Guardar antes de salir?</b><div><span>Guardar y salir</span><span>Salir sin guardar</span><span>Cancelar</span></div></div><div class="glass toast toptoast">${svg('x')}<div>Se ha pedido al juego que se cierre<small>Responde a su pregunta con el mando como siempre</small></div></div>`;
const closedTag=()=>`<div class="tag">Jugando. Pulsa <b>Espacio</b> (hace de botón de silencio del mando · F24) para abrir el overlay</div>`;

/* ===== Propuesta B ===== */
const OPEN='abierto';
const S={
 cerrado:{grp:'Juego',btn:'Jugando (cerrado)',note:'El juego en marcha, sin overlay. Al pulsar el botón de silencio el panel entra desde la derecha con un pequeño rebote y sus filas aparecen una tras otra.'},
 abierto:{grp:'Overlay',btn:'Abierto',note:'<b>Inicio:</b> una columna de cristal de 450 px a la derecha; el juego sigue vivo y nítido a la izquierda (solo se oscurece un poco el borde derecho para que el cristal se lea igual sobre un juego claro). Arriba la hora y la batería; luego el juego con el tiempo de sesión y el total; después logros, capturas, volumen y rendimiento; abajo, salir. CPU y GPU son anillos en vivo con una barra de historial (últimos 44 s) al lado.'},
 logros:{grp:'Detalle (A en una fila)',btn:'Logros',back:'abierto',note:'El panel se ensancha a 600 px y la fila se abre dentro (como una pila: «‹» o B vuelven). LB/RB cambian de pestaña.'},
 capturas:{grp:'Detalle (A en una fila)',btn:'Capturas',back:'abierto',note:'Vista previa grande y la rejilla de las últimas; «Abrir en el visor» cierra el overlay y salta a la captura.'},
 audio:{grp:'Detalle (A en una fila)',btn:'Audio',back:'abierto',note:'En el inicio, ← → sobre la fila de volumen ya lo ajusta sin entrar. Dentro: silenciar, salida y entrada.'},
 rendimiento:{grp:'Detalle (A en una fila)',btn:'Rendimiento',back:'abierto',note:'Historial de 2 minutos en barras de colores: cada barra se tiñe según la carga (azul tranquilo → rosa al límite).'},
 tiempo:{grp:'Detalle (A en una fila)',btn:'Tiempo',back:'abierto',note:'Sesión, hoy, total y horas de la semana (A sobre la tarjeta del juego).'},
 mando:{grp:'Detalle (A en una fila)',btn:'Mando',back:'abierto',note:'A sobre la píldora de batería de la cabecera.'},
 salir:{grp:'Detalle (A en una fila)',btn:'Salir del juego',back:'abierto',note:'Cerrar con A; forzar <b>manteniendo</b> A 1,5 s (prueba a mantener <kbd>Intro</kbd> o el clic).'},
 finok:{grp:'Resultado',btn:'Tras «Cerrar»',note:'El panel se va y el juego recibe la orden de cierre amable.'},
 fin:{grp:'Resultado',btn:'Tras «Forzar»',gone:1,note:'Los procesos del juego se terminan; la sesión se guarda como siempre.'},
};
function home(){const R=(i,go,inner)=>`<div class="row big" data-f data-go="${go}" style="--i:${i}">${inner}</div>`;
 return `<div class="ph" style="--i:0"><div><b class="clk" data-clock></b><small data-date></small></div><div class="sp"></div><div class="chip" data-f data-go="mando">${svg('pad')}<span class="batt" style="--p:70"><i></i></span>70 %</div></div>
 <div class="gcard" data-f data-go="tiempo" style="--i:1"><b>${D.game}</b><small>${D.cat} · sesión 31</small><div class="tt"><div><span>Esta sesión</span><b>1 h 24 min</b></div><div><span>Total</span><b>42 h 17 min</b></div></div><i class="rbline"></i></div>
 ${R(2,'logros',`${ring(48,52,6,'<b style="font-size:15px">23</b>')}<span><b>Logros · 23 de 48</b><small>Último: Primer amanecer · hace 12 min</small></span>${svg('chev','chev')}`)}
 ${R(3,'capturas',`${svg('cam')}<span style="flex:none;width:90px"><b>Capturas</b><small>12 nuevas</small></span><div class="bth">${D.shots.slice(0,4).map((t,i)=>`<div class="th" style="--bg:${SHOT[i]}"></div>`).join('')}</div>`)}
 ${R(4,'audio',`${svg('vol')}<span><b>Volumen · 64 %</b><div class="vbar" style="--p:64;margin:7px 0 5px"><i></i></div><small>Salida: Auriculares · Entrada: Arctis 7</small></span>`)}
 ${R(5,'rendimiento',`<div class="bperf"><div>${ring(38,58,7,'<b style="font-size:14px"><span data-v="cpu"></span>%</b>','cpu')}<span><b>CPU</b>${hbars('cpu',22,28)}</span></div><div>${ring(85,58,7,'<b style="font-size:14px"><span data-v="gpu"></span>%</b>','gpu')}<span><b>GPU · 71 °C</b>${hbars('gpu',22,28)}</span></div></div>`)}
 <div class="pair" style="--i:6"><div class="btn" data-f data-go="salir">${svg('x')} Cerrar juego</div><div class="btn bad" data-f data-go="salir">${svg('power')} Forzar…</div></div>`}
function view(k,o){
 if(k==='cerrado')return closedTag();if(k==='fin')return finV();if(k==='finok')return finOk();
 const det=DET[k];
 const hints=k==='salir'?H([['A','Cerrar','a'],['Mantén A','Forzar','a'],['B','Atrás','b']]):det?H([['✚','Mover'],['A','Elegir','a'],['B','Atrás','b']]):H([['✚','Mover'],['A','Abrir','a'],['← →','Volumen'],['B','Cerrar','b']]);
 const body=det?`<div class="dh"><span class="backb" data-up>${svg('chev')}</span>${svg(det[0])}${det[1]}</div><div class="dbody">${det[2]()}</div>`:home();
 return `<div class="B${o.anim?' anim':''}${det?' det':''}${!det&&o.fo?' ret':''}"><div class="scrim"></div><aside class="glass panel">${body}<div class="hints in" style="--i:7">${hints}</div></aside></div>`}
const INTRO='<b>Idea B · «Cristal lateral»:</b> una columna de cristal que entra por la derecha y deja el juego a la vista y en movimiento. Es la menos invasiva: para mirar la hora, la batería o subir el volumen sin «salir» del juego. Cada fila se abre dentro del mismo panel, como una pila de pantallas.';
const PAD='<b>Mando:</b> ↑ ↓ recorren las filas, ← → ajustan el volumen sobre su fila (y pasan entre los dos botones de abajo), A abre, B vuelve o cierra, el botón de silencio cierra. <b>Ratón:</b> pasar por encima enfoca, clic abre, «‹» vuelve. <b>En este mockup:</b> <kbd>Espacio</kbd> = botón de silencio, <kbd>← ↑ → ↓</kbd> = cruceta, <kbd>Intro</kbd> = A (mantenla en «Forzar cierre»), <kbd>Esc</kbd> = B.';

/* ===== motor común del mockup ===== */
const $=s=>document.querySelector(s);
const stage=$('#stage'),ov=$('#ov'),game=$('#game'),bar=$('#bar'),info=$('#info');
let cur='cerrado',bg=location.search.includes('claro')?'light':'dark',onFocus=null,nav=null;
const held=new Set();
const foEl=()=>ov.querySelector('.fo');
function setFo(el){const c=foEl();if(c===el)return;if(c)c.classList.remove('fo');if(el){el.classList.add('fo');onFocus&&onFocus(el)}}
function pick(dx,dy){const items=[...ov.querySelectorAll('[data-f]')];const c=foEl();if(!c)return items[0];const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bd=1e9;for(const it of items){if(it===c)continue;const q=it.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy,al=dx?x*dx:y*dy;if(al<=2)continue;const d=al+(dx?Math.abs(y):Math.abs(x))*2.2;if(d<bd){bd=d;best=it}}return best}
const move=(dx,dy)=>{const b=pick(dx,dy);if(b)setFo(b)};
function act(el){if(!el)return;if('back' in el.dataset){closeOv();return}if(el.dataset.go){go(el.dataset.go);return}if(el.classList.contains('opt'))el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===el));if(el.querySelector('.tog')){const t=el.querySelector('.tog');t.style.background=t.style.background?'':'var(--rb)'}}
function back(){const s=S[cur];if(s&&s.back)go(s.back,{fo:cur});else closeOv()}
function closeOv(){const r=ov.firstElementChild;if(!r||cur==='cerrado'||S[cur].gone||cur==='finok'){go('cerrado');return}r.classList.add('out');game.classList.remove('blur');setTimeout(()=>go('cerrado'),240)}
function refresh(){ov.querySelectorAll('svg[data-k]').forEach(drawChart);ov.querySelectorAll('[data-hb]').forEach(drawBars);ov.querySelectorAll('[data-v]').forEach(e=>e.textContent=Math.round(last(D[e.dataset.v])));ov.querySelectorAll('.ring[data-k]').forEach(e=>e.style.setProperty('--p',Math.round(last(D[e.dataset.k]))));const d=new Date();ov.querySelectorAll('[data-clock]').forEach(e=>e.textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));ov.querySelectorAll('[data-date]').forEach(e=>e.textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}
function go(k,o={}){if(!S[k])k='cerrado';cur=k;const s=S[k];game.className='game '+bg+(s.blur?' blur':'')+(s.gone?' gone':'');ov.innerHTML=view(k,o);const want=o.fo?ov.querySelector(`[data-f][data-go="${o.fo}"]`):null;const f=want||ov.querySelector('.fo')||ov.querySelector('[data-f]');ov.querySelectorAll('.fo').forEach(e=>e.classList.remove('fo'));if(f)setFo(f);refresh();info.innerHTML=INTRO+(s.note?'<br><br>'+s.note:'')+'<br><br>'+PAD;bar.querySelectorAll('button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k));if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k)}
let holdT=null;
function holdBegin(el){if(holdT)return;const t0=performance.now();const tick=()=>{const p=Math.min(1,(performance.now()-t0)/1500);el.style.setProperty('--h',p);if(p>=1){holdT=null;go('fin');return}holdT=requestAnimationFrame(tick)};holdT=requestAnimationFrame(tick)}
function holdEnd(){if(holdT){cancelAnimationFrame(holdT);holdT=null}ov.querySelectorAll('[data-hold]').forEach(e=>e.style.setProperty('--h',0))}
addEventListener('keydown',e=>{
 if(e.key===' '){e.preventDefault();if(cur==='cerrado'||S[cur].gone||cur==='finok')go(OPEN,{anim:1});else closeOv();return}
 if(cur==='cerrado')return;
 if(S[cur].gone||cur==='finok'){if(e.key==='Escape'||e.key==='Enter')go('cerrado');return}
 const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
 if(m){e.preventDefault();held.add(e.key);(nav||move)(...m);return}
 if(e.key==='Enter'){e.preventDefault();const f=foEl();if(f&&'hold' in f.dataset)holdBegin(f);else if(!e.repeat)act(f);return}
 if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();back()}
});
addEventListener('keyup',e=>{held.delete(e.key);if(e.key==='Enter')holdEnd()});
ov.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-f]');if(!el)return;setFo(el);if('hold' in el.dataset)holdBegin(el)});
ov.addEventListener('click',e=>{if(cur==='fin'||cur==='finok'){go('cerrado');return}if(e.target.closest('[data-up]')){back();return}const el=e.target.closest('[data-f]');if(el){if(!('hold' in el.dataset))act(el)}else if(!e.target.closest('.glass'))back()});
ov.addEventListener('pointerover',e=>{const el=e.target.closest('[data-f]');if(el)setFo(el)});
addEventListener('pointerup',holdEnd);
setInterval(()=>{walk(D.cpu,38,18);walk(D.gpu,84,10);refresh()},900);
let lastG='';for(const [k,s] of Object.entries(S)){if(s.grp!==lastG){bar.insertAdjacentHTML('beforeend',`<span class="lab">${s.grp}</span>`);lastG=s.grp}const b=document.createElement('button');b.textContent=s.btn;b.dataset.k=k;b.onclick=()=>go(k,{anim:cur==='cerrado'});bar.appendChild(b)}
bar.insertAdjacentHTML('beforeend',`<span class="lab">Fondo del juego</span><button data-bg="dark">Oscuro</button><button data-bg="light">Claro</button>`);
bar.querySelectorAll('[data-bg]').forEach(b=>{b.classList.toggle('on',b.dataset.bg===bg);b.onclick=()=>{bg=b.dataset.bg;bar.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('on',x===b));game.classList.remove('dark','light');game.classList.add(bg)}});
if(location.search.includes('embed'))document.body.classList.add('embed');
function fit(){const h=$('#hold');const sc=Math.min(1,(innerWidth-(document.body.classList.contains('embed')?0:32))/1280);stage.style.transform=`scale(${sc})`;h.style.width=1280*sc+'px';h.style.height=720*sc+'px'}
addEventListener('resize',fit);addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k!==cur)go(k)});fit();
go(location.hash.slice(1)||OPEN,{anim:1});
</script>
</body>
</html>
