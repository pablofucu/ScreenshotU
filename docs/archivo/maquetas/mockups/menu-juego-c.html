<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú del juego · Propuesta C · Lo cotidiano en la ficha + «Ajustes del juego»</title>
<style>
:root{--ink:#3a414e;--ink-2:#5f6776;--ink-3:#8a92a1;--line:rgba(95,110,135,.22);--panel:rgba(255,255,255,.84);--scrim:rgba(20,26,36,.45);--bad:#E8384F;--face:#dfe3e9;--face-hi:rgba(247,249,252,.94)}
*{box-sizing:border-box}
body{margin:0;font-family:'M PLUS Rounded 1c','Segoe UI',system-ui,sans-serif;background:#d9dde4;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px}
body.embed{padding:0;background:transparent;gap:0;overflow:hidden}
body.embed .bar,body.embed .info,body.embed h1{display:none}
h1{margin:0;font-size:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1280px;align-items:center}
.bar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink-2);cursor:pointer;box-shadow:0 2px 6px -3px rgba(0,0,0,.25)}
.bar button.on{background:var(--ink);color:#fff}
.bar .lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 4px 0 10px}
.info{max-width:1280px;width:100%;background:#fff;border-radius:14px;padding:12px 18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.info b{color:var(--ink)}
#hold{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:18px;background:#eceef2;box-shadow:0 30px 60px -30px rgba(20,30,50,.5);user-select:none}
body.embed #stage{border-radius:0;box-shadow:none}
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.amb .b1{left:-12%;top:-34%;width:62%;height:96%;background:var(--b1)}
.amb .b2{right:-14%;bottom:-40%;width:64%;height:100%;background:var(--b2)}
.glass{position:absolute;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 30px -16px rgba(30,40,60,.35),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.3);border-radius:var(--rad,18px)}
.top{position:absolute;left:64px;right:64px;top:26px;display:flex;align-items:center}
.crumb{font-weight:800;color:var(--ink-2);font-size:16px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.6)}
.crumb s{text-decoration:none;color:var(--ink-3);margin:0 6px;font-weight:500}
.clock{margin-left:auto;font-weight:800;color:var(--ink-2);font-size:20px}
.banner{left:64px;top:88px;width:922px;height:280px;--rad:32px;padding:10px}
.hero{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:radial-gradient(55% 80% at 78% 25%,color-mix(in srgb,var(--b2) 75%,white) 0,transparent 62%),radial-gradient(70% 90% at 15% 95%,var(--f2) 0,transparent 70%),linear-gradient(135deg,var(--f1),#1c1f3a)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,10,18,.42),rgba(8,10,18,0) 50%)}
.dlogo{position:absolute;left:100px;top:262px;font-size:50px;font-weight:800;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.5);z-index:3;white-space:nowrap}
.dchips{position:absolute;left:100px;top:108px;display:flex;gap:10px;z-index:4}
.pc{height:36px;padding:0 16px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(0,0,0,.5);background:linear-gradient(180deg,rgba(60,68,84,.78),rgba(30,36,48,.82));white-space:nowrap;transition:transform .2s}
.pc small{font-size:15px;font-weight:700;opacity:.92}
.pc.st{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,white),var(--c))}
.pc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pc.fo{transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--f1),0 0 24px 4px color-mix(in srgb,var(--f2) 60%,transparent)}
.pc.new{outline:2px dashed #fff7c2;outline-offset:3px}
.opts{position:absolute;right:310px;top:108px;z-index:4}
.ach{left:1002px;top:88px;width:214px;height:280px;--rad:28px;padding:22px 20px}
.lbl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ach b{display:block;font-size:40px;font-weight:800;margin:12px 0 4px}
.prog{height:10px;border-radius:9px;background:rgba(95,110,135,.18);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:45%;background:var(--gf)}
.play{left:64px;top:388px;width:290px;height:112px;--rad:30px;padding:8px}
.play .in{height:100%;border-radius:22px;background:var(--gf);display:flex;align-items:center;gap:18px;padding:0 22px;color:#fff}
.pi{flex:none;width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,#fff,#dfe3e9);display:grid;place-items:center;color:var(--f1)}
.pi svg{width:22px;height:22px;margin-left:3px}
.play b{font-size:34px;font-weight:800;display:block;line-height:1.05}
.play small{font-size:15px;font-weight:600;opacity:.92}
.dp{top:388px;height:112px;--rad:26px;padding:14px 22px}
.dh{left:378px;width:400px}.dw{left:802px;width:414px}
.hsub{font-size:15px;font-weight:700;color:var(--ink-2)}
.odo{font-size:46px;font-weight:800;color:var(--ink);margin-top:2px}
.odo u{text-decoration:none;font-size:20px;color:var(--ink-3);margin:0 12px 0 4px}
.bars{display:flex;align-items:flex-end;gap:14px;height:56px;margin-top:10px}
.bars i{flex:1;border-radius:6px;background:var(--gf);opacity:.85}
.dsect{position:absolute;left:64px;top:514px;font-size:18px;font-weight:800;color:var(--ink-2)}
.dsect span{font-weight:600;color:var(--ink-3);margin-left:8px}
.dshot{top:548px;width:176px;height:99px;--rad:16px;padding:5px}
.dshot i{display:block;width:100%;height:100%;border-radius:12px}
.hints{position:absolute;right:22px;bottom:16px;display:flex;gap:16px;font-size:15px;color:var(--ink-2);font-weight:700;z-index:30}
.hints span{display:flex;align-items:center;gap:7px}
.hints b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#fff;color:var(--ink);font-size:12px;box-shadow:0 2px 6px -2px rgba(0,0,0,.3)}
.scrim .hints{color:#fff}
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim);backdrop-filter:blur(10px)}
/* panel «Ajustes del juego» (mismo patrón que Ajustes: .scats + filas) */
.gp{position:absolute;left:150px;top:56px;width:980px;height:590px;padding:12px;border-radius:40px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.7);box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.gp>.in{height:100%;border-radius:30px;overflow:hidden;display:flex;background:var(--panel)}
.scats{flex:none;width:260px;padding:24px 14px;background:rgba(214,220,230,.5);display:flex;flex-direction:column;gap:6px;box-shadow:inset -1px 0 0 rgba(95,110,135,.15)}
.scats h2{margin:0 10px 2px;font-size:24px;font-weight:800}
.scats p{margin:0 10px 16px;font-size:15px;font-weight:600;color:var(--ink-3)}
.scat{height:52px;border-radius:15px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:17px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.scat i{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,color-mix(in srgb,var(--f1) 30%,white),var(--f1));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px color-mix(in srgb,var(--f1) 70%,black);color:#fff}
.scat i svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.scat small{margin-left:auto;font-size:14px;color:var(--ink-3)}
.scat.on{background:var(--face-hi);color:var(--f1);box-shadow:0 0 0 1px rgba(95,110,135,.18),0 6px 14px -8px rgba(40,50,70,.4)}
.scat.f{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--gf);color:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--f2) 75%,black),0 0 18px -2px color-mix(in srgb,var(--f1) 45%,transparent)}
.scat.f small{color:#fff}
.scat.f i{background:rgba(255,255,255,.92);color:var(--f1);box-shadow:none}
.scat.dis{opacity:.45}
.pane{flex:1;padding:26px 30px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pane h3{margin:0 4px;font-size:22px;font-weight:800}
.pane .d{margin:0 4px 12px;font-size:15px;font-weight:600;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:14px;height:58px;padding:0 20px;border-radius:16px;font-size:19px;font-weight:700;color:var(--ink-2);background:rgba(255,255,255,.45);flex:none}
.row .sl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sl small{display:block;font-size:13px;line-height:1.25;font-weight:600;color:var(--ink-3)}
.row .v{flex:none;font-size:16px;font-weight:700;color:var(--ink-3)}
.row .sw{display:flex;gap:4px}
.row .sw i{width:18px;height:18px;border-radius:6px;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.3)}
.row.f{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--gf);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.28);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 0 0 1px color-mix(in srgb,var(--f2) 75%,black),0 0 18px -2px color-mix(in srgb,var(--f1) 45%,transparent)}
.row.f .v,.row.f .sl small{color:inherit;opacity:.92}
.row.danger{color:var(--bad)}
.row.danger.f{background:linear-gradient(115deg,#e8384f,#c22a68);color:#fff;box-shadow:0 0 0 1px #9b1d3b,0 0 18px -2px rgba(232,56,79,.5)}
.row.gap{margin-top:14px}
.empty{margin:30px 4px;font-size:17px;font-weight:600;color:var(--ink-3)}
.tag{position:absolute;z-index:40;background:#fff7c2;color:#5a4a00;font-size:13px;font-weight:700;line-height:1.35;padding:8px 12px;border-radius:12px;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);max-width:240px}
.tag::before{content:attr(data-n);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#5a4a00;color:#fff7c2;font-size:11px;margin-right:6px}
</style>
</head>
<body>
<h1>Propuesta C · Lo de cada día en la ficha + «Ajustes del juego» con pestañas</h1>
<div class="bar" id="bar"></div>
<div id="hold"><div id="stage"></div></div>
<div class="info" id="info"></div>
<script>
const I={
 play:'<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>',
 image:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/>',
 coll:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13v7M13 16.5h7"/>',
 save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
 scale:'<path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/>',
 lib:'<path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l3.5-1 2.5 15-3.5 1z"/>',
 check:'<path d="M5 12l4 4 10-10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
};
const svg=k=>`<svg viewBox="0 0 24 24">${I[k]||''}</svg>`;
const GAMES={
 exe:{name:'Kanata no Hoshi',cat:'Novelas visuales',f1:'#7b4fd6',f2:'#d1457e',b1:'#a77bff',b2:'#ff8ab0',st:'Jugando',stc:'#3BB54A',rel:'12 mar 2021',h:'042',m:'17',ses:'23 sesiones',shots:128,via:'Ejecutable propio',pal:['#7b4fd6','#d1457e','#f2c14e'],coll:'En 2 colecciones'},
 emu:{name:'Isla Brisa',cat:'Switch',f1:'#0e9f8a',f2:'#2f74d8',b1:'#3fd6b8',b2:'#5aa0ff',st:'Pendiente',stc:'#F2B807',rel:'2019',h:'011',m:'05',ses:'6 sesiones',shots:57,via:'Con Ryujinx',pal:['#0e9f8a','#2f74d8','#ffd166'],coll:'Sin colección'},
};
function ficha(g,fo){
 const shots=[0,1,2,3,4].map(i=>`<div class="glass dshot" style="left:${64+i*192}px"><i style="background:linear-gradient(${120+i*40}deg,color-mix(in srgb,${i%2?g.f2:g.f1} 70%,white),${i%2?g.f1:g.f2})"></i></div>`).join('');
 const bars=[3,5,0,2,6,4,7].map(v=>`<i style="height:${8+v*6}px"></i>`).join('');
 return `<div class="bg"></div><div class="amb"><i class="b1"></i><i class="b2"></i></div>
 <div class="top"><span class="crumb">Inicio<s>›</s>${g.cat}<s>›</s>${g.name}</span><span class="clock">21:47</span></div>
 <div class="glass banner"><div class="hero"></div></div><div class="dlogo">${g.name}</div>
 <div class="dchips"><span class="pc st${fo==='st'?' fo':''}" style="--c:${g.stc}">${svg('check')}${g.st}</span><span class="pc">${svg('cal')}<b>Salió ${g.rel.length>4?'el':'en'}</b><small>${g.rel}</small></span><span class="pc new${fo==='coll'?' fo':''}">${svg('coll')}<b>${g.coll}</b></span></div>
 <span class="pc opts new${fo==='opts'?' fo':''}">${svg('gear')}<b>Ajustes</b></span>
 <div class="glass ach"><div class="lbl">Logros</div><b>18<span style="font-size:20px;color:var(--ink-3)"> / 40</span></b><div class="hsub">Último: «Primera estrella»</div><div class="prog"><i></i></div></div>
 <div class="glass play"><div class="in"><span class="pi">${svg('play')}</span><span><b>Jugar</b><small>${g.via}</small></span></div></div>
 <div class="glass dp dh"><div class="hsub">Horas jugadas · ${g.ses}</div><div class="odo">${g.h}<u>h</u>${g.m}<u>min</u></div></div>
 <div class="glass dp dw"><div class="hsub">Esta semana · 3 h 10 min</div><div class="bars">${bars}</div></div>
 <div class="dsect">Capturas<span>${g.shots}</span></div>${shots}`;
}
const hints=l=>`<div class="hints">${l.map(([k,t])=>`<span><b>${k}</b>${t}</span>`).join('')}</div>`;
function row(r,g){
 const c=['row',r.f?'f':'',r.danger?'danger':'',r.gap?'gap':''].join(' ');
 let rt='';
 if(r.v) rt+=`<span class="v">${r.v}</span>`;
 if(r.sw) rt+=`<span class="sw">${g.pal.map(x=>`<i style="background:${x}"></i>`).join('')}</span>`;
 return `<div class="${c}"><span class="sl">${r.l}${r.s?`<small>${r.s}</small>`:''}</span>${rt}</div>`;
}
/* pestañas: siempre las 4, en el mismo orden */
const TABS=[['asp','Aspecto','image'],['jug','Al jugar','scale'],['dat','Capturas y datos','save'],['bib','Biblioteca','lib']];
const DESC={asp:'Cómo se ve el juego en la biblioteca.',jug:'Se aplica la próxima vez que lo lances desde aquí.',dat:'Archivos del juego en este PC.',bib:'Dónde aparece y cómo se organiza. Sin salir de su categoría.'};
function gpanel(s,g){
 const tabs=TABS.map(([k,l,ic])=>{const n=(s.tabs[k]||[]).length;const cls=['scat',s.tab===k?(s.inTabs?'f':'on'):'',n?'':'dis'].join(' ');return `<div class="${cls}"><i>${svg(ic)}</i>${l}<small>${n||'—'}</small></div>`}).join('');
 const rows=(s.tabs[s.tab]||[]);
 return `<div class="scrim"><div class="gp"><div class="in">
  <div class="scats"><h2>Ajustes del juego</h2><p>${g.name}</p>${tabs}</div>
  <div class="pane"><h3>${TABS.find(t=>t[0]===s.tab)[1]}</h3><p class="d">${DESC[s.tab]}</p>${rows.length?rows.map(r=>row(r,g)).join(''):`<div class="empty">${s.emptyMsg||''}</div>`}</div>
 </div></div>${hints(s.hints)}${s.tags||''}</div>`;
}
const EXE={
 asp:[{l:'Imágenes del juego…',s:'Portada, fondo, logo e icono (SteamGridDB o del PC)'},{l:'Color del juego…',sw:1},{l:'Volver a cargar las imágenes',s:'Si alguna no se ve o está desfasada'}],
 jug:[{l:'Escalado con Magpie…',s:'Último: 1280×720 → 2x',v:'Automático'},{l:'Ejecutable…',v:'Kanata.exe'},{l:'Carpeta de trabajo…',v:'La del ejecutable'}],
 dat:[{l:'Abrir carpeta de capturas'},{l:'Añadir capturas…'},{l:'Partidas guardadas…',s:'Copias de seguridad y restaurar'},{l:'Frases y repaso…'}],
 bib:[{l:'Colecciones…',v:'En 2'},{l:'Estado…',v:'Jugando'},{l:'Fecha de lanzamiento…',v:'12 mar 2021'},{l:'Mover a otra categoría…',v:'Novelas visuales',gap:1},{l:'Ocultar de la biblioteca'},{l:'Quitar de la biblioteca',s:'Pide confirmación · las capturas se quedan',danger:1}],
};
const focusIn=(tab,i,extra={})=>EXE[tab].map((r,k)=>k===i?{...r,f:1,...extra}:r);
const S={
 'ficha':{g:'exe',grp:'Juego .exe completo',btn:'Ficha',hints:[['A','Colecciones'],['X','Jugar'],['B','Volver'],['Start','Ajustes del juego']],ficha:'coll',
  tags:`<div class="tag" data-n="1" style="left:520px;top:70px">Nuevo: píldora «Colecciones» junto a Estado y Fecha (A abre «Añadir a una colección»).</div>
   <div class="tag" data-n="2" style="left:760px;top:160px">Nuevo: botón «Ajustes» visible (hoy el menú solo se abre con Start o clic derecho).</div>`,
  note:'<b>La ficha hace lo cotidiano:</b> Jugar (ya está), Estado y Fecha (ya están) y una tercera píldora nueva, Colecciones. Start (o el botón «Ajustes») abre el panel con todo lo demás.'},
 'asp':{g:'exe',grp:'Juego .exe completo',btn:'Aspecto',tab:'asp',inTabs:1,tabs:EXE,hints:[['A','Entrar'],['B','Cerrar']],
  tags:`<div class="tag" data-n="3" style="left:14px;top:300px">Pestañas fijas (siempre 4, mismo orden). Las vacías se ven apagadas y se saltan.</div>`,
  note:'<b>Panel «Ajustes del juego»</b> con el mismo patrón que la pantalla de Ajustes: pestañas a la izquierda, filas a la derecha. ↑/↓ cambia de pestaña (la derecha se actualiza al momento), → o A entra en las filas, ← o B vuelve a las pestañas, B en las pestañas cierra.'},
 'jug':{g:'exe',grp:'Juego .exe completo',btn:'Al jugar',tab:'jug',tabs:{...EXE,jug:focusIn('jug',0)},hints:[['A','Elegir'],['B','Pestañas']],
  note:'<b>Al jugar</b> (solo juegos .exe añadidos a mano): Magpie abre una lista de modos con ✓. Cada fila enseña su valor actual a la derecha.'},
 'bib':{g:'exe',grp:'Juego .exe completo',btn:'Biblioteca',tab:'bib',tabs:{...EXE,bib:focusIn('bib',5,{l:'Pulsa A otra vez para quitar'})},hints:[['A','Confirmar'],['B','Pestañas']],
  note:'<b>Biblioteca:</b> Colecciones, Estado y Fecha están también aquí (para tener todo en un sitio), aunque la ficha los tenga a mano. Lo que cambia la visibilidad va separado al final; Quitar en rojo con doble pulsación.'},
 'emu-ficha':{g:'emu',grp:'Juego de emulador',btn:'Ficha',ficha:'opts',hints:[['A','Ajustes del juego'],['X','Jugar'],['B','Volver'],['Start','Ajustes del juego']],
  note:'<b>Emulador:</b> la ficha es igual; el foco en el botón «Ajustes».'},
 'emu':{g:'emu',grp:'Juego de emulador',btn:'Al jugar (vacía)',tab:'jug',inTabs:1,emptyMsg:'Este juego lo abre su emulador; aquí no hay nada que ajustar.',hints:[['A','Entrar'],['B','Cerrar']],
  tabs:{asp:EXE.asp,jug:[],dat:[EXE.dat[0],EXE.dat[1],EXE.dat[2]],bib:[{l:'Colecciones…',v:'Ninguna'},{l:'Estado…',v:'Pendiente'},{l:'Fecha de lanzamiento…',v:'2019'},{l:'Ocultar de la biblioteca',gap:1}]}},
 'tab':{g:'exe',grp:'Tablet',btn:'Capturas y datos',tab:'dat',inTabs:1,hints:[['A','Entrar'],['B','Cerrar']],
  tabs:{asp:EXE.asp,jug:[EXE.jug[0]],dat:[EXE.dat[2],EXE.dat[3]],bib:EXE.bib},
  note:'<b>Tablet:</b> «Al jugar» queda solo con Magpie; «Capturas y datos» pierde Abrir carpeta y Añadir capturas.'},
};
S.emu.note='<b>Emulador:</b> la pestaña «Al jugar» se ve apagada con «—» y el cursor la salta; así las pestañas no se mueven de sitio entre juegos.';
const INTRO='<b>Idea:</b> separar «usar» de «configurar». Lo que se toca a menudo vive en la ficha (Jugar, Estado, Fecha y la nueva píldora Colecciones). Start abre «Ajustes del juego», un panel con 4 pestañas fijas que reúne <i>todas</i> las funciones, como la pantalla de Ajustes de la app.';
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),info=document.getElementById('info');
function render(k){
 const s=S[k]||S.ficha,g=GAMES[s.g];
 for(const [p,v] of Object.entries({'--f1':g.f1,'--f2':g.f2,'--gf':`linear-gradient(115deg,${g.f1},${g.f2})`,'--b1':g.b1,'--b2':g.b2})) stage.style.setProperty(p,v);
 stage.innerHTML=ficha(g,s.ficha)+(s.tabs?gpanel(s,g):hints(s.hints)+(s.tags||''));
 info.innerHTML=INTRO+'<br><br>'+s.note;
 bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 if(location.hash.slice(1)!==k) history.replaceState(null,'','#'+k);
}
let last='';
for(const [k,s] of Object.entries(S)){
 if(s.grp!==last){bar.insertAdjacentHTML('beforeend',`<span class="lab">${s.grp}</span>`);last=s.grp}
 const b=document.createElement('button');b.textContent=s.btn;b.dataset.k=k;b.onclick=()=>render(k);bar.appendChild(b);
}
if(location.search.includes('embed')) document.body.classList.add('embed');
function fit(){const h=document.getElementById('hold');const sc=Math.min(1,(innerWidth-(document.body.classList.contains('embed')?0:32))/1280);stage.style.transform=`scale(${sc})`;h.style.width=1280*sc+'px';h.style.height=720*sc+'px'}
addEventListener('resize',fit);addEventListener('hashchange',()=>render(location.hash.slice(1)));fit();
render(location.hash.slice(1)||'ficha');
</script>
