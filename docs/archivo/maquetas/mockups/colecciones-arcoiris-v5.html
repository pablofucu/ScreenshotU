<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colecciones y arcoíris v5</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2530;--ink2:#5a6270;--ink3:#8a919c;--bg:#eef1f6}
*{box-sizing:border-box;margin:0}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;background:#d9dde4;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:1280px}
.bar .ttl{font-weight:800;margin-right:4px;font-size:14px}
.bar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink2);cursor:pointer;box-shadow:0 2px 6px -3px rgba(0,0,0,.25)}
.bar button.on{background:var(--ink);color:#fff}
.bar .sep{width:1px;height:22px;background:rgba(0,0,0,.15);margin:0 6px}
.bar small{color:var(--ink3);font-size:12px;width:100%;text-align:center}
.info{max-width:1280px;width:100%;background:#fff;border-radius:14px;padding:12px 18px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.info b{color:var(--ink)}
.info p+p{margin-top:6px}
#hold{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:18px;background:var(--bg);box-shadow:0 30px 60px -30px rgba(20,30,50,.5);user-select:none}
.amb{position:absolute;inset:0;pointer-events:none}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--ao,.5);transition:background-color 1.4s ease,opacity .8s}
.amb .b1{left:-12%;top:-34%;width:62%;height:96%;background-color:var(--b1)}
.amb .b2{right:-14%;bottom:-40%;width:64%;height:100%;background-color:var(--b2)}
.layer{position:absolute;inset:0;transition:opacity .42s ease,transform .55s cubic-bezier(.2,.8,.2,1),filter .4s}
.layer.pre{opacity:0;transform:translateY(12px)}
.layer.out{opacity:0;transform:scale(.97);filter:blur(3px)}

/* ── cristal y foco (igual que sistema-v5) ── */
.f{position:relative;--rad:18px;--sc:1.06;transition:transform .22s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.a{position:absolute}
.glass{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 30px -16px rgba(30,40,60,.35),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.3);border-radius:var(--rad,18px)}
.face{position:absolute;inset:6px;border-radius:calc(var(--rad,18px) - 6px);overflow:hidden;background:#dfe3e9}
.art{width:100%;height:100%;display:block}
.f.fo{transform:scale(var(--sc));z-index:5}
.ring{position:absolute;inset:-5px;border-radius:calc(var(--rad) + 5px);padding:3px;background:linear-gradient(115deg,var(--g1),var(--g2),var(--g1));background-size:200% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .2s;animation:sheen 3s linear infinite;pointer-events:none}
.halo{position:absolute;inset:0;border-radius:inherit;box-shadow:var(--halo),var(--halo);opacity:0;transition:opacity .25s;pointer-events:none}
.fo>.ring,.fo>.halo{opacity:1}
@keyframes sheen{to{background-position:200% 0}}
.still .ring{animation:none}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.rbr .ring{background:conic-gradient(from var(--ang),var(--rbc));background-size:100% 100%;animation:spin 3.2s linear infinite;padding:3.5px}

/* ── cabecera común: nada baja de y=150 ── */
.crumb{left:40px;top:20px;display:flex;align-items:center;gap:8px;height:38px;padding:0 16px 0 5px;font-weight:800;font-size:14px;color:var(--ink2);--rad:19px}
.crumb .appi{width:28px;height:28px;border-radius:50%;background:var(--gf);transition:background .4s}
.crumb span{color:var(--ink3);font-weight:700}
.crumb em{font-style:normal;color:var(--tx);transition:color .4s}
.pgpill{left:50%;top:23px;transform:translateX(-50%);height:32px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:12.5px;font-weight:700;color:var(--ink2);--rad:16px}
.pgbar{width:54px;height:5px;border-radius:9px;background:rgba(30,40,60,.12);overflow:hidden}
.pgbar b{display:block;height:100%;background:var(--gf);border-radius:inherit;transition:width .4s}
.clock{right:40px;top:29px;font-weight:700;color:var(--ink3);font-size:13px}
.clock b{color:var(--ink2);font-size:15px;margin-left:8px}
.h1row{left:44px;top:68px;display:flex;align-items:baseline}
.h1{font-size:28px;font-weight:800}
.cnt{margin-left:14px;font-size:14px;color:var(--ink3);font-weight:700}
.tabsrow{left:40px;top:112px;display:flex;align-items:center;gap:6px}
.kb{font-size:10.5px;font-weight:800;color:var(--ink3);background:rgba(255,255,255,.7);border-radius:6px;padding:3px 6px}
.tb{padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--ink2);cursor:pointer;background:rgba(255,255,255,.45);transition:background .4s,color .3s,box-shadow .4s}
.tb.on{background:var(--gf);color:var(--on);box-shadow:var(--glow)}
.srch{margin-left:18px;height:34px;width:220px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:var(--ink3);--rad:17px}
.vp{position:absolute;left:0;right:0;top:158px;height:506px;overflow:hidden;-webkit-mask:linear-gradient(transparent,#000 12px,#000 calc(100% - 12px),transparent);mask:linear-gradient(transparent,#000 12px,#000 calc(100% - 12px),transparent)}
.hints{position:absolute;left:40px;right:40px;bottom:16px;display:flex;justify-content:flex-end;gap:10px;font-size:12px;color:var(--ink2);font-weight:700}
.hints span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.55);border-radius:999px;padding:4px 12px 4px 4px}
.hints b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#fff;color:var(--ink);font-size:10.5px;box-shadow:0 2px 6px -2px rgba(0,0,0,.25)}
.hints b.A{background:#3BB54A;color:#fff}.hints b.B{background:#E8384F;color:#fff}.hints b.X{background:#00A0D8;color:#fff}.hints b.Y{background:#F2B807}
#toast{position:absolute;left:50%;bottom:64px;transform:translate(-50%,10px);background:rgba(31,37,48,.88);color:#fff;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:.3s;z-index:80;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── piezas ── */
.mic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--gf);color:var(--on);box-shadow:var(--glow);flex:none}
.mic.sm{width:30px;height:30px;border-radius:10px}
.mic.big{position:absolute;right:24px;top:22px;width:58px;height:58px;border-radius:17px}
.tl{position:relative;width:300px;height:34px;flex:none}
.tl .ln{position:absolute;left:0;right:0;top:5px;height:3px;border-radius:9px;background:var(--grad);opacity:.85}
.tl span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:4px}
.tl span b{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--f1)}
.aur{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;opacity:.4;transition:opacity .45s}
.aur i{position:absolute;border-radius:50%;filter:blur(34px)}
.aur .x1{left:-12%;top:-70%;width:58%;height:200%;background:var(--g1)}
.aur .x2{right:-12%;bottom:-80%;width:58%;height:200%;background:var(--g2)}
.cv .face{inset:4px;border-radius:calc(var(--rad) - 4px)}
.cn{position:absolute;left:-8px;right:-8px;top:calc(100% + 6px);text-align:center;font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo .cn{color:var(--tx)}
.mc{position:absolute;left:50%;border-radius:10px;background:#fff;box-shadow:0 10px 18px -8px rgba(20,30,50,.55);transform:translateX(var(--x)) rotate(var(--r));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.mc .face{inset:3px;border-radius:8px}
.fo .mc{transform:translateX(calc(var(--x) * 1.3)) rotate(calc(var(--r) * 1.5)) translateY(-5px)}
.dash{background:rgba(255,255,255,.3);border:2px dashed rgba(90,98,112,.32);box-shadow:none}
.newin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:800;color:var(--ink2);font-size:15px}
.newin h3{font-size:17px;font-weight:800;color:var(--ink)}
.newin small{font-size:12.5px;color:var(--ink3);font-weight:700}
.pl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.pl b{color:var(--tx)}
.prog{height:8px;border-radius:99px;background:rgba(30,40,60,.1);overflow:hidden}
.prog i{display:block;height:100%;border-radius:inherit;background:var(--gf)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.meta{font-size:13.5px;color:var(--ink2);font-weight:500}

/* ── catálogo ── */
.pages{position:absolute;inset:0;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tile{width:150px;height:200px;--rad:16px}
.tile .face{inset:5px}
.tname{position:absolute;left:-10px;right:-10px;top:206px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;transition:color .3s}
.fo .tname{color:var(--tx)}
.mark{position:absolute;left:40px;right:40px;top:227px;height:4px;border-radius:9px;background:var(--m);opacity:0;transition:opacity .3s,left .3s,right .3s}
.pos .mark{opacity:.55}
.pos.fo .mark{opacity:1;left:28px;right:28px}
.vbar{position:absolute;left:1214px;top:182px;width:6px;height:440px;border-radius:9px;transition:background .4s}
.vbar .th{position:absolute;left:-4px;width:14px;border-radius:9px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px -2px rgba(30,40,60,.4);transition:top .5s cubic-bezier(.2,.8,.2,1),height .4s}
.vbar .dt{position:absolute;left:-6px;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:top .35s cubic-bezier(.2,.8,.2,1),background-color .35s,opacity .3s}
.vbar .bub{position:absolute;right:22px;margin-top:-16px;height:32px;min-width:32px;padding:0 10px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px;color:#fff;box-shadow:0 6px 14px -6px rgba(20,30,50,.5);transition:top .35s cubic-bezier(.2,.8,.2,1),background-color .35s,opacity .3s}

/* ── A · estante de cristal ── */
.rows{position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.shelf{position:absolute;left:56px;width:1130px;height:254px}
.sbody{position:absolute;inset:0;--rad:24px;--sc:1.01;transition:background .4s,box-shadow .4s}
.sring{position:absolute;inset:-4px;border-radius:28px;padding:2.5px;background:linear-gradient(115deg,var(--g1),var(--g2),var(--g1));background-size:200% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .35s;animation:sheen 4s linear infinite;pointer-events:none}
.shelf.on .sring{opacity:.75}
.shelf.on .aur{opacity:.85}
.shelf.on .sbody{background:rgba(255,255,255,.62)}
.shd{position:absolute;left:20px;right:24px;top:14px;height:44px;display:flex;align-items:center;gap:14px}
.shd h3{font-size:19px;font-weight:800;color:var(--ink);transition:color .3s}
.shelf.on .shd h3{color:var(--tx)}
.shd small{font-size:12.5px;color:var(--ink2);font-weight:700}
.shd .tl{margin-left:auto}
.sclip{position:absolute;left:10px;right:10px;top:62px;height:190px;overflow:hidden;-webkit-mask:linear-gradient(90deg,#000,#000 calc(100% - 60px),transparent);mask:linear-gradient(90deg,#000,#000 calc(100% - 60px),transparent)}
.strack{position:absolute;left:16px;top:12px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.smore{position:absolute;right:16px;top:132px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:12px;font-weight:800;color:var(--ink2);box-shadow:0 4px 10px -6px rgba(0,0,0,.35);transition:opacity .3s}
.shelf.new .newin{flex-direction:row;justify-content:flex-start;padding-left:22px;gap:14px}

/* ── B · mosaico ── */
.card{width:266px;height:228px;--rad:22px;--sc:1.05}
.coll{position:absolute;left:8px;right:8px;top:8px;height:132px;border-radius:16px;overflow:hidden;background:var(--gp)}
.coll .aur{opacity:.7}
.fo .coll .aur,.fo .bart .aur{opacity:1}
.ct{position:absolute;left:14px;right:14px;top:150px;display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:800;color:var(--ink);white-space:nowrap;transition:color .3s}
.fo .ct,.fo .bt{color:var(--tx)}
.cm{position:absolute;left:16px;top:188px;font-size:12px;font-weight:700;color:var(--ink3)}
.cbar{position:absolute;left:16px;right:60px;top:210px;height:6px;border-radius:9px;background:rgba(30,40,60,.1);overflow:hidden}
.cbar i,.cbar2 i{display:block;height:100%;background:var(--gf);border-radius:inherit}
.cpn{position:absolute;right:16px;top:203px;font-size:12px;font-weight:800;color:var(--ink2)}

/* ── C · lista + detalle ── */
.lpanel{left:48px;top:8px;width:332px;height:486px;--rad:24px}
.lrow{left:60px;width:308px;height:54px;display:flex;align-items:center;gap:12px;padding:0 16px 0 8px;--rad:16px;--sc:1.03;font-weight:700;font-size:14.5px;color:var(--ink2);border-radius:16px;transition:background .3s,color .3s,transform .22s cubic-bezier(.2,.8,.2,1)}
.lrow .mic{width:36px;height:36px;border-radius:11px;box-shadow:none}
.lrow em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ink3);font-weight:800}
.lrow.act{background:rgba(255,255,255,.78);color:var(--ink)}
.lrow.act::after{content:'';position:absolute;left:-6px;top:14px;bottom:14px;width:4px;border-radius:9px;background:var(--gf)}
.rpanel{left:400px;top:8px;width:794px;height:486px;--rad:24px}
.rpanel.swap>*{animation:swap .4s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}
.rband{position:absolute;left:8px;right:8px;top:8px;height:176px;border-radius:18px;overflow:hidden;background:var(--gp)}
.rband .aur{opacity:.95}
.rbt{position:absolute;left:24px;top:22px}
.rt{font-size:32px;font-weight:800;color:var(--tx);margin:4px 0 2px}
.rband .tl{position:absolute;right:26px;bottom:14px;width:340px}
.rclip{position:absolute;left:8px;right:8px;top:194px;height:200px;overflow:hidden;-webkit-mask:linear-gradient(90deg,#000,#000 calc(100% - 50px),transparent);mask:linear-gradient(90deg,#000,#000 calc(100% - 50px),transparent)}
.rfoot{position:absolute;left:28px;right:28px;top:410px}
.cnew{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--ink2);font-weight:700}
.cnew h3{font-size:22px;color:var(--ink)}
.cnew p{max-width:380px;font-size:13.5px}

/* ── D · pancartas ── */
.dtrack{position:absolute;left:56px;top:0;bottom:0;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.ban{width:292px;height:430px;--rad:26px;--sc:1.035}
.bart{position:absolute;left:10px;right:10px;top:10px;height:262px;border-radius:19px;overflow:hidden;background:var(--gp)}
.bart .aur{opacity:.75}
.bt{position:absolute;left:18px;right:18px;top:286px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;color:var(--ink);transition:color .3s}
.cm2{position:absolute;left:20px;right:20px;top:326px;font-size:12px;font-weight:700;color:var(--ink3)}
.cbar2{position:absolute;left:20px;right:20px;top:350px;height:6px;border-radius:9px;background:rgba(30,40,60,.1);overflow:hidden}
.ban .tl{position:absolute;left:26px;right:26px;top:376px;width:auto}

@media (prefers-reduced-motion:reduce){.ring,.sring,.rbr .ring{animation:none!important}*{transition-duration:.01s!important}}
</style></head><body>
<div class="bar" id="bar">
 <span class="ttl">Colecciones v5</span>
 <button data-col="A">A · Estante de cristal ★</button><button data-col="B">B · Mosaico</button><button data-col="C">C · Lista + detalle</button><button data-col="D">D · Pancartas</button>
 <span class="sep"></span>
 <span class="ttl">Arcoíris del catálogo</span>
 <button data-cat="hoy">Hoy</button><button data-cat="1">1 · Por posición</button><button data-cat="2">2 · Franja por página</button><button data-cat="3">3 · Anillo animado</button><button data-cat="4">4 · Fondo con scroll</button><button data-cat="13">1 + 3 ★</button><button data-cat="134">1 + 3 + 4</button>
 <small>Flechas: foco · Intro: A · Esc: B · Q / E: pestaña · Z / C (o RePág / AvPág): página del catálogo · 1-4 diseño de colecciones · 0-6 opción del catálogo · ratón: pasar por encima o clic</small>
</div>
<div id="hold"><div id="stage"><div class="amb"><i class="b1"></i><i class="b2"></i></div><div id="toast"></div></div></div>
<div class="info" id="info"></div>
<script>
const RAD=Math.PI/180,INK='#1f2530',FACE='#dfe3e9',RAIL='#d3d8e0';
const toLin=c=>{c/=255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)};
const fromLin=v=>{v=v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055;return Math.round(Math.max(0,Math.min(1,v))*255)};
const hexToRgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rgbToHex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
function rgbToLch([r,g,b]){r=toLin(r);g=toLin(g);b=toLin(b);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  const L=.2104542553*l+.7936177850*m-.0040720468*s,A=1.9779984951*l-2.4285922050*m+.4505937099*s,B=.0259040371*l+.7827717662*m-.8086757660*s;
  return {L,C:Math.hypot(A,B),h:(Math.atan2(B,A)/RAD+360)%360}}
function lchToLin(L,C,h){const A=C*Math.cos(h*RAD),B=C*Math.sin(h*RAD);
  const l=(L+.3963377774*A+.2158037573*B)**3,m=(L-.1055613458*A-.0638541728*B)**3,s=(L-.0894841775*A-1.2914855480*B)**3;
  return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.7076147010*s]}
const inGamut=v=>v.every(x=>x>=-1e-4&&x<=1+1e-4);
function maxChroma(L,h){let lo=0,hi=.4;for(let i=0;i<24;i++){const m=(lo+hi)/2;inGamut(lchToLin(L,m,h))?lo=m:hi=m}return lo}
function oklch(L,C,h){h=(h%360+360)%360;C=Math.min(C,maxChroma(L,h));return rgbToHex(...lchToLin(L,C,h).map(fromLin))}
function lumHex(x){const [r,g,b]=hexToRgb(x).map(toLin);return .2126*r+.7152*g+.0722*b}
function contraste(a,b){const x=lumHex(a),y=lumHex(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const hueDist=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
const hueOf=x=>rgbToLch(hexToRgb(x)).h;
function hashTitulo(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
const ARCOIRIS=[['Rojo','#E8384F'],['Naranja','#F27A1A'],['Amarillo','#F2B807'],['Verde','#3BB54A'],['Azul Wii U','#00A0D8'],['Añil','#3F63E0'],['Violeta','#9A4BD8']];

/* tokens de un tono (v3, sin cambios) */
function tokensDeTono(h){const am=Math.max(0,1-hueDist(h,100)/40),L=.66+.16*am;let on,l=L;
  if(am>=.5){on=INK;while(contraste(oklch(l,.15,h),INK)<4.5&&l<.97)l+=.01}else{on='#ffffff';while(contraste(oklch(l,.15,h),'#fff')<4.5&&l>.2)l-=.01}
  const fill=oklch(l,.15,h);let ld=.52;while(contraste(oklch(ld,.12,h),FACE)<4.5&&ld>.15)ld-=.01;const deep=oklch(ld,.12,h);
  return {acc:oklch(L,.15,h),on,fill,deep,soft:oklch(.95,.03,h),line:oklch(.86,.06,h),bar:contraste(fill,RAIL)>=3?fill:deep}}

/* ═════════ v4: dos tonos desde la portada ═════════ */
const VECINO=35, MIN_SEP=35, MAX_SEP=90, CLAMP=60, PESO2=.15;

function pixeles(muestras){
  const tot=muestras.reduce((s,[,a])=>s+a,0);
  return muestras.map(([hex,a])=>({...rgbToLch(hexToRgb(hex)),a:a/tot}))
    .filter(q=>q.L>=.20&&q.L<=.93&&q.C>=.045)           // igual que v3: ni negros, ni blancos, ni grises
    .map(q=>({h:q.h,a:q.a,w:q.a*q.C}));                  // peso = área × croma
}

function vecindario(px,excl){
  // ventana de ±30° con más peso; con excl, solo tonos a ≥ MIN_SEP de excl
  const lejos=q=>excl==null||hueDist(q.h,excl)>=MIN_SEP;
  let mejor=null;
  for(const c of px.filter(lejos)){
    const vs=px.filter(q=>lejos(q)&&hueDist(q.h,c.h)<=30);
    const w=vs.reduce((s,q)=>s+q.w,0);
    if(mejor&&w<=mejor.w)continue;
    let x=0,y=0;for(const q of vs){x+=q.w*Math.cos(q.h*RAD);y+=q.w*Math.sin(q.h*RAD)}
    mejor={h:(Math.atan2(y,x)/RAD+360)%360,w};          // media circular
  }
  return mejor;
}

function extraerDosTonos(muestras){
  // muestras: [[hex, área]] de la portada reducida (en la app, 32×45 px)
  const px=pixeles(muestras);
  if(!px.length||px.reduce((s,q)=>s+q.a,0)<.03)return null;      // sin color: respaldo
  const a=vecindario(px,null);                        // h1: idéntico a v3
  const b=vecindario(px,a.h);                         // candidato a h2, a ≥35° de h1
  if(b&&b.w>=PESO2*a.w){
    let d=((b.h-a.h+540)%360)-180;                    // distancia con signo
    if(Math.abs(d)>MAX_SEP)d=Math.sign(d)*CLAMP;      // nunca complementarios chillones
    return {h1:a.h,h2:(a.h+d+360)%360,origen:'portada'};
  }
  return {h1:a.h,h2:(a.h+VECINO)%360,origen:'vecino +35°'};   // monocromo: siguiente del arcoíris
}

function tonosDelJuego(juego){
  if(juego.aMano!=null)return {h1:juego.aMano,h2:(juego.aMano+VECINO)%360,origen:'a mano'};
  const t=extraerDosTonos(juego.p);
  if(t)return t;
  const k=hashTitulo(juego.n)%7;                      // respaldo: pareja del arcoíris global
  return {h1:hueOf(ARCOIRIS[k][1]),h2:hueOf(ARCOIRIS[(k+1)%7][1]),origen:'arcoíris'};
}

function variablesCSS(h1,h2,modo='claro'){
  const osc=modo==='oscuro', t1=tokensDeTono(h1), t2=tokensDeTono(h2);
  // tinta común: si uno de los dos tonos es amarillento, tinta oscura en ambos
  const on=(t1.on===INK||t2.on===INK)?INK:'#ffffff';
  const relleno=h=>{let l=.66;const ok=()=>contraste(oklch(l,.15,h),on)>=4.5;
    while(!ok()&&l>.2&&l<.97)l+=on===INK?.01:-.01;return oklch(l,.15,h)};
  const f1=relleno(h1), f2=relleno(h2);                          // relleno: botón, barras
  const g1=osc?oklch(.76,.16,h1):oklch(.80,.12,h1);              // medio (claro) / neón (oscuro)
  const g2=osc?oklch(.76,.16,h2):oklch(.80,.12,h2);
  const p1=osc?oklch(.30,.055,h1):oklch(.935,.04,h1);            // nácar (claro) / humo (oscuro)
  const p2=osc?oklch(.30,.055,h2):oklch(.935,.04,h2);
  const d=(a,b)=>`linear-gradient(115deg,${a},${b})`;
  return {'--g1':g1,'--g2':g2,'--grad':d(g1,g2),'--p1':p1,'--p2':p2,'--gp':d(p1,p2),
    '--f1':f1,'--f2':f2,'--gf':d(f1,f2),'--on':on,'--tx':osc?oklch(.84,.11,h1):t1.deep,
    '--glow':osc?`0 0 24px -2px ${g1}aa`:`0 10px 18px -10px ${f1}`,
    '--halo':osc?`-14px 0 34px -6px ${g1},14px 0 34px -6px ${g2}`
                :`-12px 8px 28px -10px ${g1},12px 8px 28px -10px ${g2}`};
}

/* v3 «antes» (un tono + iris), para comparar */
function colorV3(g){if(g.aMano!=null)return g.aMano;const px=pixeles(g.p);
  if(px.length&&px.reduce((s,q)=>s+q.a,0)>=.03)return vecindario(px,null).h;return hueOf(ARCOIRIS[hashTitulo(g.n)%7][1])}
function varsV3(g,modo){const h=colorV3(g),t=tokensDeTono(h),osc=modo==='oscuro';
  const iris=[-120,-80,-40,0,40,80,120].map(d=>oklch(.84,.10,h+d));
  return {'--soft':osc?oklch(.30,.05,h):t.soft,'--deep':osc?oklch(.84,.11,h):t.deep,'--line-acc':t.line,'--fill':t.fill,'--ink-on':t.on,'--bar':t.bar,'--iris':iris.join(',')+','+iris[0]}}

function RH(t){t=Math.max(0,Math.min(1,t))*6;const i=Math.min(5,Math.floor(t)),f=t-i;return (H7[i]+(H7[i+1]-H7[i])*f)%360}

 {n:'Paseos tranquilos',g:['Pradera','Hoja Verde','Isla Menta','Menta','Bosque Hondo','Jade Antiguo','Bahía Quieta'],done:3,y:[2016,2019,2024]},
 {n:'Tardes de otoño',g:['Atardecer','Ocaso','Fuego Lento','Sepia','Ámbar Lejano','Dunas de Cobre','Ruinas'],done:6,y:[2012,2017,2021]},
 {n:'Frío y azul',g:['Azul Eléctrico','Zafiro','Marea Alta','Glaciar','Cumbre Helada','Nieve Blanca','Niebla','Ciudad Gris'],done:2,y:[2015,2022,2026]},
 {n:'Para terminar',g:['Rojo Sangre','Brasa Roja','Valle Rubí','Tormenta','Rayo Amarillo'],done:1,y:[2020,2025]},
];
COLS.forEach(c=>{c.gs=c.g.map(n=>BY[n]);c.v=VG(c.gs[0])});
const NC=COLS.length+1,NEW_V=variablesCSS(232,268);
const NEU={'--g1':'#c3ccdb','--g2':'#d6cde3','--grad':'linear-gradient(115deg,#c3ccdb,#d6cde3)','--p1':'#eef0f4','--p2':'#f1eef5','--gp':'linear-gradient(115deg,#eef0f4,#f1eef5)',
 '--f1':'#5a6478','--f2':'#6c6584','--gf':'linear-gradient(115deg,#5a6478,#6c6584)','--on':'#ffffff','--tx':'#3b4252','--glow':'0 10px 18px -10px #5a6478','--halo':'0 14px 30px -12px rgba(40,50,80,.45)'};
const RBC=[0,1,2,3,4,5,6].map(i=>oklch(.74,.15,RH(i/6))).join(',')+','+oklch(.74,.15,RH(0));
const OPTS=['hoy','1','2','3','4','13','134'],POS=['1','13','134'],RBR=['3','13','134'],SCR=['4','134'];

const svgI=(p,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I_COL='<rect x="3" y="7" width="13" height="14" rx="3"/><path d="M8 3h10a3 3 0 0 1 3 3v10"/>',I_PLUS='<path d="M12 5v14M5 12h14"/>',I_SRCH='<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>';
const AUR='<div class="aur"><i class="x1"></i><i class="x2"></i></div>';
const tl=y=>`<div class="tl"><i class="ln"></i>${y.map((v,i)=>`<span style="left:${y.length>1?i/(y.length-1)*100:50}%"><b></b>${v}</span>`).join('')}</div>`;
const cover=(g,x,y,w,h,at='')=>`<div class="f glass cv a" ${at} style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;--rad:14px;${est(VG(g))}"><div class="halo"></div><div class="face">${portada(g)}</div><div class="ring"></div><div class="cn">${g.n}</div></div>`;
const fan=(c,w,h,top,dx,dr)=>[0,2,1].map(k=>`<div class="mc" style="width:${w}px;height:${h}px;top:${top}px;margin-left:${-w/2}px;--x:${(k-1)*dx}px;--r:${(k-1)*dr}deg;z-index:${k===1?3:1}"><div class="face">${portada(c.gs[k])}</div></div>`).join('');
const pct=c=>Math.round(c.done/c.gs.length*100);
const newIn=(s,txt)=>`<div class="newin"><span class="mic">${svgI(I_PLUS,s)}</span><h3>Nueva colección</h3><small>${txt}</small></div>`;

let S={tab:'col',col:'A',cat:'13',ci:0,gi:0,zone:'list',f:0},LAYER=null,TV=[];

/* ── cabecera común: termina en y≈150, el contenido empieza en 158 ── */
function header(){const cat=S.tab==='cat';
 return `<div class="glass crumb a"><i class="appi"></i>Inicio<span>›</span><em>Juegos PC</em></div>
 <div class="glass pgpill a" data-pg></div>
 <div class="clock a">Sáb 31 oct<b>21:47</b></div>
 <div class="h1row a"><span class="h1">Juegos PC</span><span class="cnt">${N} juegos · ${COLS.length} colecciones</span></div>
 <div class="tabsrow a"><span class="kb">LB</span><span class="tb" data-tab="lista">Mi lista</span><span class="tb${cat?'':' on'}" data-tab="col">Colecciones</span><span class="tb${cat?' on':''}" data-tab="cat">Catálogo</span><span class="kb">RB</span><div class="glass srch">${svgI(I_SRCH,15)}Buscar en Juegos PC</div></div>`}
const hints=()=>`<div class="hints">${S.tab==='cat'?'<span><b class="A">A</b>Abrir</span><span><b class="Y">Y</b>Mi lista</span><span><b>LT RT</b>Página</span>':'<span><b class="A">A</b>Abrir</span><span><b class="X">X</b>Nueva colección</span><span><b class="Y">Y</b>Editar</span>'}<span><b class="B">B</b>Volver</span></div>`;

/* ── A · estante de cristal ── */
const A_STEP=276,A_TOTAL=12+COLS.length*A_STEP+110;
function colA(){let h='<div class="rows">';
 COLS.forEach((c,i)=>{h+=`<div class="shelf" data-c="${i}" style="top:${12+i*A_STEP}px;${est(c.v)}"><div class="sbody glass">${AUR}</div><div class="sring"></div>
  <div class="shd"><span class="mic sm">${svgI(I_COL,16)}</span><h3>${c.n}</h3><small>${c.gs.length} juegos · ${c.done} terminados</small>${tl(c.y)}</div>
  <div class="sclip"><div class="strack">${c.gs.map((g,k)=>cover(g,k*128,0,110,150,`data-c="${i}" data-g="${k}"`)).join('')}</div></div>${c.gs.length>8?`<div class="smore">+${c.gs.length-8}</div>`:''}</div>`});
 h+=`<div class="shelf new" data-c="${COLS.length}" style="top:${12+COLS.length*A_STEP}px;height:110px;${est(NEW_V)}"><div class="sbody glass dash"></div><div class="sring"></div><div class="newin"><span class="mic">${svgI(I_PLUS,22)}</span><div><h3>Nueva colección</h3><small style="display:block;margin-top:2px">Agrupa juegos de Juegos PC · una colección nunca mezcla categorías</small></div></div></div>`;
 return h+'</div>'}

/* ── B · mosaico ── */
function colB(){return [...COLS,null].map((c,i)=>{const x=72+(i%4)*290,y=14+Math.floor(i/4)*248,pos=`left:${x}px;top:${y}px;`;
 if(!c)return `<div class="f glass dash card a" data-c="${i}" style="${pos}${est(NEW_V)}"><div class="halo"></div><div class="ring"></div>${newIn(22,'Solo juegos de Juegos PC')}</div>`;
 return `<div class="f glass card a" data-c="${i}" style="${pos}${est(c.v)}"><div class="halo"></div><div class="coll">${AUR}${fan(c,62,88,22,64,9)}</div><div class="ring"></div>
  <div class="ct"><span class="mic sm">${svgI(I_COL,16)}</span>${c.n}</div><div class="cm">${c.gs.length} juegos · ${c.y[0]}–${c.y[c.y.length-1]}</div><div class="cbar"><i style="width:${pct(c)}%"></i></div><div class="cpn">${c.done}/${c.gs.length}</div></div>`}).join('')}

/* ── C · lista + detalle ── */
function colC(){return `<div class="glass lpanel a"></div>${[...COLS,null].map((c,i)=>`<div class="f lrow a" data-c="${i}" style="top:${22+i*62}px;${est(c?c.v:NEW_V)}"><span class="mic">${svgI(c?I_COL:I_PLUS,18)}</span>${c?c.n:'Nueva colección'}${c?`<em>${c.gs.length}</em>`:''}</div>`).join('')}<div class="glass rpanel a swap" data-r="-1"></div>`}
function rDetail(i){const c=COLS[i];
 if(!c)return `<div class="cnew"><span class="mic" style="width:58px;height:58px;border-radius:17px">${svgI(I_PLUS,28)}</span><h3>Nueva colección</h3><p>Elige un nombre y añade juegos de <b>Juegos PC</b>. Las colecciones viven dentro de su categoría y nunca mezclan juegos de otras.</p></div>`;
 return `<div class="rband">${AUR}<div class="rbt"><div class="lbl">Colección</div><div class="rt">${c.n}</div><div class="meta">${c.gs.length} juegos · ${c.done} terminados</div></div><span class="mic big">${svgI(I_COL,28)}</span>${tl(c.y)}</div>
 <div class="rclip"><div class="strack" style="left:20px;top:10px">${c.gs.map((g,k)=>cover(g,k*136,0,118,160,`data-g="${k}"`)).join('')}</div></div>
 <div class="rfoot"><div class="pl">Progreso <b>${c.done} / ${c.gs.length}</b></div><div class="prog"><i style="width:${pct(c)}%"></i></div></div>`}

/* ── D · pancartas ── */
const D_MAX=NC*316-24-1184;
function colD(){return `<div class="dtrack">${[...COLS,null].map((c,i)=>{const pos=`left:${i*316}px;top:30px;`;
 if(!c)return `<div class="f glass dash ban a" data-c="${i}" style="${pos}${est(NEW_V)}"><div class="halo"></div><div class="ring"></div>${newIn(24,'Solo juegos de Juegos PC')}</div>`;
 return `<div class="f glass ban a" data-c="${i}" style="${pos}${est(c.v)}"><div class="halo"></div><div class="bart">${AUR}${fan(c,104,146,52,74,8)}</div><div class="ring"></div>
  <div class="bt"><span class="mic sm">${svgI(I_COL,16)}</span>${c.n}</div><div class="cm2">${c.gs.length} juegos · ${c.done} terminados</div><div class="cbar2"><i style="width:${pct(c)}%"></i></div>${tl(c.y)}</div>`}).join('')}</div>`}

/* ── catálogo ── */
function tileVars(i){const o=S.cat,g=CAT[i];
 if(o==='hoy'||o==='4')return VG(g);
 if(o==='3')return NEU;
 const pr=o==='2'?pair(Math.floor(i/PER)/(PGN-1)):pair(i/(N-1));return variablesCSS(pr.h1,pr.h2)}
function catHTML(){const o=S.cat,pos=POS.includes(o),rbr=RBR.includes(o);TV=CAT.map((g,i)=>tileVars(i));
 return `<div class="pages">${CAT.map((g,i)=>{const x=84+(i%6)*186,y=20+Math.floor(i/6)*243;
  return `<div class="f glass tile a${pos?' pos':''}${rbr?' rbr':''}" data-i="${i}" style="left:${x}px;top:${y}px;${est(TV[i])}${rbr?`;--rbc:${RBC}`:''};--m:${oklch(.74,.14,RH(i/(N-1)))}"><div class="halo"></div><div class="face">${portada(g)}</div><div class="ring"></div><div class="tname">${g.n}</div><div class="mark"></div></div>`}).join('')}</div>`}
const vbarHTML=()=>`<div class="vbar"><div class="th" style="background:rgba(255,255,255,.3);border:2.5px solid #fff"></div><div class="dt"></div><i class="bub" style="white-space:nowrap"></i><div class="vhit" style="position:absolute;left:-16px;right:-16px;top:-12px;bottom:-12px;cursor:pointer"></div></div>`;
function paintVbar(h){const vb=LAYER.querySelector('.vbar');if(!vb)return;
 const o=S.cat,i=h??S.f,t=i/(N-1),g=CAT[i],tv=TV[i],pg=Math.floor(S.f/PER),own=o==='3'||o==='4';
 const col=own?oklch(.6,.15,RH(t)):tv['--f1'],on=own?'#fff':tv['--on'];
 vb.style.background=o==='hoy'?'rgba(30,40,60,.14)':o==='2'?`linear-gradient(180deg,${[...Array(PGN)].map((_,p)=>{const c=oklch(.74,.14,RH(p/(PGN-1)));return `${c} ${p/PGN*100}% ${(p+1)/PGN*100}%`}).join(',')})`:rbGrad('180deg');
 const th=vb.querySelector('.th');th.style.top=pg/PGN*440+'px';th.style.height=440/PGN+'px';
 const dt=vb.querySelector('.dt');dt.style.top=t*440+'px';dt.style.backgroundColor=col;
 const b=vb.querySelector('.bub');b.style.top=t*440+'px';b.style.backgroundColor=col;b.style.color=on;b.textContent=h!=null?`${LET(g)} · ${g.n}`:LET(g)}

/* ── construir y actualizar ── */
function build(){
 const L=document.createElement('div');L.className='layer pre';const cat=S.tab==='cat';
 L.innerHTML=header()+`<div class="vp">${cat?catHTML():{A:colA,B:colB,C:colC,D:colD}[S.col]()}</div>`+(cat?vbarHTML():'')+hints();
 ST.insertBefore(L,TOAST);
 if(LAYER){const o=LAYER;o.classList.add('out');o.style.pointerEvents='none';setTimeout(()=>o.remove(),450)}
 LAYER=L;requestAnimationFrame(()=>requestAnimationFrame(()=>L.classList.remove('pre')));
 upd();info();paintBar();fit()}

function updCol(q,qa){const d=S.col,i=S.ci,c=COLS[i],v=c?c.v:NEW_V;
 if(d==='A'){qa('.shelf').forEach(e=>{const k=+e.dataset.c;e.classList.toggle('on',k===i);
   const tr=e.querySelector('.strack');if(tr)tr.style.transform=`translateX(${k===i?-Math.max(0,S.gi-6)*128:0}px)`;
   const sm=e.querySelector('.smore');if(sm)sm.style.opacity=k===i&&S.gi>5?0:1});
  q('.rows').style.transform=`translateY(${-clamp(i*A_STEP,0,A_TOTAL-494)}px)`;
  if(c)q(`.cv[data-c="${i}"][data-g="${S.gi}"]`).classList.add('fo')}
 if(d==='B')q(`.card[data-c="${i}"]`).classList.add('fo');
 if(d==='D'){q(`.ban[data-c="${i}"]`).classList.add('fo');q('.dtrack').style.transform=`translateX(${-clamp((i-1)*316,0,D_MAX)}px)`}
 if(d==='C'){qa('.lrow').forEach(e=>e.classList.toggle('act',+e.dataset.c===i));
  const r=q('.rpanel');if(+r.dataset.r!==i){r.dataset.r=i;r.innerHTML=rDetail(i);r.setAttribute('style',est(v))}
  if(S.zone==='list'||!c)q(`.lrow[data-c="${i}"]`).classList.add('fo');
  else{r.querySelector(`.cv[data-g="${S.gi}"]`).classList.add('fo');r.querySelector('.strack').style.transform=`translateX(${-Math.max(0,S.gi-4)*136}px)`}}
 return {v,b1:v['--g1'],b2:v['--g2'],ao:.5,pill:`Colección ${i+1} / ${NC}<span class="pgbar"><b style="width:${(i+1)/NC*100}%"></b></span>`}}

function updCat(q){const o=S.cat,f=S.f,t=f/(N-1),pg=Math.floor(f/PER),tv=TV[f];
 q(`.tile[data-i="${f}"]`).classList.add('fo');
 q('.pages').style.transform=`translateY(${-pg*486}px)`;
 let b1='#cdd6e4',b2='#e2d9ec',ao=.55;
 if(SCR.includes(o)){b1=oklch(.82,.11,RH(t));b2=oklch(.84,.10,RH(Math.min(1,t+.14)));ao=.66}
 else if(o==='hoy'||o==='2'){b1=tv['--g1'];b2=tv['--g2'];ao=.5}
 paintVbar();
 const a=CAT[pg*PER],z=CAT[Math.min(N-1,pg*PER+PER-1)];
 return {v:tv,b1,b2,ao,pill:`Página ${pg+1} / ${PGN} · ${LET(a)}–${LET(z)}<span class="pgbar"><b style="width:${(pg+1)/PGN*100}%"></b></span>`}}

function upd(){const q=s=>LAYER.querySelector(s),qa=s=>LAYER.querySelectorAll(s);
 qa('.fo').forEach(e=>e.classList.remove('fo'));
 const r=S.tab==='cat'?updCat(q):updCol(q,qa);
 Object.entries(r.v).forEach(([k,x])=>ST.style.setProperty(k,x));
 ST.style.setProperty('--b1',r.b1);ST.style.setProperty('--b2',r.b2);ST.style.setProperty('--ao',r.ao);
 q('[data-pg]').innerHTML=r.pill}

/* ── textos ── */
const DI={
 A:'<b>A · Estante de cristal (recomendada).</b> Cada colección es un estante de cristal v5: aurora con sus dos colores dentro y un anillo que brilla al enfocarla. La cabecera del estante (icono, nombre, recuento y línea de tiempo) va <b>dentro</b> del cristal, así que ya no choca con la barra de arriba: la cabecera de la pantalla acaba en y≈150 y los estantes empiezan debajo. ↑↓ cambia de estante, ←→ recorre las portadas. Es la que menos cambia el <code>Shelf.svelte</code> actual.',
 B:'<b>B · Mosaico.</b> Cada colección es una tarjeta de cristal con tres portadas en abanico que se abren al enfocarla, más recuento, años y progreso. Se ven las 6 de un vistazo; para ver los juegos hay que entrar (A). Bueno si llegas a tener muchas colecciones.',
 C:'<b>C · Lista + detalle.</b> Lista de cristal a la izquierda; a la derecha, la franja de color de la colección con su línea de tiempo, las portadas y el progreso. Muy cómoda con ratón; con mando son dos zonas (→ entra en las portadas, ← vuelve a la lista). Es el cambio de código más grande.',
 D:'<b>D · Pancartas.</b> Una pancarta alta por colección en fila horizontal, con collage, progreso y línea de tiempo. Muy visual y muy de mando (←→), pero caben unas 4 y no se ven portadas sueltas hasta entrar.'};
const COMMON='En las cuatro, las colecciones viven <b>dentro</b> de la categoría (aquí Juegos PC) y nunca mezclan juegos de otras categorías. El color de cada colección son los dos tonos de su primera portada; «Nueva colección» va siempre al final, punteada.';
const CI={
 hoy:'<b>Hoy.</b> Cada portada usa sus dos colores (v5). Al mover el foco el color salta sin orden y la barra lateral es gris: solo decora.',
 1:'<b>1 · Por posición.</b> El tono sale del sitio en la lista: A→Z recorre rojo → violeta. Lo usan el halo, el anillo, el nombre y una rayita bajo cada portada. La barra lateral pinta el mismo arcoíris, así que el punto y la burbuja con la letra caen justo en el color de la portada enfocada. El fondo se queda neutro.',
 2:'<b>2 · Una franja por página.</b> Toda la página comparte tono, y al pasar de página (Z / C) cambian el tono y la atmósfera. Más tranquilo, pero dentro de la página no hay variación. La barra va en bandas.',
 3:'<b>3 · Anillo animado.</b> Las portadas quedan neutras; solo el borde del foco es un arcoíris cónico que gira. Halo y fondo neutros. Por sí sola se queda corta: está pensada para combinar con 1 o 2.',
 4:'<b>4 · Fondo con el scroll.</b> Las portadas siguen con sus colores (como hoy), pero la atmósfera de fondo recorre el arcoíris según dónde estás en la lista (en la app, con el tween de <code>atmos.ts</code>).',
 13:'<b>1 + 3 (recomendada).</b> Tono por posición en halo, nombre y rayita, y además el anillo arcoíris girando. El fondo se queda neutro, así que el color solo está donde está el foco. La barra y el foco coinciden siempre.',
 134:'<b>1 + 3 + 4.</b> Lo anterior y además la atmósfera sigue el arcoíris con el scroll. Es la más vistosa; en sesiones largas puede cansar.'};
const CONFLICT='<b>Conflicto con v5:</b> hoy el foco de cada juego usa <i>sus</i> dos colores. Con esta opción, en el catálogo manda el arcoíris; al abrir el juego (A) su ficha vuelve a sus propios colores (lo verás en el aviso de abajo, con su degradado).';
const CBAR='<b>Barra lateral (nota 11):</b> ahora es un minimapa. Clic o arrastre = saltar a esa altura; al pasar el ratón, la burbuja dice qué juego hay ahí. El tirador marca la página visible.';
function info(){INFO.innerHTML=S.tab==='cat'?`<p>${CI[S.cat]}</p>${S.cat!=='hoy'&&S.cat!=='4'?`<p>${CONFLICT}</p>`:''}<p>${CBAR}</p>`:`<p>${DI[S.col]}</p><p>${COMMON}</p>`}
function paintBar(){document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.col?b.dataset.col===S.col&&S.tab==='col':b.dataset.cat===S.cat&&S.tab==='cat'))}

/* ── acciones ── */
let TT;function toast(h){TOAST.innerHTML=h;TOAST.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>TOAST.classList.remove('on'),2200)}
function act(b){
 if(b==='B'){toast('B · volver a Inicio');return}
 if(S.tab==='cat'){const g=CAT[S.f],own=VG(g),cf=S.cat!=='hoy'&&S.cat!=='4';
  toast(`<i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${own['--gf']};margin-right:8px;vertical-align:-1px"></i>Ficha de «${g.n}»${cf?' · vuelve a sus dos colores':''}`);return}
 const c=COLS[S.ci];
 if(!c)toast('Crear una colección nueva en Juegos PC');
 else if(S.col==='A'||(S.col==='C'&&S.zone==='cov'))toast(`Abrir «${c.gs[S.gi].n}»`);
 else toast(`Abrir la colección «${c.n}»`)}
function move(dx,dy){
 if(S.tab==='cat'){S.f=clamp(S.f+dx+dy*6,0,N-1)}
 else{const d=S.col;
  if(d==='A'){if(dy){S.ci=clamp(S.ci+dy,0,NC-1);const c=COLS[S.ci];S.gi=c?Math.min(S.gi,c.gs.length-1):0}
   else if(COLS[S.ci])S.gi=clamp(S.gi+dx,0,COLS[S.ci].gs.length-1)}
  if(d==='B')S.ci=clamp(S.ci+dx+dy*4,0,NC-1);
  if(d==='D'&&dx)S.ci=clamp(S.ci+dx,0,NC-1);
  if(d==='C'){if(dy){S.ci=clamp(S.ci+dy,0,NC-1);const c=COLS[S.ci];if(!c)S.zone='list';else S.gi=Math.min(S.gi,c.gs.length-1)}
   else if(S.zone==='list'){if(dx>0&&COLS[S.ci]){S.zone='cov';S.gi=0}}
   else if(dx<0&&S.gi===0)S.zone='list';else S.gi=clamp(S.gi+dx,0,COLS[S.ci].gs.length-1)}}
 upd()}
function page(d){if(S.tab!=='cat')return;S.f=clamp(S.f+d*PER,0,N-1);upd()}
function setCol(d){S.tab='col';S.col=d;S.zone='list';S.gi=0;build()}
function setCat(o){S.tab='cat';S.cat=o;build()}
function setTab(t){if(t==='lista'){toast('Mi lista no entra en este mockup');return}if(S.tab!==t){S.tab=t;build()}}

/* ── entrada ── */
const key=()=>JSON.stringify(S);
ST.addEventListener('mouseover',e=>{if(!LAYER||!LAYER.contains(e.target))return;const k0=key();
 const t=e.target.closest('[data-i],[data-g],[data-c]');if(!t)return;
 if(t.dataset.i!=null)S.f=+t.dataset.i;
 else if(S.col==='C'){if(t.dataset.g!=null){S.zone='cov';S.gi=+t.dataset.g}else{S.ci=+t.dataset.c;S.zone='list'}}
 else{S.ci=+t.dataset.c;if(t.dataset.g!=null)S.gi=+t.dataset.g;else{const c=COLS[S.ci];S.gi=c?Math.min(S.gi,c.gs.length-1):0}}
 if(key()!==k0)upd()});
ST.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
 if(e.target.closest('.vhit'))return;
 if(e.target.closest('[data-i],[data-g],[data-c]'))act('A')});
const vIdx=e=>{const r=LAYER.querySelector('.vbar').getBoundingClientRect();return Math.round(clamp((e.clientY-r.top)/r.height,0,1)*(N-1))};
ST.addEventListener('mousedown',e=>{if(e.target.closest('.vhit')){S.f=vIdx(e);upd()}});
ST.addEventListener('mousemove',e=>{if(!e.target.closest('.vhit'))return;const i=vIdx(e);if(e.buttons&1){if(i!==S.f){S.f=i;upd()}}else paintVbar(i)});
ST.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.vhit'))paintVbar()});
addEventListener('keydown',e=>{const k=e.key,M={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
 if(M[k]){e.preventDefault();move(...M[k]);return}
 if(k==='Enter')act('A');else if(k==='Escape'||k==='Backspace')act('B');
 else if(/^[qe]$/i.test(k))setTab(S.tab==='col'?'cat':'col');
 else if(/^z$/i.test(k)||k==='PageUp'){e.preventDefault();page(-1)}
 else if(/^c$/i.test(k)||k==='PageDown'){e.preventDefault();page(1)}
 else if(/^[0-6]$/.test(k)){if(S.tab==='col'){if(k>='1'&&k<='4')setCol('ABCD'[k-1])}else setCat(OPTS[+k])}});
document.getElementById('bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.dataset.col?setCol(b.dataset.col):setCat(b.dataset.cat)});

function fit(){const bar=document.getElementById('bar'),info=document.getElementById('info');
 const s=Math.max(.35,Math.min(1,(innerWidth-32)/1280,(innerHeight-bar.offsetHeight-info.offsetHeight-56)/720));
 ST.style.transform=`scale(${s})`;const h=document.getElementById('hold');h.style.width=1280*s+'px';h.style.height=720*s+'px'}
addEventListener('resize',fit);
build();
document.fonts&&document.fonts.ready.then(fit);
</script></body></html>
