<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propuesta 1 · Panel compacto (Recomendada)</title>
<style>
:root{--round:'M PLUS Rounded 1c','Nunito','Segoe UI','Yu Gothic UI','Meiryo UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--round);background:#101319;color:#e6e9f0}
body.page-light{background:#dfe3e9;color:#3a414e}
button{font-family:var(--round)}

.deck{max-width:1280px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;
  background:rgba(30,34,43,.88);box-shadow:inset 0 0 0 1px rgba(200,210,235,.16);color:#e6e9f0}
body.page-light .bar{background:rgba(255,255,255,.88);box-shadow:inset 0 0 0 1px rgba(95,110,135,.22);color:#3a414e}
.bar-t{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:220px}
.bar-t b{font-size:17px;font-weight:800;line-height:1.2}
.bar-t span{font-size:13px;font-weight:500;opacity:.8;line-height:1.35}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(128,140,165,.16);box-shadow:inset 0 0 0 1px rgba(128,140,165,.22)}
.seg button{appearance:none;border:0;background:transparent;color:inherit;font:700 13px/1 var(--round);height:30px;padding:0 12px;border-radius:999px;cursor:pointer;opacity:.78;transition:opacity .15s,background .15s}
.seg button:hover{opacity:1}
.seg button.on{background:#0089be;color:#fff;opacity:1}

.stage-wrap{width:100%;position:relative;overflow:hidden;border-radius:22px;box-shadow:0 24px 60px -22px rgba(0,0,0,.6)}
#stage{
  width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;user-select:none;
  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#757d8c;--line:rgba(95,110,135,.24);--line-2:rgba(150,160,180,.35);
  --face:#dfe3e9;--face-hi:rgba(247,249,252,.94);--panel:rgba(255,255,255,.78);--scrim:rgba(20,26,36,.46);
  --glass-top:rgba(255,255,255,.72);--glass-mid:rgba(255,255,255,.30);--glass-bot:rgba(225,234,246,.22);
  --glass-in:rgba(255,255,255,.58);--glass-chip:rgba(255,255,255,.82);
  --pill-top:rgba(255,255,255,.82);--pill-bot:rgba(255,255,255,.54);--pill-glow:rgba(255,255,255,.9);
  --tile-bg:rgba(255,255,255,.62);--hl:rgba(255,255,255,1);--hl-ring:rgba(255,255,255,.55);--hl-bot:rgba(255,255,255,.95);--tint-base:#fff;
  --btn-n:var(--ink);--btn-n-top:color-mix(in srgb,var(--ink) 78%,var(--tint-base));--btn-n-fg:var(--on);--btn-n-edge:color-mix(in srgb,var(--ink) 70%,black);
  --ok:#3BB54A;--bad:#E8384F;--warn:#F2B807;--ok-f:#27833a;--bad-f:#d92c44;
  --r-xs:6px;--r-s:12px;--r-m:18px;--r-l:28px;--r-pill:999px;
  --t-xs:11px;--t-s:13px;--t-m:15px;--t-l:17px;--t-xl:20px;--t-2xl:28px;--t-3xl:44px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;
  --band:64px;--gut:24px;--content-end:644px;
  --d-1:120ms;--d-2:200ms;--d-3:300ms;
  --e-soft:cubic-bezier(.2,.8,.3,1);--e-bounce:cubic-bezier(.34,1.32,.64,1);--e-rail:cubic-bezier(.25,1,.4,1);
  --f1:#0089be;--f2:#3253c5;--gf:linear-gradient(115deg,var(--f1),var(--f2));
  --v1:#00A0D8;--v2:#3F63E0;--gv:linear-gradient(115deg,var(--v1),var(--v2));
  --g1:#00A0D8;--g2:#3F63E0;--grad:linear-gradient(115deg,var(--g1),var(--g2));
  --on:#fff;
  --ring:0 0 0 3px var(--f1),0 0 22px 2px color-mix(in srgb,var(--f2) 45%,transparent);
  --sh-1:0 0 0 1px rgba(95,110,135,.24),0 2px 3px rgba(40,50,70,.10),0 18px 30px -16px rgba(40,50,70,.42);
  --sh-3:0 0 0 1px rgba(95,110,135,.24),0 8px 14px -6px rgba(20,26,36,.22),0 36px 64px -22px rgba(20,26,36,.55);
  color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%);
}
#stage[data-theme=dark]{
  color-scheme:dark;background:radial-gradient(120% 90% at 50% 0%,#232631 0%,#16181e 60%,#0f1115 100%);
  --ink:#e6e9f0;--ink-2:#b4bccb;--ink-3:#8f98a9;--line:rgba(200,210,235,.16);--line-2:rgba(200,210,235,.24);
  --face:#262a33;--face-hi:rgba(30,33,41,.95);--panel:rgba(30,34,43,.84);--scrim:rgba(0,0,0,.62);
  --glass-top:rgba(60,66,80,.62);--glass-mid:rgba(36,40,50,.42);--glass-bot:rgba(20,22,28,.38);
  --glass-in:rgba(255,255,255,.07);--glass-chip:rgba(40,44,56,.86);
  --pill-top:rgba(52,57,70,.88);--pill-bot:rgba(36,40,50,.82);--pill-glow:rgba(255,255,255,.06);
  --tile-bg:rgba(40,44,56,.62);--hl:rgba(255,255,255,.10);--hl-ring:rgba(255,255,255,.06);--hl-bot:rgba(255,255,255,.04);--tint-base:#262a33;
  --btn-n:var(--face);--btn-n-top:color-mix(in srgb,var(--ink) 16%,var(--face));--btn-n-fg:var(--ink);--btn-n-edge:var(--line-2);
  --ring:0 0 0 3px var(--g1),0 0 26px 4px color-mix(in srgb,var(--g2) 60%,transparent);
  --sh-1:0 0 0 1px rgba(200,210,235,.14),0 2px 3px rgba(0,0,0,.30),0 18px 30px -16px rgba(0,0,0,.70);
  --sh-3:0 0 0 1px rgba(200,210,235,.16),0 8px 14px -6px rgba(0,0,0,.5),0 36px 64px -22px rgba(0,0,0,.85);
}

.blob{position:absolute;border-radius:50%;opacity:.45;background:radial-gradient(circle,var(--v1),color-mix(in srgb,var(--v1) 40%,transparent) 38%,transparent 70%);pointer-events:none}
#stage[data-theme=dark] .blob{opacity:.32}

/* Cristal Wii U */
.glass{position:absolute;--r:28px;--bw:10px;border-radius:var(--r);padding:var(--bw);isolation:isolate;
  background:linear-gradient(180deg,var(--glass-top) 0%,var(--glass-mid) 46%,var(--glass-bot) 100%);
  -webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);
  box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),inset 0 -10px 14px -8px var(--hl-bot),inset 0 -1.5px 0 rgba(110,125,150,.30),var(--sh-1)}
.glass::before{content:'';position:absolute;z-index:2;left:2px;right:2px;top:2px;height:52%;pointer-events:none;
  border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;
  background:linear-gradient(180deg,var(--tile-bg) 0%,rgba(255,255,255,.20) 55%,rgba(255,255,255,0) 100%);
  -webkit-mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:.42}
.glass::after{content:'';position:absolute;z-index:3;left:12%;top:3px;width:34%;height:5px;border-radius:var(--r-xs);pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,1) 40%,rgba(255,255,255,0));filter:blur(.6px);opacity:.65}
.glass>.face{position:relative;z-index:1;width:100%;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);overflow:hidden;background:var(--face)}
.glass>.face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(20,30,50,.18),inset 0 3px 6px -2px rgba(0,0,0,.3),inset 0 -2px 4px -2px var(--hl-ring)}

.pill{-webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);
  background:linear-gradient(180deg,var(--pill-top),var(--pill-bot));
  box-shadow:inset 0 1px 0 var(--glass-top),inset 0 -6px 10px -6px var(--pill-glow),inset 0 -1px 0 rgba(110,125,150,.22),0 0 0 1px rgba(95,110,135,.22),0 10px 20px -12px rgba(40,50,70,.4)}

/* Fondo: Ficha del juego simplificada (Detail.svelte) */
.detail-bg{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;height:76px}
.avatar{left:22px;top:12px;width:60px;height:60px;--r:16px;--bw:5px}
.avatar .face{background:linear-gradient(180deg,color-mix(in srgb,var(--f1) 35%,var(--tint-base)),var(--f1));display:grid;place-items:center;color:var(--on)}
.crumb{position:absolute;left:98px;top:22px;height:40px;display:flex;align-items:center;gap:10px;padding:0 18px;border-radius:var(--r-pill);font-size:var(--t-xl);font-weight:700;color:var(--ink-2)}
.crumb .sep{color:var(--ink-3);font-weight:500}.crumb .cur{color:var(--f1)}
.clock{position:absolute;right:24px;top:24px;font-size:var(--t-xl);font-weight:700;color:var(--ink-2)}
.banner{left:64px;top:88px;width:922px;height:280px;--r:32px;--bw:10px}
.dcover{left:1016px;top:88px;width:200px;height:280px;--r:26px;--bw:9px}
.play{left:64px;top:388px;width:290px;height:112px;--r:30px;--bw:8px}
.play .face{display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--gf);color:var(--on)}
.play .pi{width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,#fff,#dfe3e9);display:grid;place-items:center;color:var(--f1)}
.play b{font-size:32px;font-weight:800;display:block;line-height:1.05}
.play small{font-size:var(--t-m);font-weight:700;opacity:.92}
.dpanel{position:absolute;top:388px;height:112px;border-radius:var(--r-l);padding:14px 22px;display:flex;flex-direction:column;justify-content:center}
.dhours{left:378px;width:400px}.dweek{left:802px;width:414px}
.odo-val{font-size:40px;font-weight:800;letter-spacing:.03em;color:var(--ink)}
.shots-row{position:absolute;left:64px;top:520px;display:flex;gap:16px}
.shot-ph{width:220px;height:124px;border-radius:var(--r-m);background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line)}

/* Scrim y pistas */
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding-bottom:var(--band)}
.hints{position:absolute;right:var(--gut);bottom:calc((var(--band) - 38px) / 2);display:flex;gap:10px;z-index:30}
.hint{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:var(--r-pill);font-size:var(--t-m);font-weight:700;color:var(--ink-2)}
.btn{min-width:28px;height:28px;border-radius:var(--r-s);display:grid;place-items:center;font-size:var(--t-s);font-weight:800;color:var(--on);--b:var(--ink-2);padding:0 6px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--b) 55%,var(--tint-base)) 0%,var(--b) 55%,color-mix(in srgb,var(--b) 85%,black) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px color-mix(in srgb,var(--b) 70%,black),0 1px 2px rgba(0,0,0,.2)}
.btn.a{--b:var(--ok)}.btn.b{--b:var(--bad)}.btn.y{--b:var(--warn);color:#3a414e}
.btn.sh{border-radius:var(--r-xs);height:26px;padding:0 var(--s-2);color:var(--btn-n-fg);
  background:linear-gradient(180deg,var(--btn-n-top) 0%,var(--btn-n) 55%,color-mix(in srgb,var(--btn-n) 85%,black) 100%);
  box-shadow:inset 0 1px 0 var(--hl-ring),0 0 0 1px var(--btn-n-edge),0 1px 2px rgba(0,0,0,.25)}
.shp{display:flex;gap:var(--s-1)}

/* ---------- PROPUESTA 1: MODAL COMPACTO UNICO ---------- */
.gs-modal{
  position:relative;width:960px;max-height:604px;--r:var(--r-l);--bw:var(--s-3);
  box-shadow:inset 0 1.5px 0 var(--hl),inset 0 0 0 1px var(--hl-ring),inset 0 -10px 14px -8px var(--hl-bot),inset 0 -1.5px 0 rgba(110,125,150,.30),var(--sh-3);
  animation:modalIn var(--d-3) var(--e-bounce);
}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}}
.gs-modal>.face{background:var(--panel);padding:var(--s-5) var(--s-6) var(--s-4);display:flex;flex-direction:column;gap:var(--s-4);height:auto}

/* Cabecera integrada del juego */
.gs-head{display:flex;align-items:center;gap:var(--s-4)}
.gs-cov{width:58px;height:82px;border-radius:var(--r-s);overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--hl-ring),0 8px 18px -8px rgba(0,0,0,.45)}
.gs-cov svg{width:100%;height:100%;display:block}
.gs-title-blk{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.gs-kicker{font:800 var(--t-xs)/1 var(--round);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.gs-title-blk h2{margin:0;font:800 var(--t-2xl)/1.15 var(--round);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-meta{display:flex;align-items:center;gap:10px;font:500 var(--t-s)/1.2 var(--round);color:var(--ink-2)}
.gs-meta i{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.gs-badges{display:flex;align-items:center;gap:var(--s-2);flex:none}
.st-pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:var(--r-pill);font:700 var(--t-s)/1 var(--round);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px -6px rgba(0,0,0,.4)}
.acc-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line);font:700 var(--t-s)/1 var(--round);color:var(--ink-2)}
.acc-chip i{width:16px;height:16px;border-radius:50%;background:var(--gv);box-shadow:0 0 0 2px var(--tint-base)}

/* Pestañas horizontales con LB/RB y riel deslizante */
.tabs-bar{display:flex;align-items:center;gap:var(--s-3)}
.tabs-track{position:relative;flex:1;display:flex;align-items:center;gap:6px;padding:5px;border-radius:var(--r-pill);background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line)}
.tabs-slide{position:absolute;top:5px;bottom:5px;left:0;border-radius:var(--r-pill);background:var(--gf);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -8px var(--f2);transition:transform var(--d-2) var(--e-bounce),width var(--d-2) var(--e-rail);z-index:0;pointer-events:none}
.tab-btn{position:relative;z-index:1;flex:1;height:38px;border:0;border-radius:var(--r-pill);background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font:700 var(--t-m)/1 var(--round);color:var(--ink-2);cursor:pointer;transition:color var(--d-1) var(--e-soft),opacity var(--d-1) var(--e-soft)}
.tab-btn svg{width:18px;height:18px;flex:none}
.tab-btn em{font-style:normal;font:700 var(--t-xs)/1 var(--round);padding:3px 7px;border-radius:var(--r-pill);background:var(--line);color:var(--ink-2)}
.tab-btn.on{color:var(--on)}
.tab-btn.on em{background:rgba(255,255,255,.22);color:var(--on)}
.tab-btn.dis{opacity:.38;cursor:default}

/* Lista de filas con riel deslizante */
.rows-wrap{position:relative;display:flex;flex-direction:column;gap:8px}
.rows-list{position:relative;display:flex;flex-direction:column;gap:6px}
.row-slide{position:absolute;left:0;right:0;top:0;height:62px;border-radius:var(--r-m);background:var(--gf);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),var(--ring);pointer-events:none;z-index:0;transition:transform var(--d-2) var(--e-bounce),background var(--d-1) var(--e-soft),height var(--d-1) var(--e-soft)}
.row-slide.danger{background:linear-gradient(115deg,var(--bad-f),var(--bad));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 0 0 3px var(--bad),0 0 22px 2px color-mix(in srgb,var(--bad) 45%,transparent)}

.gs-row{position:relative;z-index:1;width:100%;height:62px;padding:0 var(--s-4);border:0;border-radius:var(--r-m);background:var(--glass-in);box-shadow:inset 0 1px 0 var(--hl-ring),inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;color:var(--ink);transition:background var(--d-1) var(--e-soft),color var(--d-1) var(--e-soft)}
.gs-row.on{background:transparent;box-shadow:none;color:var(--on)}
.gs-row .ico{width:38px;height:38px;border-radius:var(--r-s);display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--v1) 14%,var(--tint-base));color:var(--f1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v1) 28%,transparent);transition:background var(--d-1),color var(--d-1)}
.gs-row.danger .ico{background:color-mix(in srgb,var(--bad) 14%,var(--tint-base));color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 30%,transparent)}
.gs-row.on .ico{background:rgba(255,255,255,.22);color:var(--on);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.gs-row .ico svg{width:20px;height:20px}

.gs-row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gs-row .lbl{font:700 var(--t-l)/1.2 var(--round);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-row .sub{font:500 var(--t-s)/1.25 var(--round);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-row.on .sub{color:var(--on);opacity:.88}

.gs-row .val{display:flex;align-items:center;gap:8px;flex:none;font:700 var(--t-m)/1 var(--round);color:var(--ink-2)}
.gs-row.on .val{color:var(--on)}
.val-pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--glass-chip);box-shadow:inset 0 0 0 1px var(--line);font:700 var(--t-s)/1 var(--round);color:var(--ink)}
.gs-row.on .val-pill{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:var(--on)}
.val-dot{width:10px;height:10px;border-radius:50%}
.val-swatch{width:22px;height:22px;border-radius:50%;background:var(--gv);box-shadow:0 0 0 2px var(--tint-base),0 0 0 3px var(--line)}
.arr-btn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font:800 17px/1 var(--round);opacity:.75;transition:opacity .15s,background .15s}
.gs-row.on .arr-btn{background:rgba(255,255,255,.22);opacity:1}
.chev{opacity:.55;display:grid;place-items:center}
.gs-row.on .chev{opacity:1}

.sep-line{height:1px;background:var(--line);margin:4px 6px}

/* Sublista (Mover a categoría / Magpie) */
.subhead{display:flex;align-items:center;gap:12px}
.back-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:var(--r-pill);background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line);font:700 var(--t-s)/1 var(--round);color:var(--ink);cursor:pointer}
.subhead h3{margin:0;font:800 var(--t-xl)/1.2 var(--round);color:var(--ink)}

/* Pie de ayuda */
.gs-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:var(--s-2);border-top:1px solid var(--line);font:500 var(--t-s)/1.3 var(--round);color:var(--ink-2)}
.toast-inline{padding:4px 12px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--ok) 18%,var(--tint-base));color:var(--ok-f);font:700 var(--t-s)/1.2 var(--round);opacity:0;transition:opacity .2s}
#stage[data-theme=dark] .toast-inline{color:#7ee58b}
.toast-inline.show{opacity:1}
</style>
</head>
<body>
<div class="deck">
  <div class="bar">
    <div class="bar-t">
      <b>Propuesta 1 · Panel compacto con cabecera del juego (Recomendada)</b>
      <span>Un único modal que crece solo lo necesario, navegación directa con LB/RB, subtítulos en segunda línea y estado/color visibles arriba.</span>
    </div>
    <div class="seg" role="group" aria-label="Juego de prueba">
      <button type="button" class="on" data-game="vn" onclick="setGame('vn')">Novela japonesa (4 pestañas)</button>
      <button type="button" data-game="sw" onclick="setGame('sw')">Switch (sin Al jugar)</button>
    </div>
    <div class="seg" role="group" aria-label="Tema">
      <button type="button" data-th="light" onclick="setTheme('light')">Claro</button>

const ICONS = {

  palette: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5a9.5 9.5 0 1 0 0 19c1.5 0 2-1 1.5-2s0-2.5 2-2.5H18c2 0 3.5-1.5 3.5-3.5C21.5 7 17 2.5 12 2.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="16" cy="7.5" r="1"/></svg>',

  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16.5H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M8 7h8M8 11h6"/></svg>',
  checks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5l4 4 7-8.5M12 16.5l2 2 7.5-9"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h15M13 6.5l5.5 5.5-5.5 5.5"/></svg>',
  eyeOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-6.5 10-6.5S22 12 22 12s-4 6.5-10 6.5S2 12 2 12z"/><path d="M4.5 4l15 16"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9 6.5v-3h6v3"/><path d="M5.5 6.5l1 14h11l1-14"/><path d="M10 10v7M14 10v7"/></svg>',
  chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5 9.5-10"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4.5 3.8-6.5 7.5-6.5s6.5 2 7.5 6.5"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M8 15V9h5M16 9l-5 5"/></svg>'
};

const STATUSES = [
  { id: 'playing', label: 'Jugando', c: '#E8384F' },
  { id: 'pending', label: 'Pendiente', c: '#3BB54A' },
  { id: 'finished', label: 'Terminado', c: '#9A4BD8' },
  { id: 'dropped', label: 'Abandonado', c: '#00A0D8' },
  { id: 'none', label: 'Sin estado', c: '#757d8c' }
];
const MAGPIES = ['Desactivado', 'Automático', 'Forzar 2x', 'Forzar 4x'];
const CATS = ['Juegos', 'Novelas visuales', 'Switch', 'Novelas japonesas'];

const GAMES = {
  vn: {
    name: 'Summer Pockets: Reflection Blue',
    cat: 'Novelas japonesas',
    hours: '48 h 25 min',
    odo: '048:25',
    shots: '142 capturas',
    colls: 'En 2 colecciones',
    release: 'Jun 2020',
    accentName: 'Azul Wii U',
    f1: '#0089be', f2: '#3253c5', v1: '#00A0D8', v2: '#3F63E0',
    statusIdx: 0,
    magpieIdx: 1,
    magpieDetail: '1280×720 → 4K · Modelo CuNNy2 al lanzar',
    exe: 'SummerPocketsRB.exe',
    dir: 'D:\\Novelas\\Summer Pockets RB',
    hasPlay: true,
    hasNovel: true,
    art: ['#00A0D8','#3F63E0','#7fd8ff']
  },
  sw: {
    name: 'The Legend of Zelda: Tears of the Kingdom',
    cat: 'Switch',
    hours: '112 h 10 min',
    odo: '112:10',
    shots: '386 capturas',
    colls: 'En 1 colección',
    release: 'May 2023',
    accentName: 'Verde Bosque',
    f1: '#27833a', f2: '#0089be', v1: '#3BB54A', v2: '#00A0D8',
    statusIdx: 2,
    magpieIdx: 0,
    magpieDetail: '',
    exe: '',
    dir: '',
    hasPlay: false,
    hasNovel: false,
    art: ['#3BB54A','#00A0D8','#b9f3c3']
  }
};

const TABS = [
  { id: 'asp', name: 'Aspecto', ico: 'image', help: 'Cómo se ve el juego en la biblioteca.' },
  { id: 'jug', name: 'Al jugar', ico: 'play', help: 'Se aplica la próxima vez que lo lances desde aquí.' },
  { id: 'dat', name: 'Capturas y datos', ico: 'imp', help: 'Archivos del juego en este PC.' },
  { id: 'bib', name: 'Biblioteca', ico: 'saga', help: 'Dónde aparece y cómo se organiza, sin salir de su categoría.' }
];

let state = { gameKey: 'vn', theme: 'dark', tab: 'asp', row: 0, sublist: '', lrow: 0, confirmRemove: false, toast: '', toastTimer: 0 };

function coverSvg(g){
  return `<svg viewBox="0 0 120 168" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g.art[0]}"/><stop offset="1" stop-color="${g.art[1]}"/></linearGradient></defs>
    <rect width="120" height="168" fill="url(#cg)"/>
    <circle cx="88" cy="40" r="26" fill="${g.art[2]}" opacity=".35"/>
    <path d="M0 122 L38 78 L66 106 L94 68 L120 108 L120 168 L0 168Z" fill="rgba(12,18,28,.35)"/>
    <rect x="12" y="132" width="66" height="8" rx="4" fill="#fff" opacity=".88"/>
    <rect x="12" y="146" width="42" height="5" rx="2.5" fill="#fff" opacity=".55"/>
  </svg>`;
}

function getRows(g, tab){
  if (tab === 'asp') return [
    { id: 'sgdb', l: 'Imágenes del juego…', s: 'Portada, hero de fondo, logo e icono', ico: 'search', kind: 'nav' },
    { id: 'accent', l: 'Color del juego…', s: 'Tinte propio en su ficha, tarjetas y estadísticas', ico: 'palette', kind: 'swatch', v: g.accentName },
    { id: 'reload', l: 'Volver a cargar las imágenes', s: 'Refresca la caché local si cambiaste ficheros a mano', ico: 'reload', kind: 'act' }
  ];
  if (tab === 'jug') {
    if (!g.hasPlay) return [];
    return [
      { id: 'magpie', l: 'Escalado con Magpie', s: g.magpieDetail || 'Reescalado nítido al abrir en pantalla completa', ico: 'scale', kind: 'cycle', v: MAGPIES[g.magpieIdx] },
      { id: 'exe', l: 'Ejecutable…', s: g.exe, ico: 'folder', kind: 'nav' },
      { id: 'dir', l: 'Carpeta de trabajo…', s: g.dir, ico: 'folder', kind: 'nav' }
    ];
  }
  if (tab === 'dat') {
    const out = [
      { id: 'folder', l: 'Abrir carpeta de capturas', s: 'Abre la carpeta del explorador en Windows', ico: 'folder', kind: 'act' },
      { id: 'addshots', l: 'Añadir capturas…', s: 'Importa imágenes sueltas a la galería del juego', ico: 'image', kind: 'nav' }
    ];
    if (g.hasPlay) out.push({ id: 'saves', l: 'Partidas guardadas…', s: 'Copias manuales y automáticas de Ludusavi', ico: 'imp', kind: 'nav' });
    if (g.hasNovel) out.push({ id: 'phrases', l: 'Frases y repaso…', s: 'Glosario guardado desde el lector japonés', ico: 'book', kind: 'nav' });
    return out;
  }
  return [
    { id: 'addcoll', l: 'Colecciones…', s: 'Agrupa juegos dentro de su misma categoría', ico: 'saga', kind: 'nav', v: g.colls },
    { id: 'status', l: 'Estado en Mi lista', s: 'Pulsa ‹ › o A para cambiarlo al momento', ico: 'checks', kind: 'status', v: STATUSES[g.statusIdx] },
    { id: 'release', l: 'Fecha de lanzamiento…', s: 'Orden cronológico en biblioteca y año', ico: 'calendar', kind: 'nav', v: g.release },
    { id: 'category', l: 'Mover a otra categoría…', s: `Actual: ${g.cat}`, ico: 'move', kind: 'nav' },
    { id: 'hide', l: 'Ocultar de la biblioteca', s: 'Se puede volver a mostrar desde Ajustes', ico: 'eyeOff', kind: 'act', sep: true },
    { id: 'remove', l: state.confirmRemove ? 'Pulsa A otra vez para quitar' : 'Quitar de la biblioteca', s: 'Pide confirmación · las capturas no se borran', ico: 'trash', kind: 'danger' }
  ];
}

function flashToast(msg){
  state.toast = msg;
  clearTimeout(state.toastTimer);
  render();
  state.toastTimer = setTimeout(() => { state.toast = ''; render(); }, 2200);
}

function setGame(k){
  state.gameKey = k; state.tab = 'asp'; state.row = 0; state.sublist = ''; state.confirmRemove = false;
  document.querySelectorAll('[data-game]').forEach(b => b.classList.toggle('on', b.dataset.game === k));
  render();
}
function setTheme(th){
  state.theme = th;
  document.body.classList.toggle('page-light', th === 'light');
  document.querySelectorAll('[data-th]').forEach(b => b.classList.toggle('on', b.dataset.th === th));
  render();
}
function selectTab(id){
  const g = GAMES[state.gameKey];
  if (!getRows(g, id).length) return;
  state.tab = id; state.row = 0; state.sublist = ''; state.confirmRemove = false;
  render();
}
function stepTab(d){
  const g = GAMES[state.gameKey];
  const valid = TABS.filter(t => getRows(g, t.id).length);
  const idx = valid.findIndex(t => t.id === state.tab);
  const next = valid[(idx + d + valid.length) % valid.length];
  if (next) selectTab(next.id);
}
function actRow(i, dir = 0){
  const g = GAMES[state.gameKey];
  const rows = getRows(g, state.tab);
  const it = rows[i]; if (!it) return;
  state.row = i;
  if (it.id !== 'remove') state.confirmRemove = false;
  if (it.id === 'magpie'){
    g.magpieIdx = (g.magpieIdx + (dir || 1) + MAGPIES.length) % MAGPIES.length;
    flashToast(`Magpie: ${MAGPIES[g.magpieIdx]}`);
    return;
  }
  if (it.id === 'status'){
    g.statusIdx = (g.statusIdx + (dir || 1) + STATUSES.length) % STATUSES.length;
    flashToast(`Estado: ${STATUSES[g.statusIdx].label}`);
    return;
  }
  if (it.id === 'category'){
    state.sublist = 'category'; state.lrow = 0; render(); return;
  }
  if (it.id === 'remove'){
    if (!state.confirmRemove){ state.confirmRemove = true; render(); return; }
    state.confirmRemove = false; flashToast('Confirmación probada (demo)'); return;
  }
  flashToast(`Acción: ${it.l.replace('…','')}`);
}
function pickCat(idx){
  const g = GAMES[state.gameKey];
  const others = CATS.filter(c => c !== g.cat);
  if (others[idx]) { g.cat = others[idx]; state.sublist = ''; flashToast(`Movido a ${g.cat}`); }
}

function render(){
  const g = GAMES[state.gameKey];
  const st = document.getElementById('stage');
  st.setAttribute('data-theme', state.theme);
  st.style.setProperty('--f1', g.f1);
  st.style.setProperty('--f2', g.f2);
  st.style.setProperty('--v1', g.v1);
  st.style.setProperty('--v2', g.v2);
  st.style.setProperty('--g1', g.v1);
  st.style.setProperty('--g2', g.v2);
  const status = STATUSES[g.statusIdx];
  const rows = getRows(g, state.tab);
  const curTab = TABS.find(t => t.id === state.tab);

  let bodyHtml = '';
  if (state.sublist === 'category'){
    const others = CATS.filter(c => c !== g.cat);
    bodyHtml = `
      <div class="subhead">
        <button class="back-chip" onclick="state.sublist='';render()">${ICONS.chevL} Biblioteca</button>
        <h3>Mover a otra categoría</h3>
      </div>
      <div class="rows-list" id="rowsList">
        <div class="row-slide" style="transform:translateY(${state.lrow * 68}px)"></div>
        ${others.map((c, i) => `
          <button class="gs-row ${state.lrow === i ? 'on' : ''}" onmouseenter="state.lrow=${i};updateFocus()" onclick="pickCat(${i})">
            <span class="ico">${ICONS.move}</span>
            <span class="txt"><span class="lbl">Mover a ${c}</span><span class="sub">Conserva partidas, capturas y estado</span></span>
            <span class="chev">${ICONS.chevR}</span>
          </button>
        `).join('')}
      </div>`;
  } else {
    let sepBefore = rows.findIndex(r => r.sep);
    bodyHtml = `
      <div class="tabs-bar">
        <span class="btn sh">LB</span>
        <div class="tabs-track" id="tabsTrack">
          <div class="tabs-slide" id="tabsSlide"></div>
          ${TABS.map(tb => {
            const count = getRows(g, tb.id).length;
            const on = state.tab === tb.id;
            return `<button class="tab-btn ${on ? 'on' : ''} ${!count ? 'dis' : ''}" data-tab="${tb.id}" onclick="selectTab('${tb.id}')">${ICONS[tb.ico]}<span>${tb.name}</span><em>${count || '—'}</em></button>`;
          }).join('')}
        </div>
        <span class="btn sh">RB</span>
      </div>
      <div class="rows-wrap">
        <div class="rows-list" id="rowsList">
          <div class="row-slide ${rows[state.row]?.kind === 'danger' ? 'danger' : ''}" id="rowSlide"></div>
          ${rows.map((r, i) => {
            const on = state.row === i;
            let right = `<span class="chev">${ICONS.chevR}</span>`;
            if (r.kind === 'cycle') right = `<span class="val"><span class="arr-btn" onclick="event.stopPropagation();actRow(${i},-1)">‹</span><span>${r.v}</span><span class="arr-btn" onclick="event.stopPropagation();actRow(${i},1)">›</span></span>`;
            else if (r.kind === 'status') right = `<span class="val"><span class="arr-btn" onclick="event.stopPropagation();actRow(${i},-1)">‹</span><span class="val-pill"><i class="val-dot" style="background:${r.v.c}"></i>${r.v.label}</span><span class="arr-btn" onclick="event.stopPropagation();actRow(${i},1)">›</span></span>`;
            else if (r.kind === 'swatch') right = `<span class="val"><span>${r.v}</span><span class="val-swatch"></span><span class="chev">${ICONS.chevR}</span></span>`;
            else if (r.v) right = `<span class="val"><span>${r.v}</span><span class="chev">${ICONS.chevR}</span></span>`;
            else if (r.kind === 'act' || r.kind === 'danger') right = '';
            return `${i === sepBefore ? '<div class="sep-line"></div>' : ''}
              <button class="gs-row ${on ? 'on' : ''} ${r.kind === 'danger' ? 'danger' : ''}" data-row="${i}" onmouseenter="if(state.row!==${i}){state.row=${i};state.confirmRemove=false;updateRowVisual()}" onclick="actRow(${i},0)">
                <span class="ico">${ICONS[r.ico]}</span>
                <span class="txt"><span class="lbl">${r.l}</span><span class="sub">${r.s}</span></span>
                ${right}
              </button>`;
          }).join('')}
        </div>
      </div>`;
  }

  st.innerHTML = `
    <div class="blob" style="left:-140px;top:-120px;width:540px;height:540px"></div>
    <div class="blob" style="right:-120px;bottom:-140px;width:520px;height:520px"></div>
    <div class="detail-bg">
      <div class="top">
        <div class="glass avatar"><div class="face">${ICONS.person}</div></div>
        <div class="crumb pill"><span>Inicio</span><span class="sep">›</span><span>${g.cat}</span><span class="sep">›</span><span class="cur">${g.name}</span></div>
        <div class="clock">23:26</div>
      </div>
      <div class="glass banner"><div class="face" style="background:linear-gradient(125deg,${g.art[0]},${g.art[1]})"></div></div>
      <div class="glass dcover"><div class="face">${coverSvg(g)}</div></div>
      <div class="glass play"><div class="face"><span class="pi">${ICONS.play}</span><div><b>Jugar</b><small>${g.hasPlay ? 'Ejecutable propio' : 'Emulador'}</small></div></div></div>
      <div class="dpanel pill dhours"><span style="font-size:13px;font-weight:700;color:var(--ink-2)">Tiempo total</span><div class="odo-val">${g.odo}</div></div>
      <div class="dpanel pill dweek"><span style="font-size:13px;font-weight:700;color:var(--ink-2)">Esta semana</span><div style="font-size:20px;font-weight:800;color:var(--f1)">4 h 20 min</div></div>
      <div class="shots-row"><div class="shot-ph"></div><div class="shot-ph"></div><div class="shot-ph"></div><div class="shot-ph"></div></div>
    </div>

    <div class="scrim">
      <div class="glass gs-modal">
        <div class="face">
          <div class="gs-head">
            <div class="gs-cov">${coverSvg(g)}</div>
            <div class="gs-title-blk">
              <span class="gs-kicker">Ajustes del juego</span>
              <h2>${g.name}</h2>
              <div class="gs-meta"><span>${g.cat}</span><i></i><span>${g.hours}</span><i></i><span>${g.shots}</span></div>
            </div>
            <div class="gs-badges">
              <span class="st-pill" style="background:${status.c}">${status.label}</span>
              <span class="acc-chip"><i></i>${g.accentName}</span>
            </div>
          </div>

          ${bodyHtml}

          <div class="gs-foot">
            <span>${state.sublist ? 'Elige la categoría destino para este juego.' : curTab.help}</span>
            <span class="toast-inline ${state.toast ? 'show' : ''}">${state.toast || ' '}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="hints">
      <div class="hint pill"><span class="shp"><span class="btn sh">LB</span><span class="btn sh">RB</span></span>Pestaña</div>
      <div class="hint pill"><span class="btn a">A</span>${state.confirmRemove ? 'Confirmar' : 'Elegir'}</div>
      <div class="hint pill"><span class="btn b">B</span>${state.sublist ? 'Volver' : 'Cerrar'}</div>
    </div>`;

  requestAnimationFrame(() => { syncSlides(); });
}

function syncSlides(){
  const track = document.getElementById('tabsTrack');
  const tSlide = document.getElementById('tabsSlide');
  const activeTab = track?.querySelector('.tab-btn.on');
  if (tSlide && activeTab){
    tSlide.style.width = activeTab.offsetWidth + 'px';
    tSlide.style.transform = `translateX(${activeTab.offsetLeft}px)`;
  }
  updateRowVisual();
}

function updateRowVisual(){
  const list = document.getElementById('rowsList');
  const slide = document.getElementById('rowSlide');
  if (!list || !slide) return;
  const g = GAMES[state.gameKey];
  const rows = getRows(g, state.tab);
  const btns = list.querySelectorAll('.gs-row');
  btns.forEach((b, idx) => b.classList.toggle('on', idx === state.row));
  const cur = btns[state.row];
  if (cur){
    slide.style.transform = `translateY(${cur.offsetTop}px)`;
    slide.classList.toggle('danger', rows[state.row]?.kind === 'danger');
  }
}
function updateFocus(){
  const list = document.getElementById('rowsList');
  if (!list) return;
  list.querySelectorAll('.gs-row').forEach((b, idx) => b.classList.toggle('on', idx === state.lrow));
  const slide = list.querySelector('.row-slide');
  const cur = list.querySelectorAll('.gs-row')[state.lrow];
  if (slide && cur) slide.style.transform = `translateY(${cur.offsetTop}px)`;
}

addEventListener('keydown', e => {
  const g = GAMES[state.gameKey];
  if (e.key === 'q' || e.key === 'Q') { stepTab(-1); return; }
  if (e.key === 'e' || e.key === 'E') { stepTab(1); return; }
  if (state.sublist){
    const n = CATS.length - 1;
    if (e.key === 'ArrowUp') { state.lrow = Math.max(0, state.lrow - 1); updateFocus(); }
    else if (e.key === 'ArrowDown') { state.lrow = Math.min(n - 1, state.lrow + 1); updateFocus(); }
    else if (e.key === 'Enter') pickCat(state.lrow);
    else if (e.key === 'Escape' || e.key === 'Backspace') { state.sublist = ''; render(); }
    return;
  }
  const rows = getRows(g, state.tab);
  if (e.key === 'ArrowUp') { state.row = Math.max(0, state.row - 1); state.confirmRemove = false; updateRowVisual(); }
  else if (e.key === 'ArrowDown') { state.row = Math.min(rows.length - 1, state.row + 1); state.confirmRemove = false; updateRowVisual(); }
  else if (e.key === 'ArrowLeft') actRow(state.row, -1);
  else if (e.key === 'ArrowRight') actRow(state.row, 1);
  else if (e.key === 'Enter') actRow(state.row, 0);
});

function fit(){
  const wrap = document.getElementById('wrap');
  const st = document.getElementById('stage');
  const s = Math.min(1, wrap.clientWidth / 1280);
  st.style.transform = `scale(${s})`;
  wrap.style.height = Math.round(720 * s) + 'px';
}
addEventListener('resize', fit);
render(); fit();
</script>
</body>
