<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propuesta 3 · Eje de épocas · Colecciones</title>
<style>

:root{
  --round:'M PLUS Rounded 1c','Nunito','Segoe UI','Yu Gothic UI','Meiryo UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--round);background:#101319;color:#e6e9f0}
body.page-light{background:#dfe3e9;color:#3a414e}

/* Envoltorio de presentación de la maqueta (fuera del escenario 1280×720) */
.deck{max-width:1312px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px;padding:12px 16px;border-radius:18px;
  background:rgba(30,34,43,.85);box-shadow:inset 0 0 0 1px rgba(200,210,235,.16);color:#e6e9f0}
body.page-light .bar{background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 1px rgba(95,110,135,.22);color:#3a414e}
.bar-t{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:220px}
.bar-t b{font-size:17px;font-weight:800;line-height:1.2}
.bar-t span{font-size:13px;font-weight:500;opacity:.78;line-height:1.35}
.seg-ctrl{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(128,140,165,.16);box-shadow:inset 0 0 0 1px rgba(128,140,165,.22)}
.seg-ctrl button{appearance:none;border:0;background:transparent;color:inherit;font:700 13px/1 var(--round);
  height:30px;padding:0 12px;border-radius:999px;cursor:pointer;opacity:.75;transition:background 120ms,opacity 120ms,color 120ms}
.seg-ctrl button:hover{opacity:1}
.seg-ctrl button.on{background:#0089be;color:#fff;opacity:1}
.kb-note{font-size:13px;font-weight:500;opacity:.72;margin-top:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kb-note code{font:700 13px/1 var(--round);padding:2px 8px;border-radius:6px;background:rgba(128,140,165,.20)}

/* Marco escalable: se ve bien a cualquier ancho (móvil incluido) sin romper el lienzo 1280×720 */
.stage-fit{width:100%;max-width:1280px;margin:0 auto;position:relative;overflow:hidden;border-radius:18px;
  box-shadow:0 0 0 1px rgba(128,140,165,.28),0 24px 54px -20px rgba(0,0,0,.55)}

/* ==========================================================================
   TOKENS EXACTOS DE src/tokens.css (claro y «Noche ahumada»)
   ========================================================================== */
#stage{
  position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;outline:none;
  font-family:var(--round);user-select:none;-webkit-user-select:none;

  /* Tinta y superficies (Claro) */
  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#757d8c;--line:rgba(95,110,135,.24);--line-2:rgba(150,160,180,.35);
  --face:#dfe3e9;--face-hi:rgba(247,249,252,.94);--panel:rgba(255,255,255,.75);--scrim:rgba(20,26,36,.45);
  --glass-top:rgba(255,255,255,.72);--glass-mid:rgba(255,255,255,.30);--glass-bot:rgba(225,234,246,.22);
  --glass-in:rgba(255,255,255,.55);--glass-chip:rgba(255,255,255,.80);
  --pill-top:rgba(255,255,255,.80);--pill-bot:rgba(255,255,255,.52);--pill-glow:rgba(255,255,255,.9);
  --soft-top:rgba(255,255,255,.55);--soft-bot:rgba(214,220,230,.4);--bub-bg:rgba(255,255,255,.72);--bub-line:rgba(255,255,255,.9);--tile-bg:rgba(255,255,255,.62);
  --hl:rgba(255,255,255,1);--hl-ring:rgba(255,255,255,.55);--hl-bot:rgba(255,255,255,.95);--tint-base:#fff;
  --btn-n:var(--ink);--btn-n-top:color-mix(in srgb,var(--ink) 78%,var(--tint-base));--btn-n-fg:var(--on);--btn-n-edge:color-mix(in srgb,var(--ink) 70%,black);

  /* Significados reservados (§3.3) */
  --ok:#3BB54A;--bad:#E8384F;--warn:#F2B807;--ok-f:#27833a;--bad-f:#d92c44;

  /* Arcoíris de la app (§3.4) */
  --arc-rojo:#E8384F;--arc-naranja:#F27A1A;--arc-amarillo:#F2B807;--arc-verde:#3BB54A;--arc-azul:#00A0D8;--arc-anil:#3F63E0;--arc-violeta:#9A4BD8;
  --arc:var(--arc-rojo),var(--arc-naranja),var(--arc-amarillo),var(--arc-verde),var(--arc-azul),var(--arc-anil),var(--arc-violeta);
  --arco:linear-gradient(90deg,var(--arc));

  /* Radios (§5) */
  --r-xs:6px;--r-s:12px;--r-m:18px;--r-l:28px;--r-pill:999px;
  /* Tipografía (§4) */
  --t-xs:11px;--t-s:13px;--t-m:15px;--t-l:17px;--t-xl:20px;--t-2xl:28px;--t-3xl:44px;
  /* Espaciado (§5) */
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;
  /* Plantilla (§10) */
  --band:64px;--gut:24px;--content-end:644px;--stage-h:720px;
  /* Movimiento (§8) */
  --d-1:120ms;--d-2:200ms;--d-3:300ms;
  --e-soft:cubic-bezier(.2,.8,.3,1);
  --e-bounce:cubic-bezier(.34,1.32,.64,1);
  /* Desenfoque (§6) */
  --blur-panel:blur(14px) saturate(1.7);
  --blur-pill:blur(16px) saturate(1.7);
  /* Foco y alturas (§6) */
  --ring:0 0 0 3px var(--f1),0 0 22px 2px color-mix(in srgb,var(--f2) 45%,transparent);
  --sh-1:0 0 0 1px rgba(95,110,135,.24),0 2px 3px rgba(40,50,70,.10),0 18px 30px -16px rgba(40,50,70,.42);
  --sh-2:0 0 0 1px color-mix(in srgb,var(--f2) 75%,black),0 0 26px 2px color-mix(in srgb,var(--f1) 45%,transparent),0 22px 34px -16px color-mix(in srgb,var(--f2) 70%,black);
  --sh-3:0 0 0 1px rgba(95,110,135,.24),0 8px 14px -6px rgba(20,26,36,.22),0 36px 64px -22px rgba(20,26,36,.55);
  /* Iconos (§9) */
  --i-s:16px;--i-m:20px;--i-l:28px;

  /* Acento por defecto (categoría Juegos) */
  --cat-f1:#0079ab;--cat-f2:#2f52c4;--cat-gf:linear-gradient(115deg,#0079ab,#2f52c4);
  --acc:var(--f1);--accv:var(--v1);--on:#ffffff;
  --g1:#00A0D8;--g2:#3F63E0;--grad:linear-gradient(115deg,#00A0D8,#3F63E0);
  --f1:#0079ab;--f2:#2f52c4;--gf:linear-gradient(115deg,#0079ab,#2f52c4);
  --v1:#00A0D8;--v2:#3F63E0;--gv:linear-gradient(115deg,#00A0D8,#3F63E0);
  --b1:#00A0D8;--b2:#3F63E0;--b3:#19b8a6;
  --p1:#00A0D8;--p2:#3F63E0;

  color:var(--ink);background:#eceef2;
}

/* «Noche ahumada» (oscuro oficial) */
#stage[data-theme=dark]{
  color-scheme:dark;color:#e6e9f0;background:#14161c;
  --ink:#e6e9f0;--ink-2:#b4bccb;--ink-3:#8f98a9;--line:rgba(200,210,235,.16);--line-2:rgba(200,210,235,.24);
  --face:#262a33;--face-hi:rgba(30,33,41,.94);--panel:rgba(30,34,43,.78);--scrim:rgba(0,0,0,.6);
  --glass-top:rgba(60,66,80,.62);--glass-mid:rgba(36,40,50,.42);--glass-bot:rgba(20,22,28,.38);
  --glass-in:rgba(255,255,255,.08);--glass-chip:rgba(40,44,56,.82);
  --pill-top:rgba(52,57,70,.88);--pill-bot:rgba(36,40,50,.82);--pill-glow:rgba(255,255,255,.06);
  --soft-top:rgba(52,57,70,.62);--soft-bot:rgba(30,34,43,.5);--bub-bg:rgba(40,44,56,.82);--bub-line:rgba(200,210,235,.16);--tile-bg:rgba(40,44,56,.62);
  --hl:rgba(255,255,255,.10);--hl-ring:rgba(255,255,255,.06);--hl-bot:rgba(255,255,255,.04);--tint-base:#262a33;
  --btn-n:var(--face);--btn-n-top:color-mix(in srgb,var(--ink) 16%,var(--face));--btn-n-fg:var(--ink);--btn-n-edge:var(--line-2);
  --ring:0 0 0 3px var(--g1),0 0 26px 4px color-mix(in srgb,var(--g2) 60%,transparent);
  --sh-1:0 0 0 1px rgba(200,210,235,.14),0 2px 3px rgba(0,0,0,.30),0 18px 30px -16px rgba(0,0,0,.70);
  --sh-2:0 0 0 1px color-mix(in srgb,var(--g1) 70%,black),0 0 30px 4px color-mix(in srgb,var(--g1) 50%,transparent),0 22px 34px -16px rgba(0,0,0,.8);
  --sh-3:0 0 0 1px rgba(200,210,235,.16),0 8px 14px -6px rgba(0,0,0,.5),0 36px 64px -22px rgba(0,0,0,.85);
}

/* Fondo atmosférico + manchas + velo de color del juego enfocado */
.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}
#stage[data-theme=dark] .bg{background:radial-gradient(120% 90% at 50% 0%,#232631 0%,#16181e 60%,#0f1115 100%)}
.blob{position:absolute;border-radius:50%;opacity:.55;
  background:radial-gradient(circle,var(--b,var(--b1)),color-mix(in srgb,var(--b,var(--b1)) 45%,transparent) 35%,transparent 70%);
  transition:background var(--d-3) var(--e-soft);animation:drift 26s ease-in-out infinite alternate}
#stage[data-theme=dark] .blob{opacity:.38}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(56px,-28px) scale(1.14)}}
.ambwash{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 75% 65% at 10% 108%,color-mix(in srgb,var(--p1) 34%,transparent),transparent 72%),
    radial-gradient(ellipse 70% 60% at 94% -8%,color-mix(in srgb,var(--p2) 26%,transparent),transparent 72%);
  transition:opacity var(--d-3) var(--e-soft)}

/* Cristal Wii U (§6) */
.glass{position:relative;--r:var(--r-l);--bw:10px;border-radius:var(--r);padding:var(--bw);isolation:isolate;
  background:linear-gradient(180deg,var(--glass-top) 0%,var(--glass-mid) 46%,var(--glass-bot) 100%);
  -webkit-backdrop-filter:var(--blur-panel);backdrop-filter:var(--blur-panel);
  box-shadow:
    inset 0 1.5px 0 var(--hl),
    inset 0 0 0 1px var(--hl-ring),
    inset 0 -10px 14px -8px var(--hl-bot),
    inset 0 -1.5px 0 rgba(110,125,150,.30),
    var(--sh-1);
  transition:transform var(--d-2) var(--e-bounce),box-shadow var(--d-2) var(--e-soft),background var(--d-2) var(--e-soft)}
.glass::before{content:'';position:absolute;z-index:2;left:2px;right:2px;top:2px;height:52%;pointer-events:none;
  border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;
  background:linear-gradient(180deg,var(--tile-bg) 0%,rgba(255,255,255,.18) 55%,rgba(255,255,255,0) 100%);
  -webkit-mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);
  mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:.75}
.glass::after{content:'';position:absolute;z-index:3;left:12%;top:3px;width:34%;height:5px;border-radius:var(--r-xs);pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95) 40%,rgba(255,255,255,0));filter:blur(.6px);opacity:.85}
#stage[data-theme=dark] .glass::after{opacity:.35}
.glass .face{position:relative;z-index:1;width:100%;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);overflow:hidden;background:var(--panel)}
.glass .face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(20,30,50,.18),inset 0 3px 6px -2px rgba(0,0,0,.22),inset 0 -2px 4px -2px var(--hl-ring)}
.glass.f{transform:scale(1.06);z-index:4;
  background:linear-gradient(150deg,color-mix(in srgb,var(--g1) 55%,var(--tint-base)) 0%,var(--f1) 50%,var(--f2) 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.92),
    inset 0 0 0 1px color-mix(in srgb,white 45%,transparent),
    inset 0 -10px 14px -8px color-mix(in srgb,var(--g2) 40%,var(--tint-base)),
    var(--sh-2)}
.glass.panel{--r:var(--r-l);--bw:8px}
.glass.panel::before{height:30%;opacity:.55}
.glass.cov-g{--r:var(--r-m);--bw:6px;-webkit-backdrop-filter:none;backdrop-filter:none;cursor:pointer}
.glass.cov-g .face{border-radius:var(--r-s);background:var(--face)}
.glass.shot-g{--r:var(--r-m);--bw:5px;-webkit-backdrop-filter:none;backdrop-filter:none;cursor:pointer}
.glass.shot-g .face{border-radius:var(--r-s);background:var(--face)}

.glass-in{border-radius:var(--r-m);background:var(--glass-in);box-shadow:inset 0 1px 0 var(--hl-ring),inset 0 0 0 1px var(--line)}
.pill{-webkit-backdrop-filter:var(--blur-pill);backdrop-filter:var(--blur-pill);
  background:linear-gradient(180deg,var(--pill-top),var(--pill-bot));
  box-shadow:inset 0 1px 0 var(--glass-top),inset 0 -6px 10px -6px var(--pill-glow),inset 0 -1px 0 rgba(110,125,150,.22),0 0 0 1px var(--line),0 10px 20px -12px rgba(40,50,70,.35)}

/* Botones (§7) */
.b-main{display:inline-flex;align-items:center;gap:var(--s-2);height:40px;padding:0 var(--s-5);border:0;border-radius:var(--r-pill);
  font:800 var(--t-m)/1 var(--round);color:var(--on);background:var(--gf);cursor:pointer;white-space:nowrap;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -8px 12px -8px rgba(0,0,0,.25),0 0 0 1px color-mix(in srgb,var(--f2) 75%,black),0 12px 20px -12px color-mix(in srgb,var(--f2) 70%,black);
  transition:transform var(--d-2) var(--e-bounce),box-shadow var(--d-2) var(--e-soft)}
.b-main:hover,.b-main.f{transform:scale(1.06);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),var(--ring)}
.b-main:active{transform:scale(.97);transition-duration:var(--d-1)}

/* Iconos de trazo (§9) */
.ic{width:var(--i-m);height:var(--i-m);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:var(--i-s);height:var(--i-s)}
.ic.l{width:var(--i-l);height:var(--i-l)}

/* ==========================================================================
   PLANTILLA DE PANTALLA (§10): Barra superior (0..76) + Banda inferior (656..720)
   ========================================================================== */
.top{position:absolute;left:0;right:0;top:0;height:76px;z-index:6}
.avatar{position:absolute;left:22px;top:12px;width:54px;height:54px;--r:var(--r-m);--bw:5px}
.avatar .face{background:var(--cat-gf);display:grid;place-items:center;color:var(--on)}
.crumb{position:absolute;left:98px;top:22px;height:40px;display:flex;align-items:center;gap:var(--s-2);
  padding:0 var(--s-4);border-radius:var(--r-pill);font:700 var(--t-xl)/1 var(--round);color:var(--ink-2)}
.crumb .sep{color:var(--ink-3);font-weight:500}
.crumb .cur{color:var(--cat-f1);font-weight:800}

/* Pestañas de categoría centradas (como en Titles.svelte) */
.ttabs{position:absolute;left:50%;top:18px;transform:translateX(-50%);height:44px;padding:var(--s-1);border-radius:var(--r-pill);
  display:flex;gap:var(--s-1);align-items:center;z-index:7}
.ttabs span{height:36px;padding:0 var(--s-4);border-radius:var(--r-pill);display:flex;align-items:center;
  font:800 var(--t-m)/1 var(--round);color:var(--ink-2)}
.ttabs span.on{background:var(--cat-gf);color:var(--on);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px color-mix(in srgb,var(--cat-f2) 75%,black)}

.clock{position:absolute;right:var(--gut);top:24px;display:flex;gap:var(--s-3);align-items:center;
  font:700 var(--t-xl)/1 var(--round);color:var(--ink-2)}
.clock small{font-size:var(--t-m);font-weight:500;color:var(--ink-3)}
.pad-ic{display:grid;place-items:center}

/* Banda inferior de pistas del mando (§7 & §10) */
.hints{position:absolute;right:var(--gut);bottom:calc((var(--band) - 38px)/2);display:flex;gap:var(--s-2);z-index:6}
.hint{display:flex;align-items:center;gap:var(--s-2);height:38px;padding:0 var(--s-3) 0 var(--s-1);border-radius:var(--r-pill);
  font:700 var(--t-m)/1 var(--round);color:var(--ink-2);cursor:pointer;transition:transform var(--d-1) var(--e-soft)}
.hint:active{transform:scale(.97)}
.btn{min-width:28px;height:28px;border-radius:var(--r-s);display:grid;place-items:center;font:800 var(--t-s)/1 var(--round);
  color:var(--on);--b:var(--ink-2);padding:0 var(--s-1);
  background:linear-gradient(180deg,color-mix(in srgb,var(--b) 55%,var(--tint-base)) 0%,var(--b) 55%,color-mix(in srgb,var(--b) 85%,black) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 0 0 1px color-mix(in srgb,var(--b) 70%,black),0 1px 2px rgba(0,0,0,.2)}
.btn.a{--b:var(--ok-f)}.btn.b{--b:var(--bad-f)}.btn.x{--b:var(--f1)}.btn.y{--b:var(--warn);color:#3a414e}
.btn.sh{border-radius:var(--r-xs);padding:0 var(--s-2);color:var(--btn-n-fg);
  background:linear-gradient(180deg,var(--btn-n-top) 0%,var(--btn-n) 55%,color-mix(in srgb,var(--btn-n) 85%,black) 100%);
  box-shadow:inset 0 1px 0 var(--hl-ring),0 0 0 1px var(--btn-n-edge)}
.shp{display:flex;gap:var(--s-1)}

/* Área de contenido: estrictamente x:24..1256, y:88..644 */
.content{position:absolute;left:var(--gut);right:var(--gut);top:88px;bottom:76px;display:flex;flex-direction:column;z-index:2}

/* Distintivo de estado según §3.4 (siempre lleva nombre, nunca informa solo por color) */
.st-badge{display:inline-flex;align-items:center;gap:var(--s-2);height:28px;padding:0 var(--s-3);border-radius:var(--r-pill);
  background:var(--glass-chip);box-shadow:inset 0 0 0 1px var(--line);font:700 var(--t-s)/1 var(--round);color:var(--ink);white-space:nowrap}
.st-badge i{width:10px;height:10px;border-radius:50%;background:var(--st-c);flex:none}
.st-t{--st-c:var(--arc-violeta)}
.st-j{--st-c:var(--arc-rojo)}
.st-m{--st-c:var(--arc-naranja)}
.st-p{--st-c:var(--arc-verde)}
.st-a{--st-c:var(--arc-azul)}

/* Tag / contador */
.tag{display:inline-flex;align-items:center;gap:var(--s-1);height:28px;padding:0 var(--s-3);border-radius:var(--r-pill);
  font:700 var(--t-s)/1 var(--round);color:var(--on);background:var(--gf);white-space:nowrap}
.tag.soft{color:var(--ink-2);background:var(--glass-chip);box-shadow:inset 0 0 0 1px var(--line)}

/* Arte de portadas y capturas */
.art{width:100%;height:100%;display:block}
.cov-cap{position:absolute;left:0;right:0;bottom:0;padding:var(--s-2);
  background:linear-gradient(180deg,transparent 0%,rgba(14,18,26,.82) 100%);
  color:#fff;font:800 var(--t-s)/1.2 var(--round);text-shadow:0 1px 2px rgba(0,0,0,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Aurora cromática suave dentro de un panel */
.aurora{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.34;transition:opacity var(--d-3) var(--e-soft)}
#stage[data-theme=dark] .aurora{opacity:.28}
.aurora i{position:absolute;border-radius:50%;width:340px;height:340px;top:-150px;
  background:radial-gradient(circle,var(--ac),transparent 68%)}

/* Estado vacío (§12) y esqueleto de carga (§12) */
.empty-wrap{flex:1;display:grid;place-items:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);padding:var(--s-6);text-align:center}
.empty>svg{width:56px;height:56px;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty h3{margin:0;font:800 var(--t-xl)/1.2 var(--round);color:var(--ink)}
.empty p{margin:0;max-width:460px;font:500 var(--t-m)/1.35 var(--round);color:var(--ink-2)}

.skel{position:relative;overflow:hidden;border-radius:var(--r-m);background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--line)}
.skel.line{height:14px;border-radius:var(--r-xs)}
.skel.round{border-radius:50%}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(100deg,transparent 20%,var(--hl-ring) 50%,transparent 80%);
  animation:skel 1.4s var(--e-soft) infinite}
@keyframes skel{to{transform:translateX(100%)}}

/* Toast breve para feedback al pulsar A/X/Y en la maqueta */
.toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;z-index:12;
  height:40px;padding:0 var(--s-5);border-radius:var(--r-pill);display:flex;align-items:center;gap:var(--s-2);

// Dos acentos (§3.2): oscurece cualquier color vivo hasta cumplir AA (>= 4.5:1) sobre blanco (--on)
function hexToRgb(h){
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b){
  return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('');
}
function relLum(r, g, b){
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function fillAA(hex){
  let [r, g, b] = hexToRgb(hex);
  for (let i = 0; i < 24; i++) {
    const cr = 1.05 / (relLum(r, g, b) + 0.05);
    if (cr >= 4.65) break;
    r *= 0.90; g *= 0.90; b *= 0.90;
  }
  return rgbToHex(r, g, b);
}
function pairVars(v1, v2){
  const f1 = fillAA(v1), f2 = fillAA(v2);
  return `--g1:${v1};--g2:${v2};--grad:linear-gradient(115deg,${v1},${v2});` +
         `--f1:${f1};--f2:${f2};--gf:linear-gradient(115deg,${f1},${f2});` +
         `--v1:${v1};--v2:${v2};--gv:linear-gradient(115deg,${v1},${v2});--acc:${f1};--accv:${v1};`;
}

// Estadísticas agregadas de una colección
function colStats(col){
  const gs = col.games;
  const hours = gs.reduce((a, g) => a + g.h, 0);
  const shots = gs.reduce((a, g) => a + g.sh, 0);
  const done = gs.filter(g => g.st === 't').length;
  const y0 = gs[0].y, y1 = gs[gs.length - 1].y;
  const palette = gs.map(g => g.v1);
  return { hours, shots, done, total: gs.length, y0, y1, span: y0 === y1 ? `${y0}` : `${y0} – ${y1}`, palette };
}

// Degradado cromático del raíl (igual que railGradient en src/lib/collections.ts)
function railGrad(games){
  if (games.length === 1) return games[0].v1;
  const stops = games.map((g, i) => `${g.v1} ${(i / (games.length - 1) * 100).toFixed(1)}%`);
  return `linear-gradient(90deg,${stops.join(',')})`;
}

// Ilustración SVG procedural para portadas (sin recursos de internet)
function coverSvg(g){
  const id = 'cg_' + g.s.replace(/\W+/g, '') + g.y;
  const motif = [
    `<circle cx="72" cy="48" r="34" fill="#fff" opacity=".16"/><path d="M0 112 Q45 78 100 104 L100 150 L0 150 Z" fill="#000" opacity=".24"/>`,
    `<polygon points="50,18 90,82 10,82" fill="#fff" opacity=".14"/><path d="M0 120 L38 82 L68 108 L100 74 L100 150 L0 150 Z" fill="#000" opacity=".26"/>`,
    `<circle cx="50" cy="56" r="28" fill="none" stroke="#fff" stroke-width="3" opacity=".32"/><circle cx="50" cy="56" r="14" fill="#fff" opacity=".18"/>`,
    `<path d="M0 95 Q50 55 100 95 L100 150 L0 150 Z" fill="#000" opacity=".22"/><rect x="18" y="22" width="64" height="4" rx="2" fill="#fff" opacity=".35"/>`,
    `<path d="M-10 118 Q35 55 110 88" fill="none" stroke="#fff" stroke-width="6" opacity=".22"/><circle cx="28" cy="36" r="16" fill="#fff" opacity=".22"/>`
  ][g.sc % 5];
  return `<svg class="art" viewBox="0 0 100 144" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${g.v1}"/><stop offset="100%" stop-color="${g.v2}"/></linearGradient></defs>
    <rect width="100" height="144" fill="url(#${id})"/>
    ${motif}
    <text x="50" y="78" text-anchor="middle" fill="#fff" font-family="var(--round)" font-weight="800" font-size="18" opacity=".95" style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))">${g.s}</text>
  </svg>`;
}

// Ilustración SVG procedural para capturas 16:9 (varía con semilla k para X barajar)
function shotSvg(g, k = 0){
  const id = `sg_${g.s.replace(/\W+/g, '')}_${g.y}_${k}`;
  const shift = (k * 29) % 100;
  const shapes = [
    `<circle cx="${175 - shift * .6}" cy="44" r="34" fill="#fff" opacity=".24"/>
     <path d="M0 112 Q70 72 135 100 T240 84 L240 135 L0 135 Z" fill="#000" opacity=".26"/>
     <path d="M0 122 Q95 96 168 114 T240 104 L240 135 L0 135 Z" fill="#000" opacity=".32"/>`,
    `<rect x="${24 + shift * .5}" y="22" width="120" height="8" rx="4" fill="#fff" opacity=".25"/>
     <polygon points="0,135 64,66 122,102 184,48 240,94 240,135" fill="#000" opacity=".28"/>
     <circle cx="${52 + shift * .9}" cy="46" r="22" fill="#fff" opacity=".22"/>`,
    `<path d="M0 86 C60 40 160 120 240 54 L240 135 L0 135 Z" fill="#000" opacity=".24"/>
     <circle cx="${120 + (shift - 50) * .5}" cy="58" r="28" fill="none" stroke="#fff" stroke-width="3" opacity=".34"/>
     <circle cx="${120 + (shift - 50) * .5}" cy="58" r="12" fill="#fff" opacity=".25"/>`
  ][(g.sc + k) % 3];
  return `<svg class="art" viewBox="0 0 240 135" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="${id}" x1="${k % 2 ? 1 : 0}" y1="0" x2="${k % 2 ? 0 : 1}" y2="1">
      <stop offset="0%" stop-color="${g.v1}"/><stop offset="100%" stop-color="${g.v2}"/>
    </linearGradient></defs>
    <rect width="240" height="135" fill="url(#${id})"/>
    ${shapes}
  </svg>`;
}

function applyAtmos(col, game){
  const st = document.getElementById('stage');
  const g = game || col.games[0];
  const f1 = fillAA(g.v1), f2 = fillAA(g.v2);
  const c0 = col.games[0].v1, cMid = col.games[Math.floor(col.games.length / 2)].v1, cEnd = col.games[col.games.length - 1].v1;
  st.style.setProperty('--g1', g.v1);
  st.style.setProperty('--g2', g.v2);
  st.style.setProperty('--grad', `linear-gradient(115deg,${g.v1},${g.v2})`);
  st.style.setProperty('--f1', f1);
  st.style.setProperty('--f2', f2);
  st.style.setProperty('--gf', `linear-gradient(115deg,${f1},${f2})`);
  st.style.setProperty('--v1', g.v1);
  st.style.setProperty('--v2', g.v2);
  st.style.setProperty('--gv', `linear-gradient(115deg,${g.v1},${g.v2})`);
  st.style.setProperty('--acc', f1);
  st.style.setProperty('--accv', g.v1);
  st.style.setProperty('--b1', c0);
  st.style.setProperty('--b2', cMid);
  st.style.setProperty('--b3', cEnd);
  st.style.setProperty('--p1', g.v1);
  st.style.setProperty('--p2', g.v2);
}

// Toast de interacción
let toastT;
function ping(msg){
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 1800);
}

// Escalado automático para cualquier pantalla (escritorio, Unificador iframe, móvil)
function initFit(){
  const fit = document.getElementById('fit');
  const stage = document.getElementById('stage');
  function resize(){
    const w = fit.clientWidth;
    const s = Math.min(1, w / 1280);
    stage.style.transform = `scale(${s})`;
    fit.style.height = Math.round(720 * s) + 'px';
  }
  new ResizeObserver(resize).observe(fit);
  resize();
}

// Controles externos de la maqueta (Tema Claro/Noche ahumada + Estado Normal/Vacío/Carga)
let curTheme = 'light';
let curMode = 'data';
function setTheme(t){
  curTheme = t;
  document.getElementById('stage').dataset.theme = t;
  document.body.classList.toggle('page-light', t === 'light');
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.classList.toggle('on', b.dataset.themeBtn === t));
}
function setMode(m){
  curMode = m;
  document.querySelectorAll('[data-mode-btn]').forEach(b => b.classList.toggle('on', b.dataset.modeBtn === m));
  render();
}


let ci = 1, gi = 2, zone = 'axis', seed = 0;

function ringSvg(games){
  const r = 18, cx = 22, cy = 22, C = 2 * Math.PI * r;
  const n = games.length, gap = n > 1 ? 3.5 : 0, seg = Math.max(4, (C / n) - gap);
  const arcs = games.map((g, i) => {
    const off = -(i * (C / n));
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${g.v1}" stroke-width="4.5" stroke-linecap="round"
      stroke-dasharray="${seg.toFixed(1)} ${(C - seg).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<svg viewBox="0 0 44 44">${arcs}</svg>`;
}

// Posiciones en porcentaje respetando la escala real de años con separación mínima legible
function scalePositions(games){
  const y0 = games[0].y, y1 = games[games.length - 1].y;
  const span = Math.max(1, y1 - y0);
  const raw = games.map(g => (g.y - y0) / span * 100);
  const minGap = games.length >= 7 ? 12.2 : 14.5;
  const pos = [...raw];
  for (let pass = 0; pass < 8; pass++) {
    for (let i = 1; i < pos.length; i++) {
      if (pos[i] - pos[i - 1] < minGap) {
        const mid = (pos[i] + pos[i - 1]) / 2;
        pos[i - 1] = mid - minGap / 2;
        pos[i] = mid + minGap / 2;
      }
    }
    if (pos[0] < 0) { const d = -pos[0]; for (let i = 0; i < pos.length; i++) pos[i] += d; }
    if (pos[pos.length - 1] > 100) {
      const over = pos[pos.length - 1] - 100;
      for (let i = 0; i < pos.length; i++) pos[i] = Math.max(0, pos[i] - over * (i / Math.max(1, pos.length - 1)));
    }
  }
  return pos;
}

function render(){
  const stage = document.getElementById('stage');
  const hints = `
    <div class="hint pill" onclick="ping('Cambiar colección')"><span class="shp"><span class="btn sh">↑</span><span class="btn sh">↓</span></span>Colección</div>
    <div class="hint pill" onclick="shuffleShots()"><span class="btn x">X</span>Capturas</div>
    <div class="hint pill" onclick="ping('Editar colección')"><span class="btn y">Y</span>Editar</div>
    <div class="hint pill" onclick="openGame()"><span class="btn a">A</span>Abrir</div>
    <div class="hint pill" onclick="ping('Volver a Inicio')"><span class="btn b">B</span>Volver</div>
  `;
  if (!stage.dataset.built) { stage.innerHTML = renderShell(hints); stage.dataset.built = '1'; }
  const content = document.getElementById('content');

  if (curMode === 'empty') { content.innerHTML = renderEmpty(); return; }
  if (curMode === 'load') {
    content.innerHTML = `<div class="p3-grid">
      <div class="glass panel"><div class="face" style="padding:var(--s-3);display:flex;flex-direction:column;gap:var(--s-2)">
        ${[1,2,3,4,5].map(() => `<div class="skel" style="height:60px"></div>`).join('')}
      </div></div>
      <div class="glass panel"><div class="face" style="padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-4)">
        <div style="display:grid;grid-template-columns:1fr 320px;gap:var(--s-4);height:122px">
          <div style="display:flex;flex-direction:column;gap:var(--s-3)"><div class="skel line" style="width:45%;height:28px"></div><div class="skel" style="flex:1"></div></div>
          <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:var(--s-2)"><div class="skel"></div><div class="skel"></div></div>
        </div>
        <div class="skel" style="flex:1"></div>
      </div></div>
    </div>`;
    return;
  }

  const col = COLS[ci];
  if (gi >= col.games.length) gi = 0;
  const g = col.games[gi];
  const st = colStats(col);
  applyAtmos(col, g);

  const sideHtml = COLS.map((c, idx) => {
    const cs = colStats(c);
    const isOn = idx === ci;
    const isF = isOn && zone === 'side';
    return `<button type="button" class="sitem ${isOn ? 'on' : ''} ${isF ? 'f' : ''}"
      onmouseenter="selectCol(${idx})" onclick="selectCol(${idx});zone='axis';render()">
      <div class="ring-box">${ringSvg(c.games)}<b>${cs.total}</b></div>
      <div class="sitem-t"><b>${c.name}</b><small>${cs.span} · ${cs.hours} h</small></div>
    </button>`;
  }).join('');

  const aurOrbs = st.palette.slice(0, 5).map((hex, k) => `<i style="left:${k * 21 - 4}%;--ac:${hex}"></i>`).join('');
  const pos = scalePositions(col.games);
  const maxH = Math.max(1, ...col.games.map(x => x.h));

  // Marcas de regla de años reales
  const y0 = st.y0, y1 = st.y1, span = Math.max(1, y1 - y0);
  const step = span <= 6 ? 1 : span <= 12 ? 2 : 4;
  const ticks = [];
  for (let y = y0; y <= y1; y += step) ticks.push(y);
  if (ticks[ticks.length - 1] !== y1) ticks.push(y1);

  const tickHtml = ticks.map(y => {
    const pct = ((y - y0) / span * 100).toFixed(1);
    return `<div class="yline" style="left:${pct}%"><em>${y}</em></div>`;
  }).join('');

  const pedsHtml = col.games.map((gm, idx) => {
    const colH = gm.h ? Math.round(16 + (gm.h / maxH) * 102) : 12;
    const isF = zone === 'axis' && idx === gi;
    return `<div class="ped ${isF ? 'f' : ''}" style="left:${pos[idx].toFixed(1)}%;${pairVars(gm.v1, gm.v2)}"
      onmouseenter="focusGame(${idx})" onclick="focusGame(${idx});openGame()">
      <span class="ped-hr">${gm.h ? gm.h + ' h' : 'Pend.'}</span>
      <div class="glass cov-g ped-cov ${isF ? 'f' : ''}">
        <div class="face">${coverSvg(gm)}<span class="cov-cap">${gm.s}</span></div>
      </div>
      <div class="ped-col" style="height:${colH}px"></div>
      <div class="ped-node"></div>
    </div>`;
  }).join('');

  content.innerHTML = `<div class="p3-grid">
    <div class="glass panel side-panel">
      <div class="face side-face">
        <span class="side-lab">Colecciones en Juegos</span>
        <div class="side-list">${sideHtml}</div>
        <button type="button" class="sitem add" onclick="ping('Abrir formulario Nueva colección')">${IC.plus} Nueva colección</button>
      </div>
    </div>

    <div class="glass panel main-panel">
      <div class="face main-face">
        <div class="aurora">${aurOrbs}</div>
        <div class="mhead">
          <div class="mhead-l">
            <div class="mhead-t">
              <h1>${col.name}</h1>
              <span class="tag soft">${IC.cal} ${st.span}</span>
              <span class="tag">${st.done} / ${st.total} terminados</span>
            </div>
            <div class="glass-in mhead-game">
              <b>${g.n}</b>
              <span class="st-badge st-${g.st}"><i></i>${ST_LABEL[g.st]}</span>
              <span class="num">${g.y} · ${g.h ? g.h + ' h' : 'Sin horas'} · ${g.sh} capturas</span>
            </div>
          </div>
          <div class="mshots">
            ${[0, 1].map(k => `<div class="glass shot-g" style="${pairVars(g.v1, g.v2)}" onclick="shuffleShots()">
              <div class="face">${shotSvg(g, seed + k)}</div>
            </div>`).join('')}
          </div>
        </div>

        <div class="glass-in axis-card">
          <div class="axis-top">
            <span>Escala real de años y altura por horas jugadas</span>
            <span>${st.hours} h · ${st.shots} capturas en la saga</span>
          </div>
          <div class="axis-area">
            ${tickHtml}
            <div class="base-ribbon" style="background:${railGrad(col.games)}"></div>
            ${pedsHtml}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function selectCol(idx){ ci = idx; gi = Math.min(gi, COLS[ci].games.length - 1); render(); }
function focusGame(idx){ zone = 'axis'; gi = idx; render(); }
function shuffleShots(){ seed++; render(); ping('Mostrando otras capturas'); }
function openGame(){ ping(`Abrir «${COLS[ci].games[gi].n}»`); }

document.addEventListener('keydown', e => {
  if (curMode !== 'data') return;
  const k = e.key.toLowerCase();
  if (k === 't') { setTheme(curTheme === 'light' ? 'dark' : 'light'); return; }
  if (k === 'x') { shuffleShots(); return; }
  if (k === 'enter') { openGame(); return; }
  if (k === 'arrowup' || k === 'w' || k === 'q') { ci = (ci - 1 + COLS.length) % COLS.length; gi = 0; render(); return; }
  if (k === 'arrowdown' || k === 's' || k === 'e') { ci = (ci + 1) % COLS.length; gi = 0; render(); return; }
  if (k === 'arrowleft' || k === 'a') {
    if (zone === 'axis' && gi === 0) zone = 'side'; else gi = Math.max(0, gi - 1);
    render();
  }
  if (k === 'arrowright' || k === 'd') {
    if (zone === 'side') zone = 'axis'; else gi = Math.min(COLS[ci].games.length - 1, gi + 1);
    render();
  }
});

initFit();
render();

</script>
</body>
</html>
