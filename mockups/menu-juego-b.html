<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú del juego · Propuesta B · Accesos rápidos + lista por temas</title>
<style>
:root{--ink:#3a414e;--ink-2:#5f6776;--ink-3:#8a92a1;--line:rgba(95,110,135,.22);--panel:rgba(255,255,255,.82);--scrim:rgba(20,26,36,.45);--bad:#E8384F;--face:#dfe3e9;--face-hi:rgba(247,249,252,.94)}
*{box-sizing:border-box}
body{margin:0;font-family:'M PLUS Rounded 1c','Segoe UI',system-ui,sans-serif;background:#d9dde4;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px}
body.embed{padding:0;background:transparent;gap:0;overflow:hidden}
body.embed .bar,body.embed .info,body.embed h1{display:none}
h1{margin:0;font-size:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1280px;align-items:center}
.bar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:7px 14px;background:#fff;color:var(--ink-2);cursor:pointer;box-shadow:0 2px 6px -3px rgba(0,0,0,.25)}
.bar button.on{background:var(--ink);color:#fff}
.bar .lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 4px 0 10px}
.info{max-width:1280px;width:100%;background:#fff;border-radius:14px;padding:12px 18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.info b{color:var(--ink)}
#hold{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;border-radius:18px;background:#eceef2;box-shadow:0 30px 60px -30px rgba(20,30,50,.5);user-select:none}
body.embed #stage{border-radius:0;box-shadow:none}
.bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.amb .b1{left:-12%;top:-34%;width:62%;height:96%;background:var(--b1)}
.amb .b2{right:-14%;bottom:-40%;width:64%;height:100%;background:var(--b2)}
.glass{position:absolute;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 30px -16px rgba(30,40,60,.35),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.3);border-radius:var(--rad,18px)}
.top{position:absolute;left:64px;right:64px;top:26px;display:flex;align-items:center}
.crumb{font-weight:800;color:var(--ink-2);font-size:16px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.6)}
.crumb s{text-decoration:none;color:var(--ink-3);margin:0 6px;font-weight:500}
.clock{margin-left:auto;font-weight:800;color:var(--ink-2);font-size:20px}
.banner{left:64px;top:88px;width:922px;height:280px;--rad:32px;padding:10px}
.hero{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:radial-gradient(55% 80% at 78% 25%,color-mix(in srgb,var(--b2) 75%,white) 0,transparent 62%),radial-gradient(70% 90% at 15% 95%,var(--f2) 0,transparent 70%),linear-gradient(135deg,var(--f1),#1c1f3a)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,10,18,.42),rgba(8,10,18,0) 50%)}
.dlogo{position:absolute;left:100px;top:262px;font-size:50px;font-weight:800;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.5);z-index:3;white-space:nowrap}
.dchips{position:absolute;left:100px;top:108px;display:flex;gap:10px;z-index:4}
.pc{height:36px;padding:0 16px 0 12px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(0,0,0,.5);background:linear-gradient(180deg,rgba(60,68,84,.78),rgba(30,36,48,.82));white-space:nowrap}
.pc small{font-size:15px;font-weight:700;opacity:.92}
.pc.st{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,white),var(--c))}
.pc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ach{left:1002px;top:88px;width:214px;height:280px;--rad:28px;padding:22px 20px}
.lbl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ach b{display:block;font-size:40px;font-weight:800;margin:12px 0 4px}
.prog{height:10px;border-radius:9px;background:rgba(95,110,135,.18);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:45%;background:var(--gf)}
.play{left:64px;top:388px;width:290px;height:112px;--rad:30px;padding:8px}
.play .in{height:100%;border-radius:22px;background:var(--gf);display:flex;align-items:center;gap:18px;padding:0 22px;color:#fff}
.pi{flex:none;width:50px;height:50px;border-radius:50%;background:linear-gradient(180deg,#fff,#dfe3e9);display:grid;place-items:center;color:var(--f1)}
.pi svg{width:22px;height:22px;margin-left:3px}
.play b{font-size:34px;font-weight:800;display:block;line-height:1.05}
.play small{font-size:15px;font-weight:600;opacity:.92}
.dp{top:388px;height:112px;--rad:26px;padding:14px 22px}
.dh{left:378px;width:400px}.dw{left:802px;width:414px}
.hsub{font-size:15px;font-weight:700;color:var(--ink-2)}
.odo{font-size:46px;font-weight:800;color:var(--ink);margin-top:2px}
.odo u{text-decoration:none;font-size:20px;color:var(--ink-3);margin:0 12px 0 4px}
.bars{display:flex;align-items:flex-end;gap:14px;height:56px;margin-top:10px}
.bars i{flex:1;border-radius:6px;background:var(--gf);opacity:.85}
.dsect{position:absolute;left:64px;top:514px;font-size:18px;font-weight:800;color:var(--ink-2)}
.dsect span{font-weight:600;color:var(--ink-3);margin-left:8px}
.dshot{top:548px;width:176px;height:99px;--rad:16px;padding:5px}
.dshot i{display:block;width:100%;height:100%;border-radius:12px}
.hints{position:absolute;right:22px;bottom:16px;display:flex;gap:16px;font-size:15px;color:var(--ink-2);font-weight:700;z-index:30}
.hints span{display:flex;align-items:center;gap:7px}
.hints b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#fff;color:var(--ink);font-size:12px;box-shadow:0 2px 6px -2px rgba(0,0,0,.3)}
.scrim .hints{color:#fff}
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.mp{position:relative;padding:12px;border-radius:40px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.7);box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.mp>.in{background:var(--panel);border-radius:30px;padding:20px 24px 20px;display:flex;flex-direction:column;gap:4px}
.mp h2{margin:0 6px;font-size:26px;font-weight:800;color:var(--ink);white-space:nowrap}
.msub{margin:0 6px 12px;font-size:16px;font-weight:600;color:var(--ink-3)}
/* accesos rápidos */
.qa{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.qt{width:148px;height:122px;border-radius:24px;background:rgba(255,255,255,.66);box-shadow:0 0 0 1px rgba(95,110,135,.14),0 8px 18px -12px rgba(30,40,60,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:17px;font-weight:800;color:var(--ink-2);text-align:center;transition:transform .2s}
.qt small{font-size:13px;font-weight:600;color:var(--ink-3);height:16px}
.qt .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(180deg,color-mix(in srgb,var(--f1) 30%,white),var(--f1));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px color-mix(in srgb,var(--f1) 70%,black);color:#fff;margin-bottom:2px}
.qt .ti svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qt.f{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--gf);color:#fff;transform:scale(1.06);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 0 0 1px color-mix(in srgb,var(--f2) 75%,black),0 0 22px 0 color-mix(in srgb,var(--f1) 50%,transparent)}
.qt.f small{color:#fff;opacity:.92}
.qt.f .ti{background:rgba(255,255,255,.92);color:var(--f1);box-shadow:none}
.qt .sw{display:flex;gap:4px;height:16px;align-items:center}
.qt .sw i{width:14px;height:14px;border-radius:5px;box-shadow:0 0 0 2px #fff}
.cols{display:grid;column-gap:22px}
.col{display:flex;flex-direction:column;gap:3px;min-width:0}
.row{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:16px;font-size:18px;font-weight:700;color:var(--ink-2);flex:none}
.row .sl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sl small{display:block;font-size:12.5px;line-height:1.2;font-weight:600;color:var(--ink-3)}
.row.two{height:54px}
.row .v{flex:none;font-size:15px;font-weight:700;color:var(--ink-3)}
.row.f{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--gf);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.28);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 0 0 1px color-mix(in srgb,var(--f2) 75%,black),0 0 18px -2px color-mix(in srgb,var(--f1) 45%,transparent)}
.row.f .v,.row.f .sl small{color:inherit;opacity:.92}
.mic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--f1) 30%,white),var(--f1));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px color-mix(in srgb,var(--f1) 70%,black);color:#fff}
.mic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.row.f .mic{background:rgba(255,255,255,.92);box-shadow:none;color:var(--f1)}
.row.danger{color:var(--bad)}
.row.danger .mic{background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 35%,white),var(--bad));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px color-mix(in srgb,var(--bad) 70%,black)}
.mh{flex:none;margin:8px 0 2px;height:26px;line-height:26px;padding:0 6px;font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid color-mix(in srgb,var(--f1) 35%,transparent)}
.col>.mh:first-child{margin-top:0}
.pop{position:absolute;z-index:6;width:300px;padding:10px;border-radius:24px;background:var(--face-hi);box-shadow:0 0 0 1px rgba(95,110,135,.2),0 20px 40px -16px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:3px}
.tag{position:absolute;z-index:40;background:#fff7c2;color:#5a4a00;font-size:13px;font-weight:700;line-height:1.35;padding:8px 12px;border-radius:12px;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);max-width:200px}
.tag::before{content:attr(data-n);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#5a4a00;color:#fff7c2;font-size:11px;margin-right:6px}
</style>
</head>
<body>

<script>
const I={
 play:'<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>',
 folder:'<path d="M3 7h6l2 2h10v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
 image:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/>',

 coll:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13v7M13 16.5h7"/>',
 save:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>',
 book:'<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/>',
 addimg:'<path d="M13 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18 3v6M15 6h6"/><path d="M3 15l4-4 4 4"/>',
 move:'<path d="M4 12h14M13 6l6 6-6 6"/>',

 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',

 scale:'<path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/>',
 exe:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13l3 2-3 2M12 17h5"/>',
 dir:'<path d="M3 7h6l2 2h10v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="12" cy="14" r="2"/>',
 check:'<path d="M5 12l4 4 10-10"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
};
const svg=k=>`<svg viewBox="0 0 24 24">${I[k]||''}</svg>`;
const GAMES={
 exe:{name:'Kanata no Hoshi',cat:'Novelas visuales',f1:'#7b4fd6',f2:'#d1457e',b1:'#a77bff',b2:'#ff8ab0',st:'Jugando',stc:'#3BB54A',rel:'12 mar 2021',h:'042',m:'17',ses:'23 sesiones',shots:128,via:'Ejecutable propio',pal:['#7b4fd6','#d1457e','#f2c14e']},
 emu:{name:'Isla Brisa',cat:'Switch',f1:'#0e9f8a',f2:'#2f74d8',b1:'#3fd6b8',b2:'#5aa0ff',st:'Pendiente',stc:'#F2B807',rel:'2019',h:'011',m:'05',ses:'6 sesiones',shots:57,via:'Con Ryujinx',pal:['#0e9f8a','#2f74d8','#ffd166']},
};
function ficha(g){
 const shots=[0,1,2,3,4].map(i=>`<div class="glass dshot" style="left:${64+i*192}px"><i style="background:linear-gradient(${120+i*40}deg,color-mix(in srgb,${i%2?g.f2:g.f1} 70%,white),${i%2?g.f1:g.f2})"></i></div>`).join('');
 const bars=[3,5,0,2,6,4,7].map(v=>`<i style="height:${8+v*6}px"></i>`).join('');
 return `<div class="bg"></div><div class="amb"><i class="b1"></i><i class="b2"></i></div>
 <div class="top"><span class="crumb">Inicio<s>›</s>${g.cat}<s>›</s>${g.name}</span><span class="clock">21:47</span></div>
 <div class="glass banner"><div class="hero"></div></div><div class="dlogo">${g.name}</div>
 <div class="dchips"><span class="pc st" style="--c:${g.stc}">${svg('check')}${g.st}</span><span class="pc">${svg('cal')}<b>Salió ${g.rel.length>4?'el':'en'}</b><small>${g.rel}</small></span></div>
 <div class="glass ach"><div class="lbl">Logros</div><b>18<span style="font-size:20px;color:var(--ink-3)"> / 40</span></b><div class="hsub">Último: «Primera estrella»</div><div class="prog"><i></i></div></div>
 <div class="glass play"><div class="in"><span class="pi">${svg('play')}</span><span><b>Jugar</b><small>${g.via}</small></span></div></div>
 <div class="glass dp dh"><div class="hsub">Horas jugadas · ${g.ses}</div><div class="odo">${g.h}<u>h</u>${g.m}<u>min</u></div></div>
 <div class="glass dp dw"><div class="hsub">Esta semana · 3 h 10 min</div><div class="bars">${bars}</div></div>
 <div class="dsect">Capturas<span>${g.shots}</span></div>${shots}`;
}
const hints=l=>`<div class="hints">${l.map(([k,t])=>`<span><b>${k}</b>${t}</span>`).join('')}</div>`;
function row(r){
 if(r.h) return `<div class="mh">${r.h}</div>`;
 const c=['row',r.f?'f':'',r.danger?'danger':'',r.s?'two':''].join(' ');
 return `<div class="${c}"><span class="mic">${r.ic?svg(r.ic):''}</span><span class="sl">${r.l}${r.s?`<small>${r.s}</small>`:''}</span>${r.v?`<span class="v">${r.v}</span>`:''}${r.chk?`<span class="v">✓</span>`:''}</div>`;
}
function tile(t,g){
 const sub=t.sw?`<span class="sw">${g.pal.map(x=>`<i style="background:${x}"></i>`).join('')}</span>`:`<small>${t.v||''}</small>`;
 return `<div class="qt${t.f?' f':''}"><span class="ti">${svg(t.ic)}</span>${t.l}${sub}</div>`;
}
function panel(s,g){
 const cols=s.cols.filter(c=>c.length);
 return `<div class="scrim"><div class="mp" style="width:${s.w||860}px"><div class="in">
  <h2>Opciones del juego</h2><p class="msub">${g.name}</p>
  <div class="qa">${s.tiles.map(t=>tile(t,g)).join('')}</div>
  <div class="cols" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${cols.map(c=>`<div class="col">${c.map(row).join('')}</div>`).join('')}</div>
 </div>${s.pop||''}</div>${hints(s.hints)}${s.tags||''}</div>`;
}
const T={coll:(v,f)=>({ic:'coll',l:'Colecciones',v,f}),img:{ic:'image',l:'Imágenes',v:'Portada, fondo…'},col:{ic:'palette',l:'Color',sw:1},sav:{ic:'save',l:'Guardados',v:'Partidas'},phr:{ic:'book',l:'Frases',v:'y repaso'}};
const LEFT_EXE=(f)=>[{h:'Al jugar'},{ic:'scale',l:'Escalado con Magpie…',v:'Automático',f},{ic:'exe',l:'Ejecutable…'},{ic:'dir',l:'Carpeta de trabajo…'},{h:'Capturas'},{ic:'folder',l:'Abrir carpeta de capturas'},{ic:'image',l:'Añadir capturas…'}];
const RIGHT_EXE=[{h:'Biblioteca'},{ic:'move',l:'Mover a otra categoría…',v:'Novelas visuales'},{ic:'eyeoff',l:'Ocultar de la biblioteca'},{ic:'trash',l:'Quitar de la biblioteca',s:'Pide confirmación · las capturas se quedan',danger:1},{h:'Si algo se ve mal'},{ic:'reload',l:'Volver a cargar las imágenes'}];
const S={
 'exe':{g:'exe',grp:'Juego .exe completo',btn:'Foco arriba',hints:[['A','Elegir'],['B','Cerrar']],
  tiles:[T.coll('En 2',1),T.img,T.col,T.sav,T.phr],cols:[LEFT_EXE(0),RIGHT_EXE],
  tags:`<div class="tag" data-n="1" style="left:14px;top:110px">Arriba, lo cotidiano: 5 fichas grandes con posición fija.</div>
   <div class="tag" data-n="2" style="left:14px;top:420px">Debajo, todo lo demás por temas, a la vista: nada escondido.</div>
   <div class="tag" data-n="3" style="right:14px;top:110px">←/→ entre fichas; ↓ baja a la lista de debajo.</div>`,
  note:'<b>Un solo nivel con dos zonas.</b> Fila de accesos rápidos (Colecciones, Imágenes, Color, Guardados, Frases) y, debajo, dos columnas por temas: <i>Al jugar</i> + <i>Capturas</i> a la izquierda, <i>Biblioteca</i> + <i>Si algo se ve mal</i> a la derecha. 14 elementos a la vista en vez de 17 (Jugar, Estado y Fecha quedan en la ficha).'},
 'exe-mag':{g:'exe',grp:'Juego .exe completo',btn:'Magpie',hints:[['A','Elegir'],['B','Volver']],
  tiles:[T.coll('En 2'),T.img,T.col,T.sav,T.phr],cols:[LEFT_EXE(1),RIGHT_EXE],
  pop:`<div class="pop" style="left:330px;top:300px">${[{l:'Desactivado'},{l:'Automático',chk:1,f:1,s:'Mide la ventana al lanzar'},{l:'Forzar 2x'},{l:'Forzar 4x'}].map(row).join('')}</div>`,
  tags:`<div class="tag" data-n="4" style="right:14px;top:300px">Magpie ya no cambia al pulsar A: abre una lista corta al lado (←/→ se reservan para cambiar de columna).</div>`,
  note:'<b>Elegir modo de Magpie:</b> A sobre la fila abre una lista flotante con ✓; A elige y la cierra; B la cierra sin cambiar.'},
 'emu':{g:'emu',grp:'Juego de emulador',btn:'Foco arriba',hints:[['A','Elegir'],['B','Cerrar']],w:720,
  tiles:[T.coll('Ninguna',1),T.img,T.col,T.sav],
  cols:[[{h:'Capturas'},{ic:'folder',l:'Abrir carpeta de capturas'},{ic:'image',l:'Añadir capturas…'}],[{h:'Biblioteca'},{ic:'eyeoff',l:'Ocultar de la biblioteca'},{h:'Si algo se ve mal'},{ic:'reload',l:'Volver a cargar las imágenes'}]],
  note:'<b>Juego de emulador:</b> 4 fichas y 4 filas; el panel se estrecha. Sin «Al jugar» (lo lanza el emulador) ni Frases.'},
 'tab':{g:'exe',grp:'Tablet',btn:'Foco arriba',hints:[['A','Elegir'],['B','Cerrar']],
  tiles:[T.coll('En 2',1),T.img,T.col,T.sav,T.phr],
  cols:[[{h:'Al jugar'},{ic:'scale',l:'Escalado con Magpie…',v:'Automático'}],RIGHT_EXE],
  note:'<b>Tablet:</b> sin Ejecutable, Carpeta de trabajo ni el bloque Capturas. La columna izquierda se queda casi vacía: el panel queda descompensado (contra de esta propuesta).'},
};
const INTRO='<b>Idea:</b> todo en una sola pantalla, sin submenús, pero con jerarquía: arriba fichas grandes para lo de todos los días; abajo listas compactas agrupadas por tema. Navegación con mando por zonas: ←/→ en las fichas, ↓ baja a la columna de debajo, ↑ desde la primera fila vuelve a las fichas, ←/→ en la lista cambia de columna.';
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),info=document.getElementById('info');
function render(k){
 const s=S[k]||S.exe,g=GAMES[s.g];
 for(const [p,v] of Object.entries({'--f1':g.f1,'--f2':g.f2,'--gf':`linear-gradient(115deg,${g.f1},${g.f2})`,'--b1':g.b1,'--b2':g.b2})) stage.style.setProperty(p,v);
 stage.innerHTML=ficha(g)+panel(s,g);
 info.innerHTML=INTRO+'<br><br>'+s.note;
 bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 if(location.hash.slice(1)!==k) history.replaceState(null,'','#'+k);
}
let last='';
for(const [k,s] of Object.entries(S)){
 if(s.grp!==last){bar.insertAdjacentHTML('beforeend',`<span class="lab">${s.grp}</span>`);last=s.grp}
 const b=document.createElement('button');b.textContent=s.btn;b.dataset.k=k;b.onclick=()=>render(k);bar.appendChild(b);
}
if(location.search.includes('embed')) document.body.classList.add('embed');
function fit(){const h=document.getElementById('hold');const sc=Math.min(1,(innerWidth-(document.body.classList.contains('embed')?0:32))/1280);stage.style.transform=`scale(${sc})`;h.style.width=1280*sc+'px';h.style.height=720*sc+'px'}
addEventListener('resize',fit);addEventListener('hashchange',()=>render(location.hash.slice(1)));fit();
render(location.hash.slice(1)||'exe');
</script>
