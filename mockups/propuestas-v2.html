,'#9A4BD8',0,150,14,{fin:2026}],['Hades','#E8384F',3,190,61,{fin:2026}],['Inscryption','#3BB54A',2,240,12,{fin:2026}],['Ori','#00A0D8',3,400,11,{fin:2025}],\n].map(([n,c,sc,d,h,x={}],i)=>({i,n,c,sc,d,h,pin:!!x.pin,ab:!!x.ab,fin:x.fin||0,po:x.po||0}));\nfunction state(g){if(g.fin)return'fin';if(g.d==null)return'pend';if(g.pin)return'marcha';if(g.ab)return'parked';if(g.d<=HOT)return'marcha';if(g.d<=COLD)return'medias';return'parked'}\nconst left=g=>COLD-g.d, warn=g=>state(g)=='medias'&&!g.pin&&left(g)<=WARN;\nfunction groups(){const R={marcha:[],medias:[],pend:[],parked:[],fin:[]};GAMES.forEach(g=>R[state(g)].push(g));\n  R.marcha.sort((a,b)=>a.pin-b.pin||a.d-b.d);R.medias.sort((a,b)=>a.d-b.d);R.pend.sort((a,b)=>a.po-b.po);R.parked.sort((a,b)=>a.d-b.d);R.fin.sort((a,b)=>b.fin-a.fin||a.d-b.d);return R}\nfunction ago(d){if(d==null)return'Sin empezar';if(d==0)return'Hoy';if(d==1)return'Ayer';if(d<14)return`Hace ${d} días`;if(d<60)return`Hace ${Math.round(d/7)} semanas`;if(d<365)return`Hace ${Math.round(d/30)} meses`;return'Hace más de un año'}\nconst CLK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>';\nconst PINI='<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M15 2l7 7-3 1-4 4 1 5-2 2-4-5-5 5-1-1 5-5-5-4 2-2 5 1 4-4z\"/><\/svg>';\nconst CHK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>';\nfunction badges(g,w){let s='';\n  if(g.pin)s+=`<span class=\"bpin\">${PINI}<\/span>`;\n  if(warn(g))s+=w>=96?`<span class=\"bwarn\">${CLK}Se aparca en ${left(g)} d<\/span>`:`<span class=\"bwarn dot\">${CLK}${left(g)}<\/span>`;\n  if(g.fin&&w<70)s+=`<span class=\"bfin\">${CHK}<\/span>`;\n  return s}\n/* portada 2:3: h manda, w = h·2/3 */\nfunction cov(g,x,y,h,extra=''){const w=Math.round(h*2/3),st=state(g),fs=Math.max(10,Math.min(22,w*.105));\n  return `<div class=\"cv ${st} ${extra}\" data-f data-i=\"${g.i}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px;--sc:${ST[st].c};--cr:${Math.max(6,Math.round(w*.075))}px\">${art(g.c,g.sc)}${w>=58?`<b class=\"pt\" style=\"font-size:${fs}px\">${g.n}<\/b>`:''}<span class=\"bdg\">${badges(g,w)}<\/span><\/div>`}\nfunction infoHTML(g){const st=state(g),S=ST[st];let l1='',l2='';\n  if(st=='pend'){l1=`Nº ${g.po} en tu cola`;l2='Sin empezar'}\n  else if(st=='fin'){l1=`Terminado en ${g.fin}`;l2=`${g.h} h jugadas`}\n  else{l1=ago(g.d);l2=`${g.h} h jugadas`}\n  let extra='';\n  if(g.pin)extra=`<span class=\"ipin\">${PINI}Fijado · no se enfría<\/span>`;\n  else if(warn(g))extra=`<span class=\"iwarn\">${CLK}Se aparca en ${left(g)} días<\/span>`;\n  else if(g.ab)extra=`<span class=\"imute\">Aparcado a mano<\/span>`;\n  return `<div class=\"in-n\">${g.n}<\/div><div class=\"in-m\"><span class=\"tag\" style=\"--c:${S.c}\">${S.k}<\/span><span>${l1}<\/span><span class=\"dotsep\">·<\/span><span>${l2}<\/span><\/div><div class=\"in-x\">${extra}<\/div>`}\nfunction bindList(infoSel){\n  window.onFocus=el=>{const g=GAMES[+el.dataset.i];if(!g)return;const inf=$(infoSel);if(inf)inf.innerHTML=infoHTML(g);setAcc(ST[state(g)].c);window.onListFocus&&window.onListFocus(g,el)};\n  window.onKey=k=>{if((k=='x'||k=='X')&&FOC&&FOC.dataset.i!=null){const g=GAMES[+FOC.dataset.i];const st=state(g);if(st=='fin'||st=='pend')return;\n      g.pin=!g.pin;$$(`.cv[data-i=\"${g.i}\"] .bdg`).forEach(b=>b.innerHTML=badges(g,b.parentNode.offsetWidth));window.onFocus(FOC)}};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n}\nfunction topbar(cur='Mi lista',right=''){return `<div class=\"top\"><div class=\"glass avatar\"><div class=\"face\">P<\/div><\/div>\n <div class=\"crumb pill\"><span>${CAT}<\/span><span class=\"sep\">›<\/span><span class=\"cur\">${cur}<\/span><\/div>${right}\n <div class=\"clock pill\" style=\"padding:8px 16px\"><span>18:42<\/span><small>vie 30 oct<\/small><span class=\"batt\"><b><\/b><b><\/b><b><\/b><b class=\"off\"><\/b><\/span><\/div><\/div>`}\nconst LIST_HINTS=[['A','Jugar'],['X','Fijar'],['Y','Mover a…'],['B','Atrás']];\n\n\nfunction specimen(o){\n  const ACCF=window.ACCF||(c=>c);\n  const TT=[0,1,2,5,6,9,16].slice(0,o.n).map(i=>GAMES[i]);\n  const RB=['red','orange','yellow','green','blue','indigo','violet'];\n  $('.bg').insertAdjacentHTML('afterend',topbar('Biblioteca')+`\n  <div class=\"colL\"><div class=\"tiles\">${TT.map(g=>`<div class=\"glass rel tile\" data-f data-c=\"${g.c}\"><div class=\"face\">${art(g.c,g.sc)}<b class=\"tn\">${g.n}<\/b><i class=\"st\" style=\"--c:${ACCF(g.c)}\"><\/i><\/div><\/div>`).join('')}<\/div>\n   <div class=\"glass rel ficha\"><div class=\"face\">\n    <div class=\"fi-l\">\n      <div class=\"fi-k\"><span class=\"tag\" style=\"--c:var(--red)\">Jugando<\/span><span>Juegos PC · Hoy<\/span><\/div>\n      <div class=\"fi-n\">Elden Ring<\/div>\n      <div class=\"fi-hero\"><b>142<\/b><span>h jugadas<\/span><\/div>\n      <div><span class=\"chips pill\"><span class=\"chip on\">Todos <small>20<\/small><\/span><span class=\"chip\">Jugando <small>5<\/small><\/span><span class=\"chip\">Pendientes <small>4<\/small><\/span><\/span><\/div>\n    <\/div>\n    <div class=\"fi-r\">\n      <div class=\"glass-in fi-box\" data-f><div class=\"ring\" style=\"--p:68;--sz:68px;--th:9px\"><u><\/u><i><\/i><span><b>68%<\/b><\/span><\/div><div><b>29 de 42<\/b><small>logros conseguidos<\/small><\/div><\/div>\n      <div class=\"fi-act\"><span class=\"bmain\" data-f>▶&nbsp;Jugar<\/span><span class=\"bsec pill\" data-f>Capturas<\/span><\/div>\n    <\/div>\n   <\/div><\/div><\/div>\n  <div class=\"glass tokens\"><div class=\"face\">\n    <h4>Arcoíris · un acento por elemento<\/h4><div class=\"sw\">${RB.map(k=>`<i style=\"--c:var(--${k})\"><\/i>`).join('')}<\/div><div class=\"rb rainbow-bar\"><\/div>\n    <h4>Radios<\/h4><div class=\"rad\">${['xs','sm','md','lg','pill'].map(k=>`<div><i style=\"border-radius:var(--r-${k})\"><\/i><small data-v=\"--r-${k}\">${k}<\/small><\/div>`).join('')}<\/div>\n    <h4>Tipografía · 7 pasos<\/h4><div class=\"ty\">${['micro','sec','body','hi','panel','screen','hero'].map(k=>`<span style=\"font-size:var(--t-${k})\">Aa<\/span>`).join('')}<\/div><div class=\"tyl\" id=\"tyl\"><\/div>\n    <h4>Cristal · 3 niveles<\/h4><div class=\"lv\"><div class=\"glass rel lv1\"><div class=\"face\"><\/div><\/div><div class=\"glass-in lv2\"><\/div><div class=\"pill lv3\">Pastilla<\/div><\/div>\n    <h4>Botones · 3 tipos<\/h4><div class=\"bt\"><span class=\"bmain\">Principal<\/span><span class=\"bsec pill\">Secundaria<\/span><span class=\"chips pill\"><span class=\"chip on\">Selector<\/span><\/span><\/div>\n  <\/div><\/div>`);\n  const cs=getComputedStyle(stage);\n  $$('[data-v]').forEach(e=>{const v=cs.getPropertyValue(e.dataset.v).trim();e.textContent=e.textContent+' '+(v=='999px'?'∞':v.replace('px',''))});\n  $('#tyl').textContent=['micro','sec','body','hi','panel','screen','hero'].map(k=>cs.getPropertyValue('--t-'+k).trim().replace('px','')).join(' · ');\n  window.onFocus=el=>{if(el.dataset.c)setAcc(ACCF(el.dataset.c))};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n  hints([['A','Abrir'],['X','Fijar'],['Y','Mi lista'],['B','Atrás']]);\n  bg(RB.map(k=>cs.getPropertyValue('--'+k).trim()));\n  focusEl($('.tile'),true);\n}\n\nspecimen({\"n\":5});\naddEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)||e.key=='Escape')parent.postMessage({pv:e.key},'*')});<\/script><\/body><\/html>"},{"t":"Noche ahumada","d":"Cristal ahumado sobre fondo oscuro: el arcoíris pasa a ser brillo (glow) y el foco es neón. Descansa la vista en sesiones nocturnas.","html":"<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><style>/* ===== Sistema de diseño unificado (tokens) ===== */\n:root{\n  --round:'M PLUS Rounded 1c','Nunito','Segoe UI',system-ui,sans-serif;\n  /* arcoíris (RAINBOW) */\n  --red:#E8384F;--orange:#F27A1A;--yellow:#F2B807;--green:#3BB54A;--blue:#00A0D8;--indigo:#3F63E0;--violet:#9A4BD8;\n  --acc:var(--blue);--acc-ink:#fff;\n  /* radios */\n  --r-xs:6px;--r-sm:12px;--r-md:18px;--r-lg:28px;--r-pill:999px;\n  /* tipografía */\n  --t-micro:11px;--t-sec:13px;--t-body:15px;--t-hi:17px;--t-panel:20px;--t-screen:28px;--t-hero:44px;\n  /* espaciado (escala de 4) */\n  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;\n  /* superficies y texto */\n  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#9aa2b0;--line:rgba(95,110,135,.22);\n  --face:#dfe3e9;--face-hi:#f4f6f9;\n  --hintband:64px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0f1218;overflow:hidden;font-family:var(--round)}\n#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;color:var(--ink);\n  background:#eceef2;user-select:none;font-family:var(--round);font-weight:500}\n.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}\n.blob{position:absolute;border-radius:50%;filter:blur(34px)}\n.blob.w{background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%)}\n.blob.a{background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);opacity:.55}\n.ghost{position:absolute;width:118px;height:118px;border-radius:28px;padding:10px;background:rgba(255,255,255,.7);\n  box-shadow:0 0 0 1px rgba(120,130,150,.25),0 10px 18px -10px rgba(40,50,70,.4);filter:blur(5px);animation:float 18s ease-in-out infinite alternate}\n.ghost i{display:block;width:100%;height:100%;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 30%,white),var(--g))}\n@keyframes float{from{transform:translate(0,0) rotate(-4deg)}to{transform:translate(20px,-16px) rotate(3deg)}}\n\n/* ===== Glass nivel 1: panel (rim + arco de brillo + cara) ===== */\n.glass{position:absolute;--r:var(--r-lg);--bw span class=\"bfin\">${CHK}<\/span>`;\n  return s}\n/* portada 2:3: h manda, w = h·2/3 */\nfunction cov(g,x,y,h,extra=''){const w=Math.round(h*2/3),st=state(g),fs=Math.max(10,Math.min(22,w*.105));\n  return `<div class=\"cv ${st} ${extra}\" data-f data-i=\"${g.i}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px;--sc:${ST[st].c};--cr:${Math.max(6,Math.round(w*.075))}px\">${art(g.c,g.sc)}${w>=58?`<b class=\"pt\" style=\"font-size:${fs}px\">${g.n}<\/b>`:''}<span class=\"bdg\">${badges(g,w)}<\/span><\/div>`}\nfunction infoHTML(g){const st=state(g),S=ST[st];let l1='',l2='';\n  if(st=='pend'){l1=`Nº ${g.po} en tu cola`;l2='Sin empezar'}\n  else if(st=='fin'){l1=`Terminado en ${g.fin}`;l2=`${g.h} h jugadas`}\n  else{l1=ago(g.d);l2=`${g.h} h jugadas`}\n  let extra='';\n  if(g.pin)extra=`<span class=\"ipin\">${PINI}Fijado · no se enfría<\/span>`;\n  else if(warn(g))extra=`<span class=\"iwarn\">${CLK}Se aparca en ${left(g)} días<\/span>`;\n  else if(g.ab)extra=`<span class=\"imute\">Aparcado a mano<\/span>`;\n  return `<div class=\"in-n\">${g.n}<\/div><div class=\"in-m\"><span class=\"tag\" style=\"--c:${S.c}\">${S.k}<\/span><span>${l1}<\/span><span class=\"dotsep\">·<\/span><span>${l2}<\/span><\/div><div class=\"in-x\">${extra}<\/div>`}\nfunction bindList(infoSel){\n  window.onFocus=el=>{const g=GAMES[+el.dataset.i];if(!g)return;const inf=$(infoSel);if(inf)inf.innerHTML=infoHTML(g);setAcc(ST[state(g)].c);window.onListFocus&&window.onListFocus(g,el)};\n  window.onKey=k=>{if((k=='x'||k=='X')&&FOC&&FOC.dataset.i!=null){const g=GAMES[+FOC.dataset.i];const st=state(g);if(st=='fin'||st=='pend')return;\n      g.pin=!g.pin;$$(`.cv[data-i=\"${g.i}\"] .bdg`).forEach(b=>b.innerHTML=badges(g,b.parentNode.offsetWidth));window.onFocus(FOC)}};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n}\nfunction topbar(cur='Mi lista',right=''){return `<div class=\"top\"><div class=\"glass avatar\"><div class=\"face\">P<\/div><\/div>\n <div class=\"crumb pill\"><span>${CAT}<\/span><span class=\"sep\">›<\/span><span class=\"cur\">${cur}<\/span><\/div>${right}\n <div class=\"clock pill\" style=\"padding:8px 16px\"><span>18:42<\/span><small>vie 30 oct<\/small><span class=\"batt\"><b><\/b><b><\/b><b><\/b><b class=\"off\"><\/b><\/span><\/div><\/div>`}\nconst LIST_HINTS=[['A','Jugar'],['X','Fijar'],['Y','Mover a…'],['B','Atrás']];\n\n\nfunction specimen(o){\n  const ACCF=window.ACCF||(c=>c);\n  const TT=[0,1,2,5,6,9,16].slice(0,o.n).map(i=>GAMES[i]);\n  const RB=['red','orange','yellow','green','blue','indigo','violet'];\n  $('.bg').insertAdjacentHTML('afterend',topbar('Biblioteca')+`\n  <div class=\"colL\"><div class=\"tiles\">${TT.map(g=>`<div class=\"glass rel tile\" data-f data-c=\"${g.c}\"><div class=\"face\">${art(g.c,g.sc)}<b class=\"tn\">${g.n}<\/b><i class=\"st\" style=\"--c:${ACCF(g.c)}\"><\/i><\/div><\/div>`).join('')}<\/div>\n   <div class=\"glass rel ficha\"><div class=\"face\">\n    <div class=\"fi-l\">\n      <div class=\"fi-k\"><span class=\"tag\" style=\"--c:var(--red)\">Jugando<\/span><span>Juegos PC · Hoy<\/span><\/div>\n      <div class=\"fi-n\">Elden Ring<\/div>\n      <div class=\"fi-hero\"><b>142<\/b><span>h jugadas<\/span><\/div>\n      <div><span class=\"chips pill\"><span class=\"chip on\">Todos <small>20<\/small><\/span><span class=\"chip\">Jugando <small>5<\/small><\/span><span class=\"chip\">Pendientes <small>4<\/small><\/span><\/span><\/div>\n    <\/div>\n    <div class=\"fi-r\">\n      <div class=\"glass-in fi-box\" data-f><div class=\"ring\" style=\"--p:68;--sz:68px;--th:9px\"><u><\/u><i><\/i><span><b>68%<\/b><\/span><\/div><div><b>29 de 42<\/b><small>logros conseguidos<\/small><\/div><\/div>\n      <div class=\"fi-act\"><span class=\"bmain\" data-f>▶&nbsp;Jugar<\/span><span class=\"bsec pill\" data-f>Capturas<\/span><\/div>\n    <\/div>\n   <\/div><\/div><\/div>\n  <div class=\"glass tokens\"><div class=\"face\">\n    <h4>Arcoíris · un acento por elemento<\/h4><div class=\"sw\">${RB.map(k=>`<i style=\"--c:var(--${k})\"><\/i>`).join('')}<\/div><div class=\"rb rainbow-bar\"><\/div>\n    <h4>Radios<\/h4><div class=\"rad\">${['xs','sm','md','lg','pill'].map(k=>`<div><i style=\"border-radius:var(--r-${k})\"><\/i><small data-v=\"--r-${k}\">${k}<\/small><\/div>`).join('')}<\/div>\n    <h4>Tipografía · 7 pasos<\/h4><div class=\"ty\">${['micro','sec','body','hi','panel','screen','hero'].map(k=>`<span style=\"font-size:var(--t-${k})\">Aa<\/span>`).join('')}<\/div><div class=\"tyl\" id=\"tyl\"><\/div>\n    <h4>Cristal · 3 niveles<\/h4><div class=\"lv\"><div class=\"glass rel lv1\"><div class=\"face\"><\/div><\/div><div class=\"glass-in lv2\"><\/div><div class=\"pill lv3\">Pastilla<\/div><\/div>\n    <h4>Botones · 3 tipos<\/h4><div class=\"bt\"><span class=\"bmain\">Principal<\/span><span class=\"bsec pill\">Secundaria<\/span><span class=\"chips pill\"><span class=\"chip on\">Selector<\/span><\/span><\/div>\n  <\/div><\/div>`);\n  const cs=getComputedStyle(stage);\n  $$('[data-v]').forEach(e=>{const v=cs.getPropertyValue(e.dataset.v).trim();e.textContent=e.textContent+' '+(v=='999px'?'∞':v.replace('px',''))});\n  $('#tyl').textContent=['micro','sec','body','hi','panel','screen','hero'].map(k=>cs.getPropertyValue('--t-'+k).trim().replace('px','')).join(' · ');\n  window.onFocus=el=>{if(el.dataset.c)setAcc(ACCF(el.dataset.c))};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n  hints([['A','Abrir'],['X','Fijar'],['Y','Mi lista'],['B','Atrás']]);\n  bg(RB.map(k=>cs.getPropertyValue('--'+k).trim()));\n  focusEl($('.tile'),true);\n}\n\nspecimen({\"n\":5});\naddEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)||e.key=='Escape')parent.postMessage({pv:e.key},'*')});<\/script><\/body><\/html>"},{"t":"Caramelo","d":"Cristal grueso (rim 16, radio 40) y caras de caramelo saturadas; letra grande en 800 y menos piezas por pantalla. El más «juguete Nintendo» y táctil.","html":"<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><style>/* ===== Sistema de diseño unificado (tokens) ===== */\n:root{\n  --round:'M PLUS Rounded 1c','Nunito','Segoe UI',system-ui,sans-serif;\n  /* arcoíris (RAINBOW) */\n  --red:#E8384F;--orange:#F27A1A;--yellow:#F2B807;--green:#3BB54A;--blue:#00A0D8;--indigo:#3F63E0;--violet:#9A4BD8;\n  --acc:var(--blue);--acc-ink:#fff;\n  /* radios */\n  --r-xs:6px;--r-sm:12px;--r-md:18px;--r-lg:28px;--r-pill:999px;\n  /* tipografía */\n  --t-micro:11px;--t-sec:13px;--t-body:15px;--t-hi:17px;--t-panel:20px;--t-screen:28px;--t-hero:44px;\n  /* espaciado (escala de 4) */\n  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;\n  /* superficies y texto */\n  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#9aa2b0;--line:rgba(95,110,135,.22);\n  --face:#dfe3e9;--face-hi:#f4f6f9;\n  --hintband:64px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0f1218;overflow:hidden;font-family:var(--round)}\n#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;color:var(--ink);\n  background:#eceef2;user-select:none;font-family:var(--round);font-weight:500}\n.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}\n.blob{position:absolute;border-radius:50%;filter:blur(34px)}\n.blob.w{background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%)}\n.blob.a{background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);opacity:.55}\n.ghost{position:absolute;width:118px;height:118px;border-radius:28px;padding:10px;background:rgba(255,255,255,.7);\n  box-shadow:0 0 0 1px rgba(120,130,150,.25),0 10px 18px -10px rgba(40,50,70,.4);filter:blur(5px);animation:float 18s ease-in-out infinite alternate}\n.ghost i{display:block;width:100%;height:100%;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 30%,white),var(--g))}\n@keyframes float{from{transform:translate(0,0) rotate(-4deg)}to{transform:translate(20px,-16px) rotate(3deg)}}\n\n/* ===== Glass nivel 1: panel (rim + arco de brillo + cara) ===== */\n.glass{position:absolute;--r:var(--r-lg);--bw:10px;border-radius:var(--r);padding:var(--bw);isolation:isolate;\n  background:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.30) 46%,rgba(225,234,246,.22) 100%);\n  backdrop-filter:blur(14px) saturate(1.7);\n  box-shadow:inset 0 1.5px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -10px 14px -8px rgba(255,255,255,.95),\n    inset 0 -1.5px 0 rgba(110,125,150,.30),0 0 0 1px rgba(95,110,135,.24),0 2px 3px rgba(40,50,70,.10),0 18px 30px -16px rgba(40,50,70,.42);\n  transition:transform .24s cubic-bezier(.34,1.32,.64,1),box-shadow .24s,background .24s}\n.glass::before{content:'';position:absolute;z-index:2;left:2px;right:2px;top:2px;height:52%;pointer-events:none;\n  border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;\n  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.20) 55%,rgba(255,255,255,0));\n  -webkit-mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:.85}\n.glass::after{content:'';position:absolute;z-index:3;left:12%;top:3px;width:34%;height:5px;border-radius:5px;pointer-events:none;\n  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 40%,rgba(255,255,255,0));filter:blur(.6px);opacity:.9}\n.glass .face{position:relative;z-index:1;width:100%;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);overflow:hidden;background:var(--face)}\n.glass .face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;\n  box-shadow:inset 0 0 0 1px rgba(20,30,50,.20),inset 0 3px 6px -2px rgba(0,0,0,.35),inset 0 -2px 4px -2px rgba(255,255,255,.5)}\n.glass.f{transform:scale(1.06);z-index:4;\n  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 30%,rgba(255,255,255,.85)),color-mix(in srgb,var(--ac le=\"--c:var(--red)\">Jugando<\/span><span>Juegos PC · Hoy<\/span><\/div>\n      <div class=\"fi-n\">Elden Ring<\/div>\n      <div class=\"fi-hero\"><b>142<\/b><span>h jugadas<\/span><\/div>\n      <div><span class=\"chips pill\"><span class=\"chip on\">Todos <small>20<\/small><\/span><span class=\"chip\">Jugando <small>5<\/small><\/span><span class=\"chip\">Pendientes <small>4<\/small><\/span><\/span><\/div>\n    <\/div>\n    <div class=\"fi-r\">\n      <div class=\"glass-in fi-box\" data-f><div class=\"ring\" style=\"--p:68;--sz:68px;--th:9px\"><u><\/u><i><\/i><span><b>68%<\/b><\/span><\/div><div><b>29 de 42<\/b><small>logros conseguidos<\/small><\/div><\/div>\n      <div class=\"fi-act\"><span class=\"bmain\" data-f>▶&nbsp;Jugar<\/span><span class=\"bsec pill\" data-f>Capturas<\/span><\/div>\n    <\/div>\n   <\/div><\/div><\/div>\n  <div class=\"glass tokens\"><div class=\"face\">\n    <h4>Arcoíris · un acento por elemento<\/h4><div class=\"sw\">${RB.map(k=>`<i style=\"--c:var(--${k})\"><\/i>`).join('')}<\/div><div class=\"rb rainbow-bar\"><\/div>\n    <h4>Radios<\/h4><div class=\"rad\">${['xs','sm','md','lg','pill'].map(k=>`<div><i style=\"border-radius:var(--r-${k})\"><\/i><small data-v=\"--r-${k}\">${k}<\/small><\/div>`).join('')}<\/div>\n    <h4>Tipografía · 7 pasos<\/h4><div class=\"ty\">${['micro','sec','body','hi','panel','screen','hero'].map(k=>`<span style=\"font-size:var(--t-${k})\">Aa<\/span>`).join('')}<\/div><div class=\"tyl\" id=\"tyl\"><\/div>\n    <h4>Cristal · 3 niveles<\/h4><div class=\"lv\"><div class=\"glass rel lv1\"><div class=\"face\"><\/div><\/div><div class=\"glass-in lv2\"><\/div><div class=\"pill lv3\">Pastilla<\/div><\/div>\n    <h4>Botones · 3 tipos<\/h4><div class=\"bt\"><span class=\"bmain\">Principal<\/span><span class=\"bsec pill\">Secundaria<\/span><span class=\"chips pill\"><span class=\"chip on\">Selector<\/span><\/span><\/div>\n  <\/div><\/div>`);\n  const cs=getComputedStyle(stage);\n  $$('[data-v]').forEach(e=>{const v=cs.ge n  -webkit-mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:.85}\n.glass::after{content:'';position:absolute;z-index:3;left:12%;top:3px;width:34%;height:5px;border-radius:5px;pointer-events:none;\n  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 40%,rgba(255,255,255,0));filter:blur(.6px);opacity:.9}\n.glass .face{position:relative;z-index:1;width:100%;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);overflow:hidden;background:var(--face)}\n.glass .face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;\n  box-shadow:inset 0 0 0 1px rgba(20,30,50,.20),inset 0 3px 6px -2px rgba(0,0,0,.35),inset 0 -2px 4px -2px rgba(255,255,255,.5)}\n.glass.f{transform:scale(1.06);z-index:4;\n  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 30%,rgba(255,255,255,.85)),color-mix(in srgb,var(--acc) 72%,transparent) 55%,color-mix(in srgb,var(--acc) 92%,black));\n  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1px color-mix(in srgb,white 45%,transparent),inset 0 -10px 14px -8px color-mix(in srgb,var(--acc) 30%,white),\n    0 0 0 1px color-mix(in srgb,var(--acc) 75%,black),0 0 26px 2px color-mix(in srgb,var(--acc) 50%,transparent),0 22px 34px -16px color-mix(in srgb,var(--acc) 70%,black)}\n.glass.rel{position:relative}\n.glass.flat .face{background:rgba(255,255,255,.55)}\n.glass.flat .face::after{box-shadow:inset 0 0 0 1px rgba(20,30,50,.10),inset 0 2px 4px -2px rgba(0,0,0,.18)}\n\n/* ===== Glass nivel 2: panel dentro de panel ===== */\n.glass-in{position:relative;border-radius:var(--r-md);background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.34));\n  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(110,125,150,.16),0 0 0 1px rgba(95,110,135,.16);transition:box-shadow .18s,background .18s,transform .18s}\n.glass-in.f{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 10 `;\n  return `<svg viewBox=\"0 0 200 300\" preserveAspectRatio=\"xMidYMid slice\">${sky}${s}<rect width=\"200\" height=\"300\" fill=\"url(#${u}v)\"/><\/svg>`;\n}\nconst CAT='Juegos PC';\nconst HOT=14,COLD=90,WARN=10;\nconst ST={marcha:{k:'Jugando',c:'#E8384F'},medias:{k:'A medias',c:'#F27A1A'},pend:{k:'Pendiente',c:'#00A0D8'},parked:{k:'Aparcado',c:'#9A4BD8'},fin:{k:'Terminado',c:'#3BB54A'}};\nconst GAMES=[\n ['Elden Ring','#F27A1A',0,0,142],['Balatro','#E8384F',1,1,61],['Hades II','#9A4BD8',2,5,38],['Hi-Fi Rush','#00A0D8',3,9,9],\n ['Cyberpunk 2077','#F2B807',2,40,73,{pin:1}],\n [\"Baldur's Gate 3\",'#3F63E0',0,33,88],['Hollow Knight','#00A0D8',4,58,24],['Sekiro','#E8384F',3,82,31],['Disco Elysium','#3BB54A',1,86,19],\n ['Silksong','#E8384F',3,null,0,{po:1}],['Outer Wilds','#F27A1A',4,null,0,{po:2}],['Pentiment','#9A4BD8',0,null,0,{po:3}],['Obra Dinn','#3BB54A',1,null,0,{po:4}],\n ['Starfield','#3F63E0',4,140,22],[\"Dragon's Dogma 2\",'#F27A1A',0,121,17],['Control','#E8384F',2,35,6,{ab:1}],\n ['Celeste','#9A4BD8',0,150,14,{fin:2026}],['Hades','#E8384F',3,190,61,{fin:2026}],['Inscryption','#3BB54A',2,240,12,{fin:2026}],['Ori','#00A0D8',3,400,11,{fin:2025}],\n].map(([n,c,sc,d,h,x={}],i)=>({i,n,c,sc,d,h,pin:!!x.pin,ab:!!x.ab,fin:x.fin||0,po:x.po||0}));\nfunction state(g){if(g.fin)return'fin';if(g.d==null)return'pend';if(g.pin)return'marcha';if(g.ab)return'parked';if(g.d<=HOT)return'marcha';if(g.d<=COLD)return'medias';return'parked'}\nconst left=g=>COLD-g.d, warn=g=>state(g)=='medias'&&!g.pin&&left(g)<=WARN;\nfunction groups(){const R={marcha:[],medias:[],pend:[],parked:[],fin:[]};GAMES.forEach(g=>R[state(g)].push(g));\n  R.marcha.sort((a,b)=>a.pin-b.pin||a.d-b.d);R.medias.sort((a,b)=>a.d-b.d);R.pend.sort((a,b)=>a.po-b.po);R.parked.sort((a,b)=>a.d-b.d);R.fin.sort((a,b)=>b.fin-a.fin||a.d-b.d);return R}\nfunction ago(d){if(d==null)return'Sin empezar';if(d==0)return'Hoy';if(d==1)return'Ayer';if(d<14)return`Hace ${d} días`;if(d<60)return`Hace ${Math.round(d/7)} semanas`;if(d<365)return`Hace ${Math.round(d/30)} meses`;return'Hace más de un año'}\nconst CLK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>';\nconst PINI='<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M15 2l7 7-3 1-4 4 1 5-2 2-4-5-5 5-1-1 5-5-5-4 2-2 5 1 4-4z\"/><\/svg>';\nconst CHK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>';\nfunction badges(g,w){let s='';\n  if(g.pin)s+=`<span class=\"bpin\">${PINI}<\/span>`;\n  if(warn(g))s+=w>=96?`<span class=\"bwarn\">${CLK}Se aparca en ${left(g)} d<\/span>`:`<span class=\"bwarn dot\">${CLK}${left(g)}<\/span>`;\n  if(g.fin&&w<70)s+=`<span class=\"bfin\">${CHK}<\/span>`;\n  return s}\n/* portada 2:3: h manda, w = h·2/3 */\nfunction cov(g,x,y,h,extra=''){const w=Math.round(h*2/3),st=state(g),fs=Math.max(10,Math.min(22,w*.105));\n  return `<div class=\"cv ${st} ${extra}\" data-f data-i=\"${g.i}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px;--sc:${ST[st].c};--cr:${Math.max(6,Math.round(w*.075))}px\">${art(g.c,g.sc)}${w>=58?`<b class=\"pt\" style=\"font-size:${fs}px\">${g.n}<\/b>`:''}<span class=\"bdg\">${badges(g,w)}<\/span><\/div>`}\nfunction infoHTML(g){const st=state(g),S=ST[st];let l1='',l2='';\n  if(st=='pend'){l1=`Nº ${g.po} en tu cola`;l2='Sin empezar'}\n  else if(st=='fin'){l1=`Terminado en ${g.fin}`;l2=`${g.h} h jugadas`}\n  else{l1=ago(g.d);l2=`${g.h} h jugadas`}\n  let extra='';\n  if(g.pin)extra=`<span class=\"ipin\">${PINI}Fijado · no se enfría<\/span>`;\n  else if(warn(g))extra=`<span class=\"iwarn\">${CLK}Se aparca en ${left(g)} días<\/span>`;\n  else if(g.ab)extra=`<span class=\"imute\">Aparcado a mano<\/span>`;\n  return `<div class=\"in-n\">${g.n}<\/div><div class=\"in-m\"><span class=\"tag\" style=\"--c:${S.c}\">${S.k}<\/span><span>${l1}<\/span><span class=\"dotsep\">·<\/span><span>${l2}<\/span><\/div><div class=\"in-x\">${extra}<\/div>`}\nfunction bindList(infoSel){\n  window.onFocus=el=>{const g=GAMES[+el.dataset.i];if(!g)return;const inf=$(infoSel);if(inf)inf.innerHTML=infoHTML(g);setAcc(ST[state(g)].c);window.onListFocus&&window.onListFocus(g,el)};\n  window.onKey=k=>{if((k=='x'||k=='X')&&FOC&&FOC.dataset.i!=null){const g=GAMES[+FOC.dataset.i];const st=state(g);if(st=='fin'||st=='pend')return;\n      g.pin=!g.pin;$$(`.cv[data-i=\"${g.i}\"] .bdg`).forEach(b=>b.innerHTML=badges(g,b.parentNode.offsetWidth));window.onFocus(FOC)}};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n}\nfunction topbar(cur='Mi lista',right=''){return `<div class=\"top\"><div class=\"glass avatar\"><div class=\"face\">P<\/div><\/div>\n <div class=\"crumb pill\"><span>${CAT}<\/span><span class=\"sep\">›<\/span><span class=\"cur\">${cur}<\/span><\/div>${right}\n <div class=\"clock pill\" style=\"padding:8px 16px\"><span>18:42<\/span><small>vie 30 oct<\/small><span class=\"batt\"><b><\/b><b><\/b><b><\/b><b class=\"off\"><\/b><\/span><\/div><\/div>`}\nconst LIST_HINTS=[['A','Jugar'],['X','Fijar'],['Y','Mover a…'],['B','Atrás']];\n\n\nfunction specimen(o){\n  const ACCF=window.ACCF||(c=>c);\n  const TT=[0,1,2,5,6,9,16].slice(0,o.n).map(i=>GAMES[i]);\n  const RB=['red','orange','yellow','green','blue','indigo','violet'];\n  $('.bg').insertAdjacentHTML('afterend',topbar('Biblioteca')+`\n  <div class=\"colL\"><div class=\"tiles\">${TT.map(g=>`<div class=\"glass rel tile\" data-f data-c=\"${g.c}\"><div class=\"face\">${art(g.c,g.sc)}<b class=\"tn\">${g.n}<\/b><i class=\"st\" style=\"--c:${ACCF(g.c)}\"><\/i><\/div><\/div>`).join('')}<\/div>\n   <div class=\"glass rel ficha\"><div class=\"face\">\n    <div class=\"fi-l\">\n      <div class=\"fi-k\"><span class=\"tag\" style=\"--c:var(--red)\">Jugando<\/span><span>Juegos PC · Hoy<\/span><\/div>\n      <div class=\"fi-n\">Elden Ring<\/div>\n      <div class=\"fi-hero\"><b>142<\/b><span>h jugadas<\/span><\/div>\n      <div><span class=\"chips pill\"><span class=\"chip on\">Todos <small>20<\/small><\/span><span class=\"chip\">Jugando <small>5<\/small><\/span><span class=\"chip\">Pendientes <small>4<\/small><\/span><\/span><\/div>\n    <\/div>\n    <div class=\"fi-r\">\n      <div class=\"glass-in fi-box\" data-f><div class=\"ring\" style=\"--p:68;--sz:68px;--th:9px\"><u><\/u><i><\/i><span><b>68%<\/b><\/span><\/div><div><b>29 de 42<\/b><small>logros conseguidos<\/small><\/div><\/div>\n      <div class=\"fi-act\"><span class=\"bmain\" data-f>▶&nbsp;Jugar<\/span><span class=\"bsec pill\" data-f>Capturas<\/span><\/div>\n    <\/div>\n   <\/div><\/div><\/div>\n  <div class=\"glass tokens\"><div class=\"face\">\n    <h4>Arcoíris · un acento por elemento<\/h4><div class=\"sw\">${RB.map(k=>`<i style=\"--c:var(--${k})\"><\/i>`).join('')}<\/div><div class=\"rb rainbow-bar\"><\/div>\n    <h4>Radios<\/h4><div class=\"rad\">${['xs','sm','md','lg','pill'].map(k=>`<div><i style=\"border-radius:var(--r-${k})\"><\/i><small data-v=\"--r-${k}\">${k}<\/small><\/div>`).join('')}<\/div>\n    <h4>Tipografía · 7 pasos<\/h4><div class=\"ty\">${['micro','sec','body','hi','panel','screen','hero'].map(k=>`<span style=\"font-size:var(--t-${k})\">Aa<\/span>`).join('')}<\/div><div class=\"tyl\" id=\"tyl\"><\/div>\n    <h4>Cristal · 3 niveles<\/h4><div class=\"lv\"><div class=\"glass rel lv1\"><div class=\"face\"><\/div><\/div><div class=\"glass-in lv2\"><\/div><div class=\"pill lv3\">Pastilla<\/div><\/div>\n    <h4>Botones · 3 tipos<\/h4><div class=\"bt\"><span class=\"bmain\">Principal<\/span><span class=\"bsec pill\">Secundaria<\/span><span class=\"chips pill\"><span class=\"chip on\">Selector<\/span><\/span><\/div>\n  <\/div><\/div>`);\n  const cs=getComputedStyle(stage);\n  $$('[data-v]').forEach(e=>{const v=cs.getPropertyValue(e.dataset.v).trim();e.textContent=e.textContent+' '+(v=='999px'?'∞':v.replace('px',''))});\n  $('#tyl').textContent=['micro','sec','body','hi','panel','screen','hero'].map(k=>cs.getPropertyValue('--t-'+k).trim().replace('px','')).join(' · ');\n  window.onFocus=el=>{if(el.dataset.c)setAcc(ACCF(el.dataset.c))};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n  hints([['A','Abrir'],['X','Fijar'],['Y','Mi lista'],['B','Atrás']]);\n  bg(RB.map(k=>cs.getPropertyValue('--'+k).trim()));\n  focusEl($('.tile'),true);\n}\n\nspecimen({\"n\":7});\naddEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)||e.key=='Escape')parent.postMessage({pv:e.key},'*')});<\/script><\/body><\/html>"},{"t":"Escarcha pastel","d":"Arcoíris mezclado al 55 % con blanco, desenfoque de 30 px y caras lechosas; pesos ligeros y mucho aire. La variante más calmada.","html":"<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><style>/* ===== Sistema de diseño unificado (tokens) ===== */\n:root{\n  --round:'M PLUS Rounded 1c','Nunito','Segoe UI',system-ui,sans-serif;\n  /* arcoíris (RAINBOW) */\n  --red:#E8384F;--orange:#F27A1A;--yellow:#F2B807;--green:#3BB54A;--blue:#00A0D8;--indigo:#3F63E0;--violet:#9A4BD8;\n  --acc:var(--blue);--acc-ink:#fff;\n  /* radios */\n  --r-xs:6px;--r-sm:12px;--r-md:18px;--r-lg:28px;--r-pill:999px;\n  /* tipografía */\n  --t-micro:11px;--t-sec:13px;--t-body:15px;--t-hi:17px;--t-panel:20px;--t-screen:28px;--t-hero:44px;\n  /* espaciado (escala de 4) */\n  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;\n  /* superficies y texto */\n  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#9aa2b0;--line:rgba(95,110,135,.22);\n  --face:#dfe3e9;--face-hi:#f4f6f9;\n  --hintband:64px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0f1218;overflow:hidden;font-family:var(--round)}\n#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;color:var(--ink);\n  background:#eceef2;user-select:none;font-family:var(--round);font-weight:500}\n.bg{position:a ,'#000000',.35),DD=mix(c,'#000000',.6),M=mix(c,'#ffffff',.2);\n  const sky=`<defs><linearGradient id=\"${u}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"${scene==2||scene==4?DD:L}\"/><stop offset=\"1\" stop-color=\"${scene==2||scene==4?c:M}\"/><\/linearGradient>\n  <linearGradient id=\"${u}v\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\".55\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".55\"/><\/linearGradient><\/defs><rect width=\"200\" height=\"300\" fill=\"url(#${u})\"/>`;\n  let s='';\n  if(scene==0)s=`<circle cx=\"140\" cy=\"88\" r=\"30\" fill=\"#fff\" opacity=\".75\"/><path d=\"M0 190 L50 120 L85 165 L125 95 L200 175 V300 H0z\" fill=\"${M}\" opacity=\".7\"/><path d=\"M0 220 L40 175 L90 215 L140 150 L200 205 V300 H0z\" fill=\"${D}\"/><path d=\"M0 255 L70 215 L120 245 L200 222 V300 H0z\" fill=\"${DD}\"/>`;\n  if(scene==1)s=`<circle cx=\"100\" cy=\"170\" r=\"52\" fill=\"#fff\" opacity=\".8\"/><rect y=\"170\" width=\"200\" height=\"130\" fill=\"${D}\"/>${[184,198,214,232,254].map((y,i)=>`<rect x=\"${30+i*8}\" y=\"${y}\" width=\"${140-i*16}\" height=\"${3+i}\" rx=\"2\" fill=\"#fff\" opacity=\"${.5-i*.07}\"/>`).join('')}`;\n  if(scene==2)s=`<circle cx=\"52\" cy=\"70\" r=\"18\" fill=\"#fff\" opacity=\".85\"/>${[[0,170,34],[30,130,28],[56,190,30],[84,110,26],[108,160,34],[140,135,24],[162,185,40]].map(([x,y,w])=>`<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${300-y}\" fill=\"${DD}\"/>${[0,1,2,3].map(k=>`<rect x=\"${x+6}\" y=\"${y+12+k*22}\" width=\"5\" height=\"7\" fill=\"${L}\" opacity=\".8\"/>`).join('')}`).join('')}`;\n  if(scene==3)s=`<circle cx=\"150\" cy=\"70\" r=\"22\" fill=\"#fff\" opacity=\".7\"/>${[[0,M,.7,150],[1,D,1,200],[2,DD,1,245]].map(([r,f,o,b])=>[...Array(7)].map((_,k)=>{const x=k*34-10+r*14;return `<path d=\"M${x} ${b+40} L${x+22} ${b-40-((k*13+r*7)%30)} L${x+44} ${b+40}z\" fill=\"${f}\" opacity=\"${o}\"/>`}).join('')).join('')}<rect y=\"270\" width=\"200\" height=\"30\" fill=\"${DD}\"/>`;\n  if(scene==4)s=`${[...Array(26)].map((_,k)=>`<circle cx=\"${(k*73)%200}\" cy=\"${(k*41)%170}\" r=\"${k%3?1:1.8}\" fill=\"#fff\" opacity=\".8\"/>`).join('')}<circle cx=\"110\" cy=\"150\" r=\"58\" fill=\"${M}\"/><circle cx=\"96\" cy=\"136\" r=\"58\" fill=\"${L}\" opacity=\".35\"/><ellipse cx=\"110\" cy=\"152\" rx=\"96\" ry=\"16\" fill=\"none\" stroke=\"#fff\" stroke-width=\"5\" opacity=\".6\" transform=\"rotate(-14 110 152)\"/><path d=\"M0 260 Q100 225 200 260 V300 H0z\" fill=\"${DD}\"/>`;\n  return `<svg viewBox=\"0 0 200 300\" preserveAspectRatio=\"xMidYMid slice\">${sky}${s}<rect width=\"200\" height=\"300\" fill=\"url(#${u}v)\"/><\/svg>`;\n}\nconst CAT='Juegos PC';\nconst HOT=14,COLD=90,WARN=10;\nconst ST={marcha:{k:'Jugando',c:'#E8384F'},medias:{k:'A medias',c:'#F27A1A'},pend:{k:'Pendiente',c:'#00A0D8'},parked:{k:'Aparcado',c:'#9A4BD8'},fin:{k:'Terminado',c:'#3BB54A'}};\nconst GAMES=[\n ['Elden Ring','#F27A1A',0,0,142],['Balatro','#E8384F',1,1,61],['Hades II','#9A4BD8',2,5,38],['Hi-Fi Rush','#00A0D8',3,9,9],\n ['Cyberpunk 2077','#F2B807',2,40,73,{pin:1}],\n [\"Baldur's Gate 3\",'#3F63E0',0,33,88],['Hollow Knight','#00A0D8',4,58,24],['Sekiro','#E8384F',3,82,31],['Disco Elysium','#3BB54A',1,86,19],\n ['Silksong','#E8384F',3,null,0,{po:1}],['Outer Wilds','#F27A1A',4,null,0,{po:2}],['Pentiment','#9A4BD8',0,null,0,{po:3}],['Obra Dinn','#3BB54A',1,null,0,{po:4}],\n ['Starfield','#3F63E0',4,140,22],[\"Dragon's Dogma 2\",'#F27A1A',0,121,17],['Control','#E8384F',2,35,6,{ab:1}],\n ['Celeste','#9A4BD8',0,150,14,{fin:2026}],['Hades','#E8384F',3,190,61,{fin:2026}],['Inscryption','#3BB54A',2,240,12,{fin:2026}],['Ori','#00A0D8',3,400,11,{fin:2025}],\n].map(([n,c,sc,d,h,x={}],i)=>({i,n,c,sc,d,h,pin:!!x.pin,ab:!!x.ab,fin:x.fin||0,po:x.po||0}));\nfunction state(g){if(g.fin)return'fin';if(g.d==null)return'pend';if(g.pin)return'marcha';if(g.ab)return'parked';if(g.d<=HOT)return'marcha';if(g.d<=COLD)return'medias';return'parked'}\nconst left=g=>COLD-g.d, warn=g=>state(g)=='medias'&&!g.pin&&left(g)<=WARN;\nfunction groups(){const R={marcha:[],medias:[],pend:[],parked:[],fin:[]};GAMES.forEach(g=>R[state(g)].push(g));\n  R.marcha.sort((a,b)=>a.pin-b.pin||a.d-b.d);R.medias.sort((a,b)=>a.d-b.d);R.pend.sort((a,b)=>a.po-b.po);R.parked.sort((a,b)=>a.d-b.d);R.fin.sort((a,b)=>b.fin-a.fin||a.d-b.d);return R}\nfunction ago(d){if(d==null)return'Sin empezar';if(d==0)return'Hoy';if(d==1)return'Ayer';if(d<14)return`Hace ${d} días`;if(d<60)return`Hace ${Math.round(d/7)} semanas`;if(d<365)return`Hace ${Math.round(d/30)} meses`;return'Hace más de un año'}\nconst CLK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>';\nconst PINI='<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M15 2l7 7-3 1-4 4 1 5-2 2-4-5-5 5-1-1 5-5-5-4 2-2 5 1 4-4z\"/><\/svg>';\nconst CHK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>';\nfunction badges(g,w){let s='';\n  if(g.pin)s+=`<span class=\"bpin\">${PINI}<\/span>`;\n  if(warn(g))s+=w>=96?`<span class=\"bwarn\">${CLK}Se aparca en ${left(g)} d<\/span>`:`<span class=\"bwarn dot\">${CLK}${left(g)}<\/span>`;\n  if(g.fin&&w<70)s+=`<span class=\"bfin\">${CHK}<\/span>`;\n  return s}\n/* portada 2:3: h manda, w = h·2/3 */\nfunction cov(g,x,y,h,extra=''){const w=Math.round(h*2/3),st=state(g),fs=Math.max(10,Math.min(22,w*.105));\n  return `<div class=\"cv ${st} ${extra}\" data-f data-i=\"${g.i}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px;--sc:${ST[st].c};--cr:${Math.max(6,Math.round(w*.075))}px\">${art(g.c,g.sc)}${w>=58?`<b class=\"pt\" style=\"font-size:${fs}px\">${g.n}<\/b>`:''}<span class=\"bdg\">${badges(g,w)}<\/span><\/div>`}\nfunction infoHTML(g){const st=state(g),S=ST[st];let l1='',l2='';\n  if(st=='pend'){l1=`Nº ${g.po} en tu cola`;l2='Sin empezar'}\n  else if(st=='fin'){l1=`Terminado en ${g.fin}`;l2=`${g.h} h jugadas`}\n  else{l1=ago(g.d);l2=`${g.h} h jugadas`}\n  let extra='';\n  if(g.pin)extra=`<span class=\"ipin\">${PINI}Fijado · no se enfría<\/span>`;\n  else if(warn(g))extra=`<span class=\"iwarn\">${CLK}Se aparca en ${left(g)} días<\/span>`;\n  else if(g.ab)extra=`<span class=\"imute\">Aparcado a mano<\/span>`;\n  return `<div class=\"in-n\">${g.n}<\/div><div class=\"in-m\"><span class=\"tag\" style=\"--c:${S.c}\">${S.k}<\/span><span>${l1}<\/span><span class=\"dotsep\">·<\/span><span>${l2}<\/span><\/div><div class=\"in-x\">${extra}<\/div>`}\nfunction bindList(infoSel){\n  window.onFocus=el=>{const g=GAMES[+el.dataset.i];if(!g)return;const inf=$(infoSel);if(inf)inf.innerHTML=infoHTML(g);setAcc(ST[state(g)].c);window.onListFocus&&window.onListFocus(g,el)};\n  window.onKey=k=>{if((k=='x'||k=='X')&&FOC&&FOC.dataset.i!=null){const g=GAMES[+FOC.dataset.i];const st=state(g);if(st=='fin'||st=='pend')return;\n      g.pin=!g.pin;$$(`.cv[data-i=\"${g.i}\"] .bdg`).forEach(b=>b.innerHTML=badges(g,b.parentNode.offsetWidth));window.onFocus(FOC)}};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n}\nfunction topbar(cur='Mi lista',right=''){return `<div class=\"top\"><div class=\"glass avatar\"><div class=\"face\">P<\/div><\/div>\n <div class=\"crumb pill\"><span>${CAT}<\/span><span class=\"sep\">›<\/span><span class=\"cur\">${cur}<\/span><\/div>${right}\n <div class=\"clock pill\" style=\"padding:8px 16px\"><span>18:42<\/span><small>vie 30 oct<\/small><span class=\"batt\"><b><\/b><b><\/b><b><\/b><b class=\"off\"><\/b><\/span><\/div><\/div>`}\nconst LIST_HINTS=[['A','Jugar'],['X','Fijar'],['Y','Mover a…'],['B','Atrás']];\n\n\nconst PL={marcha:'Jugando',medias:'A medias',pend:'Pendientes',parked:'Aparcados',fin:'Terminados'};\nconst G=groups(),M=G.marcha,Me=G.medias,P=G.pend,A=G.parked,F=G.fin;\nconst lab=(x,y,st,txt,n)=>`<div class=\"lab\" style=\"left:${x}px;top:${y}px;--c:${ST[st].c}\"><i><\/i>${txt||PL[st]}${n!=null?` <small>${n}<\/small>`:''}<\/div>`;\nconst seg=(x,y,w,st)=>`<i class=\"seg\" style=\"left:${x}px;top:${y}px;width:${w}px;--c:${ST[st].c}\"><\/i>`;\nconst plab=(x,y,st,txt)=>`<div class=\"plab\" style=\"left:${x}px;top:${y}px;--c:${ST[st].c}\"><i><\/i>${txt||PL[st]}<\/div>`;\nconst glassBox=(x,y,w,h,cls,inner)=>`<div class=\"glass ${cls}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px\"><div class=\"face\">${inner}<\/div><\/div>`;\nconst cc=(g,cx,cy,h,ex)=>cov(g,Math.round(cx-h/3),Math.round(cy-h/2),h,ex);\nfunction put(h){$('.bg').insertAdjacentHTML('afterend',h)}\nfunction boot(){bindList('#info');hints(LIST_HINTS);bg(['#E8384F','#F27A1A','#00A0D8','#9A4BD8','#3BB54A']);focusEl($('.cv[data-i=\"0\"]'),true)}\nlet h=topbar();\nh+=lab(32,88,'marcha',0,M.length)+seg(32,108,576,'marcha')+cov(M[0],32,120,420);\n[[324,120],[471,120],[324,335],[471,335]].forEach(([x,y],k)=>h+=cov(M[k+1],x,y,205));\nh+=lab(636,88,'medias',0,Me.length)+seg(636,108,210,'medias');\n[[636,120],[746,120],[636,280],[746,280]].forEach(([x,y],k)=>h+=cov(Me[k],x,y,150));\nh+=lab(874,88,'pend',0,P.length)+seg(874,108,168,'pend');\n[[874,120],[962,120],[874,248],[962,248]].forEach(([x,y],k)=>h+=cov(P[k],x,y,120));\nh+=lab(874,386,'parked',0,A.length)+seg(874,406,175,'parked');\nA.forEach((g,k)=>h+=cov(g,874+k*61,418,80));\nh+=lab(1074,88,'fin',0,'2026')+seg(1074,108,128,'fin');\n[[1074,120],[1142,120],[1074,218]].forEach(([x,y],k)=>h+=cov(F[k],x,y,90));\nh+='<div class=\"yr\" style=\"left:1074px;top:316px\">2025<\/div>'+cov(F[3],1074,334,90);\nh+=glassBox(636,512,592,104,'info','<div id=\"info\"><\/div>');\nput(h);boot();\naddEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)||e.key=='Escape')parent.postMessage({pv:e.key},'*')});<\/script><\/body><\/html>"},{"t":"Cartelera","d":"Jugando como cartel de cine: portada héroe, abanico que se endereza al enfocar y fondo teñido por el juego enfocado. El resto vive en una tira inferior de escalones decrecientes.","html":"<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><style>/* ===== Sistema de diseño unificado (tokens) ===== */\n:root{\n  --round:'M PLUS Rounded 1c','Nunito','Segoe UI',system-ui,sans-serif;\n  /* arcoíris (RAINBOW) */\n  --red:#E8384F;--orange:#F27A1A;--yellow:#F2B807;--green:#3BB54A;--blue:#00A0D8;--indigo:#3F63E0;--violet:#9A4BD8;\n  --acc:var(--blue);--acc-ink:#fff;\n  /* radios */\n  --r-xs:6px;--r-sm:12px;--r-md:18px;--r-lg:28px;--r-pill:999px;\n  /* tipografía */\n  --t-micro:11px;--t-sec:13px;--t-body:15px;--t-hi:17px;--t-panel:20px;--t-screen:28px;--t-hero:44px;\n  /* espaciado (escala de 4) */\n  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;\n  /* superficies y texto */\n  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#9aa2b0;--line:rgba(95,110,135,.22);\n  --face:#dfe3e9;--face-hi:#f4f6f9;\n  --hintband:64px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0f1218;overflow:hidden;font-family:var(--round)}\n#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;color:var(--ink);\n  background:#eceef2;user-select:none;font-family:var(--round);font-weight:500}\n.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}\n.blob{position:absolute;border-radius:50%;filter:blur(34px)}\n.blob.w{background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%)}\n.blob.a{background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);opacity:.55}\n.ghost{position:absolute;width:118px;height:118px;border-radius:28px;padding:10px;background:rgba(255,255,255,.7);\n  box-shadow:0 0 0 1px rgba(120,130,150,.25),0 10px 18px -10px rgba(40,50,70,.4);filter:blur(5px);animation:float 18s ease-in-out infinite alternate}\n.ghost i{display:block;width:100%;height:100%;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,v \"bwarn\">${CLK}Se aparca en ${left(g)} d<\/span>`:`<span class=\"bwarn dot\">${CLK}${left(g)}<\/span>`;\n  if(g.fin&&w<70)s+=`<span class=\"bfin\">${CHK}<\/span>`;\n  return s}\n/* portada 2:3: h manda, w = h·2/3 */\nfunction cov(g,x,y,h,extra=''){const w=Math.round(h*2/3),st=state(g),fs=Math.max(10,Math.min(22,w*.105));\n  return `<div class=\"cv ${st} ${extra}\" data-f data-i=\"${g.i}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px;--sc:${ST[st].c};--cr:${Math.max(6,Math.round(w*.075))}px\">${art(g.c,g.sc)}${w>=58?`<b class=\"pt\" style=\"font-size:${fs}px\">${g.n}<\/b>`:''}<span class=\"bdg\">${badges(g,w)}<\/span><\/div>`}\nfunction infoHTML(g){const st=state(g),S=ST[st];let l1='',l2='';\n  if(st=='pend'){l1=`Nº ${g.po} en tu cola`;l2='Sin empezar'}\n  else if(st=='fin'){l1=`Terminado en ${g.fin}`;l2=`${g.h} h jugadas`}\n  else{l1=ago(g.d);l2=`${g.h} h jugadas`}\n  let extra='';\n  if(g.pin)extra=`<span class=\"ipin\">${PINI}Fijado · no se enfría<\/span>`;\n  else if(warn(g))extra=`<span class=\"iwarn\">${CLK}Se aparca en ${left(g)} días<\/span>`;\n  else if(g.ab)extra=`<span class=\"imute\">Aparcado a mano<\/span>`;\n  return `<div class=\"in-n\">${g.n}<\/div><div class=\"in-m\"><span class=\"tag\" style=\"--c:${S.c}\">${S.k}<\/span><span>${l1}<\/span><span class=\"dotsep\">·<\/span><span>${l2}<\/span><\/div><div class=\"in-x\">${extra}<\/div>`}\nfunction bindList(infoSel){\n  window.onFocus=el=>{const g=GAMES[+el.dataset.i];if(!g)return;const inf=$(infoSel);if(inf)inf.innerHTML=infoHTML(g);setAcc(ST[state(g)].c);window.onListFocus&&window.onListFocus(g,el)};\n  window.onKey=k=>{if((k=='x'||k=='X')&&FOC&&FOC.dataset.i!=null){const g=GAMES[+FOC.dataset.i];const st=state(g);if(st=='fin'||st=='pend')return;\n      g.pin=!g.pin;$$(`.cv[data-i=\"${g.i}\"] .bdg`).forEach(b=>b.innerHTML=badges(g,b.parentNode.offsetWidth));window.onFocus(FOC)}};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n}\nfunction topbar(cur='Mi lista',right=''){return `<div class=\"top\"><div class=\"glass avatar\"><div class=\"face\">P<\/div><\/div>\n <div class=\"crumb pill\"><span>${CAT}<\/span><span class=\"sep\">›<\/span><span class=\"cur\">${cur}<\/span><\/div>${right}\n <div class=\"clock pill\" style=\"padding:8px 16px\"><span>18:42<\/span><small>vie 30 oct<\/small><span class=\"batt\"><b><\/b><b><\/b><b><\/b><b class=\"off\"><\/b><\/span><\/div><\/div>`}\nconst LIST_HINTS=[['A','Jugar'],['X','Fijar'],['Y','Mover a…'],['B','Atrás']];\n\n\nconst PL={marcha:'Jugando',medias:'A medias',pend:'Pendientes',parked:'Aparcados',fin:'Terminados'};\nconst G=groups(),M=G.marcha,Me=G.medias,P=G.pend,A=G.parked,F=G.fin;\nconst lab=(x,y,st,txt,n)=>`<div class=\"lab\" style=\"left:${x}px;top:${y}px;--c:${ST[st].c}\"><i><\/i>${txt||PL[st]}${n!=null?` <small>${n}<\/small>`:''}<\/div>`;\nconst seg=(x,y,w,st)=>`<i class=\"seg\" style=\"left:${x}px;top:${y}px;width:${w}px;--c:${ST[st].c}\"><\/i>`;\nconst plab=(x,y,st,txt)=>`<div class=\"plab\" style=\"left:${x}px;top:${y}px;--c:${ST[st].c}\"><i><\/i>${txt||PL[st]}<\/div>`;\nconst glassBox=(x,y,w,h,cls,inner)=>`<div class=\"glass ${cls}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px\"><div class=\"face\">${inner}<\/div><\/div>`;\nconst cc=(g,cx,cy,h,ex)=>cov(g,Math.round(cx-h/3),Math.round(cy-h/2),h,ex);\nfunction put(h){$('.bg').insertAdjacentHTML('afterend',h)}\nfunction boot(){bindList('#info');hints(LIST_HINTS);bg(['#E8384F','#F27A1A','#00A0D8','#9A4BD8','#3BB54A']);focusEl($('.cv[data-i=\"0\"]'),true)}\nlet h='<div class=\"bd\" id=\"bd\"><\/div>'+topbar();\nh+=cov(M[0],48,96,360);\nh+='<div class=\"fan\">'+M.slice(1).map((g,k)=>cov(g,312+k*88,140,260).replace('style=\"','style=\"--rot:'+[-7,-2.5,2.5,7][k]+'deg;--z:'+(k+1)+';')).join('')+'<\/div>';\nh+=glassBox(788,120,420,280,'info big','<div id=\"info\"><\/div><div class=\"act\"><span class=\"bmain\">▶&nbsp;Jugar<\/span><\/div>');\nh+=lab(49,472,'medias',0,Me.length);Me.forEach((g,k)=>h+=cov(g,49+k*93,494,130));\nh+=lab(439,490,'pend',0,P.length);P.forEach((g,k)=>h+=cov(g,439+k*81,512,112));\nh+=lab(781,506,'parked',0,A.length);A.forEach((g,k)=>h+=cov(g,781+k*70,528,96));\nh+=lab(1009,526,'fin',0,'2026');F.slice(0,3).forEach((g,k)=>h+=cov(g,1009+k*57,548,76));\nh+='<div class=\"yr\" style=\"left:1188px;top:528px\">2025<\/div>'+cov(F[3],1188,548,76);\nput(h);window.onListFocus=g=>{$('#bd').innerHTML=art(g.c,g.sc)};boot();\naddEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)||e.key=='Escape')parent.postMessage({pv:e.key},'*')});<\/script><\/body><\/html>"},{"t":"Vitrina","d":"Tres baldas de cristal que se estrechan hacia abajo: Jugando arriba con la ficha apoyada en la balda, A medias + Pendientes en medio, Aparcados y Terminados por año abajo.","html":"<!doctype html><html lang=\"es\"><head><meta charset=\"utf-8\"><style>/* ===== Sistema de diseño unificado (tokens) ===== */\n:root{\n  --round:'M PLUS Rounded 1c','Nunito','Segoe UI',system-ui,sans-serif;\n  /* arcoíris (RAINBOW) */\n  --red:#E8384F;--orange:#F27A1A;--yellow:#F2B807;--green:#3BB54A;--blue:#00A0D8;--indigo:#3F63E0;--violet:#9A4BD8;\n  --acc:var(--blue);--acc-ink:#fff;\n  /* radios */\n  --r-xs:6px;--r-sm:12px;--r-md:18px;--r-lg:28px;--r-pill:999px;\n  /* tipografía */\n  --t-micro:11px;--t-sec:13px;--t-body:15px;--t-hi:17px;--t-panel:20px;--t-screen:28px;--t-hero:44px;\n  /* espaciado (escala de 4) */\n  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;\n  /* superficies y texto */\n  --ink:#3a414e;--ink-2:#5f6776;--ink-3:#9aa2b0;--line:rgba(95,110,135,.22);\n  --face:#dfe3e9;--face-hi:#f4f6f9;\n  --hintband:64px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0f1218;overflow:hidden;font-family:var(--round)}\n#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;color:var(--ink);\n  background:#eceef2;user-select:none;font-family:var(--round);font-weight:500}\n.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#f8f9fb 0%,#eceef2 55%,#e2e5ea 100%)}\n.blob{position:absolute;border-radius:50%;filter:blur(34px)}\n.blob.w{background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%)}\n.blob.a{background:radial-gradient(circle,color-mix(in srgb,var(--acc) 30%,transparent),transparent 70%);opacity:.55}\n.ghost{position:absolute;width:118px;height:118px;border-radius:28px;padding:10px;background:rgba(255,255,255,.7);\n  box-shadow:0 0 0 1px rgba(120,130,150,.25),0 10px 18px -10px rgba(40,50,70,.4);filter:blur(5px);animation:float 18s ease-in-out infinite alternate}\n.ghost i{display:block;width:100%;height:100%;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--g) 30%,white),var(--g))}\n@keyframes float{from{transform:translate(0,0) rotate(-4deg)}to{transform:translate(20px,-16px) rotate(3deg)}}\n\n/* ===== Glass nivel 1: panel (rim + arco de brillo + cara) ===== */\n.glass{position:absolute;--r:var(--r-lg);--bw:10px;border-radius:var(--r);padding:var(--bw);isolation:isolate;\n  background:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.30) 46%,rgba(225,234,246,.22) 100%);\n  backdrop-filter:blur(14px) saturate(1.7);\n  box-shadow:inset 0 1.5px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -10px 14px -8px rgba(255,255,255,.95),\n    inset 0 -1.5px 0 rgba(110,125,150,.30),0 0 0 1px rgba(95,110,135,.24),0 2px 3px rgba(40,50,70,.10),0 18px 30px -16px rgba(40,50,70,.42);\n  transition:transform .24s cubic-bezier(.34,1.32,.64,1),box-shadow .24s,background .24s}\n.glass::before{content:'';position:absolute;z-index:2;left:2px;right:2px;top:2px;height:52%;pointer-events:none;\n  border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 0 0;\n  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.20) 55%,rgba(255,255,255,0));\n  -webkit-mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);mask-image:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:.85}\n.glass::after{content:'';position:absolute;z-index:3;left:12%;top:3px;width:34%;height:5px;border-radius:5px;pointer-events:none;\n  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 40%,rgba(255,255,255,0));filter:blur(.6px);opacity:.9}\n.glass .face{position:relative;z-index:1;width:100%;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);overflow:hidden;background:var(--face)}\n.glass .face::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;\n  box-shadow:inset 0 0 0 1px rgba(20,30,50,.20),inset 0 3px 6px -2px rgba(0,0,0,.35),inset 0 -2px 4px -2px rgba(255,255,255,.5)}\n.glass.f{transform:scale(1.06);z-index:4;\n  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 30%,rgba(255,255,255,.85)),color-mix(in srgb,var(--acc) 72%,transparent) 55%,color-mix(in srgb,var(--acc) 92%,black));\n  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1px color-mix(in srgb,white 45%,transparent),inset 0 -10px 14px -8px color-mix(in srgb,var(--acc) 30%,white),\n    0 0 0 1px color-mix(in srgb,var(--acc) 75%,black),0 0 26px 2px color-mix(in srgb,var(--acc) 50%,transparent),0 22px 34px -16px color-mix(in srgb,var(--acc) 70%,black)}\n.glass.rel{position:relative}\n.glass.flat .face{background:rgba(255,255,255,.55)}\n.glass.flat .face::after{box-shadow:inset 0 0 0 1px rgba(20,30,50,.10),inset 0 2px 4px -2px rgba(0,0,0,.18)}\n\n/* ===== Glass nivel 2: panel dentro de panel ===== */\n.glass-in{position:relative;border-radius:var(--r-md);background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.34));\n  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(110,125,150,.16),0 0 0 1px rgba(95,110,135,.16);transition:box-shadow .18s,background .18s,transform .18s}\n.glass-in.f{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 10%,#fff),color-mix(in srgb,var(--acc) 18%,rgba(255,255,255,.7)));\n  box-shadow:inset 0 1px 0 #fff,0 0 0 2px var(--acc),0 0 18px -2px color-mix(i " height=\"300\" fill=\"url(#${u})\"/>`;\n  let s='';\n  if(scene==0)s=`<circle cx=\"140\" cy=\"88\" r=\"30\" fill=\"#fff\" opacity=\".75\"/><path d=\"M0 190 L50 120 L85 165 L125 95 L200 175 V300 H0z\" fill=\"${M}\" opacity=\".7\"/><path d=\"M0 220 L40 175 L90 215 L140 150 L200 205 V300 H0z\" fill=\"${D}\"/><path d=\"M0 255 L70 215 L120 245 L200 222 V300 H0z\" fill=\"${DD}\"/>`;\n  if(scene==1)s=`<circle cx=\"100\" cy=\"170\" r=\"52\" fill=\"#fff\" opacity=\".8\"/><rect y=\"170\" width=\"200\" height=\"130\" fill=\"${D}\"/>${[184,198,214,232,254].map((y,i)=>`<rect x=\"${30+i*8}\" y=\"${y}\" width=\"${140-i*16}\" height=\"${3+i}\" rx=\"2\" fill=\"#fff\" opacity=\"${.5-i*.07}\"/>`).join('')}`;\n  if(scene==2)s=`<circle cx=\"52\" cy=\"70\" r=\"18\" fill=\"#fff\" opacity=\".85\"/>${[[0,170,34],[30,130,28],[56,190,30],[84,110,26],[108,160,34],[140,135,24],[162,185,40]].map(([x,y,w])=>`<rect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"${300-y}\" fill=\"${DD}\"/>${[0,1,2,3].map(k=>`<rect x=\"${x+6}\" y=\"${y+12+k*22}\" width=\"5\" height=\"7\" fill=\"${L}\" opacity=\".8\"/>`).join('')}`).join('')}`;\n  if(scene==3)s=`<circle cx=\"150\" cy=\"70\" r=\"22\" fill=\"#fff\" opacity=\".7\"/>${[[0,M,.7,150],[1,D,1,200],[2,DD,1,245]].map(([r,f,o,b])=>[...Array(7)].map((_,k)=>{const x=k*34-10+r*14;return `<path d=\"M${x} ${b+40} L${x+22} ${b-40-((k*13+r*7)%30)} L${x+44} ${b+40}z\" fill=\"${f}\" opacity=\"${o}\"/>`}).join('')).join('')}<rect y=\"270\" width=\"200\" height=\"30\" fill=\"${DD}\"/>`;\n  if(scene==4)s=`${[...Array(26)].map((_,k)=>`<circle cx=\"${(k*73)%200}\" cy=\"${(k*41)%170}\" r=\"${k%3?1:1.8}\" fill=\"#fff\" opacity=\".8\"/>`).join('')}<circle cx=\"110\" cy=\"150\" r=\"58\" fill=\"${M}\"/><circle cx=\"96\" cy=\"136\" r=\"58\" fill=\"${L}\" opacity=\".35\"/><ellipse cx=\"110\" cy=\"152\" rx=\"96\" ry=\"16\" fill=\"none\" stroke=\"#fff\" stroke-width=\"5\" opacity=\".6\" transform=\"rotate(-14 110 152)\"/><path d=\"M0 260 Q100 225 200 260 V300 H0z\" fill=\"${DD}\"/>`;\n  return `<svg viewBox=\"0 0 200 300\" preserveAspectRatio=\"xMidYMid slice\">${sky}${s}<rect width=\"200\" height=\"300\" fill=\"url(#${u}v)\"/><\/svg>`;\n}\nconst CAT='Juegos PC';\nconst HOT=14,COLD=90,WARN=10;\nconst ST={marcha:{k:'Jugando',c:'#E8384F'},medias:{k:'A medias',c:'#F27A1A'},pend:{k:'Pendiente',c:'#00A0D8'},parked:{k:'Aparcado',c:'#9A4BD8'},fin:{k:'Terminado',c:'#3BB54A'}};\nconst GAMES=[\n ['Elden Ring','#F27A1A',0,0,142],['Balatro','#E8384F',1,1,61],['Hades II','#9A4BD8',2,5,38],['Hi-Fi Rush','#00A0D8',3,9,9],\n ['Cyberpunk 2077','#F2B807',2,40,73,{pin:1}],\n [\"Baldur's Gate 3\",'#3F63E0',0,33,88],['Hollow Knight','#00A0D8',4,58,24],['Sekiro','#E8384F',3,82,31],['Disco Elysium','#3BB54A',1,86,19],\n ['Silksong','#E8384F',3,null,0,{po:1}],['Outer Wilds','#F27A1A',4,null,0,{po:2}],['Pentiment','#9A4BD8',0,null,0,{po:3}],['Obra Dinn','#3BB54A',1,null,0,{po:4}],\n ['Starfield','#3F63E0',4,140,22],[\"Dragon's Dogma 2\",'#F27A1A',0,121,17],['Control','#E8384F',2,35,6,{ab:1}],\n ['Celeste','#9A4BD8',0,150,14,{fin:2026}],['Hades','#E8384F',3,190,61,{fin:2026}],['Inscryption','#3BB54A',2,240,12,{fin:2026}],['Ori','#00A0D8',3,400,11,{fin:2025}],\n].map(([n,c,sc,d,h,x={}],i)=>({i,n,c,sc,d,h,pin:!!x.pin,ab:!!x.ab,fin:x.fin||0,po:x.po||0}));\nfunction state(g){if(g.fin)return'fin';if(g.d==null)return'pend';if(g.pin)return'marcha';if(g.ab)return'parked';if(g.d<=HOT)return'marcha';if(g.d<=COLD)return'medias';return'parked'}\nconst left=g=>COLD-g.d, warn=g=>state(g)=='medias'&&!g.pin&&left(g)<=WARN;\nfunction groups(){const R={marcha:[],medias:[],pend:[],parked:[],fin:[]};GAMES.forEach(g=>R[state(g)].push(g));\n  R.marcha.sort((a,b)=>a.pin-b.pin||a.d-b.d);R.medias.sort((a,b)=>a.d-b.d);R.pend.sort((a,b)=>a.po-b.po);R.parked.sort((a,b)=>a.d-b.d);R.fin.sort((a,b)=>b.fin-a.fin||a.d-b.d);return R}\nfunction ago(d){if(d==null)return'Sin empezar';if(d==0)return'Hoy';if(d==1)return'Ayer';if(d<14)return`Hace ${d} días`;if(d<60)return`Hace ${Math.round(d/7)} semanas`;if(d<365)return`Hace ${Math.round(d/30)} meses`;return'Hace más de un año'}\nconst CLK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>';\nconst PINI='<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M15 2l7 7-3 1-4 4 1 5-2 2-4-5-5 5-1-1 5-5-5-4 2-2 5 1 4-4z\"/><\/svg>';\nconst CHK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>';\nfunction badges(g,w){let s='';\n  if(g.pin)s+=`<span class=\"bpin\">${PINI}<\/span>`;\n  if(warn(g))s+=w>=96?`<span class=\"bwarn\">${CLK}Se aparca en ${left(g)} d<\/span>`:`<span class=\"bwarn dot\">${CLK}${left(g)}<\/span>`;\n  if(g.fin&&w<70)s+=`<span class=\"bfin\">${CHK}<\/span>`;\n  return s}\n/* portada 2:3: h manda, w = h·2/3 */\nfunction cov(g,x,y,h,extra=''){const w=Math.round(h*2/3),st=state(g),fs=Math.max(10,Math.min(22,w*.105));\n  return `<div class=\"cv ${st} ${extra}\" data-f data-i=\"${g.i}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px;--sc:${ST[st].c};--cr:${Math.max(6,Math.round(w*.075))}px\">${art(g.c,g.sc)}${w>=58?`<b class=\"pt\" style=\"font-size:${fs}px\">${g.n}<\/b>`:''}<span class=\"bdg\">${badges(g,w)}<\/span><\/div>`}\nfunction infoHTML(g){const st=state(g),S=ST[st];let l1='',l2='';\n  if(st=='pend'){l1=`Nº ${g.po} en tu cola`;l2='Sin empezar'}\n  else if(st=='fin'){l1=`Terminado en ${g.fin}`;l2=`${g.h} h jugadas`}\n  else{l1=ago(g.d);l2=`${g.h} h jugadas`}\n  let extra='';\n  if(g.pin)extra=`<span class=\"ipin\">${PINI}Fijado · no se enfría<\/span>`;\n  else if(warn(g))extra=`<span class=\"iwarn\">${CLK}Se aparca en ${left(g)} días<\/span>`;\n  else if(g.ab)extra=`<span class=\"imute\">Aparcado a mano<\/span>`;\n  return `<div class=\"in-n\">${g.n}<\/div><div class=\"in-m\"><span class=\"tag\" style=\"--c:${S.c}\">${S.k}<\/span><span>${l1}<\/span><span class=\"dotsep\">·<\/span><span>${l2}<\/span><\/div><div class=\"in-x\">${extra}<\/div>`}\nfunction bindList(infoSel){\n  window.onFocus=el=>{const g=GAMES[+el.dataset.i];if(!g)return;const inf=$(infoSel);if(inf)inf.innerHTML=infoHTML(g);setAcc(ST[state(g)].c);window.onListFocus&&window.onListFocus(g,el)};\n  window.onKey=k=>{if((k=='x'||k=='X')&&FOC&&FOC.dataset.i!=null){const g=GAMES[+FOC.dataset.i];const st=state(g);if(st=='fin'||st=='pend')return;\n      g.pin=!g.pin;$$(`.cv[data-i=\"${g.i}\"] .bdg`).forEach(b=>b.innerHTML=badges(g,b.parentNode.offsetWidth));window.onFocus(FOC)}};\n  document.addEventListener('click',e=>{const t=e.target.closest('[data-f]');if(t)focusEl(t)});\n}\nfunction topbar(cur='Mi lista',right=''){return `<div class=\"top\"><div class=\"glass avatar\"><div class=\"face\">P<\/div><\/div>\n <div class=\"crumb pill\"><span>${CAT}<\/span><span class=\"sep\">›<\/span><span class=\"cur\">${cur}<\/span><\/div>${right}\n <div class=\"clock pill\" style=\"padding:8px 16px\"><span>18:42<\/span><small>vie 30 oct<\/small><span class=\"batt\"><b><\/b><b><\/b><b><\/b><b class=\"off\"><\/b><\/span><\/div><\/div>`}\nconst LIST_HINTS=[['A','Jugar'],['X','Fijar'],['Y','Mover a…'],['B','Atrás']];\n\n\nconst PL={marcha:'Jugando',medias:'A medias',pend:'Pendientes',parked:'Aparcados',fin:'Terminados'};\nconst G=groups(),M=G.marcha,Me=G.medias,P=G.pend,A=G.parked,F=G.fin;\nconst lab=(x,y,st,txt,n)=>`<div class=\"lab\" style=\"left:${x}px;top:${y}px;--c:${ST[st].c}\"><i><\/i>${txt||PL[st]}${n!=null?` <small>${n}<\/small>`:''}<\/div>`;\nconst seg=(x,y,w,st)=>`<i class=\"seg\" style=\"left:${x}px;top:${y}px;width:${w}px;--c:${ST[st].c}\"><\/i>`;\nconst plab=(x,y,st,txt)=>`<div class=\"plab\" style=\"left:${x}px;top:${y}px;--c:${ST[st].c}\"><i><\/i>${txt||PL[st]}<\/div>`;\nconst glassBox=(x,y,w,h,cls,inner)=>`<div class=\"glass ${cls}\" style=\"left:${x}px;top:${y}px;width:${w}px;height:${h}px\"><div class=\"face\">${inner}<\/div><\/div>`;
