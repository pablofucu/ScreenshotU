<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema v4 · dos tonos</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#c9ced6}
body.dkb{background:#07080b}
body{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

/* ── tokens de superficie: claro (A1) y Noche ahumada (oscuro oficial) ── */
.lt{--ink:#3a414e;--ink-2:#5f6776;--ink-3:#9aa2b0;--line:rgba(95,110,135,.22);--face:#dfe3e9;--face-hi:#f4f6f9;--bgc:#eceef2;--rail:#d3d8e0;
  --bgamb:radial-gradient(120% 90% at 50% 0%,#f8f9fb,#eceef2 55%,#e2e5ea);
  --glass-bg:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.30) 46%,rgba(225,234,246,.22) 100%);
  --glass-sh:inset 0 1.5px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -10px 14px -8px rgba(255,255,255,.95),inset 0 -1.5px 0 rgba(110,125,150,.30),0 0 0 1px rgba(95,110,135,.24),0 2px 3px rgba(40,50,70,.10),0 18px 30px -16px rgba(40,50,70,.42);
  --tint-a:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.16) 50%,rgba(255,255,255,.06));
  --gloss:.85;--hl:1;--face-sh:inset 0 0 0 1px rgba(20,30,50,.20),inset 0 3px 6px -2px rgba(0,0,0,.35);
  --pf:linear-gradient(180deg,#f7f8fa,#edf0f4);--pfa:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.40));
  --pill-bg:linear-gradient(180deg,#fff,#e8ecf1);--pill-sh:0 0 0 1px rgba(95,110,135,.22),inset 0 1px 0 #fff,0 2px 4px -2px rgba(40,50,70,.3);
  --chip-bg:rgba(255,255,255,.5);--chip-sh:0 0 0 1px rgba(95,110,135,.22),inset 0 1px 0 #fff;--ink-chip:#1f2530;
  --hint:linear-gradient(180deg,rgba(236,238,242,0),rgba(236,238,242,.92) 45%);--amb-op:.55;
  --card:rgba(255,255,255,.66);--card-sh:0 0 0 1px rgba(95,110,135,.22),inset 0 1px 0 #fff,0 10px 22px -16px rgba(40,50,70,.45);
  --ck:#7a3fb0;--cs:#1f7a4a;--cc:#9aa2b0}
.dk{--ink:#e8ecf3;--ink-2:#aab3c2;--ink-3:#737d90;--line:rgba(255,255,255,.14);--face:#1c212c;--face-hi:#212734;--bgc:#12151d;--rail:#2a3140;
  --bgamb:radial-gradient(120% 90% at 50% 0%,#1e2433,#12151d 60%,#0b0d12);
  --glass-bg:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 46%,rgba(255,255,255,.03));
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 1px rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.55),0 18px 34px -14px rgba(0,0,0,.85);
  --tint-a:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 50%,rgba(255,255,255,.02));
  --gloss:.32;--hl:.55;--face-sh:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 3px 8px -2px rgba(0,0,0,.65);
  --pf:linear-gradient(180deg,#1f2430,#191d27);--pfa:linear-gradient(180deg,rgba(22,25,34,.55),rgba(22,25,34,.72));
  --pill-bg:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.05));--pill-sh:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 1px rgba(255,255,255,.10),0 10px 20px -12px rgba(0,0,0,.8);
  --chip-bg:rgba(255,255,255,.06);--chip-sh:0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.10);--ink-chip:#10131a;
  --hint:linear-gradient(180deg,rgba(18,21,29,0),rgba(18,21,29,.92) 45%);--amb-op:.36;
  --card:rgba(255,255,255,.05);--card-sh:0 0 0 1px rgba(255,255,255,.10),inset 0 1px 0 rgba(255,255,255,.08),0 12px 24px -16px rgba(0,0,0,.8);
  --ck:#c9a2ff;--cs:#8fe3b0;--cc:#737d90}

#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:var(--bgc);color:var(--ink)}
.view{position:absolute;inset:0;display:none}.view.on{display:block}
.a{position:absolute}
.bg{position:absolute;inset:0;overflow:hidden;background:var(--bgamb)}
.vh{position:absolute;left:40px;top:18px;right:40px;z-index:6}
.vh .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.vh h1{font-size:26px;font-weight:800;line-height:1.25;margin-top:2px;letter-spacing:-.01em}
.vh p{font-size:14px;line-height:1.4;color:var(--ink-2);margin-top:2px}
.card{position:absolute;border-radius:18px;background:var(--card);box-shadow:var(--card-sh);padding:14px 16px}
.ct{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin-bottom:8px}
#nav{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px;z-index:20}
#nav button{font:inherit;font-size:10.5px;font-weight:800;height:20px;min-width:20px;padding:0 7px;border:0;border-radius:999px;cursor:pointer;color:var(--ink-2);background:var(--card);box-shadow:0 0 0 1px var(--line)}
#nav button.on{background:var(--ink);color:var(--bgc)}
#nav button.modo{background:var(--ink-chip);color:#fff;box-shadow:0 0 0 1px var(--line)}
.dk #nav button.modo{background:#f4f6f9;color:#12151d}
.pb{font:inherit;font-size:12px;font-weight:800;height:28px;padding:0 12px;border:0;border-radius:999px;cursor:pointer;color:var(--ink-2);background:var(--chip-bg);box-shadow:var(--chip-sh)}
.pb.on{background:var(--ink);color:var(--bgc)}

/* ── cristal Wii U (A1): rim + arco de brillo + cara ── */
.glass{position:absolute;--r:28px;--bw:10px;border-radius:var(--r);padding:var(--bw);isolation:isolate;background:var(--glass-bg);
  backdrop-filter:blur(14px) saturate(1.7);box-shadow:var(--glass-sh);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.glass::before{content:"";position:absolute;left:0;right:0;top:0;height:52%;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.12));-webkit-mask:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);mask:radial-gradient(140% 100% at 50% 0%,#000 64%,transparent 65%);opacity:var(--gloss);pointer-events:none;z-index:-1}
.glass::after{content:"";position:absolute;left:12%;top:3px;width:34%;height:5px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));opacity:var(--hl);pointer-events:none;z-index:3}
.glass>.face{position:relative;height:100%;border-radius:calc(var(--r) - var(--bw) + 2px);overflow:hidden;background:var(--face)}
.glass>.face::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:var(--face-sh);pointer-events:none}
.pf{background:var(--pf)!important}
.tile{--r:22px;--bw:8px;width:168px;height:226px}
.th{--r:14px;--bw:5px;width:150px;height:84px}
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.tt{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(180deg,transparent,rgba(10,14,22,.66));text-shadow:0 1px 2px rgba(0,0,0,.45)}

/* ── foco v4: anillo de dos tonos + halo bicolor ── */
.fo{transform:scale(1.06);z-index:4}
.ring{position:absolute;inset:calc(-1 * var(--ri,7px));border-radius:calc(var(--r,18px) + var(--ri,7px));padding:var(--rp,4px);
  background:linear-gradient(115deg,var(--f1),var(--g1) 30%,var(--g2) 60%,var(--f2) 80%,var(--f1)) 0 0/300% 100%;animation:sheen 3.2s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;z-index:6}
.halo{position:absolute;inset:0;border-radius:var(--r,18px);box-shadow:var(--halo);z-index:-2;pointer-events:none}
.var3 .halo{box-shadow:var(--halo),var(--halo)}
@keyframes sheen{to{background-position:300% 0}}
.rim{display:none;position:absolute;inset:0;border-radius:var(--r);padding:2px;background:var(--gf);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;z-index:4;pointer-events:none;opacity:.9}
.var2 .rim{display:block}
.var1 .glass.big{background:var(--tint-a),var(--gp)}
.var1 .pf{background:var(--pfa),var(--gp)!important}

/* ── controles ── */
.topbar{position:absolute;left:64px;right:64px;top:28px;height:40px;display:flex;align-items:center;gap:8px}
.topbar .sp{flex:1}
.clock{font-size:15px;font-weight:800;color:var(--ink-2)}
.row{display:flex;gap:8px;align-items:center}
.chip{height:32px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--chip-bg);box-shadow:var(--chip-sh);white-space:nowrap}
.chip.on{color:var(--ink);font-weight:800;background:var(--face-hi);box-shadow:0 0 0 1.5px var(--ink-3)}
.var1 .chip.on{background:var(--gp);color:var(--tx);box-shadow:0 0 0 1px color-mix(in srgb,var(--g1) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.var2 .chip.on{background:var(--grad);color:var(--ink-chip);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 1px rgba(0,0,0,.06)}
.pill{height:36px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink);background:var(--pill-bg);box-shadow:var(--pill-sh);white-space:nowrap}
.bmain{position:relative;overflow:hidden;height:48px;padding:0 30px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--on);background:var(--gf);box-shadow:inset 0 -3px 6px rgba(0,0,0,.14),0 0 0 1px rgba(20,30,50,.12),var(--glow);white-space:nowrap}
.bmain::before{content:"";position:absolute;left:8px;right:8px;top:2px;height:48%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.06))}
.bmain span{position:relative}
.var2 .bmain{background:var(--f1)}
.prog{height:10px;border-radius:999px;background:var(--rail);box-shadow:inset 0 1px 2px rgba(20,30,50,.18);overflow:hidden}
.prog i{display:block;height:100%;border-radius:inherit;background:var(--f1)}
.var2 .prog i,.var3 .prog i{background:var(--gf);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.hline{display:none;height:3px;width:240px;border-radius:999px;background:var(--gf);margin-top:8px}
.var2 .hline{display:block}
.amb{display:none;position:absolute;inset:0;overflow:hidden}
.var3 .amb{display:block}
.amb i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--amb-op)}
.amb .b1{left:-12%;top:-34%;width:62%;height:96%;background:var(--g1)}
.amb .b2{right:-14%;bottom:-40%;width:64%;height:100%;background:var(--g2)}
.hints{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--hint);display:flex;align-items:flex-end;justify-content:flex-end;gap:22px;padding:0 64px 20px;font-size:13px;font-weight:700;color:var(--ink-2);z-index:8}
.hints b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bgc);font-size:11px;margin-right:6px}
.tit{font-size:44px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.tit2{font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.meta{font-size:15px;color:var(--ink-2);margin-top:6px;font-weight:500}
.pan{padding:18px 24px}
.pan2{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.pl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.pl b{font-size:13px;color:var(--ink)}
.stats{display:flex;gap:48px;margin-top:10px}
.stat{font-size:12px;color:var(--ink-2);font-weight:700}
.stat b{display:block;font-size:20px;color:var(--ink);font-weight:800;margin-top:1px}

/* ── pantallas escaladas ── */
.sw{position:absolute;width:602px;height:338px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 14px 28px -16px rgba(20,30,50,.55)}
.scr{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(.4703);overflow:hidden;background:var(--bgc);color:var(--ink)}
.lbl{position:absolute;left:10px;top:8px;z-index:9;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(10,14,22,.6);color:#fff}

/* ── v3 «antes»: un tono + iris ── */
.v3a .ring,.v3a .halo,.v3a .rim,.v3a .hline{display:none}
.v3a .fo{background:linear-gradient(110deg,var(--iris)) 0 0/300% 100%;animation:sheen 3.2s linear infinite;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.7),0 0 0 1.5px var(--deep),0 14px 22px -12px rgba(40,50,70,.4)}
.v3a .chip.on{background:var(--soft);color:var(--deep);box-shadow:0 0 0 1.5px var(--line-acc)}
.v3a .bmain{background:var(--fill);color:var(--ink-on);box-shadow:inset 0 -3px 6px rgba(0,0,0,.14),0 0 0 1px rgba(20,30,50,.12)}
.v3a .prog i{background:var(--bar)}

/* ── mini pantalla (rejilla de 12) ── */
.mini{position:absolute;left:0;top:0;width:280px;height:300px;transform:scale(.5);transform-origin:0 0;overflow:hidden;background:var(--bgc);color:var(--ink)}
.mini .glass{--r:16px;--bw:6px}
.mini .ring{--ri:5px;--rp:3px}
.mini .amb i{filter:blur(28px)}
.mini .chip{height:28px;font-size:12px;padding:0 13px}
.mini .bmain{height:36px;font-size:14px;padding:0 22px}
.mini .prog{height:8px}
.mini .tt{font-size:11px;padding:16px 8px 6px}
.mt{font-size:18px;font-weight:800;line-height:1.2}
.cel{position:absolute;width:296px;height:186px}
.cn{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:center;height:16px}
.org{font-size:10px;font-weight:700;color:var(--ink-3)}
.cl{display:flex;font-size:10px;font-weight:700;color:var(--ink-3);height:14px;margin-top:2px;text-transform:uppercase;letter-spacing:.08em}
.cl span{width:148px}
.mw{position:absolute;top:34px;width:140px;height:150px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 8px 16px -10px rgba(20,30,50,.5)}

/* ── piezas de las guías ── */
.gsels{display:flex;gap:4px}
.gsel{font:inherit;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-2);padding:5px 4px;border-radius:12px;width:108px;text-align:center;line-height:1.15}
.gsel .mc{position:relative;width:40px;height:56px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.gsel.on{background:var(--face-hi);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink-3)}
.strips{display:flex;gap:8px;margin-top:8px}
.strip{flex:1;height:26px;border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);white-space:nowrap}
.tono{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-top:8px}
.tono b{color:var(--ink)}
.wl{display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.3;color:var(--ink);font-weight:500;min-height:27px}
.wl .sm{flex:none;position:relative;width:38px;height:20px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wl b{font-weight:800}
.nota{font-size:12px;color:var(--ink-3);font-weight:700;margin-top:8px}
.swt{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--ink-3);width:44px}
.swt i{display:block;width:34px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pr{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-2);font-weight:700;height:26px}
.pr i{flex:none;width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pr b{width:58px;color:var(--ink);font-family:ui-monospace,Consolas,monospace;font-size:11px}
.pr span:nth-of-type(1){width:30px}
.pr span:nth-of-type(2){width:150px;font-weight:500}
.pr em{font-style:normal;font-size:10.5px;color:var(--ink-3)}
.pr em.ok{color:var(--ink);font-weight:800}
.rg{display:flex;gap:10px;margin-bottom:10px;font-size:12.5px;line-height:1.38;color:var(--ink-2)}
.rg .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--ink-2)}
.rg b{color:var(--ink)}
.dl{display:flex;align-items:center;gap:12px;height:40px;font-size:13px;color:var(--ink-2)}
.dl .dm{flex:none;width:96px;display:flex;align-items:center;justify-content:center}
.dl b{color:var(--ink);font-weight:800}
.dtile{position:relative;display:block;width:40px;height:28px;border-radius:7px;background:var(--face);--r:7px;--ri:4px;--rp:2.5px}
.xs.bmain{height:26px;font-size:12px;padding:0 14px}
.xs.chip{height:24px;font-size:11px;padding:0 10px}
.xs.prog{display:block;width:80px;height:8px}
.no{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink-2);line-height:1.35;margin-bottom:9px}
.no::before{content:"✕";font-weight:800;color:var(--ink-3);flex:none}
.it{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:11.5px;color:var(--ink-2);font-weight:700}
.it .strip{flex:none;width:150px}
.rule{position:absolute;width:600px;height:88px;border-radius:18px;background:var(--card);box-shadow:var(--card-sh);padding:12px 18px 0 70px;font-size:13px;line-height:1.4;color:var(--ink-2)}
.rule .n{position:absolute;left:16px;top:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px -4px rgba(20,30,50,.5)}
.rule b{display:block;color:var(--ink);font-size:14.5px;font-weight:800;margin-bottom:2px}
.code{font:10px/1.4 ui-monospace,Consolas,'Cascadia Mono',monospace;white-space:pre-wrap;color:var(--ink);word-break:break-word}
.code .k{color:var(--ck);font-weight:700}.code .s{color:var(--cs)}.code .c{color:var(--cc);font-style:italic}
.tb{width:100%;border-collapse:collapse;font-size:11px}
.tb td,.tb th{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tb td:first-child{font-family:ui-monospace,Consolas,monospace;color:var(--ink);font-weight:700}
.tb td i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.lrow{position:relative;height:34px;border-radius:12px;--r:12px;display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;background:var(--face-hi);box-shadow:0 0 0 1px var(--line)}
.arco .ring{background:linear-gradient(115deg,#E8384F,#F27A1A,#F2B807,#3BB54A,#00A0D8,#3F63E0,#9A4BD8,#E8384F) 0 0/300% 100%}
</style>
</head>
<body>
<div id="stage" class="lt"><nav id="nav"></nav></div>

<textarea id="svelte" hidden><!-- Ficha.svelte · tonos del juego como variables CSS -->
<script>
  import { tonosDelJuego, variablesCSS } from '$lib/tono';
  let { juego, modo } = $props();            // modo: 'claro' | 'oscuro' (Noche ahumada)
  const t = $derived(tonosDelJuego(juego));  // una vez por portada; se cachea en visor.db
  const estilo = $derived(Object.entries(variablesCSS(t.h1, t.h2, modo))

function vDosTonos(){
 const g=G[S.dt],t=tonos(g),v=variablesCSS(t.h1,t.h2,MODO),px=pixeles(g.p),usable=px.reduce((s,q)=>s+q.a,0)>=.03;
 const a=px.length&&usable?vecindario(px,null):null,b=a?vecindario(px,a.h):null,tot=g.p.reduce((s,[,x])=>s+x,0);
 const cx=190,cy=190,R=140,P=(r,h)=>[(cx+r*Math.cos(h*RAD)).toFixed(1),(cy-r*Math.sin(h*RAD)).toFixed(1)];
 let s='';for(let i=0;i<72;i++)s+=`<path d="${seg(cx,cy,R,R-18,i*5,i*5+5.4)}" fill="${oklch(.78,.12,i*5+2.5)}"/>`;
 if(!a){ARCOIRIS.forEach(([n,c])=>{const [x,y]=P(R-9,hueOf(c));s+=`<circle cx="${x}" cy="${y}" r="7" fill="${c}" stroke="#fff" stroke-width="2"/>`})}

  s+=`<path d="${seg(cx,cy,R-24,R-30,t.h1-MIN_SEP,t.h1+MIN_SEP)}" style="fill:var(--ink-3)" opacity=".55"/>`;

  g.p.forEach(([hex,ar])=>{if(estadoPx(hex)!=='vota')return;const q=rgbToLch(hexToRgb(hex)),[x,y]=P(R-60,q.h);s+=`<circle cx="${x}" cy="${y}" r="${(4+Math.sqrt(ar/tot*q.C)*34).toFixed(1)}" fill="${hex}" stroke="#fff" stroke-width="2"/>`});
  if(t.origen.startsWith('vecino')){const r=88,[x1,y1]=P(r,t.h1),[x2,y2]=P(r,t.h2),[tx,ty]=P(r+14,t.h1+17.5);s+=`<path d="M${x1} ${y1}A${r} ${r} 0 0 0 ${x2} ${y2}" fill="none" style="stroke:var(--ink)" stroke-width="1.6" stroke-dasharray="4 3"/><text x="${tx}" y="${ty}" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink)">+35°</text>`}
 }
 [[t.h1,'h1',0],[t.h2,'h2',1]].forEach(([h,l,k])=>{const [x1,y1]=P(30,h),[x2,y2]=P(R+18,h),[lx,ly]=P(R+32,h);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--ink)" stroke-width="${k?1.6:2.4}" ${k&&t.origen!=='portada'?'stroke-dasharray="5 3"':''}/><text x="${lx}" y="${ly}" font-size="14" font-weight="800" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink)">${l}</text>`});
 s+=`<circle cx="${cx}" cy="${cy}" r="28" style="fill:var(--face-hi)"/><text x="${cx}" y="${cy+1}" font-size="10.5" font-weight="800" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink-2)">${t.origen}</text>`;
 const filas=g.p.map(([hex,ar])=>{const q=rgbToLch(hexToRgb(hex)),e=usable?estadoPx(hex):'sin color';return `<div class="pr"><i style="background:${hex}"></i><b>${hex}</b><span>${Math.round(ar/tot*100)} %</span><span>L ${q.L.toFixed(2)} · C ${q.C.toFixed(3)} · ${fmt(q.h)}</span><em class="${e==='vota'?'ok':''}">${e}</em></div>`}).join('');
 const rg=[['h1 = el tono de v3, sin cambios.','Ventana de ±30° con más peso (área × croma) y media circular. Píxeles con L<.20, L>.93 o C<.045 no votan.'],

  <div class="ct" style="margin-top:10px">Ángulo</div><div class="it"><svg width="150" height="26"><defs><linearGradient id="ang" gradientTransform="rotate(25)"><stop offset="0" stop-color="${vl['--g1']}"/><stop offset="1" stop-color="${vl['--g2']}"/></linearGradient></defs><rect width="150" height="26" rx="8" fill="url(#ang)"/><path d="M20 20L130 6" stroke="#1f2530" stroke-width="1.5"/><path d="M130 6l-7 -1 2 6z" fill="#1f2530"/></svg><span>115° siempre: g1 arriba-izquierda, g2 abajo-derecha</span></div></div>
 <div class="card" style="left:32px;top:470px;width:600px;height:218px;${est(v)}"><div class="ct">Máximo por pantalla</div>
  <div class="wl"><b style="font-size:26px;width:38px;text-align:center">3</b><span>familias con degradado <b>+ el foco</b>. Familias: superficie (cristal/fondo), hilo (filo, cabecera, barras), control (chip activo, botón).</span></div>

  <div class="wl" style="margin-top:6px"><span style="width:38px;text-align:center;font-weight:800">✓</span><span>V1 ficha: cristal + chip + botón = 3 · foco aparte.</span></div>
  <div class="wl"><span style="width:38px;text-align:center;font-weight:800">✕</span><span>Cristal teñido + filo + chips medio + barras + fondo ambiente = 5 → sobra la mitad.</span></div></div>
 <div class="card arco" style="left:646px;top:470px;width:602px;height:218px;--f1:#00A0D8;--g1:#F2B807;--g2:#9A4BD8;--f2:#3F63E0"><div class="ct">Pantalla sin juego · arcoíris global</div>
  <div style="display:flex;gap:18px"><div style="width:250px;padding-top:4px"><div class="lrow">Biblioteca</div><div class="lrow">Mando</div><div class="lrow" style="transform:scale(1.03)">Apariencia<i class="ring" style="--ri:5px;--rp:3px"></i></div><div class="lrow">Acerca de</div></div>
  <div style="flex:1;font-size:13px;line-height:1.45;color:var(--ink-2)"><div style="height:14px;border-radius:9px;margin:4px 0 10px;background:linear-gradient(90deg,${ARCOIRIS.map(x=>x[1]).join(',')})"></div><b style="color:var(--ink)">Inicio, Ajustes, Estadísticas globales y vacíos</b> usan el arcoíris de 7 tonos en el foco. En cuanto la pantalla pertenece a un juego, manda su pareja h1/h2. Si la portada no tiene color, la pareja sale del arcoíris (k, k+1).</div></div></div>`}

function vGrid(){
 return hdr('Comprobación · 12 portadas','12 portadas, antes y después','Misma mini pantalla por juego: v3 (un tono + iris) frente a v4 (dos tonos). Cabecera, cristal, chip, barra, botón y foco.')+
 `<div class="row" style="position:absolute;right:40px;top:30px;z-index:7">${[1,2,3].map(i=>`<button class="pb${S.gv===i?' on':''}" onclick="selGV(${i})">V${i} ${['Cristal teñido','Hilo nácar','Atmósfera'][i-1]}</button>`).join('')}</div>`+
 G.map((g,i)=>{const t=tonos(g);return `<div class="cel" style="left:${32+(i%4)*306}px;top:${100+Math.floor(i/4)*196}px"><div class="cn">${g.n}<span class="org">${g.d} · ${t.origen}</span></div><div class="cl"><span>Antes · v3</span><span>Después · V${S.gv}</span></div><div class="mw" style="left:0">${mini(g,'antes')}</div><div class="mw" style="left:148px">${mini(g,S.gv)}</div></div>`}).join('')}
window.selGV=i=>{S.gv=i;pinta(5)};

const TOK=[['--bgc','#eceef2','#12151d'],['--face','#dfe3e9','#1c212c'],['--face-hi','#f4f6f9','#212734'],['--rail','#d3d8e0','#2a3140'],['--ink','#3a414e','#e8ecf3'],['--ink-2','#5f6776','#aab3c2'],
 ['--line','rgba(95,110,135,.22)','rgba(255,255,255,.14)'],['--glass-bg','blancos .72→.22','blancos .17→.03'],['--gloss · --hl','.85 · 1','.32 · .55'],['--glass-sh','rim blanco','rim + sombra .85'],['--p (juego)','nácar L .935','humo L .30'],['--g (juego)','medio L .80 C .12','neón L .76 C .16']];
function vNoche(){
 const g=G[SEL5[S.na]],t=tonos(g),vl=variablesCSS(t.h1,t.h2,'claro'),vd=variablesCSS(t.h1,t.h2,'oscuro');
 const cmp=(v,l)=>`<div class="it" style="margin:6px 0 0"><span style="width:92px">${l}</span>${['--g1','--g2','--p1','--p2','--f1','--f2'].map(k=>`<i style="display:block;width:22px;height:22px;border-radius:6px;background:${v[k]};box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)"></i>`).join('')}<i style="display:block;flex:1;height:22px;border-radius:6px;background:${v['--grad']}"></i></div>`;
 const sw=c=>c.startsWith('#')||c.startsWith('rgba')?`<i style="background:${c}"></i>`:'';
 const half=a=>`<table class="tb"><tr><th>token</th><th>claro (A1)</th><th>Noche ahumada</th></tr>${a.map(([k,l,d])=>`<tr><td>${k}</td><td>${sw(l)}${l}</td><td>${sw(d)}${d}</td></tr>`).join('')}</table>`;
 return hdr('Modo oscuro oficial','Noche ahumada','Mismos h1/h2 y mismo foco en los dos modos; solo cambian los tokens de superficie y la intensidad (nácar → humo, medio → neón).')+
 `<div class="sw" style="left:32px;top:102px"><span class="lbl">Claro · A1</span>${scrDetalle(g,S.nv,'claro')}</div>
 <div class="sw" style="left:646px;top:102px"><span class="lbl">Noche ahumada</span>${scrDetalle(g,S.nv,'oscuro')}</div>
 <div class="card" style="left:32px;top:456px;width:520px;height:232px"><div class="ct">Mismo juego, dos modos</div>${selector('selNA',SEL5,S.na)}
  <div class="row" style="margin-top:6px">${[1,2,3].map(i=>`<button class="pb${S.nv===i?' on':''}" onclick="selNV(${i})">V${i}</button>`).join('')}<span class="tono" style="margin:0 0 0 8px">h1 <b>${fmt(t.h1)}</b> · h2 <b>${fmt(t.h2)}</b> en ambos</span></div>
  ${cmp(vl,'Claro')}${cmp(vd,'Noche ahumada')}</div>
 <div class="card" style="left:566px;top:456px;width:682px;height:232px"><div class="ct">Tokens que cambian en oscuro (el resto, igual)</div><div style="display:flex;gap:14px">${half(TOK.slice(0,6))}${half(TOK.slice(6))}</div>
  <div class="nota">El foco, el ángulo de 115°, el relleno del botón y las reglas de dosis no cambian. En oscuro el halo y el botón brillan (neón) en vez de proyectar sombra.</div></div>`}
window.selNA=j=>{S.na=j;pinta(6)};window.selNV=i=>{S.nv=i;pinta(6)};

const REGLAS=[
 ['Dos tonos por juego, nunca más.','h1 es el tono de v3; h2 es el segundo color de la portada o el vecino a +35°. Separación entre 35° y 90°.'],
 ['Un solo degradado: g1 → g2 a 115°.','Sin paradas extra ni arcoíris dentro del juego. Solo el foco añade el brillo animado.'],
 ['Tres intensidades fijas.','Nácar (superficies), medio (hilos, chips, foco) y relleno (botón, barras, contraste ≥ 4.5). No se inventan otras.'],
 ['El foco es sagrado.','Anillo g1→g2 animado + halo bicolor + escala 1.06, igual en las tres variantes y en los dos modos.'],
 ['Máximo 3 familias con degradado + el foco.','Superficie, hilo y control. Un solo botón principal; lo secundario es pill neutra.'],
 ['Nunca en texto, cifras, iconos ni hints.','Ni en filas de lista, chips inactivos o portadas. El texto siempre en --ink o --tx.'],
 ['El cristal Wii U no se toca.','Rim, arco de brillo y cara intactos: el tinte va por debajo de los blancos del cristal.'],
 ['Arcoíris global solo sin juego.','Inicio, Ajustes, vacíos y portadas sin color (pareja k, k+1). Con juego, manda su pareja.'],
 ['Noche ahumada es el modo oscuro oficial.','Cambian solo los tokens de superficie; el juego se recalcula con los mismos h1/h2 (humo .30, neón .76).'],
 ['Las categorías no se tocan.','El color es del juego, nunca de la categoría. Nada mezcla títulos de categorías distintas.']];
function vConst(){
 return hdr('Resumen','Constitución del color v4','Diez reglas. Si una pantalla las cumple, es del sistema; si no, se quita color antes de añadirlo.')+
 REGLAS.map(([b,x],i)=>`<div class="rule" style="left:${32+(i%2)*616}px;top:${100+Math.floor(i/2)*96}px"><span class="n" style="background:linear-gradient(115deg,${ARCOIRIS[i%7][1]},${ARCOIRIS[(i+1)%7][1]})">${i+1}</span><b>${b}</b>${x}</div>`).join('')+
 `<div class="card" style="left:32px;top:584px;width:1216px;height:104px;padding:10px 16px"><pre class="code" style="font-size:10.5px">${hl(document.getElementById('cssosc').value)}</pre></div>`}

function hl(src){const re=/(\/\/[^\n]*|<!--[^]*?-->|\/\*[^]*?\*\/)|('(?:[^'\\\n]|\\.)*'|`[^`]*`)|\b(function|const|let|return|if|for|of|null|while|continue|import|from)\b/g;
 const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');let out='',i=0,m;
 while((m=re.exec(src))){out+=e(src.slice(i,m.index));out+=m[1]?`<span class="c">${e(m[1])}</span>`:m[2]?`<span class="s">${e(m[2])}</span>`:`<span class="k">${m[3]}</span>`;i=re.lastIndex}
 return out+e(src.slice(i))}
function vCodigo(){
 const izq='// constantes de v4 (v3 no cambia: tokensDeTono, oklch, contraste…)\nconst VECINO=35, MIN_SEP=35, MAX_SEP=90, CLAMP=60, PESO2=.15;\n\n'+[pixeles,vecindario,extraerDosTonos].map(f=>f.toString()).join('\n\n');
 const der=[tonosDelJuego,variablesCSS].map(f=>f.toString()).join('\n\n')+'\n\n'+document.getElementById('svelte').value;
 return hdr('Resumen · código','Código para Svelte','Las funciones reales de esta página (toString): portada → h1/h2 → --g1, --g2, --grad, --gp, --gf y compañía, en claro u oscuro.')+
 `<div class="card" style="left:32px;top:96px;width:600px;height:592px;padding:12px 14px"><pre class="code">${hl(izq)}</pre></div>
 <div class="card" style="left:648px;top:96px;width:600px;height:592px;padding:12px 14px"><pre class="code">${hl(der)}</pre></div>`}

/* ═════════ navegación ═════════ */
const VIEWS=[['V1 Cristal',()=>vVariante(1)],['V2 Hilo',()=>vVariante(2)],['V3 Atmósfera',()=>vVariante(3)],['Dos tonos',vDosTonos],['Dosis',vDosis],['12 portadas',vGrid],['Noche ahumada',vNoche],['Constitución',vConst],['Código',vCodigo]];
let MODO='claro',cur=0;
const stage=document.getElementById('stage'),nav=document.getElementById('nav');
const secs=VIEWS.map(()=>{const s=document.createElement('section');s.className='view';stage.insertBefore(s,nav);return s});
function pinta(i){secs[i].innerHTML=VIEWS[i][1]()}
function go(i){cur=(i+VIEWS.length)%VIEWS.length;secs.forEach((s,j)=>s.classList.toggle('on',j===cur));nav.querySelectorAll('button[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===cur));history.replaceState(null,'','#'+(cur+1)+(MODO==='oscuro'?'d':''))}
function modo(m){MODO=m;stage.className=m==='oscuro'?'dk':'lt';document.body.classList.toggle('dkb',m==='oscuro');bm.textContent=m==='oscuro'?'☀ Claro':'☾ Noche ahumada';secs.forEach((_,i)=>pinta(i));go(cur)}
nav.innerHTML=`<button data-a="-1">←</button>${VIEWS.map(([n],i)=>`<button data-i="${i}">${i+1} · ${n}</button>`).join('')}<button data-a="1">→</button><button class="modo" id="bm">☾ Noche ahumada</button>`;
const bm=document.getElementById('bm');
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b===bm)return modo(MODO==='oscuro'?'claro':'oscuro');if(b.dataset.a)go(cur+ +b.dataset.a);else go(+b.dataset.i)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}else if(/^[1-9]$/.test(e.key))go(+e.key-1);else if(e.key==='d'||e.key==='D')modo(MODO==='oscuro'?'claro':'oscuro')});
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`translate(${(innerWidth-1280*s)/2}px,${(innerHeight-720*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();
const h0=location.hash.match(/^#(\d)(d?)/);cur=h0?Math.min(+h0[1]-1,VIEWS.length-1):0;modo(h0&&h0[2]?'oscuro':'claro');
</script>
